e des volumes qui contiennent la base des citoyens.", "BS4", "SS2"], ["O14", "Exploiter", "Rançongiciel sur supervision et serveurs, sauvegardes supprimées.", "BS2, BS3", "SS1"], ["O15", "Trouver", "Identification des automates de dosage ou de carrefour.", "BS1", "SS3"]], "roles": [{"id": "R01", "title": "RSSI", "sub": "Animateur de l'analyse", "mission": "Garant de la méthode. Tient la synthèse, relit les cotations, veille au temps.", "at": [{"q": "Chaque valeur métier a-t-elle au moins un bien support, chaque bien support une valeur métier ? L'ER décrit-il l'atteinte, pas l'attaque ?", "rep": "Faites justifier chaque gravité par un calcul (jours × 500 k€). Pour le socle : relisez la phrase du constat avant de choisir Conforme, Partiel ou Écart.", "pos": "Un taux de conformité honnête, même faible, plutôt qu'un taux flatteur."}, {"q": "Quelle phrase de la carte justifie ce M, ce R, ce A ? Tous les ER G3 et G4 sont-ils couverts ?", "rep": "Faites utiliser toute l'échelle 1 à 4. Deux sources ne peuvent pas avoir exactement les mêmes cotations.", "pos": "Retenir peu de sources, mais couvrir tous les ER graves."}, {"q": "Pouvons-nous dire à voix haute la phrase « source → partie prenante → événement redouté » ? Les critères A, B, C ont-ils chacun leur preuve ?", "rep": "Vérifiez que chaque niveau de menace est écrit D × P, M × C, quotient. Exigez 3 scénarios, pas 4.", "pos": "Des mesures d'écosystème qui agissent sur la variable en cause."}, {"q": "Chaque action suit-elle logiquement la précédente ? Quels biens supports reviennent le plus souvent dans les chaînes ?", "rep": "Aidez l'équipe à tenir la règle : V d'étape = 4 − freins ; V du scénario = minimum. Faites noter les biens supports critiques.", "pos": "La V de l'atelier 4 remplace celle de l'atelier 3."}, {"q": "Le budget est-il respecté ? Chaque risque accepté a-t-il un responsable, un indicateur et une date de revue ?", "rep": "Préparez la décision d'acceptation : « Risque ___, G×V = ___, accepté par le DG pour ___ mois. Responsable : le RSSI. Indicateur : ___. »", "pos": "Aucun risque Élevé ou Critique accepté sans signature et sans suivi."}], "piege": "Décider seul au nom de l'équipe. Votre rôle est de conduire, pas de trancher les cotations métier.", "phrase": "« Montrez-moi le calcul, puis la preuve. »", "vie": "Dans une collectivité, le RSSI est souvent seul ou presque : il rédige la politique de sécurité, relaie les alertes du CERT, prépare les audits et doit convaincre une direction qui arbitre d'abord entre eau, écoles et voirie. Il est rarement le décideur : il éclaire, il documente, il fait signer. Situation réelle : avant le vote du budget, l'élu demande « de quoi a-t-on besoin, et pourquoi ? » ; la seule réponse recevable est une analyse de risque chiffrée et lisible."}, {"id": "R02", "title": "Directeur des services urbains", "sub": "Valeurs métier", "mission": "Défend la continuité des services et arbitre les gravités. Connaît le coût d'un arrêt.", "at": [{"q": "Combien de jours peut-on tenir en manuel ? À partir de quand le service devient-il inacceptable pour les habitants ?", "rep": "Utilisez 500 k€ par jour. Un arrêt de 12 jours = 6 M€ : cela dépasse 5 M€. Rattachez chaque bien support à la ou aux valeurs métier qu'il soutient.", "pos": "Les gravités sont calculées, pas ressenties."}, {"q": "Quelle source de risque s'attaquerait à mes services ? Laquelle a un intérêt à mettre les élus sous pression ?", "rep": "Pensez à l'activité (A) : combien de collectivités ont été paralysées récemment ? C'est ce qui fait monter A.", "pos": "Ne pas laisser sortir de l'étude une source qui peut arrêter les services."}, {"q": "Quelle partie prenante, si elle tombe ou est compromise, arrête mes services ? Combien de temps pour la remplacer ?", "rep": "Vous êtes la meilleure source pour juger D (dépendance) : plus la partie prenante est difficile à remplacer vite, plus D est haut.", "pos": "Protéger en priorité les PP qui ont un accès direct aux équipements urbains."}, {"q": "Quels équipements l'attaquant doit-il toucher pour arrêter la supervision ? Que vous manque-t-il pour rester en manuel ?", "rep": "Aidez à distinguer l'action qui provoque l'impact (Exploiter) de celle qui ne fait que préparer.", "pos": "Les sauvegardes et le mode manuel réduisent la gravité, pas la vraisemblance."}, {"q": "Quelle mesure me rend le plus de jours de service ? Que peut-on laisser accepter sans mettre les habitants en danger ?", "rep": "Comparez les gains par jeton avec la directrice financière. Une mesure qui réduit G (sauvegardes) vaut autant qu'une qui réduit V.", "pos": "Réduire la durée d'un arrêt avant de réduire sa probabilité."}], "piege": "Sous-estimer ce qu'un jour d'arrêt coûte, parce que « on s'en est toujours sorti ».", "phrase": "« Combien de jours, et combien par jour ? »", "vie": "Le directeur des services urbains gère l'eau, l'assainissement, les feux et les bâtiments : astreintes, fournisseurs, plans de continuité. Il connaît le prix d'un jour de service dégradé, car il le vit en gestion de crise : une fuite de réseau, un carrefour en panne, un déversement. Situation réelle : lors d'une panne informatique de plusieurs jours dans une collectivité, les services sont repassés au papier et au téléphone, et chaque jour coûte en heures supplémentaires et en perte de service rendu."}, {"id": "R03", "title": "Responsable de l'exploitation technique", "sub": "Automates et supervision", "mission": "Connaît automates, supervision, stations et carrefours. Décrit les modes opératoires crédibles.", "at": [{"q": "Quels biens supports portent la distribution d'eau, la régulation du trafic ? Quel équipement n'a pas de valeur métier derrière lui ?", "rep": "Reliez chaque bien support de la liste aux valeurs métier : un bien support peut en soutenir plusieurs (supervision : eau et trafic).", "pos": "Rien ne reste « orphelin » sur la feuille 1."}, {"q": "Un technicien interne a-t-il des moyens ? Que sait-il faire sans outils ?", "rep": "L'initié a des ressources élevées parce qu'il possède des accès légitimes et connaît les procédures.", "pos": "Ne pas écarter l'initié parce qu'il n'est « pas un hacker »."}, {"q": "Quel prestataire a un accès permanent au réseau des équipements ? Lequel entre dans les locaux avec un badge ?", "rep": "Vous savez ce qui explique P (pénétration) : VPN permanent, badge, clés USB. Une PP avec un accès physique aux armoires est un relais crédible pour le sabotage.", "pos": "Faire valider les chemins par le terrain : un chemin que vous jugez impossible doit être justifié."}, {"q": "Pour piloter un automate de dosage, que doit-il savoir ? Quel accès lui faut-il ? Qui peut le remarquer ?", "rep": "Vous connaissez les freins : F1 (savoir-faire des protocoles), F3 (badge + présence + armoire), F4 (un agent d'astreinte voit une alarme inhibée). Rappel : une règle en Écart ne freine pas.", "pos": "Des chaînes réalistes : les mêmes actions ne conviennent pas à tous les scénarios."}, {"q": "Quelle mesure est applicable dans mes équipes en moins de six mois ? Laquelle suppose un arrêt des stations ?", "rep": "Verrouillage local des dosages, accès nominatif aux locaux, bastion de télémaintenance : dites ce qui est faisable et ce qui ne l'est pas.", "pos": "Un plan que les équipes peuvent réellement mettre en œuvre."}], "piege": "Trop techniser : l'atelier 4 décrit des actions sur des biens supports, pas des lignes de code.", "phrase": "« Sur le terrain, voilà comment ça se passe. »", "vie": "Le responsable de l'exploitation technique encadre les techniciens qui entretiennent les automates, la supervision et les armoires de carrefours. Il vit entre astreintes de nuit, interventions chez les sous-traitants et contraintes du constructeur. Situation réelle : un prestataire arrive à 6 h du matin avec un badge temporaire pour une intervention ; personne ne vérifie ce qu'il fait ensuite dans l'armoire, et la clé USB qu'il branche n'a jamais été scannée."}, {"id": "R06", "title": "Responsable de la sécurité de l'espace public et de la santé publique", "sub": "Sécurité des personnes", "mission": "Porte l'événement redouté de sécurité. Peut imposer un veto sur l'acceptation.", "at": [{"q": "Quel événement redouté met des personnes en danger ? Y a-t-il une atteinte qui reste invisible pendant des heures ?", "rep": "Dès qu'il y a risque pour des personnes, la gravité est G4 sans calcul d'argent. Rattachez les automates, la supervision, les armoires et les équipes à la valeur « sécurité des personnes ».", "pos": "Une ER qui nomme explicitement le risque vital."}, {"q": "Quelle source viserait la sécurité des personnes ? Qui a assez de moyens et d'accès pour le faire ?", "rep": "Un initié technicien a accès aux armoires ; un hacktiviste n'a pas les moyens d'agir sur l'eau. Ne laissez pas ER4 sans source retenue.", "pos": "Couvrir ER4 par au moins un couple retenu."}, {"q": "Qui entre physiquement dans les locaux, les stations, les armoires ? Avec quel contrôle ?", "rep": "L'accès physique avec un badge temporaire donne une pénétration forte. La menace est élevée si la maturité cyber est minimale.", "pos": "Un chemin crédible pour ER4 par accès physique."}, {"q": "Combien de personnes faut-il pour modifier une consigne de dosage sans être vu ? Quelle alarme alerterait un agent ?", "rep": "Frein F3 : plusieurs conditions cumulées (présence, badge, armoire). Frein F4 : alarmes remarquées. N'oubliez pas : sans journalisation, pas de détection.", "pos": "Des étapes qui ne sous-estiment pas la facilité de l'accès physique."}, {"q": "Le risque touchant des personnes est-il revenu à un niveau que j'accepte ? Sinon, quelle mesure supplémentaire ?", "rep": "Quand un risque touche des personnes, posez le jeton VETO : le DG doit choisir une mesure en plus, pas accepter.", "pos": "Aucun risque vital accepté sans mon avis écrit."}], "piege": "Utiliser le veto sans proposer d'alternative : le DG a besoin d'une mesure concrète à choisir.", "phrase": "« Là où il y a un risque pour des personnes, le coût passe après. »", "vie": "Le responsable de la sécurité de l'espace public et de la santé publique veille à la qualité de l'eau distribuée (contrôle sanitaire par l'ARS), à la régulation du trafic et à la sécurité des bâtiments. Les élus et les agents peuvent voir leur responsabilité pénale engagée en cas de mise en danger. Situation réelle : un dosage mal réglé ou un carrefour en feux clignotants peut causer un accident ou une alerte sanitaire en quelques heures."}, {"id": "R10", "title": "Directeur général des services (DG)", "sub": "Décision", "mission": "Arbitre en fin d'atelier 5. Accepte ou refuse les risques résiduels.", "at": [{"q": "Quelles sont nos obligations légales, nos engagements envers les habitants ? Qu'est-ce qui ne doit jamais s'arrêter ?", "rep": "Écoutez le directeur des services urbains et le responsable de la sécurité : la valeur métier passe avant la technique.", "pos": "Le cadre de l'étude validé par la direction."}, {"q": "Pourquoi retenir cette source et pas celle-là ? Ai-je tous les ER graves couverts ?", "rep": "Demandez le contrôle de couverture : si un ER grave n'est atteint par aucune source retenue, la sélection est trop étroite.", "pos": "Une sélection argumentée, pas exhaustive."}, {"q": "Ces mesures d'écosystème sont-elles réalistes avec nos prestataires ? Combien coûtent-elles ?", "rep": "Notez le coût total des ME retenues : elles s'ajouteront aux mesures M dans le budget de 14 jetons.", "pos": "Des mesures d'écosystème choisies avec le coût en tête."}, {"q": "Que retenez-vous de cet atelier pour ma décision ? Quels sont les biens supports critiques ?", "rep": "Demandez la liste des biens supports critiques : ce sont eux que le plan doit protéger.", "pos": "Une vue claire de ce qu'il faut protéger."}, {"q": "Quel risque résiduel j'accepte ? Qui en est responsable ? Quand le revoit-on ?", "rep": "Posez les trois questions : responsable, indicateur, date de revue. Si le responsable de la sécurité pose son veto, choisissez une mesure en plus.", "pos": "Décision écrite, signée, avec responsable, indicateur, revue."}], "piege": "Signer sans comprendre : vous ne pouvez pas accepter un risque que personne ne vous a expliqué.", "phrase": "« Qui est responsable, et quand revoit-on ? »", "vie": "Le directeur général des services dirige l'administration de la collectivité sous l'autorité des élus. Il arbitre entre directions, répond aux élus et signe les décisions. En matière de risque, il est celui qui accepte formellement, et donc qui assume. Situation réelle : après un incident, la question n'est pas « qui a échoué ? » mais « qui avait accepté ce risque, avec quelle information ? »"}], "hints": {"1": [["Ils listent des serveurs et des logiciels comme valeurs métier", "« Si vous changez de serveur, cet élément existe-t-il encore ? »", "« Que doit continuer à faire la Métropole, même sans informatique ? »", "« Distribuer une eau potable est une valeur métier ; l'automate de dosage qui la permet est un bien support. »"], ["Ils écrivent « rançongiciel » ou « piratage » dans un ER", "« L'ER dit-il ce que veut l'attaquant ou ce que subit la Métropole ? »", "« Reformulez sans parler d'attaque : quelle atteinte (perte, altération, divulgation) de quelle valeur métier ? »", "« Perte de la supervision plus de 10 jours » est un ER ; « rançongiciel sur la supervision » n'en est pas un."], ["Ils cotent la gravité au ressenti (« c'est grave »)", "« Combien de jours d'arrêt ? Combien coûte un jour ? »", "« Le dossier donne 500 k€ par jour (182 M€ ÷ 365). »", "« 12 jours × 500 k€ = 6 M€, au-dessus de 5 M€ : G4. »"], ["Ils hésitent entre G3 et G4 pour ER4 (eau, feux)", "« Des personnes peuvent-elles être mises en danger ? »", "« Relisez l'échelle : G4 inclut la mise en danger de personnes. »", "« G4 sans calcul : la sécurité des personnes passe avant le coût. »"], ["Ils notent le socle sans relire les constats", "« Quelle phrase du constat justifie votre état ? »", "« Écart : rien en place. Partiel : en place mais incomplet ou non testé. Conforme : en place et vérifié. »", "« R3 : 60 % des équipements sauvegardés, restauration jamais testée : Partiel. R6 : aucune journalisation : Écart. »"], ["Ils se trompent sur le taux de conformité", "« Combien de points au total, sur combien de règles ? »", "« Conforme 1, Partiel 0,5, Écart 0. »", "« 2,5 points sur 8 règles : 2,5 ÷ 8 ≈ 31 %. »"], ["Un bien support n'est rattaché à aucune valeur métier (BS6, BS10)", "« Si ce bien tombe, quelle valeur métier souffre ? »", "« Cherchez ce qui dépend de lui : flux, personnes, locaux. »", "« BS6 (passerelle) soutient VM1 ; BS10 (agents et prestataires) soutient VM1 et VM4. »"], ["Désaccord entre joueurs sur une cotation", "« Chacun peut-il la justifier en une phrase ? »", "« Le RSSI tranche après écoute ; chaque joueur a un droit de contestation par atelier. »", "« Notez la cotation retenue et la raison : un désaccord argumenté vaut mieux qu'un consensus mou. »"]], "2": [["Ils confondent objectif visé et événement redouté", "« Est-ce ce que veut la source, ou ce que redoute la Métropole ? »", "« Un objectif : gagner de l'argent. Un ER : perte de la supervision plus de 10 jours. »", "« Le lien objectif → ER se fait à l'atelier 3. »"], ["Ils cotent toutes les sources de la même façon", "« Laquelle de ces deux sources est la plus active dans les collectivités ? »", "« Utilisez toute l'échelle : 1 très faible, 4 très fort. »", "« SR6 (curieux) reste bas ; SR2 (rançongiciel) est haut sur l'activité. »"], ["Ils écartent l'initié parce que « ce n'est pas un hacker »", "« Que possède un technicien interne qu'un attaquant externe n'a pas ? »", "« Des accès légitimes, la connaissance des procédures et des rondes. »", "« Ses ressources (R) montent à 3 : il n'a pas besoin d'outils. »"], ["Ils ne comprennent pas l'activité (A)", "« Combien d'attaques de ce type voit-on dans le secteur des collectivités ? »", "« A mesure la fréquence observée, pas l'intérêt de la source. »", "« Les rançongiciels visant les collectivités sont très fréquents : A élevé. »"], ["Ils retiennent les 6 sources", "« Quel est le seuil de rétention ? »", "« Σ ≥ 8 retenu · 6 à 7 à surveiller · ≤ 5 écarté. »", "« La méthode sert à prioriser : une source à Σ = 5 sort de l'étude. »"], ["Un ER G3 ou G4 n'est atteint par aucun couple retenu", "« Qui pourrait agir sur le bien support de cet ER ? »", "« Regardez les sources à surveiller (6 à 7) ou relisez leurs R et A. »", "« ER4 (eau et feux) : l'initié SR4 est le seul acteur plausible. »"], ["Ils demandent la « bonne » valeur M, R, A", "« Quelle phrase de la carte justifie votre chiffre ? »", "« Aucune valeur n'est imprimée : reliez chaque chiffre à l'échelle du dossier. »", "« Une cotation avec une phrase de justification vaut mieux qu'un chiffre « exact ». »"], ["Σ = 7 : retenu ou pas ?", "« Quel est le seuil ? »", "« 7 est à surveiller : on ne l'analyse pas maintenant. »", "« Un aléa peut le faire basculer (défi 2.1). »"]], "3": [["Ils ne savent pas lire la carte PP", "« Quels sont les quatre nombres imprimés ? Quelle est la formule ? »", "« D × P au numérateur (ce qui monte la menace), M × C au dénominateur (ce qui la baisse). »", "« PP2 : D3 P4 M2 C2 → 12 ÷ 4 = 3,0. »"], ["Ils inversent la maturité", "« Une PP très mûre est-elle plus ou moins dangereuse ? »", "« M est au dénominateur : quand M monte, le niveau baisse. »", "« PP7 (M1) est plus dangereuse que PP3 (M4), toutes choses égales. »"], ["Ils hésitent sur une zone (3,0 ou 1,5 pile)", "« Le seuil est-il « ≥ » ou « > » ? »", "« Danger ≥ 3 · contrôle de 1,5 à moins de 3 · veille < 1,5. »", "« PP2 = 3,0 : danger. PP7 = 3,0 : danger. PP6 = 1,5 : contrôle. »"], ["Ils passent par la préfecture (PP3) parce qu'elle est « grosse »", "« Dans quelle zone est PP3 ? Quelle est sa pénétration ? »", "« Une forte dépendance ne suffit pas : PP3 a P2, M4, C4. »", "« Cherchez une PP en danger ou en contrôle qui a un accès au bien support de l'ER. »"], ["Ils ne trouvent pas la PP du chemin", "« Quel ER vise ce couple ? Quel bien support y mène ? Qui y a accès ? »", "« Lisez la description au dos de chaque carte PP. »", "« ER1 : supervision par le VPN → PP2 (ou PP1). ER3 : base des citoyens dans le cloud → PP6. ER4 : armoires et accès physique → PP7. »"], ["Ils veulent passer par deux PP, ou par aucune", "« Une seule PP suffit-elle pour relier la source à l'ER ? »", "« Le second emplacement du couloir est facultatif ; sans relais, il n'y a pas de scénario d'écosystème. »", "« Gardez une PP ; ajoutez un second relais seulement si vous pouvez écrire pourquoi. »"], ["Ils cochent un critère sans preuve", "« Montrez-moi où c'est écrit. »", "« A : feuille 2 (Σ). B : radar. C : socle (feuille 1). »", "« SS1 : A = Σ de SR2 (11) · B = PP2 (3,0) · C = R2 en Écart. »"], ["Ils comptent C mais la règle ne concerne pas le chemin", "« Quelle étape du chemin cette règle protège-t-elle ? »", "« La règle doit couvrir un maillon du chemin (accès d'administration, cloisonnement, sensibilisation…). »", "« SS2 : R1 (flux directs vers le cloud sans zone démilitarisée). SS3 : R5 et R8. »"], ["Ils inventent la gravité du scénario", "« D'où vient G ? »", "« De l'ER visé, jamais du scénario. »", "« SS1 → ER1 = G4. »"], ["Ils choisissent une ME qui n'agit pas sur la bonne variable", "« Quelle variable fait monter le niveau de cette PP ? »", "« Chaque ME agit sur une seule variable (tableau des leviers, section 5). »", "« PP2 : P4 forte, M2 et C2 faibles → ME3 (P), ME1 (M), ME2 (C). PP7 : M1 → ME7 (ou ME5 sur P). »"], ["La PP reste en danger après leur ME", "« Avez-vous recalculé ? Quel est le nouveau niveau ? »", "« Un niveau de 3,0 reste en danger : il faut passer sous 3. »", "« Avec AL5 : ME1 seule laisse PP2 à 3,0 ; il faut ME1 + ME2. »"], ["Ils font quatre scénarios (SR1 et SR5 séparés)", "« Même ER, même PP : combien de scénarios ? »", "« Un seul ; on garde la source la plus pertinente pour le critère A. »", "« SR1 (Σ 9) rend A rempli ; SR5 (Σ 8) non. »"], ["Ils ne voient pas à quoi sert une ME", "« Que voulez-vous obtenir sur le radar ? »", "« Faire sortir la PP de la zone danger sans attendre qu'elle devienne parfaite. »", "« Après ME1, PP2 passe de 3,0 à 2,0 : elle reste en contrôle, mais n'est plus un rebond facile. »"]], "4": [["Ils ne comprennent pas ce que sont les cartes noires", "« Combien de cartes noires ? Combien d'emplacements ? »", "« Les cartes noires sont les cartes Opération : 15 cartes pour 12 emplacements. »", "« Chaque carte porte une phase, une action et un bien visé. »"], ["Plusieurs cartes « Rentrer » paraissent possibles", "« Quelle PP traverse votre scénario ? Quel bien support est visé ? »", "« Une seule carte par phase correspond à votre scénario. »", "« SS1 : VPN de l'intégrateur (BS7). SS2 : compte de l'hébergeur (BS3). SS3 : badge et armoire (BS9). »"], ["Ils placent Exploiter avant Trouver, ou exfiltrent avant d'avoir repéré", "« Qu'a-t-on obtenu à l'étape précédente ? Peut-on agir sans cela ? »", "« Connaître → Rentrer → Trouver → Exploiter : chaque résultat rend le suivant possible. »", "« On n'exfiltre pas ce qu'on n'a pas localisé. »"], ["Ils ne repèrent pas les cartes hors sujet", "« Pour chaque carte restante, le bien visé est-il l'un des 10 biens supports ? »", "« Testez T1, puis T2 et T3. »", "« Site web public, portable d'un élu, Wi-Fi des médiathèques : aucun n'est l'un des 10 biens supports. »"], ["Ils ne savent pas appliquer un frein", "« Répondez oui ou non à F1, F2, F3, F4 pour cette étape. »", "« Un frein est un obstacle réel pour l'attaquant. »", "« SS1 Rentrer : F2 (R5 partielle) → V3. »"], ["Ils comptent un frein pour une règle en Écart", "« Cette règle protège-t-elle quelque chose aujourd'hui ? »", "« Écart : rien en place, donc pas de frein. Conforme ou Partiel : frein possible. »", "« R2 en Écart : pas de F2. R5 Partielle : F2. »"], ["Ils font la moyenne des V", "« Une chaîne résiste-t-elle mieux que son maillon le plus difficile ? »", "« V du scénario = la plus petite V des 4 étapes. function connect(){
  if(es){es.close();es=null}if(bc){bc.close();bc=null}
  if(!S.session){NET.status='hors ligne';return}
  topic='ebiosrm-'+CFG.key.toLowerCase()+'-'+S.session.toLowerCase();
  try{bc=new BroadcastChannel(topic);bc.onmessage=e=>onMsg(e.data)}catch(e){}
  if(RELAY==='local'){NET.status='local (cet appareil)';return}
  try{es=new EventSource(RELAY+'/'+topic+'/sse?since=12h');
    es.onopen=()=>{NET.status='connecté';badge()};es.onerror=()=>{NET.status='reconnexion…';badge()};
    es.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==='message'&&m.message)onMsg(JSON.parse(m.message))}catch(e){}}}
  catch(e){NET.status='indisponible'}
}

  else if(m.k==='res'){const t=NET.tables[m.tb]=NET.tables[m.tb]||{};t.r=m.r;t.seen=m.ts}
  else if(m.k==='timer'){NET.timer=m}
  else if(m.k==='alea'){NET.alea=m}

 const polls=allPolls();h+=`<div class="card"><h2>Votes anonymes</h2>${polls.map(p=>{const vs=NET.votes[p.id]||{},n=Object.keys(vs).length,cnt={};Object.values(vs).forEach(v=>cnt[v]=(cnt[v]||0)+1);return `<div style="margin:8px 0"><b>${esc(p.label)}</b> · ${n} vote(s) <button class="btn sm ${NET.reveal[p.id]?'':'sec'}" data-act="reveal" data-poll="${p.id}">${NET.reveal[p.id]?'Masquer':'Révéler'}</button><div class="hist">${p.opts.map(o=>`<div><span style="width:80px">${esc(o)}</span><span class="b" style="width:${n?Math.round(100*(cnt[o]||0)/n)*1.8:0}px"></span> ${cnt[o]||0}</div>`).join('')}</div></div>`}).join('')}</div>`;
 const tb=Object.entries(NET.tables).sort((a,b)=>(b[1].tot||0)-(a[1].tot||0));
 h+=`<div class="card"><h2>Tableau des scores</h2>${tb.length?`<table><tr><th>Table</th><th>Total</th><th>A1</th><th>A2</th><th>A3</th><th>A4</th><th>A5</th><th>Indices</th></tr>${tb.map(([k,t])=>`<tr><td><b>${esc(k)}</b></td><td><b>${fmt(t.tot||0,1)}</b></td>${['a1','a2','a3','a4','a5'].map(a=>`<td>${fmt((t.at||{})[a]||0,1)}</td>`).join('')}<td>−${t.hint||0}</td></tr>`).join('')}</table>`:'<div class="mut">En attente des tables…</div>'}</div>`;
 const keys=[...new Set(Object.values(NET.tables).flatMap(t=>Object.keys(t.r||{})))],ids=Object.keys(NET.tables);
 h+=`<div class="card"><h2>Débrief comparatif</h2>${keys.length?`<div class="mut">Les lignes en orange sont celles où les tables divergent.</div><table><tr><th></th>${ids.map(i=>'<th>T'+esc(i)+'</th>').join('')}</tr>${keys.map(k=>{const vals=ids.map(i=>(NET.tables[i].r||{})[k]||'—'),diff=new Set(vals).size>1;return `<tr style="${diff?'background:rgba(217,112,26,.15)':''}"><td><b>${esc(k)}</b></td>${vals.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`}).join('')}</table>`:'<div class="mut">Les tables publient leurs résultats au fil des ateliers.</div>'}<h3>Pouls des tables</h3><div class="mut">Chaque table indique 🟢🟡🔴 en fin d'atelier (sur son téléphone).</div></div>`;
 return h}
function allPolls(){const P=[];P.push({id:'p.a1.pari',label:'A1 · Pari de gravité',opts:['G1','G2','G3','G4']},{id:'p.a2.sr',label:'A2 · Source à retenir en premier',opts:CFG.sr.map(s=>s[0])},{id:'p.a3.ss',label:'A3 · Meilleure PP relais',opts:CFG.pp.map(p=>p[0])},{id:'p.a4.pl',label:'A4 · Scénario le plus plausible',opts:CFG.ref.ss.map(s=>s.id)},{id:'p.a5.acc',label:'A5 · Accepter le risque résiduel',opts:['Accepter','Traiter encore']});return P}
function photo(a){const ph=S.photos[a]||[];return `<div class="card"><h3>📷 Photo du plateau</h3><div class="mut">Photographiez votre plateau en fin d'atelier : elle sera dans votre dossier.</div><input type="file" accept="image/*" capture="environment" data-photo="${a}">${ph.map((p,i)=>`<img src="${p}" style="width:30%;margin:4px;border-radius:6px">`).join('')}</div>`}
// ---------- vérifications (sans révéler la solution)
const V={
 a1_bs(){const r={};let n=0;CFG.bs.forEach(b=>{const got=CFG.vm.filter(v=>g('a1.bs.'+b[0]+'.'+v[0])).map(v=>v[0]),ref=CFG.ref.vmbs[b[0]]||[];r[b[0]]=sameSet(got,ref);if(r[b[0]])n++});S.res.a1bs=r;award('a1.bs',n*0.5)},
 a1_g(){const r={};let n=0;CFG.er.forEach(e=>{r[e[0]]=g('a1.g.'+e[0])===e[4];if(r[e[0]])n++});S.res.a1g=r;award('a1.g',n)},
 a1_so(){const r={};let n=0;CFG.socle.forEach(s=>{r[s[0]]=g('a1.so.'+s[0])===s[2];if(r[s[0]])n++});S.res.a1so=r;award('a1.so',n*0.5)},
 a2_s(){const r={};let n=0;CFG.sr.forEach(s=>{const ref=CFG.ref.pert[s[0]],m=num(g('a2.'+s[0]+'.M')),rr=num(g('a2.'+s[0]+'.R')),a=num(g('a2.'+s[0]+'.A'));const ok=m&&rr&&a&&Math.abs(m-ref[0])<=1&&Math.abs(rr-ref[1])<=1&&Math.abs(a-ref[2])<=1,dec=m&&rr&&a&&sigmaDec(m+rr+a)===sigmaDec(ref[0]+ref[1]+ref[2]);r[s[0]]=!!(ok&&dec);if(ok)n++;if(dec)n++});S.res.a2s=r;award('a2.s',Math.min(10,n))},
 a2_c(){const ret=CFG.sr.filter(s=>{const a=num(g('a2.'+s[0]+'.M')),b=num(g('a2.'+s[0]+'.R')),c=num(g('a2.'+s[0]+'.A'));return a&&b&&c&&a+b+c>=8}).map(s=>s[0]);let all=true,n=0;CFG.er.forEach(e=>{const gv=g('a1.g.'+e[0])||e[4];if(gv==='G3'||gv==='G4'){const picked=CFG.sr.filter(s=>g('a2.cov.'+e[0]+'.'+s[0])).map(s=>s[0]);if(picked.some(x=>ret.includes(x)&&CFG.ref.cov[e[0]].includes(x)))n++;else all=false}});S.res.a2c={_all:all};award('a2.c',n)},
 a3_p(){const r={};let n=0;CFG.pp.forEach(p=>{const ref=menace(p[3],p[4],p[5],p[6]),v=num(g('a3.lv.'+p[0]));r[p[0]]=v!=null&&Math.abs(v-ref)<=0.02;if(r[p[0]])n++});S.res.a3p=r;award('a3.p',Math.min(7,n))},
 a3_s(){const r={};let n=0;[1,2,3].forEach(i=>{const er=g('a3.ss.'+i+'.er'),ref=CFG.ref.ss.find(s=>s.er===er);let ok=false;if(ref){const chain=ref.srs.includes(g('a3.ss.'+i+'.sr'))&&g('a3.ss.'+i+'.pp')===ref.pp,crit=['A','B','C'].every((c,k)=>!!g('a3.ss.'+i+'.'+c)===!!ref.crit[k]);ok=chain&&crit;if(chain)n++;if(crit)n++}r['SS'+i]=ok});S.res.a3s=r;award('a3.s',n+(Object.values(r).every(Boolean)?1:0))},
 a3_m(){let n=0;const pts=[];CFG.ref.danger.forEach(pid=>{const p=PP[pid],cards=CFG.me.filter(m=>g('a3.me.c.'+pid+'.'+m[0])),v={D:p[3],P:p[4],M:p[5],C:p[6]};cards.forEach(m=>{v[m[2]]=Math.min(4,Math.max(1,v[m[2]]+m[3]))});const lv=menace(v.D,v.P,v.M,v.C),cost=cards.reduce((s,m)=>s+m[4],0);if(cards.length&&lv<3){n++;if(cost<=CFG.ref.meplan[pid])n++}pts.push(pid+(cards.length&&lv<3?' ✔':' ✘'))});award('a3.m',Math.min(4,n));toast('Parties prenantes en danger : '+pts.join(' · '))},
 a4_c(){const r={},rv={};let n=0;CFG.ref.ss.forEach(s=>{const E=CFG.ref.etapes[s.id];let all=true;['Connaître','Rentrer','Trouver','Exploiter'].forEach((ph,k)=>{const ok=g('a4.ch.'+s.id+'.'+ph)===E[k].op;if(ok)n+=0.5;else all=false;const nf=['F1','F2','F3','F4'].filter(f=>g('a4.fr.'+s.id+'.'+k+'.'+f)).length;const okv=Math.max(1,4-nf)===E[k].V;rv[s.id+'.'+k]=okv;if(okv)n+=0.25});r[s.id]=all});S.res.a4c=r;S.res.a4v=rv;award('a4.c',n)},
 a4_h(){const got=[1,2,3].map(i=>g('a4.hs.'+i)).filter(Boolean),ok=sameSet([...new Set(got)],CFG.ref.horsSujet)&&got.length===3;S.res.a4h={all:ok};award('a4.h',ok?3:got.filter(x=>CFG.ref.horsSujet.includes(x)).length)},
 a4_b(){const got=CFG.bs.filter(b=>g('a4.crit.'+b[0])).map(b=>b[0]),ok=sameSet(got,CFG.ref.crit);S.res.a4b={all:ok};award('a4.b',ok?2:Math.max(0,got.filter(x=>CFG.ref.crit.includes(x)).length*0.25))},
 a5(){const r={};let n=0;const cost=planCost();if(cost<=CFG.budget&&cost>0)n+=3;CFG.ref.ss.forEach((s,i)=>{const x=after(i+1),ok=x!=null&&x<=CFG.seuil;r[s.id]=ok;if(ok)n+=2;else if(x!=null&&g('a5.d.'+(i+1)+'.resp')&&g('a5.d.'+(i+1)+'.ind')&&g('a5.d.'+(i+1)+'.date'))n+=1});S.res.a5s=r;award('a5.p',n);toast(cost>CFG.budget?'Budget dépassé':'Plan vérifié : '+fmt(n,0)+' point(s)')}
};
// ---------- rendu
function render(){
  const m=$('#m');const fo=document.activeElement;
  let h='';
  if(S.alea_banner){}
  if(NET.alea&&!IS_ANIM)h+=`<div class="banner"><b>Carte Aléa : ${esc(NET.alea.t)}</b><br>${esc(NET.alea.x)}</div>`;
  h+=({home,a1,a2,a3,a4,a5,deb,anim})[tab]();
  m.innerHTML=h;
  $('#nav').innerHTML=IS_ANIM?'':[['home','🏠','Accueil'],...AT.map((a,i)=>[a.id,i<5?'<b>'+(i+1)+'</b>':'🏁',i<5?'Atelier':'Débrief'])].map(([id,ic,l])=>`<button class="${tab===id?'on':''}" data-act="go" data-t="${id}"><b>${ic}</b>${l}</button>`).join('');
  $('#fab').innerHTML=(IS_ANIM||tab==='home')?'':`<button class="h" data-act="hint">💡 Indice</button><button data-act="role">🎭 Aide de mon rôle</button>`;
  badge();tick();
}
function badge(){$('#sc').textContent=IS_ANIM?NET.status:(fmt(total(),1)+' pts');$('#sub').textContent=IS_ANIM?'Animateur':('Table '+(S.table||'?')+' · '+(S.role||'rôle ?')+' · '+(S.session?NET.status:'hors ligne'))}
let tmrI=null;function tick(){clearInterval(tmrI);const t=NET.timer;const el=$('#tmr');if(!el||!t||t.stop)return;const f=()=>{const e=$('#tmr');if(!e)return;const left=Math.max(0,t.start+t.dur-Date.now());e.textContent=String(Math.floor(left/60000)).padStart(2,'0')+':'+String(Math.floor(left/1000)%60).padStart(2,'0');e.style.color=left<5*60000?'var(--ko)':'';if(left===0)clearInterval(tmrI)};f();tmrI=setInterval(f,1000)}
// ---------- événements
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.photo){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const a=t.dataset.photo;(S.photos[a]=S.photos[a]||[]).push(c.toDataURL('image/jpeg',.65));if(S.photos[a].length>3)S.photos[a].shift();save();render()};im.src=r.result};r.readAsDataURL(f);return}
  const k=t.dataset.k;if(!k)return;const v=t.type==='checkbox'?t.checked:t.value;
  if(k==='__table'){S.table=v.trim();save();badge();pub('score');return}
  if(k==='__session'){S.session=v.trim().toUpperCase();save();connect();render();return}
  if(k==='__role'){S.role=v;save();badge();return}
  setv(k,v);pub('res');render()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='go'){tab=b.dataset.t;render();window.scrollTo(0,0)}
  else if(a.startsWith('v_')){V[a.slice(2)]();pub('res');render()}
  else if(a==='vote'){S.vote[b.dataset.poll]=b.dataset.v;save();pubRaw({k:'vote',poll:b.dataset.poll,vid:S.vid,v:b.dataset.v});render()}
  else if(a==='reveal'){const id=b.dataset.poll;pubRaw({k:'reveal',poll:id,on:!NET.reveal[id]})}
  else if(a==='closeov'){if(e.target===b)$('#ov').innerHTML=''}
  else if(a==='closeov2'){$('#ov').innerHTML=''}
  else if(a==='hint')hintSheet();
  else if(a==='hintshow'){const id=b.dataset.id,l=+b.dataset.l;if(l===2||l===3){if(!confirm(l===2?'Ce niveau coûte 1 point. Continuer ?':'Ce niveau coûte 2 points. Continuer ?'))return}S.hint[id]=Math.max(S.hint[id]||0,l);save();pub('score');hintSheet(b.dataset.open);badge()}
  else if(a==='role')roleSheet(S.role);
  else if(a==='menu')menu();
  else if(a==='pulse'){S.pulse[b.dataset.a]=b.dataset.e;save();render()}
  else if(a==='dossier')dossier();
  else if(a==='json'){const bl=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),u=URL.createObjectURL(bl),x=document.createElement('a');x.href=u;x.download='analyse_'+CFG.key+'_table'+(S.table||'')+'.json';x.click()}
  else if(a==='gen'){S.session=Math.random().toString(36).slice(2,6).toUpperCase();save();connect();render()}
  else if(a==='tstart'){const at=g('anim.at')||'a1',mi=num(g('anim.min'))||AT.find(x=>x.id===at).min;pubRaw({k:'timer',at,start:Date.now(),dur:mi*60000})}
  else if(a==='tstop'){pubRaw({k:'timer',at:'',start:0,dur:0,stop:true})}
  else if(a==='tpause'){pubRaw({k:'timer',at:'',start:Date.now(),dur:30*60000})}
  else if(a==='alea'){const at=g('anim.at')||'a1',nm=at.replace('a','Atelier '),al=CFG.alea.filter(x=>x[1]===nm);if(al.length){const x=al[Math.floor(Math.random()*al.length)];pubRaw({k:'alea',id:x[0],t:x[0]+' · '+x[2],x:x[3]})}}
  else if(a==='aleaoff'){pubRaw({k:'alea',id:'',t:'',x:''});NET.alea=null;render()}
  else if(a==='video'){sheet('<h2>Message de la direction</h2><video controls playsinline style="width:100%;border-radius:10px" src="dg.mp4"></video><p class="mut">Si la vidéo ne se lance pas, demandez le fichier à l\'animateur.</p>')}
});
function menu(){sheet(`<h2>Réglages</h2><p><label>N° de table <input data-k="__table" type="text" value="${esc(S.table)}" style="width:90px"></label> <label>Code <input data-k="__session" type="text" value="${esc(S.session)}" style="width:110px;text-transform:uppercase"></label></p><p class="mut">Relais : ${esc(RELAY)} · état : ${esc(NET.status)}</p><p><button class="btn sec" data-act="go" data-t="home">Accueil</button> <button class="btn sec" onclick="if(confirm('Effacer toutes les données de cet appareil ?')){localStorage.removeItem('${LSK}');location.reload()}">Tout effacer</button></p>`)}
function hintSheet(open){const cur=AT.find(a=>a.id===tab),n=cur.id==='deb'?'5':cur.id.slice(1),rows=CFG.hints[n]||[];
  sheet(`<h2>💡 Indices · ${cur.n}</h2><div class="mut">Choisissez la situation qui vous ressemble. Niveau 1 : une question (gratuit). Niveau 2 : un indice (−1 pt). Niveau 3 : dernier recours (−2 pts).</div>`+rows.map((r,i)=>{const id=n+'.'+i,l=S.hint[id]||0,isOpen=open===id||l>0;return `<div class="card"><b>${esc(r[0])}</b>${isOpen?`<div style="margin-top:6px">${[1,2,3].map(k=>k<=Math.max(l,1)?`<p>${['','Question','Indice','Dernier recours'][k]} : ${esc(r[k])}</p>`:'').join('')}</div>`:''}<div>${!isOpen?`<button class="btn sm" data-act="hintshow" data-id="${id}" data-l="1" data-open="${id}">Voir la question</button>`:''}${isOpen&&l<2?`<button class="btn sm sec" data-act="hintshow" data-id="${id}" data-l="2" data-open="${id}">Indice suivant (−1 pt)</button>`:''}${isOpen&&l===2?`<button class="btn sm sec" data-act="hintshow" data-id="${id}" data-l="3" data-open="${id}">Dernier recours (−2 pts)</button>`:''}</div></div>`}).join(''))}
function roleSheet(rid){const cur=AT.find(a=>a.id===tab),n=cur.id==='deb'?4:+cur.id.slice(1)-1;const r=CFG.roles.find(x=>x.id===rid)||CFG.roles[0];
  sheet(`<h2>🎭 Aide de rôle · ${cur.n}</h2><div class="row">${CFG.roles.map(x=>`<button class="btn ${x.id===r.id?'':'sec'} sm" onclick="roleSheet('${x.id}')">${x.id}</button>`).join('')}</div><div class="card"><b>${r.id} · ${esc(r.title)}</b><div class="mut">${esc(r.sub)}</div></div><div class="card"><h3>Question à poser à la table</h3>${esc(r.at[n].q)}</div><div class="card"><h3>Repère pour positionner votre choix</h3>${esc(r.at[n].rep)}</div><div class="card"><h3>Position à défendre</h3>${esc(r.at[n].pos)}</div><div class="card"><h3>Phrase-clé</h3><i>${esc(r.phrase)}</i></div>`)}
window.roleSheet=roleSheet;
function dossier(){const ba=byAt();const rows=(t,arr)=>`<table>${arr.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</table>`;
  let h=`<div class="rep"><p class="noprint"><button class="btn" onclick="window.print()">Imprimer / Enregistrer en PDF</button> <button class="btn sec" onclick="document.querySelector('.rep').remove()">Fermer</button></p><h1>Dossier d'analyse de risque · ${esc(CFG.org)}</h1><p>Méthode EBIOS RM · Table ${esc(S.table||'—')} · Rôle ${esc(S.role||'—')} · ${new Date().toLocaleDateString('fr-FR')} · Score : ${fmt(total(),1)} pts</p>`;
  h+=`<h2>Atelier 1 · Gravité des événements redoutés</h2>`+rows('',[['ER','Pari','Gravité retenue','Jours d\'arrêt','Commentaire'],...CFG.er.map(e=>[e[0]+' '+esc(e[1]),g('a1.pari.'+e[0])||'',g('a1.g.'+e[0])||'',g('a1.j.'+e[0])||'',esc(g('a1.n.'+e[0])||'')])]);
  const so=CFG.socle.reduce((s,r)=>s+(g('a1.so.'+r[0])==='Conforme'?1:g('a1.so.'+r[0])==='Partiel'?.5:0),0);
  h+=`<p>Socle : ${fmt(so,1)} / ${CFG.socle.length} (${fmt(100*so/CFG.socle.length,0)} %) · ${CFG.socle.map(r=>r[0]+' '+(g('a1.so.'+r[0])||'?')).join(' · ')}</p>`;
  h+=`<h2>Atelier 2 · Sources de risque</h2>`+rows('',[['Source','M','R','A','Σ','Décision'],...CFG.sr.map(s=>{const m=num(g('a2.'+s[0]+'.M')),r=num(g('a2.'+s[0]+'.R')),a=num(g('a2.'+s[0]+'.A'));return [s[0]+' '+esc(s[1]),m||'',r||'',a||'',m&&r&&a?m+r+a:'',m&&r&&a?sigmaDec(m+r+a):'']})]);
  h+=`<h2>Atelier 3 · Scénarios stratégiques</h2>`+rows('',[['SS','Chemin','Critères','V','Preuves'],...[1,2,3].map(i=>['SS'+i,[g('a3.ss.'+i+'.sr'),g('a3.ss.'+i+'.pp'),g('a3.ss.'+i+'.er')].map(x=>x||'?').join(' → '),['A','B','C'].filter(c=>g('a3.ss.'+i+'.'+c)).join(''),'V'+vOf(i),esc(g('a3.ss.'+i+'.why')||'')])]);
  h+=`<p>Mesures d'écosystème : ${CFG.pp.map(p=>{const c=CFG.me.filter(m=>g('a3.me.c.'+p[0]+'.'+m[0])).map(m=>m[0]);return c.length?p[0]+' : '+c.join('+'):''}).filter(Boolean).join(' · ')||'—'}</p>`;
  h+=`<h2>Atelier 4 · Scénarios opérationnels</h2>`+rows('',[['SS','Connaître','Rentrer','Trouver','Exploiter','V'],...CFG.ref.ss.map(s=>[s.id,...['Connaître','Rentrer','Trouver','Exploiter'].map(p=>g('a4.ch.'+s.id+'.'+p)||'?'),'V'+v4s(s.id)])]);
  h+=`<p>Biens supports critiques : ${CFG.bs.filter(b=>g('a4.crit.'+b[0])).map(b=>b[0]).join(', ')||'—'}</p>`;
  h+=`<h2>Atelier 5 · Traitement du risque</h2><p>Plan : ${CFG.mes.filter(m=>g('a5.m.'+m[0])).map(m=>m[0]).concat(CFG.me.filter(m=>g('a5.me.'+m[0])).map(m=>m[0])).join(', ')||'—'} · coût ${planCost()} / ${CFG.budget} · seuil d'acceptation G × V ≤ ${CFG.seuil}</p>`+rows('',[['SS','Après traitement (G × V)','Seuil','Dérogation du DG'],...CFG.ref.ss.map((s,i)=>{const x=after(i+1);return [s.id,x==null?'?':x,x==null?'':(x<=CFG.seuil?'sous le seuil':'au-dessus'),x!=null&&x>CFG.seuil?esc([g('a5.d.'+(i+1)+'.resp'),g('a5.d.'+(i+1)+'.ind'),g('a5.d.'+(i+1)+'.date')].map(y=>y||'…').join(' · ')):'']})]);
  h+=`<p>Signature du DG : ______________________ &nbsp;&nbsp; Veto sécurité : ______________________</p><h2>Ce que je fais lundi</h2><p>${esc(g('deb.lundi')||'')}</p>`;
  const phs=Object.entries(S.photos).filter(([k,v])=>v.length);if(phs.length){h+='<h2>Photos du plateau</h2>'+phs.map(([k,v])=>'<div><b>'+k.toUpperCase()+'</b><br>'+v.map(p=>'<img src="'+p+'">').join('')+'</div>').join('')}
  h+='</div>';document.body.insertAdjacentHTML('beforeend',h)}
window.addEventListener('hashchange',()=>location.reload());
connect();render();
