// ---------- vues
function view(){const a=$('#app');
 if(!unlocked){a.innerHTML=`<div class="card"><h2>Accès réservé à l'enseignant</h2><div class="row"><label>Code enseignant<br><input id="tc" type="password" autocomplete="off" style="width:240px"></label><button class="btn" id="tgo">Entrer</button></div><div id="tmsg" class="mut">Le code n'est pas enregistré sur cet appareil.</div></div>`;
  const go=async()=>{const v=$('#tc').value;if(!v)return;$('#tmsg').textContent='Vérification…';if(await unlock(v)){unlocked=true;await boot()}else{$('#tmsg').innerHTML='<span class="ko">Code incorrect.</span>'}};
  $('#tgo').onclick=go;$('#tc').onkeydown=e=>{if(e.key==='Enter')go()};return}
 if(!P||P.phase==='setup')return viewSetup();
 if(P.phase==='assign')return viewAssign();
 return viewRun()}
async function boot(){const c=(qs.get('s')||'').toUpperCase();
 if(c){P=loadP();if(!P||P.code!==c){const r=await restore(c);P=r?{code:c,nt:r.nt,assign:r.assign||{},phase:r.phase||'assign'}:{code:c,nt:0,assign:{},phase:'setup',lost:true};saveP()}}
 else P=null;
 view();if(P&&P.phase==='run')live()}
function viewSetup(){const a=$('#app'),old=loadP();
 a.innerHTML=`<div class="card"><h2>Nouvelle séance</h2>${P&&P.lost?'<div class="banner ko">Séance introuvable pour ce code. Créez une nouvelle séance.</div>':''}<div class="row"><label>Nombre de tables (1 à ${MAXT})<br><input id="nt" type="number" min="1" max="${MAXT}" value="${old&&old.nt||4}" style="width:100px"></label><button class="btn" id="mk">Créer la séance</button></div><div class="mut">Chaque table compte de 2 à ${MAXJ} joueurs et choisit un scénario différent.</div></div>
 ${old&&old.code?`<div class="card"><h2>Reprendre la dernière séance</h2><div class="mut">Code ${esc(old.code)} · ${old.nt} table(s) · ${old.phase==='run'?'en cours':'choix des scénarios'}</div><p><button class="btn sec" id="rs">Reprendre</button></p></div>`:''}`;
 $('#mk').onclick=()=>{const n=Math.max(1,Math.min(MAXT,parseInt($('#nt').value)||0));if(!n)return;P={code:newCode(),nt:n,assign:{},phase:'assign'};saveP();pubSess();history.replaceState(null,'','?s='+P.code+(qs.get('relay')?'&relay='+encodeURIComponent(qs.get('relay')):''));view()};
 const r=$('#rs');if(r)r.onclick=()=>{P=old;history.replaceState(null,'','?s='+P.code);view();if(P.phase==='run')live()}}
function pubSess(){post(topicSess(P.code),{k:'sess',nt:P.nt,assign:P.assign,phase:P.phase})}
function used(){return Object.values(P.assign)}
function viewAssign(){const a=$('#app'),n=Object.keys(P.assign).length;
 a.innerHTML=`<div class="card"><h2>Choix des scénarios · séance ${esc(P.code)}</h2>
 <div class="banner"><b>Vous allez devoir choisir un scénario par table : un seul, et le préciser à l'enseignant.</b><br>Deux tables ne peuvent pas choisir le même scénario.</div>
 <div class="mut">Lien enseignant de cette séance (à n'ouvrir que par vous) : <span class="link">${esc(BASE+'prof/?s='+P.code)}</span></div></div>
 <div class="card"><div class="grid">${SC.map(s=>{const t=P.assign[s.k]||'';return `<div class="sc ${t?'on':''}"><b>${esc(s.n)}</b><div class="mut">${esc(s.o)}</div><div class="row"><label>Table<br><select data-k="${s.k}"><option value="">—</option>${Array.from({length:P.nt},(_,i)=>i+1).map(i=>`<option value="${i}" ${String(t)===String(i)?'selected':''} ${used().includes(String(i))&&String(t)!==String(i)?'disabled':''}>${i}</option>`).join('')}</select></label></div></div>`}).join('')}</div>
 <p><b>${n} scénario(s) attribué(s) sur ${P.nt} table(s).</b> <span id="av"></span></p><p><button class="btn" id="val">Valider les choix</button> <button class="btn sec" id="rst">Annuler la séance</button></p></div>`;
 document.querySelectorAll('select[data-k]').forEach(s=>s.onchange=()=>{const k=s.dataset.k;if(s.value)P.assign[k]=s.value;else delete P.assign[k];saveP();view()});
 $('#val').onclick=()=>{const n=Object.keys(P.assign).length;if(n!==P.nt){$('#av').innerHTML=`<span class="ko">Il faut ${P.nt} attributions (une par table) : il en manque ${P.nt-n>0?P.nt-n:0}${n>P.nt?', il y en a '+(n-P.nt)+' en trop':''}.</span>`;return}
  P.phase='run';saveP();pubSess();view();live()};
 $('#rst').onclick=()=>{if(confirm('Annuler cette séance ?')){P=null;try{localStorage.removeItem(LS)}catch(e){}history.replaceState(null,'','?');view()}}}
const retained=()=>SC.filter(s=>P.assign[s.k]).sort((a,b)=>(+P.assign[a.k])-(+P.assign[b.k]));
const urlP=s=>BASE+s.k+'/?s='+P.code+'&t='+P.assign[s.k]+RQ;
const urlT=s=>BASE+s.k+'/?tour='+P.assign[s.k]+'&s='+P.code+'&k='+tkey(P.code,P.assign[s.k])+RQ;
const msgT=s=>'Opération '+s.n+' ('+s.o+') · Table '+P.assign[s.k]+'\n\nLien joueurs (tous les membres de la table) :\n'+urlP(s)+'\n\nLien de la tour de contrôle de la table :\n'+urlT(s)+'\n';
function copyTxt(t){return (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()})}
function viewRun(){const a=$('#app'),R=retained();
 a.innerHTML=`<div class="card"><h2>Séance ${esc(P.code)} · ${P.nt} table(s)</h2><div class="banner"><b>Chaque table reçoit deux liens</b> : le <b>lien joueurs</b> (PC ou téléphone, pour tous les membres de la table, 2 à ${MAXJ} joueurs) et le <b>lien de la tour de contrôle</b> de la table. Les QR codes servent de secours pour un étudiant sans PC.</div>
 <p class="noprint"><button class="btn" id="cpall">Copier tous les liens de toutes les tables</button> <span id="cpmsg" class="mut"></span></p></div>
 ${R.map(s=>`<div class="card"><h2>Table ${esc(P.assign[s.k])} · ${esc(s.n)}</h2><div class="mut">${esc(s.o)}</div>
 <div class="grid2"><div class="qrc"><div class="qrt">Lien joueurs</div><a class="link" href="${esc(urlP(s))}" target="_blank" style="color:#111">${esc(urlP(s))}</a><button class="btn sm noprint" data-cp="p" data-k="${s.k}">Copier</button>${qrSvg(urlP(s),180)}<div class="mut">Pas de PC ? Scannez ce QR.</div></div>
 <div class="qrc"><div class="qrt">Lien de la tour de contrôle</div><a class="link" href="${esc(urlT(s))}" target="_blank" style="color:#111">${esc(urlT(s))}</a><button class="btn sm noprint" data-cp="t" data-k="${s.k}">Copier</button>${qrSvg(urlT(s),180)}<div class="mut">Pas de PC ? Scannez ce QR.</div></div></div>
 <div class="row noprint"><button class="btn sec" data-cp="b" data-k="${s.k}">Copier les 2 liens</button><label>Envoyer par mail à<br><input type="text" data-mail="${s.k}" placeholder="adresse(s) mail, séparées par des virgules" style="width:340px"></label><button class="btn" data-send="${s.k}">Envoyer par mail</button></div></div>`).join('')}
 <div class="card"><h2>Chronomètre</h2><div class="row"><label>Atelier<br><select id="tat">${ATL.map(x=>`<option value="${x[0]}">${x[1]} · ${x[2]} min</option>`).join('')}</select></label><label>Minutes<br><input id="tmin" type="number" style="width:90px" placeholder="auto"></label><button class="btn" id="tst">Démarrer</button><button class="btn sec" id="tsp">Arrêter</button></div><div class="big" id="tmr">--:--</div></div>
 <div class="card"><h2>Avancement des tables</h2><div id="dash"></div></div>
 <p class="noprint"><button class="btn sec" onclick="window.print()">Imprimer cette page (QR)</button> <button class="btn sec" id="back">Revenir au choix des scénarios</button> <button class="btn sec" id="end">Terminer / nouvelle séance</button></p>`;
 const say=t=>{const m=$('#cpmsg');if(m)m.textContent=t;setTimeout(()=>{if(m)m.textContent=''},3000)};
 $('#cpall').onclick=()=>copyTxt(retained().map(msgT).join('\n————————————\n')).then(()=>say('Liens de toutes les tables copiés.'));
 document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{const s=SC.find(x=>x.k===b.dataset.k),w=b.dataset.cp;copyTxt(w==='p'?urlP(s):w==='t'?urlT(s):msgT(s)).then(()=>{const o=b.textContent;b.textContent='Copié ✔';setTimeout(()=>b.textContent=o,1500)})});
 document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>{const s=SC.find(x=>x.k===b.dataset.send),to=(document.querySelector('[data-mail="'+s.k+'"]').value||'').split(/[;,\s]+/).filter(Boolean).join(',');location.href='mailto:'+to+'?subject='+encodeURIComponent('Opération '+s.n+' · Table '+P.assign[s.k])+'&body='+encodeURIComponent(msgT(s))});
 $('#tst').onclick=()=>{const at=$('#tat').value,mi=parseInt($('#tmin').value)||ATL.find(x=>x[0]===at)[2];const o={k:'timer',at,start:Date.now(),dur:mi*60000};NETt=o;retained().forEach(s=>post(topicOf(s.k,P.code),{...o}));tick()};
 $('#tsp').onclick=()=>{const o={k:'timer',at:'',start:0,dur:0,stop:true};NETt=null;retained().forEach(s=>post(topicOf(s.k,P.code),{...o}));tick()};
 $('#back').onclick=()=>{if(confirm('Revenir au choix ? Les QR déjà distribués ne correspondront plus.')){P.phase='assign';saveP();pubSess();closeLive();view()}};
 $('#end').onclick=()=>{if(confirm('Terminer cette séance ?')){closeLive();P=null;try{localStorage.removeItem(LS)}catch(e){}history.replaceState(null,'','?');view()}};
 dash()}
// ---------- direct
function closeLive(){es.forEach(e=>e.close());es=[];T={};clearInterval(timerInt)}
function tb(n){return T[n]=T[n]||{joins:{},kicks:{},st:null,tow:null}}
function onMsg(m){if(!m||!m.k||!m.tb&&m.k!=='timer')return;const t=m.tb?tb(m.tb):null;
 if(m.k==='join'){const key=String(m.name||'').trim().toLowerCase();if(key&&m.ts>(t.kicks[key]||0))t.joins[key]={vid:m.vid,ts:m.ts,n:m.name}}
 else if(m.k==='kick'){const key=String(m.name||'').trim().toLowerCase();t.kicks[key]=m.ts;if(t.joins[key]&&t.joins[key].ts<=m.ts)delete t.joins[key]}
 else if(m.k==='tow'){t.tow={vid:m.vid,ts:m.ts}}
 else if(m.k==='st'){if(!t.st||m.ts>=t.st.ts)t.st=m}
 clearTimeout(onMsg.t);onMsg.t=setTimeout(dash,300)}
function live(){closeLive();retained().forEach(s=>{try{const e=new EventSource(RELAY+'/'+topicOf(s.k,P.code)+'/sse?since=12h');e.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==='message'&&m.message)onMsg(JSON.parse(m.message))}catch(x){}};es.push(e)}catch(x){}});
 timerInt=setInterval(()=>{tick();dash()},1000);tick()}
function tick(){const el=$('#tmr');if(!el)return;if(!NETt||NETt.stop){el.textContent='--:--';return}const r=NETt.start+NETt.dur-Date.now();const a=Math.abs(Math.round(r/1000)),mm=String(Math.floor(a/60)).padStart(2,'0'),ss=String(a%60).padStart(2,'0');el.textContent=(r<0?'−':'')+mm+':'+ss;el.style.color=r<0?'var(--ko)':''}
function ago(t){if(!t)return '—';const m=Math.floor((Date.now()-t)/60000);return m<1?'à l\'instant':'il y a '+m+' min'}
function dash(){const d=$('#dash');if(!d||!P||P.phase!=='run')return;if(d.contains(document.activeElement)&&document.activeElement.tagName==='INPUT')return;
 const R=retained();
 d.innerHTML=`<div style="overflow-x:auto"><table><tr><th>Table</th><th>Scénario</th><th>Joueurs</th><th>Tour</th><th>En cours</th>${ATL.slice(0,5).map(a=>`<th>A${a[0].slice(1)}</th>`).join('')}<th>Pts</th><th>Aides (par joueur)</th><th>Activité</th></tr>${R.map(s=>{const n=P.assign[s.k],t=tb(n),J=Object.values(t.joins),st=t.st||{},ap=st.ap||{};
  const tw=t.tow&&Date.now()-t.tow.ts<70000;
  return `<tr><td><b>${esc(n)}</b></td><td>${esc(s.n)}</td><td>${J.length?J.map(j=>`<span class="chip">${esc(j.n)} <a href="#" data-kick="${esc(n)}" data-name="${esc(j.n)}" title="Retirer ce joueur" style="text-decoration:none">✕</a></span>`).join(''):'<span class="mut">aucun</span>'}${J.length>MAXJ?`<div class="ko">${J.length} joueurs : limite ${MAXJ}</div>`:''}<div class="mut">${J.length} joueur(s)</div></td><td>${tw?'<span class="ok">ouverte</span>':'<span class="mut">–</span>'}</td><td>${esc(st.cs||'–')}</td>${ATL.slice(0,5).map(a=>{const p=(st.prog||{})[a[0]]||0,ok=(st.ok||{})[a[0]];return `<td>${ok?'<span class="ok">✔</span>':p>0?Math.round(100*p)+' %':'<span class="mut">–</span>'}<div class="bar"><i style="width:${Math.round(100*p)}%"></i></div></td>`}).join('')}<td><b>${st.tot!=null?Math.round(st.tot*10)/10:'–'}</b></td><td>${st.aid||0}${Object.keys(ap).length?' · '+Object.entries(ap).map(([w,c])=>esc(w)+' '+c).join(', '):''}</td><td>${ago(st.last||st.ts)}</td></tr>`}).join('')}</table></div>`;
 d.querySelectorAll('[data-kick]').forEach(a=>a.onclick=e=>{e.preventDefault();const n=a.dataset.kick,nm=a.dataset.name;if(!confirm('Retirer '+nm+' de la table '+n+' ?'))return;const s=SC.find(x=>String(P.assign[x.k])===String(n));const o={k:'kick',tb:String(n),name:nm};post(topicOf(s.k,P.code),o);onMsg({...o,ts:Date.now()})})}
view();
</script></body></html>
