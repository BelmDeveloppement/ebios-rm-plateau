es, emplacement des armoires.", "BS9", "SS3"], ["O11", "Rentrer", "Hameçonnage d'un technicien de l'intégrateur et vol de sa session VPN.", "BS7", "SS1"], ["O12", "Rentrer", "Vol d'un ordinateur portable commercial dans un train.", "Portable commercial", "aucune"], ["O13", "Trouver", "Repérage des volumes qui contiennent les recettes d'alliages.", "BS4", "SS2"], ["O14", "Exploiter", "Rançongiciel sur SCADA et MES, suppression des sauvegardes accessibles en ligne.", "BS2, BS3", "SS1"], ["O15", "Trouver", "Identification de l'automate du four et de ses consignes de température.", "BS1", "SS3"]], "roles": [{"id": "R01", "title": "RSSI", "sub": "Animateur de l'analyse", "mission": "Garant de la méthode. Tient la synthèse, relit les cotations, veille au temps.", "at": [{"q": "Chaque valeur métier a-t-elle au moins un bien support, chaque bien support une valeur métier ? L'ER décrit-il l'atteinte, pas l'attaque ?", "rep": "Faites justifier chaque gravité par un calcul (jours × 378 k€). Pour le socle : relisez la phrase du constat avant de choisir Conforme, Partiel ou Écart.", "pos": "Un taux de conformité honnête, même faible, plutôt qu'un taux flatteur."}, {"q": "Quelle phrase de la carte justifie ce M, ce R, ce A ? Tous les ER G3 et G4 sont-ils couverts ?", "rep": "Faites utiliser toute l'échelle 1 à 4. Deux sources ne peuvent pas avoir exactement les mêmes cotations.", "pos": "Retenir peu de sources, mais couvrir tous les ER graves."}, {"q": "Pouvons-nous dire à voix haute la phrase « source → partie prenante → événement redouté » ? Les critères A, B, C ont-ils chacun leur preuve ?", "rep": "Vérifiez que chaque niveau de menace est écrit D × P, M × C, quotient. Exigez 3 scénarios, pas 4.", "pos": "Des mesures d'écosystème qui agissent sur la variable en cause."}, {"q": "Chaque action suit-elle logiquement la précédente ? Quels biens supports reviennent le plus souvent dans les chaînes ?", "rep": "Aidez l'équipe à tenir la règle : V d'étape = 4 − freins ; V du scénario = minimum. Faites noter les biens supports critiques.", "pos": "La V de l'atelier 4 remplace celle de l'atelier 3."}, {"q": "Le budget est-il respecté ? Chaque risque accepté a-t-il un responsable, un indicateur et une date de revue ?", "rep": "Préparez la décision d'acceptation : « Risque ___, G×V = ___, accepté par le DG pour ___ mois. Responsable : le RSSI. Indicateur : ___. »", "pos": "Aucun risque Élevé ou Critique accepté sans signature et sans suivi."}], "piege": "Décider seul au nom de l'équipe. Votre rôle est de conduire, pas de trancher les cotations métier.", "phrase": "« Montrez-moi le calcul, puis la preuve. »", "vie": "Dans une organisation comme FERROMEUSE Aciers Spéciaux, le RSSI est souvent seul ou presque : il rédige la politique de sécurité, relaie les alertes, prépare les audits et doit convaincre une direction qui arbitre d'abord entre ses priorités métier. Il est rarement le décideur : il éclaire, il documente, il fait signer. Situation réelle : avant le vote du budget, la direction demande « de quoi a-t-on besoin, et pourquoi ? » ; la seule réponse recevable est une analyse de risque chiffrée et lisible."}, {"id": "R02", "title": "Directeur industriel", "sub": "Valeurs métier", "mission": "Défend les missions et arbitre les gravités. Connaît le coût d'un arrêt.", "at": [{"q": "Combien de jours peut-on tenir en mode dégradé ? À partir de quand l'indisponibilité devient-elle inacceptable ?", "rep": "Utilisez 378 k€ par jour. Un arrêt de 12 jours = 4,5 M€ : G3. Rattachez chaque bien support à la ou aux valeurs métier qu'il soutient.", "pos": "Les gravités sont calculées, pas ressenties."}, {"q": "Quelle source de risque s'attaquerait à mon activité ? Laquelle a un intérêt à nous mettre sous pression ?", "rep": "Pensez à l'activité (A) : combien d'organisations du secteur ont été paralysées récemment ? C'est ce qui fait monter A.", "pos": "Ne pas laisser sortir de l'étude une source qui peut arrêter l'activité."}, {"q": "Quelle partie prenante, si elle tombe ou est compromise, arrête mon activité ? Combien de temps pour la remplacer ?", "rep": "Vous êtes la meilleure source pour juger D (dépendance) : plus la partie prenante est difficile à remplacer vite, plus D est haut.", "pos": "Protéger en priorité les PP qui ont un accès direct aux systèmes critiques."}, {"q": "Quels biens supports l'attaquant doit-il toucher pour provoquer l'ER1 ? Que vous manque-t-il pour rester en mode dégradé ?", "rep": "Aidez à distinguer l'action qui provoque l'impact (Exploiter) de celle qui ne fait que préparer.", "pos": "Les sauvegardes et le mode dégradé réduisent la gravité, pas la vraisemblance."}, {"q": "Quelle mesure me rend le plus de jours de service ? Que peut-on laisser accepter sans mettre l'activité en danger ?", "rep": "Comparez les gains par jeton avec la direction financière. Une mesure qui réduit G (sauvegardes) vaut autant qu'une qui réduit V.", "pos": "Réduire la durée d'un arrêt avant de réduire sa probabilité."}], "piege": "Sous-estimer ce qu'un jour d'arrêt coûte, parce que « on s'en est toujours sorti ».", "phrase": "« Combien de jours, et combien par jour ? »", "vie": "Le poste « Directeur industriel » porte la continuité de l'activité de FERROMEUSE Aciers Spéciaux : astreintes, fournisseurs, plans de continuité. Il connaît le prix d'un jour de service dégradé, car il le vit en gestion de crise. Situation réelle : lors d'une panne informatique de plusieurs jours dans une organisation comparable, l'activité est repassée au papier et au téléphone, et chaque jour coûte en heures supplémentaires, en clients mécontents et en perte de service rendu."}, {"id": "R03", "title": "Responsable automatisme", "sub": "Systèmes industriels", "mission": "Connaît automates, SCADA, réseau OT. Décrit les modes opératoires crédibles.", "at": [{"q": "Quels biens supports portent l'activité ? Quel équipement n'a pas de valeur métier derrière lui ?", "rep": "Reliez chaque bien support de la liste aux valeurs métier : un bien support peut en soutenir plusieurs (serveur MES : plusieurs valeurs métier).", "pos": "Rien ne reste « orphelin » sur la feuille 1."}, {"q": "Un technicien interne a-t-il des moyens ? Que sait-il faire sans outils ?", "rep": "L'initié a des ressources élevées parce qu'il possède des accès légitimes et connaît les procédures.", "pos": "Ne pas écarter l'initié parce qu'il n'est « pas un hacker »."}, {"q": "Quel prestataire a un accès permanent à nos systèmes ? Lequel entre dans les locaux avec un badge ou un compte partenaire ?", "rep": "Vous savez ce qui explique P (pénétration) : accès permanent, compte partagé, badge, support amovible. Une PP avec un accès direct aux systèmes critiques est un relais crédible.", "pos": "Faire valider les chemins par le terrain : un chemin que vous jugez impossible doit être justifié."}, {"q": "Pour atteindre automates programmables (≈140), que doit savoir faire l'attaquant ? Quel accès lui faut-il ? Qui peut le remarquer ?", "rep": "Vous connaissez les freins : F1 (savoir-faire sur les systèmes), F3 (accès + présence + cible accessible), F4 (une anomalie remarquée par l'exploitation). Rappel : une règle en Écart ne freine pas.", "pos": "Des chaînes réalistes : les mêmes actions ne conviennent pas à tous les scénarios."}, {"q": "Quelle mesure est applicable dans mes équipes en moins de six mois ? Laquelle suppose un arrêt de service ?", "rep": "Cloisonnement, bastion d'accès, verrouillage local : dites ce qui est faisable et ce qui ne l'est pas.", "pos": "Un plan que les équipes peuvent réellement mettre en œuvre."}], "piege": "Trop techniser : l'atelier 4 décrit des actions sur des biens supports, pas des lignes de code.", "phrase": "« Sur le terrain, voilà comment ça se passe. »", "vie": "Le poste « Responsable automatisme » connaît les systèmes de l'intérieur : architectures, accès d'administration, interventions de prestataires. Il vit entre astreintes, contraintes des éditeurs et délais d'intervention. Situation réelle : un prestataire arrive tôt le matin avec un accès temporaire pour une intervention ; personne ne vérifie ce qu'il fait ensuite, et le support amovible qu'il branche n'a jamais été contrôlé."}, {"id": "R06", "title": "Responsable HSE", "sub": "Sécurité des personnes", "mission": "Porte l'événement redouté de sécurité. Peut imposer un veto sur l'acceptation.", "at": [{"q": "Quel événement redouté touche à ce qui ne se négocie pas (sécurité, conformité, solvabilité) ? Y a-t-il une atteinte qui reste invisible pendant des heures ?", "rep": "Dès qu'une atteinte qualitative est décrite en G4, la gravité est G4 sans calcul d'argent. Rattachez les biens supports concernés à la valeur métier correspondante.", "pos": "Une ER qui nomme explicitement l'enjeu critique."}, {"q": "Quelle source viserait cet enjeu ? Qui a assez de moyens et d'accès pour le faire ?", "rep": "Un initié a des accès légitimes ; un hacktiviste n'a pas les moyens d'agir en profondeur. Ne laissez pas ER4 sans source retenue.", "pos": "Couvrir ER4 par au moins un couple retenu."}, {"q": "Qui entre physiquement ou logiquement dans les zones sensibles ? Avec quel contrôle ?", "rep": "Un accès partenaire (compte, badge) donne une pénétration forte. La menace est élevée si la maturité cyber est minimale (PP7 : 3,0).", "pos": "Un chemin crédible pour ER4 par le relais le moins mûr."}, {"q": "Combien de personnes ou de conditions faut-il réunir pour modifier une consigne sans être vu ? Quelle alerte remarquerait-on ?", "rep": "Frein F3 : plusieurs conditions cumulées. Frein F4 : alarmes remarquées. N'oubliez pas : sans journalisation, pas de détection.", "pos": "Des étapes qui ne sous-estiment pas la facilité de l'accès."}, {"q": "Le risque touchant mon périmètre est-il revenu à un niveau que j'accepte ? Sinon, quelle mesure supplémentaire ?", "rep": "Quand un risque relève du veto, posez le jeton noir : le DG doit choisir une mesure en plus, pas accepter.", "pos": "Aucun risque critique accepté sans mon avis écrit."}], "piege": "Utiliser le veto sans proposer d'alternative : le DG a besoin d'une mesure concrète à choisir.", "phrase": "« Là où l'enjeu est vital, le coût passe après. »", "vie": "Le poste « Responsable HSE » (expertise : sécurité des personnes) veille à ce qui ne se négocie pas : sécurité, conformité, intégrité. Sa responsabilité, et celle de la direction, peut être engagée en cas de manquement. Situation réelle : un paramètre modifié ou une consigne falsifiée peut avoir des conséquences graves en quelques heures, bien avant que le service informatique ne le voie."}, {"id": "R10", "title": "Directeur général", "sub": "Décision", "mission": "Arbitre en fin d'atelier 5. Accepte ou refuse les risques résiduels.", "at": [{"q": "Quelles sont nos obligations légales, nos engagements envers nos clients ou usagers ? Qu'est-ce qui ne doit jamais s'arrêter ?", "rep": "Écoutez le directeur des opérations et le titulaire du veto : la valeur métier passe avant la technique.", "pos": "Le cadre de l'étude validé par la direction."}, {"q": "Pourquoi retenir cette source et pas celle-là ? Ai-je tous les ER graves couverts ?", "rep": "Demandez le contrôle de couverture : si un ER grave n'est atteint par aucune source retenue, la sélection est trop étroite.", "pos": "Une sélection argumentée, pas exhaustive."}, {"q": "Ces mesures d'écosystème sont-elles réalistes avec nos prestataires ? Combien coûtent-elles ?", "rep": "Notez le coût total des ME retenues : elles s'ajouteront aux mesures M dans le budget de 14 jetons.", "pos": "Des mesures d'écosystème choisies avec le coût en tête."}, {"q": "Que retenez-vous de cet atelier pour ma décision ? Quels sont les biens supports critiques ?", "rep": "Demandez la liste des biens supports critiques : ce sont eux que le plan doit protéger.", "pos": "Une vue claire de ce qu'il faut protéger."}, {"q": "Quel risque résiduel j'accepte ? Qui en est responsable ? Quand le revoit-on ?", "rep": "Posez les trois questions : responsable, indicateur, date de revue. Si le titulaire du veto le pose, choisissez une mesure en plus.", "pos": "Décision écrite, signée, avec responsable, indicateur, revue."}], "piege": "Signer sans comprendre : vous ne pouvez pas accepter un risque que personne ne vous a expliqué.", "phrase": "« Qui est responsable, et quand revoit-on ? »", "vie": "Le poste « Directeur général » dirige l'organisation. Il arbitre entre directions, répond aux instances de gouvernance et signe les décisions. En matière de risque, il est celui qui accepte formellement, et donc qui assume. Situation réelle : après un incident, la question n'est pas « qui a échoué ? » mais « qui avait accepté ce risque, avec quelle information ? »"}], "hints": {"1": [["Ils listent des serveurs et des logiciels comme valeurs métier", "« Si vous changez de serveur, cet élément existe-t-il encore ? »", "« Que doit continuer à faire l'organisation même sans informatique ? »", "« Production laminage et traitement thermique est une valeur métier ; Automates programmables (≈140) est un bien support. »"], ["Ils écrivent « rançongiciel » ou « piratage » dans un ER", "« L'ER dit-il ce que veut l'attaquant ou ce que subit l'organisation ? »", "« Reformulez sans parler d'attaque : quelle atteinte (perte, altération, divulgation) de quelle valeur métier ? »", "« Arrêt du site A plus de 3 semaines » est un ER ; « rançongiciel sur un système » n'en est pas un."], ["Ils cotent la gravité au ressenti (« c'est grave »)", "« Combien de jours d'arrêt ? Combien coûte un jour ? »", "« Le dossier donne 378 k€ par jour d'arrêt. »", "« 12 jours × 378 k€ = 4 536 k€, soit G3. »"], ["Ils hésitent entre G3 et G4 pour ER4", "« Quel est le critère qui s'applique : le coût chiffré, ou une atteinte qualitative (sécurité, conformité, survie) ? »", "« Relisez la définition de G4 dans l'échelle du dossier : elle ne se limite pas au montant. »", "« ER4 : Perte de maîtrise d'un four de traitement → G4. »"], ["Ils notent le socle sans relire les constats", "« Quelle phrase du constat justifie votre état ? »", "« Écart : rien en place. Partiel : en place mais incomplet ou non testé. Conforme : en place et vérifié. »", "« R3 (Sauvegardes hors ligne des configurations d'automates) : partielle car la restauration n'a jamais été testée. R6 (Journalisation et détection sur le réseau industriel) : aucune journalisation, donc Écart. »"], ["Ils se trompent sur le taux de conformité", "« Combien de points au total, sur combien de règles ? »", "« Conforme 1, Partiel 0,5, Écart 0. »", "« 2,5 points sur 8 règles : 2,5 ÷ 8 ≈ 31 %. »"], ["Un bien support n'est rattaché à aucune valeur métier", "« Si ce bien tombe, quelle valeur métier souffre ? »", "« Cherchez ce qui dépend de lui : flux, personnes, locaux, données. »", "« Le tableau de référence de l'atelier 1 (section précédente) donne le rattachement attendu ; une autre proposition est acceptée si elle est justifiée. »"], ["Désaccord entre joueurs sur une cotation", "« Chacun peut-il la justifier en une phrase ? »", "« Le RSSI tranche après écoute ; chaque joueur a un droit de contestation par atelier. »", "« Notez la cotation retenue et la raison : un désaccord argumenté vaut mieux qu'un consensus mou. »"]], "2": [["Ils confondent objectif visé et événement redouté", "« Est-ce ce que veut la source, ou ce que redoute l'organisation ? »", "« Un objectif : gagner de l'argent. Un ER : arrêt du site a plus de 3 semaines. »", "« Le lien objectif → ER se fait à l'atelier 3. »"], ["Ils cotent toutes les sources de la même façon", "« Laquelle de ces deux sources est la plus active dans le secteur de l'organisation ? »", "« Utilisez toute l'échelle : 1 très faible, 4 très fort. »", "« SR6 (curieux) reste bas ; SR2 (rançongiciel) est haut sur l'activité. »"], ["Ils écartent l'initié parce que « ce n'est pas un hacker »", "« Que possède un salarié ou un intervenant interne qu'un attaquant externe n'a pas ? »", "« Des accès légitimes, la connaissance des procédures et des horaires. »", "« Ses ressources (R) montent à 3 : il n'a pas besoin d'outils. »"], ["Ils ne comprennent pas l'activité (A)", "« Combien d'attaques de ce type voit-on dans le secteur de l'organisation ? »", "« A mesure la fréquence observée, pas l'intérêt de la source. »", "« Les rançongiciels visant ce secteur sont très fréquents : A élevé. »"], ["Ils retiennent les 6 sources", "« Quel est le seuil de rétention ? »", "« Σ ≥ 8 retenu · 6 à 7 à surveiller · ≤ 5 écarté. »", "« La méthode sert à prioriser : une source à Σ = 5 sort de l'étude. »"], ["Un ER G3 ou G4 n'est atteint par aucun couple retenu", "« Qui pourrait agir sur le bien support de cet ER ? »", "« Regardez les sources à surveiller (6 à 7) ou relisez leurs R et A. »", "« ER4 (Perte de maîtrise d'un four de traitement) : l'initié SR4 est le seul acteur plausible. »"], ["Ils demandent la « bonne » valeur M, R, A", "« Quelle phrase de la carte justifie votre chiffre ? »", "« Aucune valeur n'est imprimée : reliez chaque chiffre à l'échelle du dossier. »", "« Une cotation avec une phrase de justification vaut mieux qu'un chiffre « exact ». »"], ["Σ = 7 : retenu ou pas ?", "« Quel est le seuil ? »", "« 7 est à surveiller : on ne l'analyse pas maintenant. »", "« Un aléa peut le faire basculer (défi 2.1). »"]], "3": [["Ils ne savent pas lire la carte PP", "« Quels sont les quatre nombres imprimés ? Quelle est la formule ? »", "« D × P au numérateur (ce qui monte la menace), M × C au dénominateur (ce qui la baisse). »", "« PP2 : D3 P4 M2 C2 → 12 ÷ 4 = 3,0. »"], ["Ils inversent la maturité", "« Une PP très mûre est-elle plus ou moins dangereuse ? »", "« M est au dénominateur : quand M monte, le niveau baisse. »", "« PP7 (M1) est plus dangereuse que PP3 (M4), toutes choses égales. »"], ["Ils hésitent sur une zone (3,0 ou 1,5 pile)", "« Le seuil est-il « ≥ » ou « > » ? »", "« Danger ≥ 3 · contrôle de 1,5 à moins de 3 · veille < 1,5. »", "« PP2 = 3,0 : danger. PP7 = 3,0 : danger. PP6 = 1,5 : contrôle. »"], ["Ils passent par PP3 (Client automobile) parce qu'elle est « grosse »", "« Dans quelle zone est PP3 ? Quelle est sa pénétration ? »", "« Une forte dépendance ne suffit pas : PP3 a P2, M4, C4. »", "« Cherchez une PP en danger ou en contrôle qui a un accès au bien support de l'ER. »"], ["Ils ne trouvent pas la PP du chemin", "« Quel ER vise ce couple ? Quel bien support y mène ? Qui y a accès ? »", "« Lisez la description au dos de chaque carte PP. »", "« ER1 : PP2 (Intégrateur SCADA) ou PP1. ER3 : PP6 (Hébergeur du jumeau numérique). ER4 : PP7 (Sous-traitant de maintenance mécanique). »"], ["Ils veulent passer par deux PP, ou par aucune", "« Une seule PP suffit-elle pour relier la source à l'ER ? »", "« Le second emplacement du couloir est facultatif ; sans relais, il n'y a pas de scénario d'écosystème. »", "« Gardez une PP ; ajoutez un second relais seulement si vous pouvez écrire pourquoi. »"], ["Ils cochent un critère sans preuve", "« Montrez-moi où c'est écrit. »", "« A : feuille 2 (Σ). B : radar. C : socle (feuille 1). »", "« SS1 : A : Σ de SR2 = 11 ≥ 9. B : PP2 niveau 3,0, zone danger. C : R2 en écart (télémaintenance) sur le chemin. »"], ["Ils comptent C mais la règle ne concerne pas le chemin", "« Quelle étape du chemin cette règle protège-t-elle ? »", "« La règle doit couvrir un maillon du chemin. »", "« SS2 : R1 en écart (MES relié au cloud sans zone démilitarisée). SS3 : R5 et R8 partielles (sensibilisation et clauses des prestataires). »"], ["Ils inventent la gravité du scénario", "« D'où vient G ? »", "« De l'ER visé, jamais du scénario. »", "« SS1 → ER1 = G4. »"], ["Ils choisissent une ME qui n'agit pas sur la bonne variable", "« Quelle variable fait monter le niveau de cette PP ? »", "« Chaque ME agit sur une seule variable (tableau des leviers, section 5). »", "« PP2 : P4 forte, M2 et C2 faibles → ME3 (P), ME1 (M), ME2 (C). PP7 : M1 → ME7 (ou ME5 sur P). »"], ["La PP reste en danger après leur ME", "« Avez-vous recalculé ? Quel est le nouveau niveau ? »", "« Un niveau de 3,0 reste en danger : il faut passer sous 3. »", "« PP2 avec ME1 : M passe à 3, 12 ÷ (3 × 2) = 2,0 : sortie de la zone danger. »"], ["Ils font quatre scénarios (SR1 et SR5 séparés)", "« Même ER, même PP : combien de scénarios ? »", "« Un seul ; on garde la source la plus pertinente pour le critère A. »", "« SR1 (Σ 9) rend A rempli ; SR5 (Σ 8) non. »"], ["Ils ne voient pas à quoi sert une ME", "« Que voulez-vous obtenir sur le radar ? »", "« Faire sortir la PP de la zone danger sans attendre qu'elle devienne parfaite. »", "« Après ME1, PP2 passe de 3,0 à 2,0 : elle reste en contrôle, mais n'est plus un rebond facile. »"]], "4": [["Ils ne comprennent pas ce que sont les cartes noires", "« Combien de cartes noires ? Combien d'emplacements ? »", "« Les cartes noires sont les cartes Opération : 15 cartes pour 12 emplacements. »", "« Chaque carte porte une phase, une action et un bien visé. »"], ["Plusieurs cartes « Rentrer » paraissent possibles", "« Quelle PP traverse votre scénario ? Quel bien support est visé ? »", "« Une seule carte par phase correspond à votre scénario. »", "« SS1 : Intégrateur SCADA (BS7). SS2 : Hébergeur du jumeau numérique (BS3). SS3 : Sous-traitant de maintenance mécanique (BS9). »"], ["Ils placent Exploiter avant Trouver, ou exfiltrent avant d'avoir repéré", "« Qu'a-t-on obtenu à l'étape précédente ? Peut-on agir sans cela ? »", "« Connaître → Rentrer → Trouver → Exploiter : chaque résultat rend le suivant possible. »", "« On n'exfiltre pas ce qu'on n'a pas localisé. »"], ["Ils ne repèrent pas les cartes hors sujet", "« Pour chaque carte restante, le bien visé est-il l'un des 10 biens supports ? »", "« Testez T1, puis T2 et T3. »", "« Site web vitrine, Wi-Fi invité, Portable commercial : aucun n'est l'un des 10 biens supports. »"], ["Ils ne savent pas appliquer un frein", "« Répondez oui ou non à F1, F2, F3, F4 pour cette étape. »", "« Un frein est un obstacle réel pour l'attaquant. »", "« SS1 Rentrer : F2 : R5 partielle (hameçonnage de prestataire, sensibilisation partielle) → V3. »"], ["Ils comptent un frein pour une règle en Écart", "« Cette règle protège-t-elle quelque chose aujourd'hui ? »", "« Écart : rien en place, donc pas de frein. Conforme ou Partiel : frein possible. »", "« R2 en Écart : pas de F2. R5 Partielle : F2. »"], ["Ils font la moyenne des V", "« Une chaîne résiste-t-elle mieux que son maillon le plus difficile ? »", "« V du scénario = la plus petite V des 4 étapes. »", "« SS1 : 4, 3, 3, 4 → V3. »"], ["Ils trouvent tous les biens supports critiques, ou aucun", "« Combien d'actions visent ce bien ? L'une est-elle un Rentrer ou un Exploiter ? »", "« Comptez sur les 12 cartes posées. Critique : au moins 2 actions dont un Rentrer ou un Exploiter. »", "« 6 biens supports répondent (BS1, BS2, BS3, BS4, BS7, BS9). »"], ["Leur V de l'atelier 4 diffère de celle de l'atelier 3", "« Qu'avez-vous appris en détaillant les actions ? »", "« C'est normal : l'atelier 4 affine. La V de l'atelier 4 remplace l'autre. »", "« Faites écrire la raison sur la feuille 2. »"], ["Ils veulent une action absente des cartes", "« Passe-t-elle les tests T1 à T4 ? »", "« Autorisée si elle est justifiée par les tests ; sinon utilisez la carte. »", "« Les chaînes de référence tiennent avec les cartes fournies. »"]], "5": [["Ils ne savent pas d'où viennent G et V", "« Quel ER vise le scénario ? Quelle est la plus petite V de ses étapes ? »", "« G : feuille 1. V : feuille 2, atelier 4. »", "« SS1 : ER1 G4, V3 → 12 · SS2 : ER3 G3, V2 → 6 · SS3 : ER4 G4, V2 → 8. »"], ["Ils utilisent la V de l'atelier 3", "« Quelle V a été confirmée par le détail des étapes ? »", "« La V du scénario opérationnel remplace celle du scénario stratégique. »", "« SS1 : V3 dans les deux ateliers ; SS2 et SS3 : V2. »"], ["Ils dépassent les 14 jetons", "« Combien de points de risque gagne-t-on par jeton ? »", "« Classez les mesures par gain par jeton. »", "« M7 : 2 points par jeton ; M8 : 0,67 mais traite SS3 (G4). »"], ["Ils ne recalculent pas G ou V", "« Que dit la carte : G, V, ou les deux ? »", "« Écrivez G × V avant, puis après. »", "« M2 : SS1 V3 → V2. M3 : SS1 G4 → G3. »"], ["Ils cumulent M5 et ME1 + ME7", "« Ces deux lignes font-elles la même chose ? »", "« Elles agissent sur la maturité de PP2 et PP7. »", "« Ne les comptez pas deux fois. »"], ["Ils oublient le veto sécurité", "« Quel scénario touche le veto ? Qui détient le jeton noir ? »", "« SS3 vise ER4 (G4). »", "« Le veto s'exerce avant la signature du DG. »"], ["Ils veulent accepter un risque sans condition", "« Qui est responsable ? Quel indicateur ? Quelle date de revue ? »", "« Reprenez le modèle de formulation. »", "« Responsable : le RSSI · indicateur mesurable · revue à 6 mois. »"], ["Ils proposent la cyber-assurance (M12) pour réduire un risque", "« Change-t-elle G ou V ? »", "« Elle partage le coût d'un sinistre, elle ne réduit rien. »", "« « Partager » est une stratégie, mais sans recalcul de G × V. »"], ["Un bien support critique n'est couvert par aucune mesure", "« Quelle mesure protège ce bien ? »", "« Sinon, le risque associé doit être accepté explicitement. »", "« BS4 (Serveur de recettes et paramètres) : M6 non retenue, donc SS2 accepté. »"], ["Le budget n'est pas utilisé", "« Un risque élevé subsiste-t-il ? »", "« Le budget est un plafond, pas une obligation. »", "« Plan de référence : 13 jetons sur 14. »"]]}, "ref": {"vmbs": {"BS1": ["VM1", "VM4"], "BS2": ["VM1", "VM3", "VM4"], "BS3": ["VM1", "VM2", "VM5"], "BS4": ["VM3"], "BS5": ["VM2", "VM5"], "BS6": ["VM1"], "BS7": ["VM1"], "BS8": ["VM2", "VM3"], "BS9": ["VM1", "VM4"], "BS10": ["VM1", "VM4"]}, "cov": {"ER1": ["SR2"], "ER2": ["SR4"], "ER3": ["SR1", "SR5"], "ER4": ["SR4"], "ER5": ["SR2"], "ER6": ["SR2"]}, "pert": {"SR1": [3, 4, 2], "SR2": [4, 3, 4], "SR3": [2, 2, 2], "SR4": [3, 3, 2], "SR5": [3, 3, 2], "SR6": [1, 1, 3]}, "ss": [{"id": "SS1", "title": "Rançongiciel via l'intégrateur", "chain": "SR2 Cybercriminel → Intégrateur PP2 compromis → rebond par la télémaintenance → chiffrement SCADA et MES", "srs": ["SR2"], "pp": "PP2", "er": "ER1", "G": 4, "crit": [1, 1, 1], "V": 3, "why": "A : Σ de SR2 = 11 ≥ 9. B : PP2 niveau 3,0, zone danger. C : R2 en écart (télémaintenance) sur le chemin."}, {"id": "SS2", "title": "Vol des recettes via le cloud", "chain": "SR1 Étatique ou SR5 Concurrent → Hébergeur PP6 compromis → accès au serveur de recettes → exfiltration", "srs": ["SR1", "SR5"], "pp": "PP6", "er": "ER3", "G": 3, "crit": [1, 0, 1], "V": 2, "why": "A : Σ de SR1 = 9 ≥ 9 (SR5 = 8 ne suffit pas, on retient la plus pertinente). B : PP6 niveau 1,5, zone contrôle seulement. C : R1 en écart (MES relié au cloud sans zone démilitarisée)."}, {"id": "SS3", "title": "Sabotage d'un four par un initié", "chain": "SR4 Initié + sous-traitant PP7 (badge, accès physique) → modification des consignes du four", "srs": ["SR4"], "pp": "PP7", "er": "ER4", "G": 4, "crit": [0, 1, 1], "V": 2, "why": "A : Σ de SR4 = 8 < 9. B : PP7 niveau 3,0, zone danger. C : R5 et R8 partielles (sensibilisation et clauses des prestataires)."}], "etapes": {"SS1": [{"op": "O6", "phase": "Connaître", "V": 4, "why": "aucun frein : sources ouvertes"}, {"op": "O11", "phase": "Rentrer", "V": 3, "why": "F2 : R5 partielle (hameçonnage de prestataire, sensibilisation partielle) ; R2 en écart : pas de frein"}, {"op": "O2", "phase": "Trouver", "V": 3, "why": "F1 : il faut connaître les protocoles et comptes industriels ; R1 et R6 en écart, pas de frein"}, {"op": "O14", "phase": "Exploiter", "V": 4, "why": "aucun frein : postes obsolètes (R4 en écart), rançongiciel courant"}], "SS2": [{"op": "O9", "phase": "Connaître", "V": 4, "why": "aucun frein : sources ouvertes"}, {"op": "O4", "phase": "Rentrer", "V": 2, "why": "F3 : mot de passe réutilisé ET sans second facteur côté hébergeur ; F4 : l'hébergeur surveille les connexions d'administration"}, {"op": "O13", "phase": "Trouver", "V": 3, "why": "F1 : il faut savoir repérer les volumes de recettes dans l'architecture MES/cloud"}, {"op": "O1", "phase": "Exploiter", "V": 3, "why": "F1 : exfiltration lente et discrète demande du savoir-faire"}], "SS3": [{"op": "O10", "phase": "Connaître", "V": 4, "why": "aucun frein : l'initié connaît déjà procédures et horaires"}, {"op": "O3", "phase": "Rentrer", "V": 2, "why": "F3 : présence physique + badge de sous-traitant valide + armoire accessible ; F4 : passage dans la salle de contrôle remarqué"}, {"op": "O15", "phase": "Trouver", "V": 4, "why": "aucun frein : l'initié est technicien, il connaît l'automate"}, {"op": "O7", "phase": "Exploiter", "V": 3, "why": "F4 : un opérateur peut remarquer l'inhibition d'alarmes"}]}, "meplan": {"PP2": 1, "PP7": 1}, "crit": ["BS1", "BS2", "BS3", "BS4", "BS7", "BS9"], "horsSujet": ["O5", "O8", "O12"], "danger": ["PP2", "PP7"]}, "guide": [{"id": "intro", "title": "Présentation", "blocks": [["p", "t", "OPÉRATION FERROMEUSE"], ["p", "st", "Jeu de plateau d'acculturation à EBIOS RM · scénario industriel OT/ICS"], ["p", "st", "CONSIGNES DES JOUEURS"], ["t", [["Public", "Master 2 cybersécurité (adaptable à des cadres en entreprise)"], ["Durée", "Journée de cours de 7 heures, pauses comprises : présentation (30 min), quiz (45 min), puis jeu de plateau (4 h 45)"], ["Joueurs", "4 à 5 par table (5 rôles au maximum)"], ["Méthode", "EBIOS Risk Manager (ANSSI, Club EBIOS) : les 5 ateliers"], ["Entreprise", "FERROMEUSE Aciers Spéciaux, cas fictif : aucun lien avec une entreprise réelle"], ["Ce document", "Règles, dossier de scénario et une fiche par atelier (chaque atelier commence sur une nouvelle page, vous pouvez les imprimer séparément). Il ne contient aucune réponse."]]], ["p", "note", "© 2026 BEL'M DEVELOPPEMENT – Tous droits réservés. Création originale, indépendante du Club EBIOS et de l'ANSSI ; EBIOS Risk Manager est une méthode publiée par l'ANSSI avec le Club EBIOS."]]}, {"id": "s1", "title": "1. Le jeu en bref", "blocks": [["p", "b", "Vous formez la cellule d'analyse de risque de FERROMEUSE, un sidérurgiste qui veut relier son usine à un jumeau numérique. À chaque atelier vous <b>lisez des cartes</b>, <b>posez des cartes sur le plateau</b>, <b>calculez</b>, <b>débattez</b> et remplissez une <b>feuille de travail</b>. L'animateur valide votre travail avant que vous avanciez. Les 5 ateliers du jeu sont les 5 ateliers de la méthode EBIOS RM : vous allez dérouler une analyse complète, des valeurs métier jusqu'à l'acceptation des risques."], ["p", "h2", "Ce que vous saurez faire à la fin de la journée"], ["p", "bl", "Situer les 5 ateliers d'EBIOS RM et leur enchaînement."], ["p", "bl", "Distinguer valeur métier, bien support, événement redouté, source de risque, partie prenante, scénario stratégique et scénario opérationnel."], ["p", "bl", "Coter une gravité, une pertinence, un niveau de menace et une vraisemblance, et justifier chaque cotation."], ["p", "bl", "Arbitrer un plan de traitement sous contrainte de budget et formaliser l'acceptation d'un risque résiduel."], ["p", "bl", "Travailler en équipe pluridisciplinaire, comme dans une entreprise."], ["p", "h2", "Le matériel, en un coup d'œil"], ["t", [["Élément", "À quoi il sert"], ["Plateau A1 du scénario", "Moitié gauche : emplacements des cartes (ateliers 3, 4 et 5). Moitié droite : les 4 feuilles de travail du scénario, imprimées sur le plateau. On écrit directement dessus (feutre effaçable sur support lisse, ou stylo)."], ["Cartes (6 couleurs)", "Bleu ENTREPRISE (atelier 1) · rouge MENACE (2) · vert ÉCOSYSTÈME et vert foncé MESURE ÉCOSYSTÈME (3) · noir OPÉRATION (4) · orange MESURE (5) · jaune RÔLE (avant le jeu). Les cartes violettes ALÉA appartiennent à l'animateur. Les cartes se lisent, puis se <b>posent sur les emplacements</b> du plateau aux ateliers 3, 4 et 5."], ["Feuilles du plateau", "Feuille 1 : atelier 1 · feuille 2 : atelier 2 (haut) et atelier 4 (bas) · feuille 3 : atelier 3 · feuille 4 : atelier 5 et débrief. La version 1 n'est <b>jamais effacée</b> : après un aléa, vous écrivez la version 2 dans le bloc « Après l'aléa ». Des exemplaires A4 de réserve existent."], ["Jetons (21)", "14 jetons jaunes = budget de l'atelier 5 · 2 bleus, 2 rouges, 2 verts = marqueurs SS1, SS2, SS3 dans la matrice (avant, après) · 1 jeton noir = veto sécurité."], ["Stylos, calculatrice", "Les calculs sont écrits ligne par ligne, à côté du résultat, sur la feuille."]]], ["p", "h2", "Les rôles (4 à 5 joueurs)"], ["p", "b", "Il y a <b>5 rôles</b> ; chaque joueur reçoit une carte <b>Rôle</b> et sa fiche. Un rôle donne un point de vue et une responsabilité. Deux responsabilités s'ajoutent à la carte : le <b>DG (R10) tient les 14 jetons de budget</b> (il fait aussi le rôle de la finance) et le <b>responsable technique (R03) joue l'attaquant</b> (Red Team) pour contester les scénarios. À quatre joueurs, le joueur R02 joue aussi R06 (veto sécurité). Au-delà de cinq joueurs, formez plusieurs tables."], ["t", [["Carte", "Rôle", "Expertise", "Mission dans le jeu"], ["R01", "RSSI", "Animateur de l'analyse", "Garant de la méthode. Tient la synthèse, relit les cotations, veille au temps."], ["R02", "Directeur industriel", "Valeurs métier", "Défend les missions et arbitre les gravités. Connaît le coût d'un arrêt."], ["R03", "Responsable automatisme", "Systèmes industriels", "Connaît automates, SCADA, réseau OT. Décrit les modes opératoires crédibles."], ["R06", "Responsable HSE", "Sécurité des personnes", "Porte l'événement redouté de sécurité. Peut imposer un veto sur l'acceptation."], ["R10", "Directeur général", "Décision", "Arbitre en fin d'atelier 5. Accepte ou refuse les risques résiduels."]]], ["t", [["Joueurs", "Répartition (cartes de rôle, « + » = même joueur)"], ["5", "R01 | R02 | R03 | R06 | R10"], ["4", "R01 | R02 + R06 | R03 | R10"]]]]}, {"id": "s2", "title": "2. Règles du jeu", "blocks": [["p", "h2", "Déroulement d'un atelier"], ["p", "bl", "<b>Brief de méthode</b> (5 minutes) : l'animateur rappelle les notions et les échelles. Vous retrouvez ce rappel dans votre fiche d'atelier."], ["p", "bl", "<b>Première version</b> : vous lisez les cartes, posez les cartes sur leurs emplacements, calculez et remplissez la feuille du plateau."], ["p", "bl", "<b>Aléa à mi-parcours</b> : quand votre première version est posée, l'animateur lit <b>une</b> carte Aléa. Elle change une donnée ou une contrainte. Vous <b>révisez</b> votre travail comme lors d'une revue en entreprise : ce qui change, le recalcul, la justification, dans le bloc « Après l'aléa » de la feuille."], ["p", "bl", "<b>Validation</b> : vous appelez l'animateur. Il contrôle, annonce « Validé » ou « À revoir » et attribue les points."], ["p", "h2", "Règles de table"], ["p", "bl", "<b>Le RSSI conduit</b> la discussion et tient la feuille, mais ne décide pas seul : toute cotation est justifiée à voix haute en une phrase."], ["p", "bl", "<b>Droit de contestation</b> : chaque joueur peut, une fois par atelier, contester une cotation. L'équipe la justifie ou la modifie. Le responsable technique (R03), qui joue l'attaquant, conteste en priorité les scénarios peu plausibles."], ["p", "bl", "<b>Veto sécurité</b> : le responsable HSE peut, avec le jeton noir VETO SÉCURITÉ, refuser qu'un risque touchant la sécurité des personnes soit accepté. Le DG doit alors choisir une mesure supplémentaire."], ["p", "bl", "<b>Décision du DG</b> : le directeur général tranche les désaccords à l'atelier 5 et signe l'acceptation des risques résiduels."], ["p", "bl", "<b>Calculs écrits</b> : un résultat sans calcul n'est pas validé."], ["p", "bl", "<b>Vos résultats peuvent différer de ceux de l'animateur.</b> Le corrigé est une référence, pas l'unique réponse possible. Les <b>calculs</b> (Σ, niveau de menace, G × V, coût en jetons) doivent être exacts. Les <b>choix</b> (couples retenus, partie prenante du chemin, mesures, cotations subjectives comme M, R, A ou les freins) peuvent différer d'un niveau, ou suivre un autre chemin, à condition d'être <b>justifiés par écrit</b> avec le vocabulaire de la méthode. L'animateur ne cherche pas à retrouver mot pour mot sa réponse : il vérifie que votre raisonnement tient."], ["p", "bl", "<b>Temps</b> : à la fin du temps imparti, l'animateur peut valider un travail incomplet avec des points partiels. Si vous finissez avant, demandez les défis flash (2 points de bonus au maximum par atelier)."], ["p", "h2", "Score"], ["p", "b", "Chaque atelier est noté : A1 sur 20, A2 sur 15, A3 sur 20, A4 sur 20, A5 sur 20, cohésion et temps sur 5, soit <b>100 points</b>. Chaque atelier valorise le raisonnement (calculs, justifications) et 2 points récompensent la qualité de la <b>révision après aléa</b>. Les points servent à comparer les tables et à repérer les notions fragiles, pas à classer les personnes."]]}, {"id": "s3", "title": "3. La journée", "blocks": [["t", [["Repère depuis le début du cours", "Durée", "Séquence"], ["0 h 00 – 0 h 30", "30 min", "Présentation EBIOS RM (PowerPoint)"], ["0 h 30 – 1 h 15", "45 min", "Quiz EBIOS RM (jeu de cartes)"], ["1 h 15 – 1 h 30", "15 min", "Prologue : objectifs, rôles, découverte de FERROMEUSE"], ["1 h 30 – 2 h 20", "50 min", "Atelier 1 · Cadrage et socle"], ["2 h 20 – 2 h 50", "—", "Pause de 30 minutes"], ["2 h 50 – 3 h 30", "40 min", "Atelier 2 · Sources de risque"], ["Coupure", "—", "Déjeuner (hors des 7 h)"], ["3 h 30 – 4 h 25", "55 min", "Atelier 3 · Écosystème et scénarios stratégiques"], ["4 h 25 – 4 h 55", "—", "Pause de 30 minutes"], ["4 h 55 – 5 h 50", "55 min", "Atelier 4 · Scénarios opérationnels"], ["5 h 50 – 6 h 30", "40 min", "Atelier 5 · Traitement du risque"], ["6 h 30 – 7 h 00", "30 min", "Débrief : comparaison des tables, scores"]]], ["p", "note", "Journée de 7 heures pauses comprises : présentation 30 + quiz 45 + jeu de plateau (15 + 50 + 40 + 55 + 55 + 40 + 30 = 285) = 360 minutes de travail, plus 2 pauses de 30 minutes. La coupure déjeuner n'est pas comptée. Les repères partent du début du cours : ils ne dépendent pas de l'heure de début de l'école."]]}, {"id": "s4", "title": "4. Dossier de scénario : FERROMEUSE", "blocks": [["p", "h2", "Fiche entreprise"], ["t", [["Raison sociale", "FERROMEUSE Aciers Spéciaux SAS (entreprise fictive, Meuse, Grand Est)"], ["Activité", "Laminage à chaud et traitement thermique d'aciers spéciaux pour l'automobile et l'aéronautique"], ["Taille", "640 salariés, 138 M€ de chiffre d'affaires, soit environ 378 k€ par jour (138 M€ ÷ 365)"], ["Sites", "Site A : laminoir (4 lignes) et traitement thermique. Site B : logistique et finition"], ["Clients", "Trois constructeurs et équipementiers représentent 55 % du chiffre d'affaires"], ["Certifications", "Qualité automobile et aéronautique (audit client chaque année)"], ["Projet stratégique", "« Usine 4.0 » : connecter le MES à un jumeau numérique hébergé dans le cloud"]]], ["p", "h2", "Système d'information et système industriel"], ["p", "bl", "Environ 140 automates programmables de deux constructeurs pilotent fours, laminoirs et convoyeurs."], ["p", "bl", "Une supervision SCADA sur postes Windows hérités affiche les 4 lignes en temps réel."], ["p", "bl", "Un MES planifie la production et alimente l'ERP. Un serveur de recettes stocke les compositions d'alliages."], ["p", "bl", "Une passerelle IT/OT et un pare-feu assurent une segmentation partielle."], ["p", "bl", "Le constructeur d'automates et l'intégrateur SCADA se connectent par VPN pour la télémaintenance."], ["p", "bl", "Des sous-traitants et des intérimaires accèdent à la salle de contrôle et aux armoires électriques avec des badges temporaires."], ["p", "h2", "Constats de l'audit interne sur le socle de sécurité (atelier 1 (socle))"], ["p", "note", "L'audit décrit la situation sans la noter : c'est à vous d'attribuer un état à chaque règle (Conforme, Partiel, Écart)."], ["t", [["Règle", "Constat de l'audit interne (sans notation)"], ["R1 Segmentation IT/OT", "Un pare-feu sépare bureautique et industriel, mais plusieurs flux directs existent (SCADA vers MES, accès du constructeur) sans zone démilitarisée industrielle."], ["R2 Télémaintenance", "Accès VPN du constructeur et de l'intégrateur : comptes partagés, sessions permanentes, aucun second facteur d'authentification."], ["R3 Sauvegardes", "Configurations d'automates sauvegardées hors ligne pour environ 60 % des automates ; aucune restauration n'a jamais été testée."], ["R4 Postes de supervision", "Postes SCADA Windows hérités : correctifs non appliqués depuis deux ans, durcissement inexistant."], ["R5 Sensibilisation", "80 % du personnel formé ; prestataires et intérimaires non formés."], ["R6 Détection OT", "Aucune journalisation ni détection sur le réseau industriel."], ["R7 Continuité", "Procédures de repli manuel testées chaque année sur les 4 lignes."], ["R8 Clauses contractuelles", "Des clauses de sécurité figurent dans 3 contrats sur 8 prestataires critiques."]]], ["p", "h3", "Contexte réglementaire (à discuter, non à affirmer)"], ["p", "note", "Selon son activité et sa taille, FERROMEUSE peut relever de réglementations européennes de cybersécurité (directive NIS 2) ou de référentiels de sécurité industrielle (famille IEC 62443). Votre animateur vous dira ce qu'il faut en retenir."]]}, {"id": "s5", "title": "5. Échelles et règles de calcul du jeu", "blocks": [["p", "note", "Ces règles sont des <b>simplifications pédagogiques</b>. À la fin de la journée, vous les comparerez aux échelles du guide officiel de l'ANSSI."], ["t", [["Gravité", "Définition"], ["G1 Mineure", "Perte inférieure à 50 k€, arrêt de quelques heures sur une ligne"], ["G2 Significative", "50 à 500 k€, arrêt de plusieurs heures à un jour"], ["G3 Grave", "0,5 à 5 M€, client directement touché, certification menacée"], ["G4 Critique", "Plus de 5 M€, atteinte à la sécurité des personnes ou à l'environnement, arrêt administratif"]]], ["t", [["Vraisemblance", "Définition"], ["V1 Peu vraisemblable", "Nécessite des moyens très importants ou plusieurs conditions rares"], ["V2 Vraisemblable", "Réalisable par une source motivée avec des moyens courants"], ["V3 Très vraisemblable", "Facilement réalisable, déjà observé dans le secteur"], ["V4 Quasi certaine", "Pratiquement garanti si la source le décide"]]], ["p", "h3", "Atelier 2 : coter la motivation, les ressources et l'activité (de 1 à 4)"], ["t", [["Niveau", "Motivation (M)", "Ressources (R)", "Activité (A)"], ["1", "Faible : intérêt marginal, opportuniste", "Très limitées : une personne isolée, outils publics", "Rarement observée dans le secteur"], ["2", "Moyenne : intérêt réel mais pas prioritaire", "Limitées : outils courants, compétences moyennes", "Occasionnelle : quelques cas par an dans le secteur"], ["3", "Forte : objectif clair, prêt à investir du temps", "Importantes : équipe organisée, outils spécialisés ou accès légitimes", "Régulière : attaques observées chaque mois"], ["4", "Très forte : objectif prioritaire, détermination durable", "Très importantes : organisation structurée, moyens élevés", "Très fréquente : attaques quasi quotidiennes"]]], ["p", "h3", "Atelier 3 : les quatre variables d'une partie prenante (D, P, M, C)"], ["t", [["Variable", "Définition", "Valeur 1", "Valeur 4", "Effet sur le niveau de menace"], ["D · Dépendance", "À quel point l'organisation a besoin de cette partie prenante pour fonctionner. Peut-on la remplacer vite ?", "Remplaçable en quelques jours, sans conséquence", "Indispensable, aucune solution de repli", "D monte : la menace monte"], ["P · Pénétration", "Jusqu'où la partie prenante entre dans nos systèmes et nos locaux : VPN, comptes, badge, clés USB, accès physique.", "Aucun accès, simples échanges de documents", "Accès permanent et privilégié (administration, VPN toujours ouvert)", "P monte : la menace monte"], ["M · Maturité cyber", "Capacité de la partie prenante à se protéger et à gérer un incident : organisation, outils, certification, sensibilisation de son personnel.", "Aucune démarche de sécurité", "Démarche structurée, certifiée et testée", "M monte : la menace baisse"], ["C · Confiance", "Confiance que l'on peut accorder à ses intentions et à ses engagements : contrat, historique, transparence, droit d'audit.", "Doutes, intérêts divergents, aucun engagement", "Relation éprouvée, engagements opposables, intérêts alignés", "C monte : la menace baisse"]]], ["p", "h3", "Atelier 3 : les mesures d'écosystème (ME), leviers pour réduire le niveau de menace d'une partie prenante"], ["p", "note", "Les cartes ME (vert foncé) sont les <b>mesures d'écosystème</b> : chacune agit sur une variable de la partie prenante. Leur but : faire sortir de la zone danger les parties prenantes qui sont des rebonds faciles. Après chaque mesure, recalculez le niveau et la zone."], ["t", [["Variable", "Ce qu'elle mesure", "Comment la faire évoluer", "Cartes ME"], ["D · Dépendance", "À quel point FERROMEUSE a besoin de la partie prenante", "Prévoir un second prestataire ou un plan B (D baisse)", "ME6"], ["P · Pénétration", "Accès de la partie prenante à nos systèmes et à nos locaux", "Accès à la demande, cloisonnement, accompagnement sur site (P baisse)", "ME3, ME4, ME5"], ["M · Maturité cyber", "Niveau de sécurité de la partie prenante", "Audit, sensibilisation du prestataire (M monte)", "ME1, ME7"], ["C · Confiance", "Engagements opposables et relation éprouvée", "Clauses contractuelles, revue annuelle, exercice commun (C monte)", "ME2, ME8"]]], ["p", "h3", "Atelier 4 : les freins qui rendent une étape plus difficile"], ["t", [["Frein", "Question à se poser sur l'étape", "Effet"], ["F1 · Compétences ou moyens", "La source doit-elle disposer de compétences ou de moyens qu'elle n'a pas naturellement (par exemple connaître les protocoles industriels) ?", "−1"], ["F2 · Règle du socle", "Une règle du socle qui couvre cette étape est-elle Conforme ou Partielle ? (Écart : aucun frein)", "−1"], ["F3 · Conditions cumulatives", "Faut-il réunir plusieurs conditions indépendantes (présence physique et badge valide, par exemple) ?", "−1"], ["F4 · Détection probable", "Quelqu'un ou quelque chose a-t-il de bonnes chances de remarquer l'action ?", "−1"]]], ["p", "h3", "Récapitulatif des règles du jeu"], ["t", [["Notion", "Règle"], ["Pertinence d'un couple source / objectif (atelier 2)", "Σ = M + R + A. Σ ≥ 8 : retenu · 6 à 7 : à surveiller · ≤ 5 : écarté"], ["Niveau de menace d'une partie prenante (atelier 3)", "(D × P) ÷ (M × C). Danger ≥ 3 · Contrôle de 1,5 à moins de 3 · Veille moins de 1,5"], ["Vraisemblance d'un scénario stratégique (atelier 3)", "Nombre de critères remplis, minimum V1 : A. Σ de la source ≥ 9 ; B. une partie prenante du chemin est en zone danger ; C. une règle du socle sur le chemin est en Écart ou Partielle"], ["Vraisemblance d'une étape (atelier 4)", "V étape = 4 − nombre de freins (F1 à F4), minimum V1"], ["Vraisemblance d'un scénario opérationnel (atelier 4)", "La plus faible des quatre étapes. Elle remplace la V de l'atelier 3 pour la matrice de l'atelier 5"], ["Niveau de risque (atelier 5)", "G × V. Faible ≤ 3 · Moyen 4 à 6 · Élevé 8 à 9 · Critique ≥ 12"], ["Seuil d'acceptation (atelier 5)", "G × V ≤ 6. Après traitement, chaque scénario doit être à 6 ou moins ; au-dessus, il faut une mesure en plus ou une dérogation signée du DG"]]]]}, {"id": "a1", "title": "Atelier 1 · Cadrage et socle de sécurité · 0 h 50", "blocks": [["t", [["CE DONT VOUS AVEZ BESOIN", ""], ["<b>Plateau</b>", "Zone ① : la feuille 1, imprimée sur le plateau (moitié droite, en haut à gauche) : valeurs métier, biens supports, gravité, socle."], ["<b>Jetons</b>", "Aucun."], ["<b>Cartes</b>", "Deck bleu ENTREPRISE (21 cartes) : à lire pour le détail. Rien ne se pose sur le plateau à cet atelier : vous cochez les tableaux."], ["<b>Où écrire</b>", "Directement sur le plateau, feuille 1 : tableau biens supports × valeurs métier, gravité des ER, socle et taux de conformité."], ["<b>Autres</b>", "Dossier de scénario (échelle de gravité, constats d'audit du socle) · calculatrice · stylo ou feutre effaçable."]]], ["p", "h2c1", "Objectif"], ["p", "b", "Cadrer l'étude : identifier ce qui compte pour l'entreprise (valeurs métier) et ce qui le supporte (biens supports), définir les événements redoutés et leur gravité, puis mesurer l'écart au socle de sécurité."], ["p", "h2c1", "Rappel de méthode"], ["p", "bl", "<b>Valeur métier</b> : ce qui est essentiel à la mission (un processus, une information, un savoir-faire). Test : « si on change de technologie, cela existe-t-il encore ? »"], ["p", "bl", "<b>Bien support</b> : composante du SI, de l'OT, des locaux ou des personnes sur laquelle repose une valeur métier. <b>Remplissez le tableau bien support par bien support</b> (ligne par ligne) : « si ce bien disparaît, quelle valeur métier est touchée ? ». Un bien peut soutenir plusieurs valeurs métier ; chaque bien doit en soutenir au moins une."], ["p", "bl", "<b>Événement redouté (ER)</b> : atteinte à une valeur métier selon un critère (disponibilité, intégrité, confidentialité), avec son impact. On ne décrit jamais l'attaque."], ["p", "bl", "<b>Gravité</b> : cotation de chaque ER sur l'échelle G1 à G4, avec un calcul d'impact lorsque c'est possible (jours d'arrêt × 378 k€)."], ["p", "bl", "<b>Socle de sécurité</b> : liste de règles de base. On note pour chacune Conforme (1 point), Partielle (0,5) ou Écart (0), puis on calcule le taux de conformité."], ["p", "h2c1", "Pas à pas"], ["t", [["Minutes", "Ce que vous faites", "Où"], ["0–5", "Brief de méthode", "—"], ["5–18", "Lire les cartes bleues <b>sauf les 6 cartes ER : laissez-les face cachée</b>. Remplir la feuille 1 <b>bien support par bien support</b> : pour chacun des 10 biens supports, cocher la ou les valeurs métier qu'il soutient", "Zone ① haut ; feuille 1"], ["18–20", "Aléa lu à mi-parcours par l'animateur. Écrire la version 2 dans le bloc violet", "Feuille 1"], ["20–24", "<b>Pari de gravité (étape 1)</b> : cartes ER toujours face cachée, chacun écrit en silence son pari G1 à G4 pour les 6 ER à partir des seuls titres de la feuille et de l'échelle du dossier ; comparez les paris à voix haute", "Zone ① colonne « Pari »"], ["24–38", "<b>Calcul (étape 2)</b> : retournez les cartes ER, calculez avec le dossier (jours × coût par jour), cochez G1 à G4. Pour chaque ER dont le résultat diffère du pari, écrivez en une phrase ce que le titre ne montrait pas", "Zone ① grille ; feuille 1"], ["38–46", "Noter l'état des 8 règles du socle d'après les constats d'audit, calculer le taux", "Zone ① socle ; feuille 1 (socle)"], ["46–50", "Appeler l'animateur pour la validation", "—"]]], ["p", "note", "<b>Pourquoi un pari avant le calcul ?</b> Les cartes ER indiquent déjà l'impact chiffré : si vous les lisez d'abord, il ne reste qu'à recopier. Le pari vous oblige à raisonner sur la nature de l'événement (durée, sécurité des personnes, clients, réglementation) <b>avant</b> de voir les chiffres. L'écart entre votre pari et le calcul est ce que vous apprenez : sous-estimation de la durée, oubli des pénalités, ER de sécurité (G4 par nature)…"], ["p", "h2c1", "Livrables"], ["p", "b", "Feuille 1 complétées (versions 1 et 2), tableaux cochés, taux de conformité du socle, écart prioritaire désigné."], ["p", "h2c1", "Avant d'appeler l'animateur : auto-contrôle"], ["p", "bl", "☐ Chaque valeur métier est reliée à au moins un bien support, et chaque bien support à une valeur métier."], ["p", "bl", "☐ Aucun événement redouté ne décrit une attaque."], ["p", "bl", "☐ Chaque ER a un pari écrit <b>avant</b> le calcul, un calcul écrit, et une phrase explique chaque écart entre les deux."], ["p", "bl", "☐ Les 8 règles du socle sont notées, le taux est calculé."], ["p", "bl", "☐ Le bloc « Après l'aléa » est rempli."], ["p", "h3", "Conseils de vos rôles pendant cet atelier"], ["p", "note", "Chaque joueur a une fiche de rôle. Pour cet atelier, voici <b>la question que chaque rôle doit poser</b>. Si la table hésite, le rôle concerné lit sa ligne « Atelier 1 » dans sa fiche, ou scanne le QR code ci-dessous. Ces repères aident à positionner un choix ; ils ne remplacent jamais la justification de l'équipe."], ["t", [["Rôle", "Question que ce rôle pose à la table à l'atelier 1"], ["<b>R01</b><br/>RSSI", "Chaque valeur métier a-t-elle au moins un bien support, chaque bien support une valeur métier ? L'ER décrit-il l'atteinte, pas l'attaque ?"], ["<b>R02</b><br/>Directeur industriel", "Combien de jours peut-on tenir en mode dégradé ? À partir de quand l'indisponibilité devient-elle inacceptable ?"], ["<b>R03</b><br/>Responsable automatisme", "Quels biens supports portent l'activité ? Quel équipement n'a pas de valeur métier derrière lui ?"], ["<b>R06</b><br/>Responsable HSE", "Quel événement redouté touche à ce qui ne se négocie pas (sécurité, conformité, solvabilité) ? Y a-t-il une atteinte qui reste invisible pendant des heures ?"], ["<b>R10</b><br/>Directeur général", "Quelles sont nos obligations légales, nos engagements envers nos clients ou usagers ? Qu'est-ce qui ne doit jamais s'arrêter ?"]]], ["t", [["", "<b>Scannez : conseils complets des 5 rôles pour l'atelier 1</b><br/>Questions, repères pour positionner vos choix, position à défendre, piège à éviter. Le même contenu figure dans le tableau « atelier par atelier » de votre fiche de rôle.", "", "<b>Scannez : fiche de définitions</b><br/>Tous les termes de la méthode, avec la carte qui les porte. Une version papier est dans votre pochette."]]], ["p", "h2c1", "Défis flash de l'atelier 1 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 1.1 · Valeur métier ou bien support ?.</b> Classez : a) recettes d'alliages ; b) serveur de recettes ; c) traçabilité des lots ; d) automate du four 3 ; e) capacité à fabriquer en sécurité ; f) salle de contrôle ; g) relation avec le client automobile ; h) opérateur de la ligne 2."], ["p", "b", "<b>Défi 1.2 · Gravité.</b> Cotez : a) arrêt de la ligne 2 (un quart de la production) pendant 6 heures ; b) arrêt total du site pendant 5 jours ; c) même arrêt de 5 jours avec un opérateur gravement blessé."], ["p", "b", "<b>Défi 1.3 · Priorités du socle.</b> Parmi R1 à R8, lesquelles traiteriez-vous en premier, et pourquoi ?"], ["p", "b", "<b>Défi 1.4 · Impact chiffré.</b> Chiffrez un arrêt de 21 jours du site A et placez-le sur l'échelle."]]}, {"id": "a2", "title": "Atelier 2 · Sources de risque · 0 h 40", "blocks": [["t", [["CE DONT VOUS AVEZ BESOIN", ""], ["<b>Plateau</b>", "Zone ② : feuille 2, partie haute : tableau de cotation M / R / A / Σ avec les trois zones (rouge écartée, jaune à surveiller, vert retenue) et contrôle de couverture des ER."], ["<b>Jetons</b>", "Aucun."], ["<b>Cartes</b>", "Deck rouge MENACE (6 cartes SR : profil et objectif visé). Aucune cotation n'est imprimée : c'est à vous de coter."], ["<b>Où écrire</b>", "Directement sur le plateau, feuille 2 (haut) ; révision après l'aléa dans le bandeau « Après l'aléa »."], ["<b>Autres</b>", "Échelle M / R / A du dossier de scénario · calculatrice · stylo ou feutre effaçable."]]], ["p", "h2c2", "Objectif"], ["p", "b", "Identifier qui pourrait s'en prendre à FERROMEUSE et pour quel objectif, évaluer la pertinence de chaque couple source de risque / objectif visé et décider lesquels vous analyserez dans la suite."], ["p", "h2c2", "Rappel de méthode"], ["p", "bl", "Une <b>source de risque</b> est une personne ou un groupe qui peut porter atteinte à l'organisation : État, cybercriminel, hacktiviste, concurrent, initié malveillant, amateur…"], ["p", "bl", "Un <b>objectif visé</b> est ce que la source cherche à obtenir : espionnage, gain financier, atteinte à l'image, vengeance, défi. Ce n'est pas un événement redouté : l'objectif est ce que veut l'attaquant, l'ER est ce que redoute l'entreprise."], ["p", "bl", "La <b>pertinence</b> du couple dépend de la <b>motivation</b> (M), des <b>ressources</b> (R) et de l'<b>activité</b> (A) de la source dans le secteur. Vous cotez chacun de 1 à 4 avec l'échelle du dossier de scénario, puis calculez Σ = M + R + A."], ["p", "bl", "<b>Règle du jeu</b> : Σ ≥ 8 retenu · 6 à 7 à surveiller · ≤ 5 écarté. Une source qui a plusieurs objectifs donne plusieurs couples évalués séparément."], ["p", "h2c2", "Pas à pas"], ["t", [["Minutes", "Ce que vous faites", "Où"], ["0–5", "Brief de méthode", "—"], ["5–15", "Lire les 6 cartes rouges. Discuter du profil de chaque source", "Cartes rouges"], ["15–26", "Première version : coter M, R, A pour chaque source, entourer Σ (rouge : écartée · jaune : à surveiller · vert : retenue)", "Zone ② ; feuille 2"], ["26–29", "Aléa lu à mi-parcours : recoter la source concernée, justifier le maintien ou le changement de décision", "Feuille 2, bloc violet"], ["29–35", "Contrôle de couverture : chaque ER de gravité G3 ou G4 est-il atteint par au moins un couple retenu ? Compléter le tableau", "Zone ② bas"], ["35–40", "Validation", "—"]]], ["t", [["Comment remplir le contrôle de couverture"], ["<b>① Repérez les couples retenus</b> : ceux dont Σ est entouré en vert (Σ ≥ 8). Eux seuls comptent. Une source à surveiller (jaune) ou écartée (rouge) ne couvre rien."], ["<b>② Pour chaque ER G3 ou G4</b> : quel couple retenu peut l'atteindre ? Écrivez la source et son objectif dans la colonne « Couple(s) retenu(s) »."], ["<b>③ Entourez OUI</b> si au moins un couple retenu mène à cet ER ; <b>entourez NON</b> sinon."], ["<b>④ Si NON</b> : la sélection est trop restrictive. Écrivez dans la dernière colonne ce que vous changez (retenir une source de plus, ou revoir une cotation) et corrigez la feuille."], ["Les ER de gravité G1 ou G2 ne sont pas exigés : laissez la ligne en blanc."]]], ["p", "h2c2", "Livrables"], ["p", "b", "Feuille 2 complétée, Σ entouré pour les 6 sources, tableau de couverture des ER, révision après aléa."], ["p", "h2c2", "Avant d'appeler l'animateur : auto-contrôle"], ["p", "bl", "☐ Chaque cotation M, R, A est justifiée en une phrase et le calcul de Σ est écrit."], ["p", "bl", "☐ Σ est entouré dans la colonne qui correspond au total."], ["p", "bl", "☐ Chaque ER G3 ou G4 a un OUI ou un NON entouré et le couple retenu qui l'atteint ; aucune source à surveiller n'est comptée comme couvrant."], ["p", "bl", "☐ Si un ER grave n'est atteint par aucun couple retenu, vous avez revu votre sélection."], ["p", "h3", "Conseils de vos rôles pendant cet atelier"], ["p", "note", "Chaque joueur a une fiche de rôle. Pour cet atelier, voici <b>la question que chaque rôle doit poser</b>. Si la table hésite, le rôle concerné lit sa ligne « Atelier 2 » dans sa fiche, ou scanne le QR code ci-dessous. Ces repères aident à positionner un choix ; ils ne remplacent jamais la justification de l'équipe."], ["t", [["Rôle", "Question que ce rôle pose à la table à l'atelier 2"], ["<b>R01</b><br/>RSSI", "Quelle phrase de la carte justifie ce M, ce R, ce A ? Tous les ER G3 et G4 sont-ils couverts ?"], ["<b>R02</b><br/>Directeur industriel", "Quelle source de risque s'attaquerait à mon activité ? Laquelle a un intérêt à nous mettre sous pression ?"], ["<b>R03</b><br/>Responsable automatisme", "Un technicien interne a-t-il des moyens ? Que sait-il faire sans outils ?"], ["<b>R06</b><br/>Responsable HSE", "Quelle source viserait cet enjeu ? Qui a assez de moyens et d'accès pour le faire ?"], ["<b>R10</b><br/>Directeur général", "Pourquoi retenir cette source et pas celle-là ? Ai-je tous les ER graves couverts ?"]]], ["t", [["", "<b>Scannez : conseils complets des 5 rôles pour l'atelier 2</b><br/>Questions, repères pour positionner vos choix, position à défendre, piège à éviter. Le même contenu figure dans le tableau « atelier par atelier » de votre fiche de rôle.", "", "<b>Scannez : fiche de définitions</b><br/>Tous les termes de la méthode, avec la carte qui les porte. Une version papier est dans votre pochette."]]], ["p", "h2c2", "Défis flash de l'atelier 2 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 2.1.</b> Un hacktiviste voit son activité passer de 2 à 4 après une campagne médiatique. Recalculez et décidez."], ["p", "b", "<b>Défi 2.2.</b> Donnez pour chaque source de risque un exemple d'objectif visé différent de celui de la carte."], ["p", "b", "<b>Défi 2.3.</b> Pourquoi la ressource (R) de SR4 est-elle de 3 alors qu'il est seul ?"]]}, {"id": "a3", "title": "Atelier 3 · Écosystème et scénarios stratégiques · 0 h 55", "blocks": [["t", [["CE DONT VOUS AVEZ BESOIN", ""], ["<b>Plateau</b>", "Zone ③ : trois couloirs SS1 à SS3 à gauche (cartes SR → PP → ER ; le second emplacement PP est facultatif), cadre des mesures d'écosystème (ME), et la feuille 3 : radar des parties prenantes, scénarios stratégiques."], ["<b>Jetons</b>", "Aucun."], ["<b>Cartes</b>", "Deck vert ÉCOSYSTÈME (8 cartes PP : D, P, M, C sont imprimés) et deck vert foncé MESURE ÉCOSYSTÈME (8 cartes ME). Réutilisés : les cartes SR retenues (atelier 2) et les cartes ER (atelier 1), à poser dans les couloirs."], ["<b>Où écrire</b>", "Directement sur le plateau, feuille 3 : niveaux de menace avant et après mesures, tableau des scénarios stratégiques, critères A, B, C."], ["<b>Autres</b>", "Calculatrice · stylo ou feutre effaçable · définitions de D, P, M, C et tableau des mesures d'écosystème (section 5 du dossier de scénario)."]]], ["p", "h2c3", "Objectif"], ["p", "b", "Cartographier l'écosystème de FERROMEUSE Aciers Spéciaux, calculer le <b>niveau de menace</b> de chaque partie prenante, construire les <b>scénarios stratégiques</b> qui relient une source de risque retenue à un événement redouté, puis choisir des <b>mesures d'écosystème (ME)</b> qui font sortir de la zone danger les parties prenantes les plus exposées."], ["p", "h2c3", "Rappel de méthode"], ["p", "bl", "Une <b>partie prenante</b> (PP) est une entité extérieure en relation avec l'organisation (fournisseur, prestataire, partenaire). Elle peut servir de <b>rebond</b> : la source d'attaque la compromet, puis passe par elle pour atteindre l'organisation."], ["p", "bl", "Chaque PP est décrite par <b>quatre variables de 1 à 4</b>, déjà imprimées sur sa carte : <b>D</b> dépendance, <b>P</b> pénétration, <b>M</b> maturité cyber, <b>C</b> confiance (définitions ci-dessous)."], ["p", "bl", "<b>Niveau de menace = (D × P) ÷ (M × C).</b> D et P sont au numérateur : elles font monter la menace. M et C sont au dénominateur : elles la font baisser."], ["p", "bl", "Le <b>radar</b> classe chaque PP selon son niveau : <b>danger</b> si le niveau est ≥ 3 · <b>contrôle</b> de 1,5 à moins de 3 · <b>veille</b> en dessous de 1,5. Un niveau de 3,0 pile est en danger, un niveau de 1,5 pile est en contrôle."], ["p", "bl", "Un <b>scénario stratégique</b> est un chemin d'attaque : <b>source de risque → partie prenante (relais) → événement redouté</b>. Sa gravité est <b>celle de l'ER visé</b>. Sa vraisemblance se cote avec trois critères (A, B, C)."], ["p", "h3", "Les quatre variables d'une partie prenante"], ["t", [["Variable", "Définition", "Valeur 1", "Valeur 4", "Effet sur le niveau de menace"], ["D · Dépendance", "À quel point l'organisation a besoin de cette partie prenante pour fonctionner. Peut-on la remplacer vite ?", "Remplaçable en quelques jours, sans conséquence", "Indispensable, aucune solution de repli", "D monte : la menace monte"], ["P · Pénétration", "Jusqu'où la partie prenante entre dans nos systèmes et nos locaux : VPN, comptes, badge, clés USB, accès physique.", "Aucun accès, simples échanges de documents", "Accès permanent et privilégié (administration, VPN toujours ouvert)", "P monte : la menace monte"], ["M · Maturité cyber", "Capacité de la partie prenante à se protéger et à gérer un incident : organisation, outils, certification, sensibilisation de son personnel.", "Aucune démarche de sécurité", "Démarche structurée, certifiée et testée", "M monte : la menace baisse"], ["C · Confiance", "Confiance que l'on peut accorder à ses intentions et à ses engagements : contrat, historique, transparence, droit d'audit.", "Doutes, intérêts divergents, aucun engagement", "Relation éprouvée, engagements opposables, intérêts alignés", "C monte : la menace baisse"]]], ["p", "note", "Les valeurs sont déjà sur les cartes : vous n'avez pas à les coter, mais à savoir les lire. Si deux PP ont le même niveau, c'est la variable qui explique ce niveau qui guide le choix de la mesure."], ["p", "h3", "Exemple fil rouge, hors du jeu : un prestataire de maintenance du parc de postes de travail"], ["p", "b", "D 3, P 4, M 1, C 3. D × P = 12 ; M × C = 3 ; niveau = 12 ÷ 3 = <b>4,0</b> : zone <b>danger</b>. Ce qui explique le niveau : une pénétration forte (accès permanent) avec une maturité minimale."], ["p", "h2c3", "Méthode : construire un scénario stratégique en 5 étapes"], ["t", [["Étape", "Question", "Où trouver la réponse", "Où écrire"], ["① Couple", "Quel couple source / objectif avez-vous retenu à l'atelier 2 (Σ ≥ 8) ?", "Feuille 2, colonne Σ", "Feuille 3 (scénarios), colonne « Couple »"], ["② ER visé", "Quel événement redouté cet objectif menace-t-il ? Faites le lien entre l'objectif de la source et la valeur métier qu'il menace : gain financier → disponibilité des services ou intégrité des opérations ; revente de données → confidentialité ; sabotage → sécurité ou intégrité.", "Feuille 1 (6 ER) · cartes bleues ER", "Colonne « ER visé »"], ["③ Relais", "Par quelle partie prenante la source peut-elle entrer ? Cherchez la PP qui a un accès (pénétration) au bien support qui conduit à l'ER, en priorité en zone danger ou contrôle. <b>Une seule PP suffit.</b>", "Radar (feuille 3) · description au dos des cartes PP", "Couloir SS du plateau (SR → PP → ER) · colonne « Événements intermédiaires »"], ["④ Gravité", "Quelle est la gravité de cet ER ? Reprenez-la telle quelle : elle n'est jamais inventée pour le scénario.", "Feuille 1 (gravité des ER)", "Colonne G"], ["⑤ Vraisemblance", "Quels critères A, B, C sont remplis ? V = nombre de ✓, avec un minimum de V1.", "Tableau des critères ci-dessous", "Colonnes A B C, V et justification"]]], ["p", "note", "<b>Le couloir a 4 emplacements, mais vous posez 3 cartes.</b> Il comporte : une carte SR, une carte PP, un <b>second emplacement PP facultatif</b>, une carte ER. Dans la solution de référence, chaque scénario passe par <b>une seule</b> partie prenante : le second emplacement PP reste vide et vous posez donc <b>3 cartes par scénario</b> (SR, PP, ER). Vous ne l'utilisez que pour un second relais que vous pouvez justifier par une phrase ; ce n'est jamais obligatoire. Deux sources qui mènent au même ER par le même relais donnent <b>un seul</b> scénario (pour le critère A, retenez la source la plus pertinente). Vous devez obtenir <b>trois</b> scénarios (SS1 à SS3), pas quatre. La ligne « bis » de la feuille 3 est facultative."], ["p", "h3", "Lire un scénario comme une phrase"], ["p", "b", "« [Source] cherche [objectif]. Elle compromet [partie prenante], qui a un accès à [bien support]. Cela lui permet d'atteindre [événement redouté]. » Si vous ne pouvez pas dire cette phrase à voix haute sans hésiter, le chemin n'est pas encore solide."], ["p", "h3", "Les trois critères de vraisemblance A, B, C"], ["t", [["Critère", "Question à se poser", "Où regarder", "Il est rempli (✓) quand…", "Exemple hors jeu"], ["A · Source pertinente", "La source qui part sur ce chemin est-elle très motivée, bien outillée et active ?", "Feuille 2 : le Σ de la source du chemin", "Σ ≥ 9", "SR2 : Σ = 11. ✓"], ["B · Relais facile", "La partie prenante du chemin est-elle déjà en zone danger sur le radar ?", "Feuille 3 : le niveau de menace de la PP du chemin", "Niveau ≥ 3", "PP8 : 1,5, zone contrôle. ✗"], ["C · Terrain favorable", "Une règle du socle qui protège un maillon de ce chemin est-elle mal tenue ?", "Feuille 1 : état des 8 règles ; la règle doit concerner une étape du chemin", "La règle est en Écart ou Partielle", "R2 (accès d'administration externes) est en Écart. ✓"]]], ["p", "note", "<b>V = nombre de ✓, avec un minimum de V1</b> : 0 ou 1 critère → V1 · 2 critères → V2 · 3 critères → V3. Écrivez pour chaque critère la preuve (« Σ de SR2 = 11 », « niveau de PP8 = 1,5 », « R2 en Écart ») : un ✓ sans preuve n'est pas validé."], ["p", "h3", "Exemple résolu hors du jeu (il ne fait pas partie des trois scénarios attendus)"], ["t", [["Couple", "ER visé", "Chemin (SR → PP → ER)", "G", "A", "B", "C", "V"], ["SR2 cybercriminel / gain financier", "ER6 Altération des commandes et de la facturation", "SR2 compromet l'accès d'administration de PP8 (infogérant de l'erp), puis modifie des données de facturation ou de paiement → ER6", "G2", "✓", "✗", "✓", "V2"]]], ["p", "note", "Risque avant traitement : G2 × V2 = 4, moyen."], ["p", "h2c3", "Méthode : choisir des mesures d'écosystème (ME)"], ["t", [["À quoi servent les mesures d'écosystème ?"], ["Vous ne pouvez pas rendre un prestataire plus sûr par décret. Une ME agit sur ce que l'organisation <b>peut</b> faire : auditer, former, limiter les accès, encadrer par contrat, prévoir un plan B."], ["<b>But</b> : faire redescendre le niveau de menace d'une partie prenante <b>sous le seuil de danger (3)</b>, pour qu'elle ne soit plus un rebond facile."], ["Les ME sont les cartes <b>vert foncé</b> (ME1 à ME8). Elles se rangent dans le cadre « mesures d'écosystème » du plateau, et leur coût sera pris sur les 14 jetons de l'atelier 5."]]], ["p", "h3", "Catalogue des mesures d'écosystème et de leur coût"], ["t", [["Carte", "Mesure", "Agit sur", "Effet", "Coût (jetons)"], ["ME1", "Audit de sécurité d'un prestataire", "M · maturité", "M +1", "<b>1</b>"], ["ME2", "Clauses contractuelles : notification d'incident, comptes nominatifs, droit d'audit", "C · confiance", "C +1", "<b>1</b>"], ["ME3", "Accès à la demande avec validation et enregistrement des sessions", "P · pénétration", "P −1", "<b>2</b>"], ["ME4", "Cloisonnement du réseau accessible au prestataire", "P · pénétration", "P −1", "<b>2</b>"], ["ME5", "Badge nominatif et accompagnement sur site", "P · pénétration", "P −1", "<b>1</b>"], ["ME6", "Second prestataire ou plan B de continuité", "D · dépendance", "D −1", "<b>2</b>"], ["ME7", "Sensibilisation et formation des équipes du prestataire", "M · maturité", "M +1", "<b>1</b>"], ["ME8", "Revue annuelle et exercice de crise commun", "C · confiance", "C +1", "<b>1</b>"]]], ["p", "note", "<b>Le coût est imprimé sur chaque carte ME.</b> Additionnez le coût des cartes que vous posez et reportez le total dans la zone « mesures d'écosystème » de la feuille 3. Ce total sera <b>retiré des 14 jetons de budget</b> de l'atelier 5 : une mesure à 2 jetons est donc deux fois plus chère à l'atelier 5 qu'une mesure à 1 jeton. Cherchez la solution la moins chère qui fait passer la partie prenante sous le seuil de danger (3)."], ["t", [["Étape", "Ce que vous faites"], ["① Repérer", "Pour chaque PP en zone danger, quelle variable (D, P, M ou C) explique le niveau élevé ? Appuyez-vous sur le tableau des leviers (section 5)."], ["② Choisir", "Choisissez une ou plusieurs cartes ME qui agissent sur cette variable. Une ME change <b>une seule variable de 1</b> (D ou P : −1 ; M ou C : +1)."], ["③ Recalculer", "Réécrivez D, P, M, C, puis (D × P) ÷ (M × C) dans la colonne « Après mesures » de la feuille 3 ; cochez la nouvelle zone."], ["④ Contrôler", "La PP est-elle sortie de la zone danger (niveau < 3) ? Sinon, ajoutez ou changez de mesure."], ["⑤ Compter le coût et noter les conséquences", "Additionnez le <b>coût en jetons</b> des cartes ME posées (imprimé sur chaque carte) et reportez le total sur la feuille 3 : il sera retiré des 14 jetons de l'atelier 5. Notez aussi, à côté du scénario concerné, si le critère B (PP en zone danger) n'est plus rempli : la vraisemblance du scénario baisserait alors d'un cran."]]], ["p", "note", "<b>Ce qu'il faut recalculer après une ME :</b> le nouveau niveau de la PP et sa zone · le critère B des scénarios qui passent par cette PP · le coût total des ME. La matrice de l'atelier 5 utilise toutefois la V de l'atelier 4 (scénario opérationnel), pas celle de l'atelier 3."], ["p", "b", "Exemple fil rouge, suite : ME7 (sensibilisation et formation des équipes du prestataire, M +1) : M passe de 1 à 2 ; niveau = 12 ÷ (2 × 3) = <b>2,0</b> : zone contrôle, coût 1. ME3 (accès à la demande, P −1) : 9 ÷ (1 × 3) = <b>3,0</b> : encore en danger, il faudrait une seconde mesure."], ["p", "h2c3", "Pas à pas"], ["t", [["Minutes", "Ce que vous faites", "Où"], ["0–5", "Brief de méthode", "—"], ["5–18", "Première version : calculer le niveau de menace des 8 parties prenantes (feuille 3, radar), cocher la zone de chaque PP", "Zone ③ radar ; feuille 3 (radar)"], ["18–21", "Aléa lu à mi-parcours : recalculer la partie prenante concernée, la replacer, en tirer les conséquences", "Feuille 3 (radar), bloc violet"], ["21–40", "Construire les 3 scénarios stratégiques par la méthode en 5 étapes : cartes SR, PP, ER posées dans le couloir SS, tableau rempli", "Zone ③ couloirs ; feuille 3 (scénarios stratégiques)"], ["40–50", "Choisir au moins une mesure d'écosystème par PP en zone danger, recalculer", "Zone ③ mesures ; feuille 3 (mesures ME)"], ["50–55", "Validation", "—"]]], ["p", "h2c3", "Livrables"], ["p", "b", "Feuille 3 complétée ; 8 zones cochées sur le radar ; 3 scénarios dans les couloirs avec G, critères A B C et V ; mesures d'écosystème posées avec nouveau niveau calculé."], ["p", "h2c3", "Avant d'appeler l'animateur : auto-contrôle"], ["p", "bl", "☐ Chaque niveau de menace est calculé par écrit (D × P, M × C, quotient) et la zone est cochée."], ["p", "bl", "☐ Chaque scénario part d'une source retenue, passe par une partie prenante et se termine sur un ER ; la gravité est celle de l'ER."], ["p", "bl", "☐ Pour chaque V, vous pouvez dire quels critères A, B, C sont remplis, avec la preuve."], ["p", "bl", "☐ Chaque partie prenante en danger a une mesure d'écosystème avec recalcul, et vous savez ce qu'elle change."], ["p", "bl", "☐ Le bloc « Après l'aléa » est rempli."], ["p", "h3", "Conseils de vos rôles pendant cet atelier"], ["p", "note", "Chaque joueur a une fiche de rôle. Pour cet atelier, voici <b>la question que chaque rôle doit poser</b>. Si la table hésite, le rôle concerné lit sa ligne « Atelier 3 » dans sa fiche, ou scanne le QR code ci-dessous. Ces repères aident à positionner un choix ; ils ne remplacent jamais la justification de l'équipe."], ["t", [["Rôle", "Question que ce rôle pose à la table à l'atelier 3"], ["<b>R01</b><br/>RSSI", "Pouvons-nous dire à voix haute la phrase « source → partie prenante → événement redouté » ? Les critères A, B, C ont-ils chacun leur preuve ?"], ["<b>R02</b><br/>Directeur industriel", "Quelle partie prenante, si elle tombe ou est compromise, arrête mon activité ? Combien de temps pour la remplacer ?"], ["<b>R03</b><br/>Responsable automatisme", "Quel prestataire a un accès permanent à nos systèmes ? Lequel entre dans les locaux avec un badge ou un compte partenaire ?"], ["<b>R06</b><br/>Responsable HSE", "Qui entre physiquement ou logiquement dans les zones sensibles ? Avec quel contrôle ?"], ["<b>R10</b><br/>Directeur général", "Ces mesures d'écosystème sont-elles réalistes avec nos prestataires ? Combien coûtent-elles ?"]]], ["t", [["", "<b>Scannez : conseils complets des 5 rôles pour l'atelier 3</b><br/>Questions, repères pour positionner vos choix, position à défendre, piège à éviter. Le même contenu figure dans le tableau « atelier par atelier » de votre fiche de rôle.", "", "<b>Scannez : fiche de définitions</b><br/>Tous les termes de la méthode, avec la carte qui les porte. Une version papier est dans votre pochette."]]], ["p", "h2c3", "Défis flash de l'atelier 3 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 3.1.</b> Calculez et classez : société de gardiennage (D 2, P 3, M 1, C 2) ; éditeur du logiciel qualité (D 3, P 3, M 3, C 3) ; prestataire de nettoyage (D 1, P 2, M 2, C 3)."], ["p", "b", "<b>Défi 3.2.</b> Mesurez l'effet de la mesure M5 (maturité +1) sur PP2 et PP7."], ["p", "b", "<b>Défi 3.3.</b> Un étudiant propose : « SR1 → client PP3 → ER3 ». Cotez le scénario par les critères A, B, C."], ["p", "b", "<b>Défi 3.4.</b> Pourquoi le niveau de menace d'une partie prenante peut-il baisser sans toucher à la partie prenante elle-même ?"], ["p", "b", "<b>Défi 3.5.</b> Cotez le scénario : SR3 hacktiviste (Σ 6) → PP4 transporteur (niveau 0,67) → ER6. Aucune règle du socle en écart ou partielle ne se trouve sur ce chemin."]]}, {"id": "a4", "title": "Atelier 4 · Scénarios opérationnels · 0 h 55", "blocks": [["t", [["CE DONT VOUS AVEZ BESOIN", ""], ["<b>Plateau</b>", "Zone ④ : 3 chaînes de 4 emplacements (Connaître, Rentrer, Trouver, Exploiter) à gauche, et la feuille 2 (partie basse) : cotation des étapes, actions écartées, tests T1 à T4, ligne « Biens supports critiques »."], ["<b>Jetons</b>", "Aucun."], ["<b>Cartes</b>", "<b>Cartes noires = cartes OPÉRATION</b> (15 cartes : phase, action, bien visé), mélangées : certaines ne servent à rien. Posez 4 cartes par chaîne (12 au total), les 3 autres restent à côté. <b>Cartes bleues BS</b> (les 10 biens supports de l'atelier 1) : à garder sous la main pour vérifier le bien visé de chaque action (test T1) et repérer les biens supports critiques. Vos scénarios de l'atelier 3 (cartes SR, PP, ER) restent posés dans les couloirs."], ["<b>Où écrire</b>", "Directement sur le plateau, feuille 2 (bas) : V et freins de chaque étape, V du scénario, actions écartées. Gardez sous la main la feuille 3 et la feuille 1."], ["<b>Autres</b>", "Tableau des freins (dossier de scénario, section 5) · cartes BS ou liste des 10 biens supports · stylo ou feutre effaçable."]]], ["p", "h2c4", "Objectif"], ["p", "b", "Détailler, pour chacun de vos 3 scénarios stratégiques, le mode opératoire de l'attaquant sur les biens supports, en 4 phases, coter sa vraisemblance, puis <b>identifier les biens supports critiques</b> (ceux par où l'attaquant entre ou frappe)."], ["p", "h2c4", "Rappel de méthode"], ["p", "bl", "Un <b>scénario opérationnel</b> enchaîne quatre actions sur des biens supports : <b>Connaître</b> (reconnaissance), <b>Rentrer</b> (accès initial), <b>Trouver</b> (déplacement, découverte), <b>Exploiter</b> (atteinte de l'objectif)."], ["p", "bl", "Seuls les scénarios stratégiques retenus sont détaillés."], ["p", "bl", "Un scénario opérationnel décrit des <b>actions sur les biens supports</b>. Il ne décrit pas l'impact (c'est l'ER) ni la partie prenante en général (c'est le scénario stratégique)."], ["p", "bl", "On peut s'inspirer de bases de connaissance d'attaques (MITRE ATT&amp;CK pour les systèmes industriels, CAPEC)."], ["p", "bl", "Les <b>cartes noires sont les cartes Opération</b> : chacune décrit une action, sa phase (Connaître, Rentrer, Trouver ou Exploiter) et le bien support visé."], ["p", "bl", "Les actions décrites montrent aussi quels <b>biens supports sont critiques</b> : ceux qui servent de vecteur d'entrée ou d'exploitation. Ils guideront l'atelier 5."], ["p", "h2c4", "Méthode : construire une chaîne de 4 actions"], ["t", [["Étape", "Ce que vous faites"], ["① Partir de la fin", "Reprenez le scénario stratégique (source, partie prenante, ER). Quel bien support l'attaquant doit-il toucher pour provoquer l'ER ? C'est la cible de l'action <b>Exploiter</b>."], ["② Remonter", "<b>Trouver</b> : que doit-il découvrir ou cartographier pour atteindre cette cible ? <b>Rentrer</b> : par quel accès (souvent la partie prenante en rebond) obtient-il l'entrée ? <b>Connaître</b> : que doit-il savoir au préalable ?"], ["③ Choisir les cartes", "Dans la réserve de 15 cartes noires (cartes Opération), choisissez pour chaque phase la carte qui correspond à votre scénario et posez-la sur l'emplacement de la chaîne. Plusieurs cartes paraissent plausibles : <b>le bien visé et la partie prenante du scénario tranchent</b>."], ["④ Vérifier chaque maillon", "Pour chaque action écrivez sur la feuille 2 (chaînes) <b>pourquoi elle suit la précédente</b> : le résultat de l'une doit rendre l'autre possible. Si vous ne pouvez pas l'écrire, l'action n'est pas à sa place."]]], ["p", "h2c4", "Méthode : écarter les actions qui n'ont rien à faire là"], ["p", "b", "Les 15 cartes ne servent pas toutes. Testez chaque carte que vous n'utilisez pas : elle est <b>écartée</b> dès qu'ell
