e échoue à l'un des tests suivants, et vous écrivez pourquoi (feuille 2 (actions écartées))."], ["t", [["Test", "Question"], ["T1 · Bien connu", "Le bien visé est-il l'un des 10 biens supports de l'atelier 1 ?"], ["T2 · Valeur métier", "Ce bien soutient-il une valeur métier de votre étude ?"], ["T3 · Chemin vers un ER", "L'action peut-elle contribuer à l'un de vos 3 scénarios stratégiques ?"], ["T4 · Enchaînement", "Son résultat permet-il l'action suivante d'une chaîne ?"]]], ["p", "h2c4", "Méthode : coter les étapes puis le scénario"], ["t", [["Comprendre un frein"], ["Un <b>frein</b> est un <b>obstacle réel</b> que la source rencontre à cette étape. Il ne bloque pas l'attaque : il la rend plus difficile, donc <b>moins vraisemblable</b>."], ["On part de <b>V4</b> (étape facile). Pour chaque frein qui s'applique <b>vraiment</b>, on retire 1. Il y a 4 freins possibles (F1 à F4), la V ne descend jamais sous V1."], ["Pour chaque étape, mettez-vous à la place de l'attaquant et répondez <b>oui ou non</b> aux quatre questions, dans l'ordre. Écrivez le frein retenu et la raison en une phrase."], ["<b>Piège classique</b> : une règle du socle en <b>Écart</b> n'est <b>pas</b> un frein (il n'y a aucune protection). Seule une règle <b>Conforme ou Partielle</b> peut freiner (F2)."]]], ["t", [["Frein", "Question de l'attaquant", "Exemple dans votre scénario", "Exemple de réponse « non »"], ["F1 · Compétences ou moyens", "Ai-je besoin de savoir-faire ou d'outils que je n'ai pas déjà ?", "Altérer les systèmes visés demande de connaître leurs protocoles et leur architecture.", "Un initié connaît déjà les systèmes : pas de F1."], ["F2 · Règle du socle", "Une protection existe-t-elle (règle Conforme ou Partielle) qui couvre cette étape ?", "La sensibilisation (R5) est partielle : un hameçonnage réussit moins souvent.", "Postes jamais mis à jour (R4 en Écart) : pas de F2."], ["F3 · Conditions cumulatives", "Faut-il réunir plusieurs conditions indépendantes en même temps ?", "Être sur place ET avoir un accès valide ET une cible accessible.", "Un seul mot de passe réutilisé suffit : pas de F3."], ["F4 · Détection probable", "Quelqu'un ou quelque chose a-t-il de bonnes chances de me remarquer ?", "Le prestataire ou l'hébergeur surveille les connexions d'administration.", "Aucune journalisation (R6 en Écart) : l'action passe inaperçue, pas de F4."]]], ["p", "note", "Calcul de l'étape : V = 4 − (nombre de freins retenus), minimum V1. Exemple : 2 freins retenus → V2. La V du scénario est la <b>plus petite</b> des 4 étapes : une chaîne est aussi difficile que son maillon le plus dur."], ["p", "b", "Pour chaque action : commencez à <b>V4</b>, retirez 1 par frein applicable (tableau des freins, section 5), sans descendre sous V1. Écrivez sur la feuille 2 (chaînes) les freins retenus et la V de l'étape. La vraisemblance du scénario est celle de <b>l'étape la plus difficile</b> (la plus petite V). Elle <b>remplace</b> celle de l'atelier 3 pour la matrice de l'atelier 5 ; si les deux diffèrent, expliquez pourquoi sur la feuille 2 (actions écartées)."], ["p", "h3", "Exemple résolu hors du jeu (même scénario que l'exemple de l'atelier 3)"], ["t", [["Phase", "Action", "Bien", "Pourquoi elle suit", "Freins", "V"], ["Connaître", "Recherche en sources ouvertes sur l'infogérant et ses outils", "BS5", "Point de départ", "Aucun", "V4"], ["Rentrer", "Hameçonnage d'un administrateur de l'infogérant, vol de ses identifiants", "BS5", "Il faut connaître les personnes et les outils pour cibler", "F2 : sensibilisation partielle des prestataires (R5)", "V3"], ["Trouver", "Repérage des tables de facturation et des coordonnées bancaires", "BS5", "Les identifiants donnent accès à l'ERP, il faut y repérer les données utiles", "F1 : connaître la structure de l'ERP", "V3"], ["Exploiter", "Modification de coordonnées bancaires de fournisseurs", "BS5", "Les données repérées peuvent être modifiées", "F4 : un contrôle de gestion peut remarquer le changement", "V3"]]], ["p", "note", "La plus faible des 4 étapes est V3 : le scénario est <b>V3</b>. Il était V2 à l'atelier 3 : la précision des actions a montré que chaque étape était accessible. C'est la V3 qui entre dans la matrice (G2 × V3 = 6, risque moyen)."], ["p", "h2c4", "Méthode : repérer les biens supports critiques"], ["t", [["Biens supports critiques : où l'attaquant passe le plus"], ["Dans la méthode EBIOS RM, l'atelier 4 ne sert pas seulement à décrire des attaques : il permet aussi d'identifier les <b>biens supports critiques</b>, ceux qui servent de <b>vecteur d'entrée</b> (Rentrer) ou de <b>point d'exploitation</b> (Exploiter) dans les scénarios."], ["Ce sont eux que l'atelier 5 devra protéger en priorité : une mesure sur un bien support critique réduit plusieurs scénarios à la fois."], ["<b>Règle du jeu</b> : un bien support est <b>critique</b> s'il est visé par <b>au moins 2 actions</b> de vos 12 cartes posées, dont <b>au moins un Rentrer ou un Exploiter</b>."]]], ["t", [["Bien support", "Nombre d'actions de vos chaînes qui le visent", "Une de ces actions est-elle un Rentrer ou un Exploiter ?", "Critique ?"], ["BS1", "", "", ""], ["BS2", "", "", ""], ["BS3", "", "", ""], ["BS4", "", "", ""], ["BS5", "", "", ""], ["BS6", "", "", ""], ["BS7", "", "", ""], ["BS8", "", "", ""], ["BS9", "", "", ""], ["BS10", "", "", ""]]], ["p", "note", "Comptez uniquement les cartes posées dans vos 3 chaînes (pas les cartes écartées). Reportez la liste des biens supports critiques sur la feuille 2, ligne « Biens supports critiques »."], ["p", "h2c4", "Pas à pas"], ["t", [["Minutes", "Ce que vous faites", "Où"], ["0–5", "Brief de méthode", "—"], ["5–15", "Lire les 15 cartes noires (cartes Opération) et vérifier les 3 scénarios stratégiques de la feuille 3 (scénarios stratégiques)", "Cartes noires ; feuille 3 (scénarios stratégiques)"], ["15–32", "Première version : poser les actions dans les 3 chaînes, écrire pourquoi chaque action suit la précédente", "Zone ④ chaînes ; feuille 2 (chaînes)"], ["32–35", "Aléa lu à mi-parcours : réexaminer vos chaînes et votre vraisemblance", "Feuille 2 (actions écartées), bloc violet"], ["35–46", "Écarter les actions inutiles (tests T1 à T4), coter chaque étape puis chaque scénario", "Zones ④ ; feuille 2 (atelier 4)"], ["46–51", "Compter les actions par bien support et noter les biens supports critiques", "Feuille 2, ligne « Biens supports critiques »"], ["51–55", "Validation", "—"]]], ["p", "h2c4", "Livrables"], ["p", "b", "Feuille 2 (atelier 4) complétées ; 3 chaînes de 4 actions posées dans l'ordre Connaître → Rentrer → Trouver → Exploiter ; actions écartées justifiées ; V de chaque étape et de chaque scénario ; comparaison avec la V de l'atelier 3 ; liste des biens supports critiques."], ["p", "h2c4", "Avant d'appeler l'animateur : auto-contrôle"], ["p", "bl", "☐ Chaque chaîne a exactement 4 actions, une par phase, dans le bon ordre."], ["p", "bl", "☐ Chaque action indique son bien support et pourquoi elle suit la précédente."], ["p", "bl", "☐ Chaque carte écartée est justifiée par un test échoué."], ["p", "bl", "☐ Chaque étape a sa V et ses freins ; la V du scénario est la plus petite."], ["p", "bl", "☐ Chaque bien support critique est noté, avec le décompte de ses actions."], ["p", "bl", "☐ Le bloc « Après l'aléa » est rempli."], ["p", "h3", "Conseils de vos rôles pendant cet atelier"], ["p", "note", "Chaque joueur a une fiche de rôle. Pour cet atelier, voici <b>la question que chaque rôle doit poser</b>. Si la table hésite, le rôle concerné lit sa ligne « Atelier 4 » dans sa fiche, ou scanne le QR code ci-dessous. Ces repères aident à positionner un choix ; ils ne remplacent jamais la justification de l'équipe."], ["t", [["Rôle", "Question que ce rôle pose à la table à l'atelier 4"], ["<b>R01</b><br/>RSSI", "Chaque action suit-elle logiquement la précédente ? Quels biens supports reviennent le plus souvent dans les chaînes ?"], ["<b>R02</b><br/>Directeur industriel", "Quels biens supports l'attaquant doit-il toucher pour provoquer l'ER1 ? Que vous manque-t-il pour rester en mode dégradé ?"], ["<b>R03</b><br/>Responsable automatisme", "Pour atteindre automates programmables (≈140), que doit savoir faire l'attaquant ? Quel accès lui faut-il ? Qui peut le remarquer ?"], ["<b>R06</b><br/>Responsable HSE", "Combien de personnes ou de conditions faut-il réunir pour modifier une consigne sans être vu ? Quelle alerte remarquerait-on ?"], ["<b>R10</b><br/>Directeur général", "Que retenez-vous de cet atelier pour ma décision ? Quels sont les biens supports critiques ?"]]], ["t", [["", "<b>Scannez : conseils complets des 5 rôles pour l'atelier 4</b><br/>Questions, repères pour positionner vos choix, position à défendre, piège à éviter. Le même contenu figure dans le tableau « atelier par atelier » de votre fiche de rôle.", "", "<b>Scannez : fiche de définitions</b><br/>Tous les termes de la méthode, avec la carte qui les porte. Une version papier est dans votre pochette."]]], ["p", "h2c4", "Défis flash de l'atelier 4 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 4.1.</b> Remettez dans l'ordre : O1 exfiltration, O9 veille sur l'hébergeur, O13 repérage des recettes, O4 compte administrateur compromis."], ["p", "b", "<b>Défi 4.2.</b> Citez un bien support et une mesure de détection pour chaque phase de SS1."], ["p", "b", "<b>Défi 4.3.</b> Le bastion de télémaintenance avec second facteur (M2) est déployé : R2 devient Conforme. Recotez « Rentrer » de SS1 par le VPN, puis cherchez une autre étape Rentrer et donnez la vraisemblance de SS1."], ["p", "b", "<b>Défi 4.5.</b> Dans vos trois chaînes, quels biens supports sont visés par au moins deux actions, dont un Rentrer ou un Exploiter ? Lequel protégeriez-vous en premier, et pourquoi ?"], ["p", "b", "<b>Défi 4.4.</b> Une publication décrit comment détecter et cartographier les automates sans connaître leurs protocoles (AL8). Que devient le frein F1 de « Trouver » en SS1 ? Quelle est la vraisemblance de SS1 ?"]]}, {"id": "a5", "title": "Atelier 5 · Traitement du risque · 0 h 40", "blocks": [["t", [["CE DONT VOUS AVEZ BESOIN", ""], ["<b>Plateau</b>", "Zone ⑤ : emplacements des mesures ME et M (colonne de droite de la partie gauche) et feuille 4 : matrice G × V, budget, avant / après traitement, décision du DG, risque résiduel et acceptation."], ["<b>Jetons</b>", "14 jetons jaunes de budget · 2 jetons bleus (SS1), 2 rouges (SS2), 2 verts (SS3) pour la matrice : le premier posé = avant traitement, le second = après · 1 jeton noir VETO SÉCURITÉ."], ["<b>Cartes</b>", "Deck orange MESURE (12 cartes : coût et effet) et cartes ME retenues à l'atelier 3 : à poser sur les emplacements."], ["<b>Où écrire</b>", "Directement sur le plateau, feuille 4 : avant / après, décision du DG, risque résiduel, cadre de suivi."], ["<b>Autres</b>", "Calculatrice · stylo ou feutre effaçable."]]], ["p", "h2c5", "Objectif"], ["p", "b", "Synthétiser les risques, choisir un plan de traitement sous contrainte de budget, formuler les risques résiduels et faire accepter formellement ces risques par le décideur."], ["p", "h2c5", "Rappel de méthode"], ["p", "bl", "<b>Synthèse</b> : chaque scénario est placé dans la matrice gravité × vraisemblance, avec la V de l'atelier 4."], ["p", "bl", "<b>Stratégies de traitement</b> : réduire, éviter, partager (transférer) ou accepter."], ["p", "bl", "<b>PACS</b> : plan d'amélioration continue de la sécurité (mesures, responsables, échéances)."], ["p", "bl", "<b>Seuil d'acceptation</b> : la direction accepte un risque jusqu'à <b>G × V = 6</b> (niveau Moyen au plus). <b>Votre objectif : amener chaque scénario stratégique à 6 ou moins</b>, avec le moins de jetons possible. Un scénario qui reste au-dessus de 6 doit recevoir une mesure en plus ou une dérogation écrite du DG, avec responsable, indicateur et date de revue ; le veto sécurité reste possible."], ["p", "bl", "<b>Risque résiduel</b> : ce qui reste après traitement ; il est accepté <b>formellement</b> par le décideur (responsable, date de revue, indicateur)."], ["p", "bl", "<b>Mesures</b> : chaque carte orange indique un coût en jetons et un effet (par exemple « SS1 : vraisemblance −1 »). Les mesures d'écosystème (ME) choisies à l'atelier 3 rejoignent ce plan et coûtent aussi des jetons ; une mesure M et une mesure ME qui font la même chose ne se cumulent pas (c'est le cas de M5 et de ME1 + ME7)."], ["p", "h3", "D'où viennent G et V de chaque scénario ?"], ["t", [["Scénario", "G vient de…", "V vient de…", "À reporter dans la matrice"], ["SS1, SS2, SS3 (chacun)", "La <b>gravité de l'événement redouté</b> visé par le scénario (feuille 1, repris dans la feuille 3, colonne G). Jamais modifiée sans mesure.", "La <b>vraisemblance du scénario opérationnel</b> : la plus petite V de ses 4 étapes (feuille 2, atelier 4). Elle <b>remplace</b> la V de l'atelier 3.", "Risque avant = G × V. Placez le premier jeton de la couleur du scénario."]]], ["t", [["Scénario", "ER visé", "G (feuille 1)", "V de l'atelier 3", "V de l'atelier 4 (retenue)", "G × V avant"], ["SS1", "ER__", "G__", "V__", "V__", "__"], ["SS2", "ER__", "G__", "V__", "V__", "__"], ["SS3", "ER__", "G__", "V__", "V__", "__"]]], ["p", "note", "Après une mesure : lisez l'effet sur la carte (« vraisemblance −1 » ou « gravité −1 »), recalculez G × V par écrit, puis posez le second jeton."], ["p", "h2c5", "Pas à pas"], ["t", [["Minutes", "Ce que vous faites", "Où"], ["0–5", "Brief de méthode", "—"], ["5–8", "Placer SS1 à SS3 dans la matrice : un jeton de la couleur du scénario (avant traitement)", "Zone ⑤ matrice ; feuille 4"], ["8–22", "Première version du plan : choisir les mesures dans la limite de 14 jetons pour que chaque scénario passe <b>à G × V ≤ 6</b> (seuil d'acceptation), recalculer G et V, poser le second jeton de la même couleur (après traitement)", "Zone ⑤ PACS et budget"], ["22–28", "Aléa lu à mi-parcours : refaire le plan sous la nouvelle contrainte", "Feuille 4, bloc violet"], ["28–35", "Formuler le risque résiduel, remplir le cadre de suivi, décision du DG, veto du HSE si nécessaire", "Zone ⑤ acceptation"], ["35–40", "Validation", "—"]]], ["p", "h2c5", "Livrables"], ["p", "b", "Feuille 4 complétée ; matrice avec jetons avant et après ; PACS posé (cartes M et ME sur leurs emplacements) ; budget respecté ; risques résiduels formulés ; décision d'acceptation signée par le DG (et co-signée par le HSE si ER4 est concerné) ; cadre de suivi."], ["p", "h2c5", "Avant d'appeler l'animateur : auto-contrôle"], ["p", "bl", "☐ Le total des coûts ne dépasse pas le budget."], ["p", "bl", "☐ Chaque scénario est à G × V ≤ 6 après traitement, ou une dérogation signée du DG est écrite (responsable, indicateur, date de revue)."], ["p", "bl", "☐ Pour chaque mesure, vous avez recalculé G ou V par écrit."], ["p", "bl", "☐ Chaque risque résiduel est situé dans la matrice."], ["p", "bl", "☐ Chaque risque accepté a un responsable, une date de revue et un indicateur."], ["p", "bl", "☐ Votre plan s'appuie sur les écarts du socle de l'atelier 1."], ["p", "bl", "☐ Pour chaque scénario, vous pouvez dire d'où viennent son G et sa V."], ["p", "bl", "☐ Chaque bien support critique (atelier 4) est protégé par une mesure, ou son risque est accepté explicitement."], ["p", "h3", "Conseils de vos rôles pendant cet atelier"], ["p", "note", "Chaque joueur a une fiche de rôle. Pour cet atelier, voici <b>la question que chaque rôle doit poser</b>. Si la table hésite, le rôle concerné lit sa ligne « Atelier 5 » dans sa fiche, ou scanne le QR code ci-dessous. Ces repères aident à positionner un choix ; ils ne remplacent jamais la justification de l'équipe."], ["t", [["Rôle", "Question que ce rôle pose à la table à l'atelier 5"], ["<b>R01</b><br/>RSSI", "Le budget est-il respecté ? Chaque risque accepté a-t-il un responsable, un indicateur et une date de revue ?"], ["<b>R02</b><br/>Directeur industriel", "Quelle mesure me rend le plus de jours de service ? Que peut-on laisser accepter sans mettre l'activité en danger ?"], ["<b>R03</b><br/>Responsable automatisme", "Quelle mesure est applicable dans mes équipes en moins de six mois ? Laquelle suppose un arrêt de service ?"], ["<b>R06</b><br/>Responsable HSE", "Le risque touchant mon périmètre est-il revenu à un niveau que j'accepte ? Sinon, quelle mesure supplémentaire ?"], ["<b>R10</b><br/>Directeur général", "Quel risque résiduel j'accepte ? Qui en est responsable ? Quand le revoit-on ?"]]], ["t", [["", "<b>Scannez : conseils complets des 5 rôles pour l'atelier 5</b><br/>Questions, repères pour positionner vos choix, position à défendre, piège à éviter. Le même contenu figure dans le tableau « atelier par atelier » de votre fiche de rôle.", "", "<b>Scannez : fiche de définitions</b><br/>Tous les termes de la méthode, avec la carte qui les porte. Une version papier est dans votre pochette."]]], ["p", "h2c5", "Défis flash de l'atelier 5 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 5.1.</b> Placez dans la matrice un risque G2 × V4, un risque G4 × V1 et un risque G3 × V3. Donnez leur niveau."], ["p", "b", "<b>Défi 5.2.</b> Avec 6 jetons, quelle priorité pour SS1 seul (12) ?"], ["p", "b", "<b>Défi 5.3.</b> Pourquoi la cyber-assurance (M12) n'apparaît-elle pas dans le plan de référence ?"], ["p", "b", "<b>Défi 5.4.</b> Rédigez une décision d'acceptation pour SS1 résiduel (G3 × V2 = 6)."]]}, {"id": "deb", "title": "Débrief et bilan · 0 h 30", "blocks": [["t", [["CE DONT VOUS AVEZ BESOIN", ""], ["<b>Plateau</b>", "Bas de la feuille 4 : bilan de la journée et questions de débrief."], ["<b>Jetons</b>", "Aucun."], ["<b>Cartes</b>", "Aucune."], ["<b>Où écrire</b>", "Sur le plateau (débrief) et votre dossier d'analyse."], ["<b>Autres</b>", "Votre dossier d'analyse complet, un stylo."]]], ["p", "h2c6", "Pas à pas"], ["t", [["Minutes", "Ce que vous faites", "Où"], ["0–5", "Chaque table présente son résultat : score, risque le plus critique, plus grande divergence avec les autres tables", "Colonne débrief"], ["5–17", "Comparaison des tables : valeurs métier, couples retenus, plan de traitement", "Dossiers"], ["17–25", "Retour sur la méthode officielle : écarts entre les échelles du jeu et celles du guide de l'ANSSI", "Guide ANSSI"], ["25–30", "« Ce que je fais lundi » : engagement individuel écrit", "Colonne débrief"]]], ["p", "h2c6", "Questions à préparer"], ["p", "bl", "Quelle cotation a le plus divisé votre équipe, et comment l'avez-vous tranchée ?"], ["p", "bl", "Qu'a changé l'aléa dans votre analyse ?"], ["p", "bl", "La vraisemblance fixée à l'atelier 3 a-t-elle survécu à l'atelier 4 ? Pourquoi ?"], ["p", "bl", "Si FERROMEUSE avait un autre secteur (santé, énergie), que changeriez-vous aux ateliers 1 et 3 ?"], ["p", "bl", "Qui signe l'acceptation d'un risque dans votre entreprise ou votre stage ?"], ["p", "bl", "Que ferez-vous lundi ?"], ["p", "note", "© 2026 BEL'M DEVELOPPEMENT – Tous droits réservés."]]}], "fichesFull": [[["p", "rh", "R01 · RSSI"], ["p", "note", "<b>Fiche rôle individuelle</b> · Opération FERROMEUSE · poste : RSSI · à ne pas montrer aux autres joueurs"], ["p", "h2", "Votre mission dans le jeu"], ["p", "b", "Garant de la méthode. Tient la synthèse, relit les cotations, veille au temps."], ["p", "h2", "Dans la vraie vie"], ["p", "b", "Dans une organisation comme FERROMEUSE Aciers Spéciaux, le RSSI est souvent seul ou presque : il rédige la politique de sécurité, relaie les alertes, prépare les audits et doit convaincre une direction qui arbitre d'abord entre ses priorités métier. Il est rarement le décideur : il éclaire, il documente, il fait signer. Situation réelle : avant le vote du budget, la direction demande « de quoi a-t-on besoin, et pourquoi ? » ; la seule réponse recevable est une analyse de risque chiffrée et lisible."], ["t", [["Ce que vous savez (et que les autres ne savent pas forcément)"], ["Vous connaissez la méthode : vous savez à chaque atelier quelle feuille remplir et dans quel ordre. Vous tenez le temps (chronomètre du plateau)."], ["Vous avez commandé l'audit interne : les constats du socle viennent de vous. Vous savez que « Partiel » veut dire « en place mais incomplet ou non testé », « Écart » « rien en place »."], ["Vous savez que les sources de risque et les parties prenantes sont connues, mais que personne n'a encore chiffré leur niveau."]]], ["p", "h3", "Comment cette fiche vous aide"], ["p", "note", "<b>Lien avec le guide des joueurs :</b> à la fin de chaque atelier, le guide reprend la question de chaque rôle dans l'encadré « Conseils de vos rôles pendant cet atelier », avec un QR code vers le détail en ligne. Le tableau ci-dessous est la version complète, atelier par atelier."], ["p", "b", "À chaque atelier, vous avez des <b>questions à poser</b> à l'équipe, des <b>repères</b> pour aider à positionner une valeur ou un choix (ce ne sont pas des réponses toutes faites : vous devez toujours justifier), et une <b>position à défendre</b>."], ["p", "rh", "R01 · RSSI · atelier par atelier"], ["t", [["Atelier", "Questions à poser", "Repères pour positionner vos valeurs et vos choix", "Position à défendre"], ["1 · Cadrage et socle", "Chaque valeur métier a-t-elle au moins un bien support, chaque bien support une valeur métier ? L'ER décrit-il l'atteinte, pas l'attaque ?", "Faites justifier chaque gravité par un calcul (jours × 378 k€). Pour le socle : relisez la phrase du constat avant de choisir Conforme, Partiel ou Écart.", "Un taux de conformité honnête, même faible, plutôt qu'un taux flatteur."], ["2 · Sources de risque", "Quelle phrase de la carte justifie ce M, ce R, ce A ? Tous les ER G3 et G4 sont-ils couverts ?", "Faites utiliser toute l'échelle 1 à 4. Deux sources ne peuvent pas avoir exactement les mêmes cotations.", "Retenir peu de sources, mais couvrir tous les ER graves."], ["3 · Écosystème", "Pouvons-nous dire à voix haute la phrase « source → partie prenante → événement redouté » ? Les critères A, B, C ont-ils chacun leur preuve ?", "Vérifiez que chaque niveau de menace est écrit D × P, M × C, quotient. Exigez 3 scénarios, pas 4.", "Des mesures d'écosystème qui agissent sur la variable en cause."], ["4 · Scénarios opérationnels", "Chaque action suit-elle logiquement la précédente ? Quels biens supports reviennent le plus souvent dans les chaînes ?", "Aidez l'équipe à tenir la règle : V d'étape = 4 − freins ; V du scénario = minimum. Faites noter les biens supports critiques.", "La V de l'atelier 4 remplace celle de l'atelier 3."], ["5 · Traitement du risque", "Le budget est-il respecté ? Chaque risque accepté a-t-il un responsable, un indicateur et une date de revue ?", "Préparez la décision d'acceptation : « Risque ___, G×V = ___, accepté par le DG pour ___ mois. Responsable : le RSSI. Indicateur : ___. »", "Aucun risque Élevé ou Critique accepté sans signature et sans suivi."]]], ["t", [["Votre piège à éviter"], ["Décider seul au nom de l'équipe. Votre rôle est de conduire, pas de trancher les cotations métier."]]], ["t", [["Votre phrase-clé"], ["« Montrez-moi le calcul, puis la preuve. »"]]], ["p", "h3", "Débrief : trois questions pour vous"], ["p", "bl", "Quelle décision de l'équipe ai-je le plus influencée, et sur quel fait ?"], ["p", "bl", "Quelle information de ma fiche aurait-elle dû être donnée plus tôt ?"], ["p", "bl", "Dans mon vrai métier, qui joue ce rôle, et que ferait-il lundi ?"]], [["p", "rh", "R02 · Directeur industriel"], ["p", "note", "<b>Fiche rôle individuelle</b> · Opération FERROMEUSE · poste : Directeur industriel · à ne pas montrer aux autres joueurs"], ["p", "h2", "Votre mission dans le jeu"], ["p", "note", "<b>À 4 joueurs</b> : vous jouez aussi le responsable de la sécurité (R06) et portez le veto sécurité."], ["p", "b", "Défend les missions et arbitre les gravités. Connaît le coût d'un arrêt."], ["p", "h2", "Dans la vraie vie"], ["p", "b", "Le poste « Directeur industriel » porte la continuité de l'activité de FERROMEUSE Aciers Spéciaux : astreintes, fournisseurs, plans de continuité. Il connaît le prix d'un jour de service dégradé, car il le vit en gestion de crise. Situation réelle : lors d'une panne informatique de plusieurs jours dans une organisation comparable, l'activité est repassée au papier et au téléphone, et chaque jour coûte en heures supplémentaires, en clients mécontents et en perte de service rendu."], ["t", [["Ce que vous savez (et que les autres ne savent pas forcément)"], ["Un jour d'arrêt total coûte environ 378 k€ (valeur donnée par le dossier de scénario)."], ["Constat de l'audit sur la continuité : Procédures de repli manuel testées chaque année sur les 4 lignes."], ["La valeur métier VM1 (production laminage et traitement thermique) repose sur les biens supports techniques, les locaux et les équipes : Automates programmables (≈140) ; Serveur MES ; Accès de télémaintenance."]]], ["p", "h3", "Comment cette fiche vous aide"], ["p", "note", "<b>Lien avec le guide des joueurs :</b> à la fin de chaque atelier, le guide reprend la question de chaque rôle dans l'encadré « Conseils de vos rôles pendant cet atelier », avec un QR code vers le détail en ligne. Le tableau ci-dessous est la version complète, atelier par atelier."], ["p", "b", "À chaque atelier, vous avez des <b>questions à poser</b> à l'équipe, des <b>repères</b> pour aider à positionner une valeur ou un choix (ce ne sont pas des réponses toutes faites : vous devez toujours justifier), et une <b>position à défendre</b>."], ["p", "rh", "R02 · Directeur industriel · atelier par atelier"], ["t", [["Atelier", "Questions à poser", "Repères pour positionner vos valeurs et vos choix", "Position à défendre"], ["1 · Cadrage et socle", "Combien de jours peut-on tenir en mode dégradé ? À partir de quand l'indisponibilité devient-elle inacceptable ?", "Utilisez 378 k€ par jour. Un arrêt de 12 jours = 4,5 M€ : G3. Rattachez chaque bien support à la ou aux valeurs métier qu'il soutient.", "Les gravités sont calculées, pas ressenties."], ["2 · Sources de risque", "Quelle source de risque s'attaquerait à mon activité ? Laquelle a un intérêt à nous mettre sous pression ?", "Pensez à l'activité (A) : combien d'organisations du secteur ont été paralysées récemment ? C'est ce qui fait monter A.", "Ne pas laisser sortir de l'étude une source qui peut arrêter l'activité."], ["3 · Écosystème", "Quelle partie prenante, si elle tombe ou est compromise, arrête mon activité ? Combien de temps pour la remplacer ?", "Vous êtes la meilleure source pour juger D (dépendance) : plus la partie prenante est difficile à remplacer vite, plus D est haut.", "Protéger en priorité les PP qui ont un accès direct aux systèmes critiques."], ["4 · Scénarios opérationnels", "Quels biens supports l'attaquant doit-il toucher pour provoquer l'ER1 ? Que vous manque-t-il pour rester en mode dégradé ?", "Aidez à distinguer l'action qui provoque l'impact (Exploiter) de celle qui ne fait que préparer.", "Les sauvegardes et le mode dégradé réduisent la gravité, pas la vraisemblance."], ["5 · Traitement du risque", "Quelle mesure me rend le plus de jours de service ? Que peut-on laisser accepter sans mettre l'activité en danger ?", "Comparez les gains par jeton avec la direction financière. Une mesure qui réduit G (sauvegardes) vaut autant qu'une qui réduit V.", "Réduire la durée d'un arrêt avant de réduire sa probabilité."]]], ["t", [["Votre piège à éviter"], ["Sous-estimer ce qu'un jour d'arrêt coûte, parce que « on s'en est toujours sorti »."]]], ["t", [["Votre phrase-clé"], ["« Combien de jours, et combien par jour ? »"]]], ["p", "h3", "Débrief : trois questions pour vous"], ["p", "bl", "Quelle décision de l'équipe ai-je le plus influencée, et sur quel fait ?"], ["p", "bl", "Quelle information de ma fiche aurait-elle dû être donnée plus tôt ?"], ["p", "bl", "Dans mon vrai métier, qui joue ce rôle, et que ferait-il lundi ?"]], [["p", "rh", "R03 · Responsable automatisme"], ["p", "note", "<b>Fiche rôle individuelle</b> · Opération FERROMEUSE · poste : Responsable automatisme · à ne pas montrer aux autres joueurs"], ["p", "h2", "Votre mission dans le jeu"], ["p", "note", "<b>Responsabilité en plus de votre carte :</b> vous jouez aussi l'attaquant (Red Team). Vous pensez comme la source de risque, cherchez le maillon le moins protégé et contestez en priorité les scénarios peu plausibles."], ["p", "b", "Connaît automates, SCADA, réseau OT. Décrit les modes opératoires crédibles."], ["p", "h2", "Dans la vraie vie"], ["p", "b", "Le poste « Responsable automatisme » connaît les systèmes de l'intérieur : architectures, accès d'administration, interventions de prestataires. Il vit entre astreintes, contraintes des éditeurs et délais d'intervention. Situation réelle : un prestataire arrive tôt le matin avec un accès temporaire pour une intervention ; personne ne vérifie ce qu'il fait ensuite, et le support amovible qu'il branche n'a jamais été contrôlé."], ["t", [["Ce que vous savez (et que les autres ne savent pas forcément)"], ["Un pare-feu sépare bureautique et industriel, mais plusieurs flux directs existent (SCADA vers MES, accès du constructeur) sans zone démilitarisée industrielle."], ["Accès VPN du constructeur et de l'intégrateur : comptes partagés, sessions permanentes, aucun second facteur d'authentification."], ["Postes SCADA Windows hérités : correctifs non appliqués depuis deux ans, durcissement inexistant."]]], ["p", "h3", "Comment cette fiche vous aide"], ["p", "note", "<b>Lien avec le guide des joueurs :</b> à la fin de chaque atelier, le guide reprend la question de chaque rôle dans l'encadré « Conseils de vos rôles pendant cet atelier », avec un QR code vers le détail en ligne. Le tableau ci-dessous est la version complète, atelier par atelier."], ["p", "b", "À chaque atelier, vous avez des <b>questions à poser</b> à l'équipe, des <b>repères</b> pour aider à positionner une valeur ou un choix (ce ne sont pas des réponses toutes faites : vous devez toujours justifier), et une <b>position à défendre</b>."], ["p", "rh", "R03 · Responsable automatisme · atelier par atelier"], ["t", [["Atelier", "Questions à poser", "Repères pour positionner vos valeurs et vos choix", "Position à défendre"], ["1 · Cadrage et socle", "Quels biens supports portent l'activité ? Quel équipement n'a pas de valeur métier derrière lui ?", "Reliez chaque bien support de la liste aux valeurs métier : un bien support peut en soutenir plusieurs (serveur MES : plusieurs valeurs métier).", "Rien ne reste « orphelin » sur la feuille 1."], ["2 · Sources de risque", "Un technicien interne a-t-il des moyens ? Que sait-il faire sans outils ?", "L'initié a des ressources élevées parce qu'il possède des accès légitimes et connaît les procédures.", "Ne pas écarter l'initié parce qu'il n'est « pas un hacker »."], ["3 · Écosystème", "Quel prestataire a un accès permanent à nos systèmes ? Lequel entre dans les locaux avec un badge ou un compte partenaire ?", "Vous savez ce qui explique P (pénétration) : accès permanent, compte partagé, badge, support amovible. Une PP avec un accès direct aux systèmes critiques est un relais crédible.", "Faire valider les chemins par le terrain : un chemin que vous jugez impossible doit être justifié."], ["4 · Scénarios opérationnels", "Pour atteindre automates programmables (≈140), que doit savoir faire l'attaquant ? Quel accès lui faut-il ? Qui peut le remarquer ?", "Vous connaissez les freins : F1 (savoir-faire sur les systèmes), F3 (accès + présence + cible accessible), F4 (une anomalie remarquée par l'exploitation). Rappel : une règle en Écart ne freine pas.", "Des chaînes réalistes : les mêmes actions ne conviennent pas à tous les scénarios."], ["5 · Traitement du risque", "Quelle mesure est applicable dans mes équipes en moins de six mois ? Laquelle suppose un arrêt de service ?", "Cloisonnement, bastion d'accès, verrouillage local : dites ce qui est faisable et ce qui ne l'est pas.", "Un plan que les équipes peuvent réellement mettre en œuvre."]]], ["t", [["Votre piège à éviter"], ["Trop techniser : l'atelier 4 décrit des actions sur des biens supports, pas des lignes de code."]]], ["t", [["Votre phrase-clé"], ["« Sur le terrain, voilà comment ça se passe. »"]]], ["p", "h3", "Débrief : trois questions pour vous"], ["p", "bl", "Quelle décision de l'équipe ai-je le plus influencée, et sur quel fait ?"], ["p", "bl", "Quelle information de ma fiche aurait-elle dû être donnée plus tôt ?"], ["p", "bl", "Dans mon vrai métier, qui joue ce rôle, et que ferait-il lundi ?"]], [["p", "rh", "R06 · Responsable HSE"], ["p", "note", "<b>Fiche rôle individuelle</b> · Opération FERROMEUSE · poste : Responsable HSE · à ne pas montrer aux autres joueurs"], ["p", "h2", "Votre mission dans le jeu"], ["p", "b", "Porte l'événement redouté de sécurité. Peut imposer un veto sur l'acceptation."], ["p", "h2", "Dans la vraie vie"], ["p", "b", "Le poste « Responsable HSE » (expertise : sécurité des personnes) veille à ce qui ne se négocie pas : sécurité, conformité, intégrité. Sa responsabilité, et celle de la direction, peut être engagée en cas de manquement. Situation réelle : un paramètre modifié ou une consigne falsifiée peut avoir des conséquences graves en quelques heures, bien avant que le service informatique ne le voie."], ["t", [["Ce que vous savez (et que les autres ne savent pas forcément)"], ["Vous détenez le jeton noir VETO SÉCURITÉ : vous pouvez refuser qu'un risque relevant de votre périmètre soit accepté."], ["L'ER4 (perte de maîtrise d'un four de traitement) est classé G4 : Risque de blessures graves, incendie, pollution. Arrêt administratif du site."], ["Procédures de repli manuel testées chaque année sur les 4 lignes."]]], ["p", "h3", "Comment cette fiche vous aide"], ["p", "note", "<b>Lien avec le guide des joueurs :</b> à la fin de chaque atelier, le guide reprend la question de chaque rôle dans l'encadré « Conseils de vos rôles pendant cet atelier », avec un QR code vers le détail en ligne. Le tableau ci-dessous est la version complète, atelier par atelier."], ["p", "b", "À chaque atelier, vous avez des <b>questions à poser</b> à l'équipe, des <b>repères</b> pour aider à positionner une valeur ou un choix (ce ne sont pas des réponses toutes faites : vous devez toujours justifier), et une <b>position à défendre</b>."], ["p", "rh", "R06 · Responsable HSE · atelier par atelier"], ["t", [["Atelier", "Questions à poser", "Repères pour positionner vos valeurs et vos choix", "Position à défendre"], ["1 · Cadrage et socle", "Quel événement redouté touche à ce qui ne se négocie pas (sécurité, conformité, solvabilité) ? Y a-t-il une atteinte qui reste invisible pendant des heures ?", "Dès qu'une atteinte qualitative est décrite en G4, la gravité est G4 sans calcul d'argent. Rattachez les biens supports concernés à la valeur métier correspondante.", "Une ER qui nomme explicitement l'enjeu critique."], ["2 · Sources de risque", "Quelle source viserait cet enjeu ? Qui a assez de moyens et d'accès pour le faire ?", "Un initié a des accès légitimes ; un hacktiviste n'a pas les moyens d'agir en profondeur. Ne laissez pas ER4 sans source retenue.", "Couvrir ER4 par au moins un couple retenu."], ["3 · Écosystème", "Qui entre physiquement ou logiquement dans les zones sensibles ? Avec quel contrôle ?", "Un accès partenaire (compte, badge) donne une pénétration forte. La menace est élevée si la maturité cyber est minimale (PP7 : 3,0).", "Un chemin crédible pour ER4 par le relais le moins mûr."], ["4 · Scénarios opérationnels", "Combien de personnes ou de conditions faut-il réunir pour modifier une consigne sans être vu ? Quelle alerte remarquerait-on ?", "Frein F3 : plusieurs conditions cumulées. Frein F4 : alarmes remarquées. N'oubliez pas : sans journalisation, pas de détection.", "Des étapes qui ne sous-estiment pas la facilité de l'accès."], ["5 · Traitement du risque", "Le risque touchant mon périmètre est-il revenu à un niveau que j'accepte ? Sinon, quelle mesure supplémentaire ?", "Quand un risque relève du veto, posez le jeton noir : le DG doit choisir une mesure en plus, pas accepter.", "Aucun risque critique accepté sans mon avis écrit."]]], ["t", [["Votre piège à éviter"], ["Utiliser le veto sans proposer d'alternative : le DG a besoin d'une mesure concrète à choisir."]]], ["t", [["Votre phrase-clé"], ["« Là où l'enjeu est vital, le coût passe après. »"]]], ["p", "h3", "Débrief : trois questions pour vous"], ["p", "bl", "Quelle décision de l'équipe ai-je le plus influencée, et sur quel fait ?"], ["p", "bl", "Quelle information de ma fiche aurait-elle dû être donnée plus tôt ?"], ["p", "bl", "Dans mon vrai métier, qui joue ce rôle, et que ferait-il lundi ?"]], [["p", "rh", "R10 · Directeur général"], ["p", "note", "<b>Fiche rôle individuelle</b> · Opération FERROMEUSE · poste : Directeur général · à ne pas montrer aux autres joueurs"], ["p", "h2", "Votre mission dans le jeu"], ["p", "note", "<b>Responsabilité en plus de votre carte :</b> vous tenez les 14 jetons de budget (rôle de la finance). Vous évaluez les coûts d'impact et de traitement et signez l'acceptation des risques."], ["p", "b", "Arbitre en fin d'atelier 5. Accepte ou refuse les risques résiduels."], ["p", "h2", "Dans la vraie vie"], ["p", "b", "Le poste « Directeur général » dirige l'organisation. Il arbitre entre directions, répond aux instances de gouvernance et signe les décisions. En matière de risque, il est celui qui accepte formellement, et donc qui assume. Situation réelle : après un incident, la question n'est pas « qui a échoué ? » mais « qui avait accepté ce risque, avec quelle information ? »"], ["t", [["Ce que vous savez (et que les autres ne savent pas forcément)"], ["Vous tranchez les désaccords à l'atelier 5 et vous signez l'acceptation des risques résiduels."], ["Les instances de gouvernance attendent de vous une décision que vous pourrez expliquer et défendre."], ["Le budget est limité à 14 jetons. Vous ne pouvez pas tout traiter : vous devez choisir."]]], ["p", "h3", "Comment cette fiche vous aide"], ["p", "note", "<b>Lien avec le guide des joueurs :</b> à la fin de chaque atelier, le guide reprend la question de chaque rôle dans l'encadré « Conseils de vos rôles pendant cet atelier », avec un QR code vers le détail en ligne. Le tableau ci-dessous est la version complète, atelier par atelier."], ["p", "b", "À chaque atelier, vous avez des <b>questions à poser</b> à l'équipe, des <b>repères</b> pour aider à positionner une valeur ou un choix (ce ne sont pas des réponses toutes faites : vous devez toujours justifier), et une <b>position à défendre</b>."], ["p", "rh", "R10 · Directeur général · atelier par atelier"], ["t", [["Atelier", "Questions à poser", "Repères pour positionner vos valeurs et vos choix", "Position à défendre"], ["1 · Cadrage et socle", "Quelles sont nos obligations légales, nos engagements envers nos clients ou usagers ? Qu'est-ce qui ne doit jamais s'arrêter ?", "Écoutez le directeur des opérations et le titulaire du veto : la valeur métier passe avant la technique.", "Le cadre de l'étude validé par la direction."], ["2 · Sources de risque", "Pourquoi retenir cette source et pas celle-là ? Ai-je tous les ER graves couverts ?", "Demandez le contrôle de couverture : si un ER grave n'est atteint par aucune source retenue, la sélection est trop étroite.", "Une sélection argumentée, pas exhaustive."], ["3 · Écosystème", "Ces mesures d'écosystème sont-elles réalistes avec nos prestataires ? Combien coûtent-elles ?", "Notez le coût total des ME retenues : elles s'ajouteront aux mesures M dans le budget de 14 jetons.", "Des mesures d'écosystème choisies avec le coût en tête."], ["4 · Scénarios opérationnels", "Que retenez-vous de cet atelier pour ma décision ? Quels sont les biens supports critiques ?", "Demandez la liste des biens supports critiques : ce sont eux que le plan doit protéger.", "Une vue claire de ce qu'il faut protéger."], ["5 · Traitement du risque", "Quel risque résiduel j'accepte ? Qui en est responsable ? Quand le revoit-on ?", "Posez les trois questions : responsable, indicateur, date de revue. Si le titulaire du veto le pose, choisissez une mesure en plus.", "Décision écrite, signée, avec responsable, indicateur, revue."]]], ["t", [["Votre piège à éviter"], ["Signer sans comprendre : vous ne pouvez pas accepter un risque que personne ne vous a expliqué."]]], ["t", [["Votre phrase-clé"], ["« Qui est responsable, et quand revoit-on ? »"]]], ["p", "h3", "Débrief : trois questions pour vous"], ["p", "bl", "Quelle décision de l'équipe ai-je le plus influencée, et sur quel fait ?"], ["p", "bl", "Quelle information de ma fiche aurait-elle dû être donnée plus tôt ?"], ["p", "bl", "Dans mon vrai métier, qui joue ce rôle, et que ferait-il lundi ?"]]], "defs": [["p", "h2", "Fiche de définitions · un seul vocabulaire pour toute la table"], ["p", "note", "À lire par tous les joueurs avant de commencer et à garder sous la main. La dernière colonne indique <b>la carte ou la zone du plateau qui porte la notion</b>."], ["p", "h3", "Pour tous"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Valeur métier (VM)</b>", "Ce qui est essentiel à la mission de l'organisation (un processus, une information, un savoir-faire). Test : « si on change de technologie, cela existe-t-il encore ? »", "Carte bleue ENTREPRISE"], ["<b>Bien support (BS)</b>", "Composante du SI, de l'OT, des locaux ou des personnes sur laquelle repose une valeur métier. Il disparaît avec la technologie.", "Carte bleue ENTREPRISE"], ["<b>Événement redouté (ER)</b>", "Atteinte à une valeur métier selon un critère (disponibilité, intégrité, confidentialité), avec son impact. On ne décrit jamais l'attaque.", "Carte bleue ENTREPRISE"], ["<b>Gravité (G1 à G4)</b>", "Niveau d'impact d'un ER, coté avec l'échelle du dossier de scénario (calcul jours d'arrêt × coût par jour quand c'est possible). Un ER qui touche la sécurité des personnes est G4.", "Dossier de scénario ; feuille 1"], ["<b>Vraisemblance (V1 à V4)</b>", "Facilité avec laquelle un scénario peut se produire. Cotée par critères à l'atelier 3, par étapes à l'atelier 4.", "Feuilles 3 et 2"], ["<b>Risque</b>", "Gravité × vraisemblance (G × V). Faible ≤ 3 · Moyen 4 à 6 · Élevé 8 à 9 · Critique ≥ 12.", "Matrice atelier 5"]]], ["p", "h3", "Atelier 1 · Cadrage et socle"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Socle de sécurité</b>", "8 règles de base. Chacune est notée Conforme (1 point), Partielle (0,5) ou Écart (0). Taux de conformité = points ÷ 8.", "Feuille 1 ; constats d'audit du dossier"]]], ["p", "h3", "Atelier 2 · Sources de risque"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Source de risque (SR)</b>", "Personne ou groupe qui peut porter atteinte à l'organisation : État, cybercriminel, hacktiviste, concurrent, initié, amateur…", "Carte rouge MENACE"], ["<b>Objectif visé (OV)</b>", "Ce que la source cherche à obtenir (espionnage, gain financier, vengeance, défi). Ce n'est pas un ER : l'objectif est ce que veut l'attaquant, l'ER est ce que redoute l'entreprise.", "Carte rouge MENACE"], ["<b>M, R, A et pertinence (Σ)</b>", "Motivation, Ressources, Activité, chacune de 1 à 4. Σ = M + R + A : ≥ 8 retenu · 6 à 7 à surveiller · ≤ 5 écarté.", "Feuille 2"], ["<b>Couple retenu</b>", "Couple source / objectif dont Σ ≥ 8. Seul un couple retenu compte dans le contrôle de couverture.", "Feuille 2"], ["<b>Couverture</b>", "Contrôle de cohérence : chaque ER de gravité G3 ou G4 doit être atteint par au moins un couple retenu. Sinon la sélection est trop restrictive. Une source à surveiller ou écartée ne couvre rien.", "Feuille 2, bas"]]], ["p", "h3", "Atelier 3 · Écosystème et scénarios stratégiques"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Partie prenante (PP)</b>", "Entité extérieure en relation avec l'organisation (fournisseur, prestataire, partenaire). Elle peut servir de rebond.", "Carte verte ÉCOSYSTÈME"], ["<b>D, P, M, C</b>", "Dépendance et Pénétration font monter la menace ; Maturité cyber et Confiance la font baisser. Valeurs de 1 à 4 imprimées sur la carte.", "Carte verte ÉCOSYSTÈME"], ["<b>Niveau de menace</b>", "(D × P) ÷ (M × C). Danger ≥ 3 · Contrôle de 1,5 à moins de 3 · Veille moins de 1,5.", "Radar, feuille 3"], ["<b>Scénario stratégique (SS)</b>", "Chemin d'attaque source de risque → partie prenante (relais) → événement redouté. Sa gravité est celle de l'ER. On pose 3 cartes dans le couloir ; le second emplacement PP reste vide sauf second relais justifié.", "Couloir SS du plateau"], ["<b>Critères A, B, C</b>", "A : Σ de la source ≥ 9. B : la PP du chemin est en zone danger. C : une règle du socle sur le chemin est en Écart ou Partielle. V = nombre de critères remplis (minimum V1, maximum V3).", "Feuilles 1, 2 et 3"], ["<b>Mesure d'écosystème (ME)</b>", "Action sur une partie prenante qui change UNE variable de 1 (D ou P : −1 · M ou C : +1). Elle a un coût en jetons, repris sur le budget de l'atelier 5.", "Carte vert foncé MESURE ÉCOSYSTÈME"]]], ["p", "h3", "Atelier 4 · Scénarios opérationnels"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Scénario opérationnel</b>", "Enchaînement de 4 actions sur des biens supports : Connaître, Rentrer, Trouver, Exploiter (CRTE).", "Cartes noires OPÉRATION"], ["<b>Tests T1 à T4</b>", "Pour écarter une action : bien connu (T1), valeur métier (T2), chemin vers un ER (T3), enchaînement (T4). Trois cartes sont hors sujet.", "Feuille 2"], ["<b>Freins F1 à F4</b>", "Chaque frein fait baisser la vraisemblance d'une étape : V étape = 4 − nombre de freins (minimum 1). V du scénario = la plus faible des 4 étapes.", "Feuille 2"], ["<b>Bien support critique</b>", "Bien visé par au moins 2 des 12 actions posées, dont au moins un Rentrer ou un Exploiter.", "Feuille 2"]]], ["p", "h3", "Atelier 5 · Traitement du risque"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Mesure du plan</b>", "Action de sécurité qui réduit G ou V. Elle coûte des jetons ; le budget total est de 14 jetons.", "Carte orange MESURE"], ["<b>Seuil d'acceptation</b>", "Niveau de risque que la direction accepte : G × V ≤ 6. Au-dessus, le scénario doit être traité (mesure en plus) ou faire l'objet d'une dérogation signée du DG.", "Matrice, feuille 4"], ["<b>Risque résiduel</b>", "Risque qui reste après traitement. Il est accepté formellement : responsable du suivi, indicateur, date de revue.", "Feuille 4"], ["<b>Veto sécurité</b>", "Le responsable de la sécurité des personnes peut s'opposer à l'acceptation d'un risque qui touche l'ER de sécurité.", "Carte jaune RÔLE ; feuille 4"], ["<b>Stratégies de traitement</b>", "Réduire, éviter, partager (assurance : ne change ni G ni V) ou accepter.", "Cartes orange MESURE"], ["<b>PACS</b>", "Plan d'amélioration continue de la sécurité : mesures, responsables, échéances.", "Zone PACS du plateau"]]], ["p", "h3", "Cartes de jeu"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Carte Aléa</b>", "Événement lu par l'animateur à mi-parcours : il oblige à recoter. La version 1 n'est jamais effacée.", "Carte violette ALÉA"], ["<b>Carte Rôle</b>", "Votre point de vue, vos questions et votre position à défendre. À ne pas montrer aux autres.", "Carte jaune RÔLE ; fiche de rôle"]]], ["t", [["", "Version en ligne de cette fiche et conseils des rôles atelier par atelier : scannez le QR code.<br/>https://github.com/BelmDeveloppement/ebios-rm-plateau/blob/main/DEFINITIONS.md"]]]], "hasAnim": true, "eval": {"rows": [["Atelier 1", "20", "Exhaustivité (5) · gravités (7) · socle (4) · justification (2) · révision après aléa (2)"], ["Atelier 2", "15", "Cotations (5) · décisions retenir / écarter (5) · justifications (3) · révision après aléa (2)"], ["Atelier 3", "20", "Calculs de menace (7) · scénarios stratégiques (7) · mesures d'écosystème (4) · révision après aléa (2)"], ["Atelier 4", "20", "Chaînes complètes (9) · actions écartées (5) · vraisemblance justifiée (4) · révision après aléa (2)"], ["Atelier 5", "20", "Matrice (4) · plan sous budget (7) · risque résiduel (4) · acceptation formelle (3) · révision après aléa (2)"], ["Cohésion et temps", "5", "Parole partagée (2) · respect du temps (2) · réactivité aux aléas (1)"], ["Défis flash (bonus)", "+2 par atelier", "Ateliers concernés : ________________"], ["TOTAL", "100", ""]], "note": "Appréciation : 85 et plus : analyse prête à présenter à un comité · 70 à 84 : solide, points à consolider · 50 à 69 : méthode comprise, rigueur à renforcer · moins de 50 : refaire l'atelier faible avec l'animateur."}};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AT=[{id:'a1',n:'Atelier 1',t:'Cadrage et socle',c:'--a1',min:50},{id:'a2',n:'Atelier 2',t:'Sources de risque',c:'--a2',min:40},{id:'a3',n:'Atelier 3',t:'Écosystème et scénarios stratégiques',c:'--a3',min:55},{id:'a4',n:'Atelier 4',t:'Scénarios opérationnels',c:'--a4',min:55},{id:'a5',n:'Atelier 5',t:'Traitement du risque',c:'--a5',min:40},{id:'deb',n:'Débrief',t:'Bilan et dossier',c:'--a6',min:30}];
const LSK='ebios_'+CFG.key;
let S={table:'',role:'',session:'',inp:{},pts:{},res:{},hint:{},vote:{},photos:{},pulse:{},vid:Math.random().toString(36).slice(2,10)};
try{Object.assign(S,JSON.parse(localStorage.getItem(LSK)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){toast('Mémoire pleine : retirez des photos')}};
const IS_ANIM=/anim/.test(location.hash+location.search);
const qs=new URLSearchParams(location.search);if(qs.get('s')&&!S.session)S.session=qs.get('s').toUpperCase();
let tab=IS_ANIM?'anim':(S.session&&S.role?'a1':'home');
const g=k=>S.inp[k],setv=(k,v)=>{S.inp[k]=v;save()};
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:x};
const fmt=(x,d=2)=>x==null?'—':(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toString().replace('.',',');
// ---------- règles du jeu
const gClass=k=>k<CFG.gk[0]?1:k<CFG.gk[1]?2:k<CFG.gk[2]?3:4;
const sigmaDec=s=>s>=8?'Retenu':s>=6?'À surveiller':'Écarté';
const menace=(D,P,M,C)=>(D*P)/(M*C);
const zoneOf=v=>v>=3?['Danger','z-d']:v>=1.5?['Contrôle','z-c']:['Veille','z-v'];
const riskLvl=x=>x>=12?['Critique','l-c']:x>=8?['Élevé','l-e']:x>=4?['Moyen','l-m']:['Faible','l-f'];
const ER=Object.fromEntries(CFG.er.map(e=>[e[0],e])),SR=Object.fromEntries(CFG.sr.map(e=>[e[0],e])),PP=Object.fromEntries(CFG.pp.map(e=>[e[0],e])),ME=Object.fromEntries(CFG.me.map(e=>[e[0],e])),MS=Object.fromEntries(CFG.mes.map(e=>[e[0],e])),OP=Object.fromEntries(CFG.ops.map(e=>[e[0],e]));
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
// ---------- points
function award(id,p){S.pts[id]=Math.max(S.pts[id]||0,p);save();pub('score')}
function hintPenalty(){return Object.values(S.hint).reduce((s,l)=>s+(l>=3?2:l>=2?1:0),0)}
function total(){return Math.max(0,Object.values(S.pts).reduce((a,b)=>a+b,0)-hintPenalty())}
function byAt(){const o={};for(const k in S.pts){const a=k.split('.')[0];o[a]=(o[a]||0)+S.pts[k]}return o}
// ---------- réseau (relais type ntfy.sh ; BroadcastChannel en secours)
const RELAY=qs.get('relay')||'https://ntfy.sh';
const NET={votes:{},reveal:{},tables:{},timer:null,alea:null,status:'hors ligne'};
let es=null,bc=null,topic='';
function connect(){
  if(es){es.close();es=null}if(bc){bc.close();bc=null}
  if(!S.session){NET.status='hors ligne';return}
  topic='ebiosrm-'+CFG.key.toLowerCase()+'-'+S.session.toLowerCase();
  try{bc=new BroadcastChannel(topic);bc.onmessage=e=>onMsg(e.data)}catch(e){}
  if(RELAY==='local'){NET.status='local (cet appareil)';return}
  try{es=new EventSource(RELAY+'/'+topic+'/sse?since=12h');
    es.onopen=()=>{NET.status='connecté';badge()};es.onerror=()=>{NET.status='reconnexion…';badge()};
    es.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==='message'&&m.message)onMsg(JSON.parse(m.message))}catch(e){}}}
  catch(e){NET.status='indisponible'}
}
function pubRaw(o){o.ts=Date.now();onMsg(o,true);try{bc&&bc.postMessage(o)}catch(e){}
  if(RELAY!=='local'&&topic)fetch(RELAY+'/'+topic,{method:'POST',body:JSON.stringify(o),mode:'cors'}).catch(()=>{NET.status='envoi impossible';badge()})}
let pubT={};function pub(kind){clearTimeout(pubT[kind]);pubT[kind]=setTimeout(()=>{
  if(!S.session||!S.table)return;
  if(kind==='score')pubRaw({k:'sc',tb:S.table,tot:total(),at:byAt(),hint:hintPenalty(),role:S.role});
  if(kind==='res')pubRaw({k:'res',tb:S.table,r:summary()});},900)}
function onMsg(m,self){if(!m||!m.k)return;
  if(m.k==='vote'){(NET.votes[m.poll]=NET.votes[m.poll]||{})[m.vid]=m.v}
  else if(m.k==='reveal'){NET.reveal[m.poll]=m.on}
  else if(m.k==='sc'){const t=NET.tables[m.tb]=NET.tables[m.tb]||{};t.tot=m.tot;t.at=m.at;t.hint=m.hint;t.role=m.role;t.seen=m.ts}
  else if(m.k==='res'){const t=NET.tables[m.tb]=NET.tables[m.tb]||{};t.r=m.r;t.seen=m.ts}
  else if(m.k==='timer'){NET.timer=m}
  else if(m.k==='alea'){NET.alea=m}
  clearTimeout(onMsg.t);onMsg.t=setTimeout(()=>{if(!$('input:focus,textarea:focus,select:focus'))render();badge()},300)}
// ---------- résumé publié pour le débrief comparatif
function summary(){
  const ret=CFG.sr.filter(s=>{const a=num(g('a2.'+s[0]+'.M')),b=num(g('a2.'+s[0]+'.R')),c=num(g('a2.'+s[0]+'.A'));return a&&b&&c&&a+b+c>=8}).map(s=>s[0]);
  const ss=[1,2,3].map(i=>{const x=['sr','pp','er'].map(k=>g('a3.ss.'+i+'.'+k)||'?');return x.join('→')+' V'+vOf(i)}).join(' | ');
  const bsc=CFG.bs.filter(b=>g('a4.crit.'+b[0])).map(b=>b[0]).join(',');
  const sa=[1,2,3].map(i=>{const r=after(i);return r?'SS'+i+'='+r:'?'}).join(' ');
  return {'A2 · couples retenus':ret.join(', ')||'—','A3 · scénarios stratégiques':ss,'A4 · BS critiques':bsc||'—','A5 · risque après traitement':sa,'A5 · coût du plan':planCost()+' / '+CFG.budget}}
// ---------- utilitaires UI
function toast(t){const d=document.createElement('div');d.className='banner';d.style.cssText='position:fixed;left:16px;right:16px;top:60px;z-index:40';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
const sel=(k,opts,ph='—',attr='')=>`<select data-k="${k}" ${attr}><option value="">${ph}</option>${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(g(k))===String(v)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
const cb=(k,label,extra='')=>`<label class="chip"><input type="checkbox" data-k="${k}" ${g(k)?'checked':''} ${extra}>${label}</label>`;
const mark=(id,key)=>{const r=S.res[id];if(!r||!(key in r))return '';return r[key]?'<span class="ok">✔</span>':'<span class="ko">✘</span>'};
const pill=(t,c)=>`<span class="pill ${c}">${t}</span>`;
function vOf(i){const n=[g('a3.ss.'+i+'.A'),g('a3.ss.'+i+'.B'),g('a3.ss.'+i+'.C')].filter(Boolean).length;return Math.max(1,n)}
function v4(i){const ss='SS'+i;let m=4,any=false;for(let s=0;s<4;s++){const n=['F1','F2','F3','F4'].filter(f=>g('a4.fr.'+ss+'.'+s+'.'+f)).length;any=true;m=Math.min(m,Math.max(1,4-n))}return any?m:null}
function gOf(i){const e=ER[g('a3.ss.'+i+'.er')];return e?parseInt(e[4].slice(1)):null}
function after(i){const G=num(g('a5.G'+i)),V=num(g('a5.V'+i));return G&&V?G*V:null}
function planCost(){let t=0;CFG.mes.forEach(m=>{if(g('a5.m.'+m[0]))t+=m[2]});CFG.me.forEach(m=>{if(g('a5.me.'+m[0]))t+=m[4]});return t}

function san(t){return String(t==null?'':t).replace(/<\/?font[^>]*>/g,'').replace(/<(\/?)super>/g,'<$1sup>').replace(/<(?!\/?(b|i|u|br|sub|sup|strong|em)\b)[^>]*>/g,'')}

async function unlockAnim(code){try{const r=await fetch('animateur.enc.json',{cache:'no-store'});if(!r.ok)throw 0;const e=await r.json();const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(e.iv)},key,b(e.ct));NET.animDoc=JSON.parse(new TextDecoder().decode(pt));return true}catch(err){return false}}
function animGuide(){if(!CFG.hasAnim)return '';
 if(!NET.animDoc)return '<div class="card"><h2>📘 Corrigés et guide de l\'animateur</h2><div class="mut">Contenu protégé. Saisissez le code animateur (il n\'est pas stocké sur cet appareil).</div><div class="row" style="margin-top:6px"><input id="acode" type="password" placeholder="Code animateur" style="width:180px"><button class="btn" data-act="unlock">Déverrouiller</button></div><div id="amsg" class="mut"></div></div>';
 const q=(S.qa||'').toLowerCase(),tx=b=>(b[0]==='t'?b[1].flat().join(' '):b[2]).replace(/<[^>]+>/g,'').toLowerCase();
 let h='<div class="card"><h2>📘 Corrigés et guide de l\'animateur</h2><div class="row"><input data-k="__qa" type="text" placeholder="Rechercher (ex. ER1, SS2, jetons)" value="'+esc(S.qa||'')+'" style="flex:1"><button class="btn sec sm" data-act="lock">Verrouiller</button></div></div>';
 NET.animDoc.filter(g=>!q||g.blocks.some(b=>tx(b).includes(q))).forEach(g=>{h+='<details class="dd" '+(q?'open':'')+'><summary>'+esc(g.title)+'</summary>'+blocksHtml(g.blocks)+'</details>'});return h}

S.ev=S.ev||{};
function evKey(){return S.evt||''}
function evG(t){S.ev[t]=S.ev[t]||{};return S.ev[t]}
function evItems(c){const it=[];String(c).replace(/([^·()]+?)\s*\((\d+)\)/g,(m,a,b)=>{it.push([a.trim(),+b])});return it}
function evCalc(t){const e=evG(t),rows=CFG.eval.rows;let tot=0;const per=[];rows.forEach((r,i)=>{if(/Défis/i.test(r[0])){const n=['a1','a2','a3','a4','a5'].filter(a=>e['bn.'+a]).length;per.push(n*2);tot+=n*2;return}const it=evItems(r[2]);let s=0;it.forEach((x,k)=>{const v=num(e['c.'+i+'.'+k]);if(v!=null)s+=Math.max(0,Math.min(x[1],v))});per.push(s);tot+=s});return {tot,per}}

  h+=`<p>Signature du DG : ______________________ &nbsp;&nbsp; Veto sécurité : ______________________</p><h2>Ce que je fais lundi</h2><p>${esc(g('deb.lundi')||'')}</p>`;
  const phs=Object.entries(S.photos).filter(([k,v])=>v.length);if(phs.length){h+='<h2>Photos du plateau</h2>'+phs.map(([k,v])=>'<div><b>'+k.toUpperCase()+'</b><br>'+v.map(p=>'<img src="'+p+'">').join('')+'</div>').join('')}
  h+='</div>';document.body.insertAdjacentHTML('beforeend',h)}
window.addEventListener('hashchange',()=>location.reload());
connect();render();
</script>
