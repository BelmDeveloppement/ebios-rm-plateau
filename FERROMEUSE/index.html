nimum V1 : A. Σ de la source ≥ 9 ; B. une partie prenante du chemin est en zone danger ; C. une règle du socle sur le chemin est en Écart ou Partielle"], ["Vraisemblance d'une étape (atelier 4)", "V étape = 4 − nombre de freins (F1 à F4), minimum V1"], ["Vraisemblance d'un scénario opérationnel (atelier 4)", "La plus faible des quatre étapes. Elle remplace la V de l'atelier 3 pour la matrice de l'atelier 5"], ["Niveau de risque (atelier 5)", "G × V. Faible ≤ 3 · Moyen 4 à 6 · Élevé 8 à 9 · Critique ≥ 12"], ["Seuil d'acceptation (atelier 5)", "G × V ≤ 6. Après traitement, chaque scénario doit être à 6 ou moins ; au-dessus, il faut une mesure en plus ou une dérogation signée du DG"]]]], "defis": {"a1": [["p", "h2c1", "Défis flash de l'atelier 1 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 1.1 · Valeur métier ou bien support ?.</b> Classez : a) recettes d'alliages ; b) serveur de recettes ; c) traçabilité des lots ; d) automate du four 3 ; e) capacité à fabriquer en sécurité ; f) salle de contrôle ; g) relation avec le client automobile ; h) opérateur de la ligne 2."], ["p", "b", "<b>Défi 1.2 · Gravité.</b> Cotez : a) arrêt de la ligne 2 (un quart de la production) pendant 6 heures ; b) arrêt total du site pendant 5 jours ; c) même arrêt de 5 jours avec un opérateur gravement blessé."], ["p", "b", "<b>Défi 1.3 · Priorités du socle.</b> Parmi R1 à R8, lesquelles traiteriez-vous en premier, et pourquoi ?"], ["p", "b", "<b>Défi 1.4 · Impact chiffré.</b> Chiffrez un arrêt de 21 jours du site A et placez-le sur l'échelle."]], "a2": [["p", "h2c2", "Défis flash de l'atelier 2 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 2.1.</b> Un hacktiviste voit son activité passer de 2 à 4 après une campagne médiatique. Recalculez et décidez."], ["p", "b", "<b>Défi 2.2.</b> Donnez pour chaque source de risque un exemple d'objectif visé différent de celui de la carte."], ["p", "b", "<b>Défi 2.3.</b> Pourquoi la ressource (R) de SR4 est-elle de 3 alors qu'il est seul ?"]], "a3": [["p", "h2c3", "Défis flash de l'atelier 3 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 3.1.</b> Calculez et classez : société de gardiennage (D 2, P 3, M 1, C 2) ; éditeur du logiciel qualité (D 3, P 3, M 3, C 3) ; prestataire de nettoyage (D 1, P 2, M 2, C 3)."], ["p", "b", "<b>Défi 3.2.</b> Mesurez l'effet de la mesure M5 (maturité +1) sur PP2 et PP7."], ["p", "b", "<b>Défi 3.3.</b> Un étudiant propose : « SR1 → client PP3 → ER3 ». Cotez le scénario par les critères A, B, C."], ["p", "b", "<b>Défi 3.4.</b> Pourquoi le niveau de menace d'une partie prenante peut-il baisser sans toucher à la partie prenante elle-même ?"], ["p", "b", "<b>Défi 3.5.</b> Cotez le scénario : SR3 hacktiviste (Σ 6) → PP4 transporteur (niveau 0,67) → ER6. Aucune règle du socle en écart ou partielle ne se trouve sur ce chemin."]], "a4": [["p", "h2c4", "Défis flash de l'atelier 4 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 4.1.</b> Remettez dans l'ordre : O1 exfiltration, O9 veille sur l'hébergeur, O13 repérage des recettes, O4 compte administrateur compromis."], ["p", "b", "<b>Défi 4.2.</b> Citez un bien support et une mesure de détection pour chaque phase de SS1."], ["p", "b", "<b>Défi 4.3.</b> Le bastion de télémaintenance avec second facteur (M2) est déployé : R2 devient Conforme. Recotez « Rentrer » de SS1 par le VPN, puis cherchez une autre étape Rentrer et donnez la vraisemblance de SS1."], ["p", "b", "<b>Défi 4.5.</b> Dans vos trois chaînes, quels biens supports sont visés par au moins deux actions, dont un Rentrer ou un Exploiter ? Lequel protégeriez-vous en premier, et pourquoi ?"], ["p", "b", "<b>Défi 4.4.</b> Une publication décrit comment détecter et cartographier les automates sans connaître leurs protocoles (AL8). Que devient le frein F1 de « Trouver » en SS1 ? Quelle est la vraisemblance de SS1 ?"]], "a5": [["p", "h2c5", "Défis flash de l'atelier 5 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 5.1.</b> Placez dans la matrice un risque G2 × V4, un risque G4 × V1 et un risque G3 × V3. Donnez leur niveau."], ["p", "b", "<b>Défi 5.2.</b> Avec 6 points de budget, quelle priorité pour SS1 seul (12) ?"], ["p", "b", "<b>Défi 5.3.</b> Pourquoi la cyber-assurance (M12) n'apparaît-elle pas dans le plan de référence ?"], ["p", "b", "<b>Défi 5.4.</b> Rédigez une décision d'acceptation pour SS1 résiduel (G3 × V2 = 6)."]]}}, "defs": [["p", "h2", "Fiche de définitions · un seul vocabulaire pour toute la table"], ["p", "note", "À lire par tous les joueurs avant de commencer et à garder sous la main. La dernière colonne indique <b>la carte ou la zone du plateau qui porte la notion</b>."], ["p", "h3", "Pour tous"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Valeur métier (VM)</b>", "Ce qui est essentiel à la mission de l'organisation (un processus, une information, un savoir-faire). Test : « si on change de technologie, cela existe-t-il encore ? »", "Carte bleue ENTREPRISE"], ["<b>Bien support (BS)</b>", "Composante du SI, de l'OT, des locaux ou des personnes sur laquelle repose une valeur métier. Il disparaît avec la technologie.", "Carte bleue ENTREPRISE"], ["<b>Événement redouté (ER)</b>", "Atteinte à une valeur métier selon un critère (disponibilité, intégrité, confidentialité), avec son impact. On ne décrit jamais l'attaque.", "Carte bleue ENTREPRISE"], ["<b>Gravité (G1 à G4)</b>", "Niveau d'impact d'un ER, coté avec l'échelle du dossier de scénario (calcul jours d'arrêt × coût par jour quand c'est possible). Un ER qui touche la sécurité des personnes est G4.", "Dossier de scénario ; feuille 1"], ["<b>Vraisemblance (V1 à V4)</b>", "Facilité avec laquelle un scénario peut se produire. Cotée par critères à l'atelier 3, par étapes à l'atelier 4.", "Feuilles 3 et 2"], ["<b>Risque</b>", "Gravité × vraisemblance (G × V). Faible ≤ 3 · Moyen 4 à 6 · Élevé 8 à 9 · Critique ≥ 12.", "Matrice atelier 5"]]], ["p", "h3", "Atelier 1 · Cadrage et socle"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Socle de sécurité</b>", "8 règles de base. Chacune est notée Conforme (1 point), Partielle (0,5) ou Écart (0). Taux de conformité = points ÷ 8.", "Feuille 1 ; constats d'audit du dossier"]]], ["p", "h3", "Atelier 2 · Sources de risque"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Source de risque (SR)</b>", "Personne ou groupe qui peut porter atteinte à l'organisation : État, cybercriminel, hacktiviste, concurrent, initié, amateur…", "Carte rouge MENACE"], ["<b>Objectif visé (OV)</b>", "Ce que la source cherche à obtenir (espionnage, gain financier, vengeance, défi). Ce n'est pas un ER : l'objectif est ce que veut l'attaquant, l'ER est ce que redoute l'entreprise.", "Carte rouge MENACE"], ["<b>M, R, A et pertinence (Σ)</b>", "Motivation, Ressources, Activité, chacune de 1 à 4. Σ = M + R + A : ≥ 8 retenu · 6 à 7 à surveiller · ≤ 5 écarté.", "Feuille 2"], ["<b>Couple retenu</b>", "Couple source / objectif dont Σ ≥ 8. Seul un couple retenu compte dans le contrôle de couverture.", "Feuille 2"], ["<b>Couverture</b>", "Contrôle de cohérence : chaque ER de gravité G3 ou G4 doit être atteint par au moins un couple retenu. Sinon la sélection est trop restrictive. Une source à surveiller ou écartée ne couvre rien.", "Feuille 2, bas"]]], ["p", "h3", "Atelier 3 · Écosystème et scénarios stratégiques"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Partie prenante (PP)</b>", "Entité extérieure en relation avec l'organisation (fournisseur, prestataire, partenaire). Elle peut servir de rebond.", "Carte verte ÉCOSYSTÈME"], ["<b>D, P, M, C</b>", "Dépendance et Pénétration font monter la menace ; Maturité cyber et Confiance la font baisser. Valeurs de 1 à 4 imprimées sur la carte.", "Carte verte ÉCOSYSTÈME"], ["<b>Niveau de menace</b>", "(D × P) ÷ (M × C). Danger ≥ 3 · Contrôle de 1,5 à moins de 3 · Veille moins de 1,5.", "Radar, feuille 3"], ["<b>Scénario stratégique (SS)</b>", "Chemin d'attaque source de risque → partie prenante (relais) → événement redouté. Sa gravité est celle de l'ER. On pose 3 cartes dans le couloir ; le second emplacement PP reste vide sauf second relais justifié.", "Couloir SS du plateau"], ["<b>Critères A, B, C</b>", "A : Σ de la source ≥ 9. B : la PP du chemin est en zone danger. C : une règle du socle sur le chemin est en Écart ou Partielle. V = nombre de critères remplis (minimum V1, maximum V3).", "Feuilles 1, 2 et 3"], ["<b>Mesure d'écosystème (ME)</b>", "Action sur une partie prenante qui change UNE variable de 1 (D ou P : −1 · M ou C : +1). Elle a un coût en points de budget, repris sur le budget de l'atelier 5.", "Carte vert foncé MESURE ÉCOSYSTÈME"]]], ["p", "h3", "Atelier 4 · Scénarios opérationnels"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Scénario opérationnel</b>", "Enchaînement de 4 actions sur des biens supports : Connaître, Rentrer, Trouver, Exploiter (CRTE).", "Cartes noires OPÉRATION"], ["<b>Tests T1 à T4</b>", "Pour écarter une action : bien connu (T1), valeur métier (T2), chemin vers un ER (T3), enchaînement (T4). Trois cartes sont hors sujet.", "Feuille 2"], ["<b>Freins F1 à F4</b>", "Chaque frein fait baisser la vraisemblance d'une étape : V étape = 4 − nombre de freins (minimum 1). V du scénario = la plus faible des 4 étapes.", "Feuille 2"], ["<b>Bien support critique</b>", "Bien visé par au moins 2 des 12 actions posées, dont au moins un Rentrer ou un Exploiter.", "Feuille 2"]]], ["p", "h3", "Atelier 5 · Traitement du risque"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Mesure du plan</b>", "Action de sécurité qui réduit G ou V. Elle coûte des points de budget ; le budget total est de 14 points de budget.", "Carte orange MESURE"], ["<b>Seuil d'acceptation</b>", "Niveau de risque que la direction accepte : G × V ≤ 6 function dossier(){const ba=byAt();const rows=(t,arr)=>`<table>${arr.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</table>`;
  let h=`<div class="rep"><p class="noprint"><button class="btn" onclick="window.print()">Imprimer / Enregistrer en PDF</button> <button class="btn sec" onclick="document.querySelector('.rep').remove()">Fermer</button></p><h1>Dossier d'analyse de risque · ${esc(CFG.org)}</h1><p>Méthode EBIOS RM · Table ${esc(S.table||'—')} · ${new Date().toLocaleDateString('fr-FR')} · Score : ${fmt(total(),1)} pts</p>`;
  h+=`<h2>Atelier 1 · Valeurs métier et biens supports</h2>`+rows('',[['Valeur métier','Biens supports','Critère'],...CFG.vm.map(v=>[v[0]+' '+esc(v[1]),CFG.bs.filter(b=>g('a1.vb.'+v[0]+'.'+b[0])).map(b=>b[0]).join(', '),['D','I','C'].filter(c=>g('a1.vc.'+v[0]+'.'+c)).join(' ')])]);
  h+=`<h2>Atelier 1 · Gravité des événements redoutés</h2>`+rows('',[['ER','Pari','Gravité retenue','Jours d\'arrêt','Commentaire'],...CFG.er.map(e=>[e[0]+' '+esc(e[1]),g('a1.pari.'+e[0])||'',g('a1.g.'+e[0])||'',g('a1.j.'+e[0])||'',esc(g('a1.n.'+e[0])||'')])]);
  const so=CFG.socle.reduce((s,r)=>s+(g('a1.so.'+r[0])==='Conforme'?1:g('a1.so.'+r[0])==='Partiel'?.5:0),0);
  h+=`<p>Socle : ${fmt(so,1)} / ${CFG.socle.length} (${fmt(100*so/CFG.socle.length,0)} %) · ${CFG.socle.map(r=>r[0]+' '+(g('a1.so.'+r[0])||'?')).join(' · ')}</p>`;
  h+=`<h2>Atelier 2 · Sources de risque</h2>`+rows('',[['Source','M','R','A','Σ','Décision'],...CFG.sr.map(s=>{const m=num(g('a2.'+s[0]+'.M')),r=num(g('a2.'+s[0]+'.R')),a=num(g('a2.'+s[0]+'.A'));return [s[0]+' '+esc(s[1]),m||'',r||'',a||'',m&&r&&a?m+r+a:'',m&&r&&a?sigmaDec(m+r+a):'']})]);
  h+=`<h2>Atelier 3 · Scénarios stratégiques</h2>`+rows('',[['SS','Chemin','Critères','V','Preuves'],...[1,2,3].map(i=>['SS'+i,[g('a3.ss.'+i+'.sr'),g('a3.ss.'+i+'.pp'),g('a3.ss.'+i+'.er')].map(x=>x||'?').join(' → '),['A','B','C'].filter(c=>g('a3.ss.'+i+'.'+c)).join(''),'V'+vOf(i),esc(g('a3.ss.'+i+'.why')||'')])]);
  h+=`<p>Mesures d'écosystème : ${CFG.pp.map(p=>{const c=CFG.me.filter(m=>g('a3.me.c.'+p[0]+'.'+m[0])).map(m=>m[0]);return c.length?p[0]+' : '+c.join('+'):''}).filter(Boolean).join(' · ')||'—'}</p>`;
  h+=`<h2>Atelier 4 · Scénarios opérationnels</h2>`+rows('',[['SS','Connaître','Rentrer','Trouver','Exploiter','V'],...CFG.ref.ss.map(s=>[s.id,...['Connaître','Rentrer','Trouver','Exploiter'].map(p=>g('a4.ch.'+s.id+'.'+p)||'?'),'V'+v4s(s.id)])]);
  h+=`<p>Biens supports critiques : ${CFG.bs.filter(b=>g('a4.crit.'+b[0])).map(b=>b[0]).join(', ')||'—'}</p>`;
  h+=`<h2>Atelier 5 · Traitement du risque</h2><p>Plan : ${CFG.mes.filter(m=>g('a5.m.'+m[0])).map(m=>m[0]).concat(CFG.me.filter(m=>g('a5.me.'+m[0])).map(m=>m[0])).join(', ')||'—'} · coût ${planCost()} / ${CFG.budget} · seuil d'acceptation G × V ≤ ${CFG.seuil}</p>`+rows('',[['SS','Après traitement (G × V)','Seuil','Dérogation du DG'],...CFG.ref.ss.map((s,i)=>{const x=after(i+1);return [s.id,x==null?'?':x,x==null?'':(x<=CFG.seuil?'sous le seuil':'au-dessus'),x!=null&&x>CFG.seuil?esc([g('a5.d.'+(i+1)+'.resp'),g('a5.d.'+(i+1)+'.ind'),g('a5.d.'+(i+1)+'.date')].map(y=>y||'…').join(' · ')):'']})]);
  h+=`<p>Signature du DG : ______________________ </p><h2>Ce que je fais lundi</h2><p>${esc(g('deb.lundi')||'')}</p>`;
  const phs=Object.entries(S.photos).filter(([k,v])=>v.length);if(phs.length){h+='<h2>Photos du plateau</h2>'+phs.map(([k,v])=>'<div><b>'+k.toUpperCase()+'</b><br>'+v.map(p=>'<img src="'+p+'">').join('')+'</div>').join('')}
  h+='</div>';document.body.insertAdjacentHTML('beforeend',h)}
window.addEventListener('hashchange',()=>location.reload());
connect();render();
</script>
