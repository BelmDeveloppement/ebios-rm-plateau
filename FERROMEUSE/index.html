1."], ["ME8", "Revue annuelle et exercice de crise commun", "C", 1, 1, "Confiance : +1 (relation éprouvée)."]], "mes": [["M1", "Segmentation IT/OT avec zone démilitarisée", 4, "SS1 : vraisemblance −1."], ["M2", "Bastion de télémaintenance avec MFA et sessions à la demande", 3, "SS1 : vraisemblance −1."], ["M3", "Sauvegardes hors ligne testées (SCADA, MES, automates)", 2, "SS1 : gravité −1 (reprise plus rapide)."], ["M4", "Détection passive sur le réseau industriel", 4, "SS1 et SS3 : vraisemblance −1."], ["M5", "Clauses de sécurité et audit des prestataires critiques", 2, "PP2 et PP7 : maturité +1."], ["M6", "Cloisonnement et chiffrement des recettes, contrôle des sorties", 3, "SS2 : vraisemblance −1."], ["M7", "Contrôle d'accès physique nominatif des armoires", 2, "SS3 : vraisemblance −1."], ["M8", "Système de sécurité indépendant du SCADA pour les fours", 3, "SS3 : gravité −1."], ["M9", "Remplacement des postes de supervision obsolètes", 4, "SS1 : vraisemblance −1."], ["M10", "Sensibilisation ciblée des techniciens et intérimaires", 1, "Réduit un écart du socle (R5). Pas d'effet chiffré."], ["M11", "Validation à quatre yeux des changements de consignes", 2, "SS3 : vraisemblance −1."], ["M12", "Cyber-assurance (partage du risque)", 2, "Finance l'impact mais ne change ni G ni V."]], "alea": [["AL1", "Atelier 1", "Jumeau numérique", "La direction lance un jumeau numérique relié au MES. Ajoutez au périmètre l'hébergeur et ses accès, puis revoyez votre liste de biens supports."], ["AL2", "Atelier 1", "Audit client", "Un client automobile exige la preuve d'un socle de sécurité. Ajoutez une ligne de socle « journalisation OT » et notez son état."], ["AL3", "Atelier 2", "Incident chez un confrère", "Un rançongiciel a arrêté un industriel voisin. L'activité de SR2 passe à 4 (déjà au maximum). Justifiez le maintien du couple."], ["AL4", "Atelier 2", "Conflit social", "Un technicien est sanctionné. La motivation de SR4 augmente d'un niveau (maximum 4). Recalculez la pertinence."], ["AL5", "Atelier 3", "Changement d'intégrateur", "L'intégrateur est racheté par un groupe sans culture cyber. La maturité de PP2 baisse d'un niveau. Recalculez."], ["AL6", "Atelier 3", "Alerte du CERT", "Une vulnérabilité critique touche les accès du constructeur d'automates. La maturité de PP1 baisse d'un niveau. Recalculez."], ["AL7", "Atelier 4", "Absence d'expert", "Le responsable OT est indisponible 10 minutes. Son équipe décrit un mode opératoire sans lui, puis le fait relire à son retour."], ["AL8", "Atelier 4", "Technique publiée", "Une méthode d'attaque industrielle est publiée. Réexaminez la vraisemblance de SS1 et justifiez votre cotation."], ["AL9", "Atelier 5", "Gel budgétaire", "Le budget passe de 14 à 11 points de budget. Refaites votre plan d'amélioration."], ["AL10", "Atelier 5", "Exigence du DG", "Aucun risque de niveau Élevé ou Critique ne peut être accepté. Ajustez votre plan en conséquence."]], "ops": [["O1", "Exploiter", "Exfiltration lente et discrète des recettes vers un serveur externe.", "BS4", "SS2"], ["O2", "Trouver", "Cartographie du réseau industriel depuis la passerelle et liste des comptes à privilèges.", "BS6, BS2", "SS1"], ["O3", "Rentrer", "Accès physique à l'armoire du four avec le badge d'un sous-traitant.", "BS9", "SS3"], ["O4", "Rentrer", "Compromission d'un compte d'administration de l'hébergeur (mot de passe réutilisé).", "BS3", "SS2"], ["O5", "Exploiter", "Déni de service sur le site web vitrine de l'entreprise.", "Site web vitrine", "aucune"], ["O6", "Connaître", "Recherche en sources ouvertes sur l'intégrateur SCADA : salariés, outils, accès.", "BS7", "SS1"], ["O7", "Exploiter", "Modification des consignes et inhibition des alarmes du four.", "BS1", "SS3"], ["O8", "Connaître", "Écoute du Wi-Fi invité de l'accueil.", "Wi-Fi invité", "aucune"], ["O9", "Connaître", "Veille sur l'hébergeur du jumeau numérique et ses administrateurs.", "BS3", "SS2"], ["O10", "Connaître", "Exploitation de la connaissance interne : procédures, horaires, emplacement des armoires.", "BS9", "SS3"], ["O11", "Rentrer", "Hameçonnage d'un technicien de l'intégrateur et vol de sa session VPN.", "BS7", "SS1"], ["O12", "Rentrer", "Vol d'un ordinateur portable commercial dans un train.", "Portable commercial", "aucune"], ["O13", "Trouver", "Repérage des volumes qui contiennent les recettes d'alliages.", "BS4", "SS2"], ["O14", "Exploiter", "Rançongiciel sur SCADA et MES, suppression des sauvegardes accessibles en ligne.", "BS2, BS3", "SS1"], ["O15", "Trouver", "Identification de l'automate du four et de ses consignes de température.", "BS1", "SS3"]], "roles": [], "ref": {"vmtab": {"VM1": {"bs": ["BS1", "BS2", "BS3", "BS6", "BS7", "BS9", "BS10"], "crit": ["D"]}, "VM2": {"bs": ["BS3", "BS5", "BS8"], "crit": ["D", "I"]}, "VM3": {"bs": ["BS2", "BS4", "BS8"], "crit": ["C"]}, "VM4": {"bs": ["BS1", "BS2", "BS9", "BS10"], "crit": ["I"]}, "VM5": {"bs": ["BS3", "BS5"], "crit": ["I"]}}, "vmbs": {"BS1": ["VM1", "VM4"], "BS2": ["VM1", "VM3", "VM4"], "BS3": ["VM1", "VM2", "VM5"], "BS4": ["VM3"], "BS5": ["VM2", "VM5"], "BS6": ["VM1"], "BS7": ["VM1"], "BS8": ["VM2", "VM3"], "BS9": ["VM1", "VM4"], "BS10": ["VM1", "VM4"]}, "cov": {"ER1": ["SR2"], "ER2": ["SR4"], "ER3": ["SR1", "SR5"], "ER4": ["SR4"], "ER5": ["SR2"], "ER6": ["SR2"]}, "pert": {"SR1": [3, 4, 2], "SR2": [4, 3, 4], "SR3": [2, 2, 2], "SR4": [3, 3, 2], "SR5": [3, 3, 2], "SR6": [1, 1, 3]}, "ss": [{"id": "SS1", "title": "Rançongiciel via l'intégrateur", "chain": "SR2 Cybercriminel → Intégrateur PP2 compromis → rebond par la télémaintenance → chiffrement SCADA et MES", "srs": ["SR2"], "pp": "PP2", "er": "ER1", "G": 4, "crit": [1, 1, 1], "V": 3, "why": "A : Σ de SR2 = 11 ≥ 9. B : PP2 niveau 3,0, zone danger. C : R2 en écart (télémaintenance) sur le chemin."}, {"id": "SS2", "title": "Vol des recettes via le cloud", "chain": "SR1 Étatique ou SR5 Concurrent → Hébergeur PP6 compromis → accès au serveur de recettes → exfiltration", "srs": ["SR1", "SR5"], "pp": "PP6", "er": "ER3", "G": 3, "crit": [1, 0, 1], "V": 2, "why": "A : Σ de SR1 = 9 ≥ 9 (SR5 = 8 ne suffit pas, on retient la plus pertinente). B : PP6 niveau 1,5, zone contrôle seulement. C : R1 en écart (MES relié au cloud sans zone démilitarisée)."}, {"id": "SS3", "title": "Sabotage d'un four par un initié", "chain": "SR4 Initié + sous-traitant PP7 (badge, accès physique) → modification des consignes du four", "srs": ["SR4"], "pp": "PP7", "er": "ER4", "G": 4, "crit": [0, 1, 1], "V": 2, "why": "A : Σ de SR4 = 8 < 9. B : PP7 niveau 3,0, zone danger. C : R5 et R8 partielles (sensibilisation et clauses des prestataires)."}], "etapes": {"SS1": [{"op": "O6", "phase": "Connaître", "V": 4, "why": "aucun frein : sources ouvertes"}, {"op": "O11", "phase": "Rentrer", "V": 3, "why": "F2 : R5 partielle (hameçonnage de prestataire, sensibilisation partielle) ; R2 en écart : pas de frein"}, {"op": "O2", "phase": "Trouver", "V": 3, "why": "F1 : il faut connaître les protocoles et comptes industriels ; R1 et R6 en écart, pas de frein"}, {"op": "O14", "phase": "Exploiter", "V": 4, "why": "aucun frein : postes obsolètes (R4 en écart), rançongiciel courant"}], "SS2": [{"op": "O9", "phase": "Connaître", "V": 4, "why": "aucun frein : sources ouvertes"}, {"op": "O4", "phase": "Rentrer", "V": 2, "why": "F3 : mot de passe réutilisé ET sans second facteur côté hébergeur ; F4 : l'hébergeur surveille les connexions d'administration"}, {"op": "O13", "phase": "Trouver", "V": 3, "why": "F1 : il faut savoir repérer les volumes de recettes dans l'architecture MES/cloud"}, {"op": "O1", "phase": "Exploiter", "V": 3, "why": "F1 : exfiltration lente et discrète demande du savoir-faire"}], "SS3": [{"op": "O10", "phase": "Connaître", "V": 4, "why": "aucun frein : l'initié connaît déjà procédures et horaires"}, {"op": "O3", "phase": "Rentrer", "V": 2, "why": "F3 : présence physique + badge de sous-traitant valide + armoire accessible ; F4 : passage dans la salle de contrôle remarqué"}, {"op": "O15", "phase": "Trouver", "V": 4, "why": "aucun frein : l'initié est technicien, il connaît l'automate"}, {"op": "O7", "phase": "Exploiter", "V": 3, "why": "F4 : un opérateur peut remarquer l'inhibition d'alarmes"}]}, "meplan": {"PP2": 1, "PP7": 1}, "crit": ["BS1", "BS2", "BS3", "BS4", "BS7", "BS9"], "horsSujet": ["O5", "O8", "O12"], "danger": ["PP2", "PP7"]}, "hints": {"1": [["Ils listent des serveurs et des logiciels comme valeurs métier", "« Si vous changez de serveur, cet élément existe-t-il encore ? »", "« Que doit continuer à faire l'organisation même sans informatique ? »", "« Production laminage et traitement thermique est une valeur métier ; Automates programmables (≈140) est un bien support. »"], ["Ils écrivent « rançongiciel » ou « piratage » dans un ER", "« L'ER dit-il ce que veut l'attaquant ou ce que subit l'organisation ? »", "« Reformulez sans parler d'attaque : quelle atteinte (perte, altération, divulgation) de quelle valeur métier ? »", "« Arrêt du site A plus de 3 semaines » est un ER ; « rançongiciel sur un système » n'en est pas un."], ["Ils cotent la gravité au ressenti (« c'est grave »)", "« Combien de jours d'arrêt ? Combien coûte un jour ? »", "« Le dossier donne 378 k€ par jour d'arrêt. »", "« 12 jours × 378 k€ = 4 536 k€, soit G3. »"], ["Ils hésitent entre G3 et G4 pour ER4", "« Quel est le critère qui s'applique : le coût chiffré, ou une atteinte qualitative (sécurité, conformité, survie) ? »", "« Relisez la définition de G4 dans l'échelle du dossier : elle ne se limite pas au montant. »", "« ER4 : Perte de maîtrise d'un four de traitement → G4. »"], ["Ils notent le socle sans relire les constats", "« Quelle phrase du constat justifie votre état ? »", "« Écart : rien en place. Partiel : en place mais incomplet ou non testé. Conforme : en place et vérifié. »", "« R3 (Sauvegardes hors ligne des configurations d'automates) : partielle car la restauration n'a jamais été testée. R6 (Journalisation et détection sur le réseau industriel) : aucune journalisation, donc Écart. »"], ["Ils se trompent sur le taux de conformité", "« Combien de points au total, sur combien de règles ? »", "« Conforme 1, Partiel 0,5, Écart 0. »", "« 2,5 points sur 8 règles : 2,5 ÷ 8 ≈ 31 %. »"], ["Un bien support n'est rattaché à aucune valeur métier", "« Si ce bien tombe, quelle valeur métier souffre ? »", "« Cherchez ce qui dépend de lui : flux, personnes, locaux, données. »", "« Le tableau de référence de l'atelier 1 (section précédente) donne le rattachement attendu ; une autre proposition est acceptée si elle est justifiée. »"], ["Désaccord entre joueurs sur une cotation", "« Chacun peut-il la justifier en une phrase ? »", "« Le RSSI tranche après écoute ; chaque joueur a un droit de contestation par atelier. »", "« Notez la cotation retenue et la raison : un désaccord argumenté vaut mieux qu'un consensus mou. »"]], "2": [["Ils confondent objectif visé et événement redouté", "« Est-ce ce que veut la source, ou ce que redoute l'organisation ? »", "« Un objectif : gagner de l'argent. Un ER : arrêt du site a plus de 3 semaines. »", "« Le lien objectif → ER se fait à l'atelier 3. »"], ["Ils cotent toutes les sources de la même façon", "« Laquelle de ces deux sources est la plus active dans le secteur de l'organisation ? »", "« Utilisez toute l'échelle : 1 très faible, 4 très fort. »", "« SR6 (curieux) reste bas ; SR2 (rançongiciel) est haut sur l'activité. »"], ["Ils écartent l'initié parce que « ce n'est pas un hacker »", "« Que possède un salarié ou un intervenant interne qu'un attaquant externe n'a pas ? »", "« Des accès légitimes, la connaissance des procédures et des horaires. »", "« Ses ressources (R) montent à 3 : il n'a pas besoin d'outils. »"], ["Ils ne comprennent pas l'activité (A)", "« Combien d'attaques de ce type voit-on dans le secteur de l'organisation ? »", "« A mesure la fréquence observée, pas l'intérêt de la source. »", "« Les rançongiciels visant ce secteur sont très fréquents : A élevé. »"], ["Ils retiennent les 6 sources", "« Quel est le seuil de rétention ? »", "« Σ ≥ 8 retenu · 6 à 7 à surveiller · ≤ 5 écarté. »", "« La méthode sert à prioriser : une source à Σ = 5 sort de l'étude. »"], ["Un ER G3 ou G4 n'est atteint par aucun couple retenu", "« Qui pourrait agir sur le bien support de cet ER ? »", "« Regardez les sources à surveiller (6 à 7) ou relisez leurs R et A. »", "« ER4 (Perte de maîtrise d'un four de traitement) : l'initié SR4 est le seul acteur plausible. »"], ["Ils demandent la « bonne » valeur M, R, A", "« Quelle phrase de la carte justifie votre chiffre ? »", "« Aucune valeur n'est imprimée : reliez chaque chiffre à l'échelle du dossier. »", "« Une cotation avec une phrase de justification vaut mieux qu'un chiffre « exact ». »"], ["Σ = 7 : retenu ou pas ?", "« Quel est le seuil ? »", "« 7 est à surveiller : on ne l'analyse pas maintenant. »", "« Un aléa peut le faire basculer (défi 2.1). »"]], "3": [["Ils ne savent pas lire la carte PP", "« Quels sont les quatre nombres imprimés ? Quelle est la formule ? »", "« D × P au numérateur (ce qui monte la menace), M × C au dénominateur (ce qui la baisse). »", "« PP2 : D3 P4 M2 C2 → 12 ÷ 4 = 3,0. »"], ["Ils inversent la maturité", "« Une PP très mûre est-elle plus ou moins dangereuse ? »", "« M est au dénominateur : quand M monte, le niveau baisse. »", "« PP7 (M1) est plus dangereuse que PP3 (M4), toutes choses égales. »"], ["Ils hésitent sur une zone (3,0 ou 1,5 pile)", "« Le seuil est-il « ≥ » ou « > » ? »", "« Danger ≥ 3 · contrôle de 1,5 à moins de 3 · veille < 1,5. »", "« PP2 = 3,0 : danger. PP7 = 3,0 : danger. PP6 = 1,5 : contrôle. »"], ["Ils passent par PP3 (Client automobile) parce qu'elle est « grosse »", "« Dans quelle zone est PP3 ? Quelle est sa pénétration ? »", "« Une forte dépendance ne suffit pas : PP3 a P2, M4, C4. »", "« Cherchez une PP en danger ou en contrôle qui a un accès au bien support de l'ER. »"], ["Ils ne trouvent pas la PP du chemin", "« Quel ER vise ce couple ? Quel bien support y mène ? Qui y a accès ? »", "« Lisez la description au dos de chaque carte PP. »", "« ER1 : PP2 (Intégrateur SCADA) ou PP1. ER3 : PP6 (Hébergeur du jumeau numérique). ER4 : PP7 (Sous-traitant de maintenance mécanique). »"], ["Ils veulent passer par deux PP, ou par aucune", "« Une seule PP suffit-elle pour relier la source à l'ER ? »", "« Le second emplacement du couloir est facultatif ; sans relais, il n'y a pas de scénario d'écosystème. »", "« Gardez une PP ; ajoutez un second relais seulement si vous pouvez écrire pourquoi. »"], ["Ils cochent un critère sans preuve", "« Montrez-moi où c'est écrit. »", "« A : feuille 2 (Σ). B : radar. C : socle (feuille 1). »", "« SS1 : A : Σ de SR2 = 11 ≥ 9. B : PP2 niveau 3,0, zone danger. C : R2 en écart (télémaintenance) sur le chemin. »"], ["Ils comptent C mais la règle ne concerne pas le chemin", "« Quelle étape du chemin cette règle protège-t-elle ? »", "« La règle doit couvrir un maillon du chemin. »", "« SS2 : R1 en écart (MES relié au cloud sans zone démilitarisée). SS3 : R5 et R8 partielles (sensibilisation et clauses des prestataires). »"], ["Ils inventent la gravité du scénario", "« D'où vient G ? »", "« De l'ER visé, jamais du scénario. »", "« SS1 → ER1 = G4. »"], ["Ils choisissent une ME qui n'agit pas sur la bonne variable", "« Quelle variable fait monter le niveau de cette PP ? »", "« Chaque ME agit sur une seule variable (tableau des leviers, section 5). »", "« PP2 : P4 forte, M2 et C2 faibles → ME3 (P), ME1 (M), ME2 (C). PP7 : M1 → ME7 (ou ME5 sur P). »"], ["La PP reste en danger après leur ME", "« Avez-vous recalculé ? Quel est le nouveau niveau ? »", "« Un niveau de 3,0 reste en danger : il faut passer sous 3. »", "« PP2 avec ME1 : M passe à 3, 12 ÷ (3 × 2) = 2,0 : sortie de la zone danger. »"], ["Ils font quatre scénarios (SR1 et SR5 séparés)", "« Même ER, même PP : combien de scénarios ? »", "« Un seul ; on garde la source la plus pertinente pour le critère A. »", "« SR1 (Σ 9) rend A rempli ; SR5 (Σ 8) non. »"], ["Ils ne voient pas à quoi sert une ME", "« Que voulez-vous obtenir sur le radar ? »", "« Faire sortir la PP de la zone danger sans attendre qu'elle devienne parfaite. »", "« Après ME1, PP2 passe de 3,0 à 2,0 : elle reste en contrôle, mais n'est plus un rebond facile. »"]], "4": [["Ils ne comprennent pas ce que sont les cartes noires", "« Combien de cartes noires ? Combien d'emplacements ? »", "« Les cartes noires sont les cartes Opération : 15 cartes pour 12 emplacements. »", "« Chaque carte porte une phase, une action et un bien visé. »"], ["Plusieurs cartes « Rentrer » paraissent possibles", "« Quelle PP traverse votre scénario ? Quel bien support est visé ? »", "« Une seule carte par phase correspond à votre scénario. »", "« SS1 : Intégrateur SCADA (BS7). SS2 : Hébergeur du jumeau numérique (BS3). SS3 : Sous-traitant de maintenance mécanique (BS9). »"], ["Ils placent Exploiter avant Trouver, ou exfiltrent avant d'avoir repéré", "« Qu'a-t-on obtenu à l'étape précédente ? Peut-on agir sans cela ? »", "« Connaître → Rentrer → Trouver → Exploiter : chaque résultat rend le suivant possible. »", "« On n'exfiltre pas ce qu'on n'a pas localisé. »"], ["Ils ne repèrent pas les cartes hors sujet", "« Pour chaque carte restante, le bien visé est-il l'un des 10 biens supports ? »", "« Testez T1, puis T2 et T3. »", "« Site web vitrine, Wi-Fi invité, Portable commercial : aucun n'est l'un des 10 biens supports. »"], ["Ils ne savent pas appliquer un frein", "« Répondez oui ou non à F1, F2, F3, F4 pour cette étape. »", "« Un frein est un obstacle réel pour l'attaquant. »", "« SS1 Rentrer : F2 : R5 partielle (hameçonnage de prestataire, sensibilisation partielle) → V3. »"], ["Ils comptent un frein pour une règle en Écart", "« Cette règle protège-t-elle quelque chose aujourd'hui ? »", "« Écart : rien en place, donc pas de frein. Conforme ou Partiel : frein possible. »", "« R2 en Écart : pas de F2. R5 Partielle : F2. »"], ["Ils font la moyenne des V", "« Une chaîne résiste-t-elle mieux que son maillon le plus difficile ? »", "« V du scénario = la plus petite V des 4 étapes. »", "« SS1 : 4, 3, 3, 4 → V3. »"], ["Ils trouvent tous les biens supports critiques, ou aucun", "« Combien d'actions visent ce bien ? L'une est-elle un Rentrer ou un Exploiter ? »", "« Comptez sur les 12 cartes posées. Critique : au moins 2 actions dont un Rentrer ou un Exploiter. »", "« 6 biens supports répondent (BS1, BS2, BS3, BS4, BS7, BS9). »"], ["Leur V de l'atelier 4 diffère de celle de l'atelier 3", "« Qu'avez-vous appris en détaillant les actions ? »", "« C'est normal : l'atelier 4 affine. La V de l'atelier 4 remplace l'autre. »", "« Faites écrire la raison sur la feuille 2. »"], ["Ils veulent une action absente des cartes", "« Passe-t-elle les tests T1 à T4 ? »", "« Autorisée si elle est justifiée par les tests ; sinon utilisez la carte. »", "« Les chaînes de référence tiennent avec les cartes fournies. »"]], "5": [["Ils ne savent pas d'où viennent G et V", "« Quel ER vise le scénario ? Quelle est la plus petite V de ses étapes ? »", "« G : feuille 1. V : feuille 2, atelier 4. »", "« SS1 : ER1 G4, V3 → 12 · SS2 : ER3 G3, V2 → 6 · SS3 : ER4 G4, V2 → 8. »"], ["Ils utilisent la V de l'atelier 3", "« Quelle V a été confirmée par le détail des étapes ? »", "« La V du scénario opérationnel remplace celle du scénario stratégique. »", "« SS1 : V3 dans les deux ateliers ; SS2 et SS3 : V2. »"], ["Ils dépassent les 14 points de budget", "« Combien de points de risque gagne-t-on par point de budget ? »", "« Classez les mesures par gain par point de budget. »", "« M7 : 2 points par point de budget ; M8 : 0,67 mais traite SS3 (G4). »"], ["Ils ne recalculent pas G ou V", "« Que dit la carte : G, V, ou les deux ? »", "« Écrivez G × V avant, puis après. »", "« M2 : SS1 V3 → V2. M3 : SS1 G4 → G3. »"], ["Ils cumulent M5 et ME1 + ME7", "« Ces deux lignes font-elles la même chose ? »", "« Elles agissent sur la maturité de PP2 et PP7. »", "« Ne les comptez pas deux fois. »"], ["Ils acceptent par dérogation un risque qui touche la sécurité des personnes", "« Quel scénario touche la sécurité des personnes ? Peut-on l'accepter par dérogation ? »", "« SS3 vise ER4 (G4). »", "« Ce risque ne s'accepte pas par dérogation : ajoutez une mesure avant la signature du DG. »"], ["Ils veulent accepter un risque sans condition", "« Qui est responsable ? Quel indicateur ? Quelle date de revue ? »", "« Reprenez le modèle de formulation. »", "« Responsable : le RSSI · indicateur mesurable · revue à 6 mois. »"], ["Ils proposent la cyber-assurance (M12) pour réduire un risque", "« Change-t-elle G ou V ? »", "« Elle partage le coût d'un sinistre, elle ne réduit rien. »", "« « Partager » est une stratégie, mais sans recalcul de G × V. »"], ["Un bien support critique n'est couvert par aucune mesure", "« Quelle mesure protège ce bien ? »", "« Sinon, le risque associé doit être accepté explicitement. »", "« BS4 (Serveur de recettes et paramètres) : M6 non retenue, donc SS2 accepté. »"], ["Le budget n'est pas utilisé", "« Un risque élevé subsiste-t-il ? »", "« Le budget est un plafond, pas une obligation. »", "« Plan de référence : 13 points de budget sur 14. »"]]}, "v2": {"tuto": {"a1": {"titre": "Atelier 1 · Cadrage et socle de sécurité", "duree": 50, "obj": "Dire ce qui compte pour FERROMEUSE Aciers Spéciaux (valeurs métier), ce qui le porte (biens supports), ce qui serait grave (événements redoutés, leur gravité) et où en est la sécurité de base (socle).", "besoin": [["Plateau", "Feuille 1 (moitié droite du plateau, en haut à gauche) : tableau valeurs métier / biens supports, gravité des événements redoutés, socle."], ["Cartes", "Deck bleu ENTREPRISE (21 cartes : 5 valeurs métier VM, 10 biens supports BS, 6 événements redoutés ER). Mettez les 6 cartes ER de côté, FACE CACHÉE."], ["À côté de vous", "Le dossier de scénario (constats d'audit, coût d'un jour d'arrêt : 378 k€) et les échelles (bouton « Documents »)."]], "etapes": [["0–3", "Se préparer", "Sortez le deck bleu. Séparez les 6 cartes ER et posez-les face cachée au centre : personne ne les retourne avant l'étape « Calcul ».", "Cartes bleues"], ["3–13", "Lire les valeurs métier et les biens supports", "Chacun lit à voix haute 2 ou 3 cartes VM puis BS. Une valeur métier est ce que l'entreprise doit protéger pour vivre (processus, information, savoir-faire) ; un bien support est ce sur quoi elle repose (matériel, logiciel, locaux, personnes).", "Cartes bleues VM et BS"], ["13–25", "Relier valeurs métier et biens supports", "Pour chaque VM, demandez-vous : « si cette valeur est atteinte, quels biens supports sont touchés ? ». Écrivez leurs codes BS sur la feuille 1, dans la colonne « Biens supports associés », puis le critère le plus sensible de la VM : D (disponibilité), I (intégrité) ou C (confidentialité). Dans l'appli : étape 1, une carte par VM.", "Feuille 1, tableau du haut"], ["25–29", "Estimer les gravités (sans les chiffres)", "Chacun écrit en silence G1 à G4 pour chacun des 6 ER, d'après le titre seul et l'échelle de gravité. Comparez ensuite à voix haute. Dans l'appli : étape 2.", "Appli (estimation) + feuille 1"], ["29–38", "Calculer les gravités", "Retournez les cartes ER. Pour chaque ER : jours d'arrêt × 378 k€ par jour, puis lisez l'échelle. Si le résultat diffère de votre estimation, écrivez en une phrase ce que le titre ne montrait pas. Les ER qui touchent la sécurité des personnes sont G4 par nature.", "Feuille 1, grille des ER"], ["38–46", "Noter le socle de sécurité", "Pour chacune des 8 règles R1 à R8, lisez le constat d'audit (dossier de scénario) et choisissez Conforme (1 point), Partiel (0,5) ou Écart (0). Calculez le taux : total des points ÷ 8.", "Feuille 1 bis (socle)"], ["46–50", "Aléa puis vérification", "Tirez la carte Aléa de l'atelier (bouton de l'appli) : écrivez dans le bloc violet de la feuille ce qui change. Cliquez sur « Vérifier » dans chaque étape : l'appli garde vos bonnes réponses, met ✘ sur les autres avec une courte explication, et vous laisse corriger.", "Appli"]], "appli": ["Chaque étape a un bouton « Vérifier » : ✔ juste (la réponse est conservée), ✘ à revoir avec une courte explication. Vous modifiez vos choix et revérifiez. Après 3 essais infructueux sur une même vérification, la solution est proposée avec ses explications (les points de cette vérification ne montent plus).", "Bloqué ? Le bouton « Aide » donne d'abord une question gratuite ; indice et réponse coûtent 1 des 5 aides de votre table pour toute la journée."], "controle": ["Chaque valeur métier a au moins un bien support, et chaque bien support apparaît dans au moins une valeur métier.", "Aucun ER ne décrit une attaque : il décrit une atteinte (disponibilité, intégrité ou confidentialité) et son impact.", "Chaque ER a une estimation écrite avant le calcul, un calcul écrit, et une phrase explique chaque écart.", "Les 8 règles du socle sont notées et le taux est calculé.", "Le bloc « Après l'aléa » est rempli."], "pieges": ["Prendre un événement (« arrêt de production ») pour une valeur métier.", "Décrire l'attaque dans l'ER.", "Oublier les personnes et les locaux comme biens supports.", "Coter une gravité sans calcul."], "exemple": "Exemple hors jeu (boulangerie) : valeur métier « Vente du jour ». Si elle est atteinte, sont touchés : la caisse enregistreuse, le logiciel de commande en ligne et le four connecté → on écrit ces trois biens supports en face de « Vente du jour ». Critère le plus sensible : D (disponibilité), car sans caisse on ne vend plus.", "objs": ["Cadrer l'étude : dire ce qui compte pour l'entreprise (valeurs métier) et sur quoi cela repose (biens supports).", "Identifier les événements redoutés (ER) et estimer puis calculer leur GRAVITÉ. Cette gravité sera reprise telle quelle à l'atelier 5 (risque = gravité × vraisemblance).", "Évaluer le socle de sécurité : où l'entreprise est conforme, partielle ou en écart. C'est ce socle qui rendra les attaques plus ou moins faciles à l'atelier 4.", "Poser le cadre commun de la table : vocabulaire, échelles, documents."]}, "a2": {"titre": "Atelier 2 · Sources de risque", "duree": 40, "obj": "Décider quelles sources de risque (qui voudrait nous nuire, et pourquoi) méritent d'être étudiées, puis vérifier qu'aucun événement redouté grave n'est laissé sans source.", "besoin": [["Plateau", "Feuille 2, partie haute : tableau de cotation M / R / A / Σ, puis contrôle de couverture."], ["Cartes", "Deck rouge MENACE (6 cartes SR : un profil et un objectif visé). Aucune cotation n'est imprimée."], ["À côté de vous", "Les échelles M / R / A (bouton « Documents », rubrique Échelles), la calculatrice."]], "etapes": [["0–8", "Lire les cartes rouges", "Chacun lit à voix haute une ou deux cartes SR. Discutez du profil : qui est-ce, que veut-il ?", "Cartes rouges"], ["8–20", "Coter M, R et A", "Pour chaque source, cotez de 1 à 4 : M motivation, R ressources, A activité (fréquence observée), avec les échelles du dossier. Justifiez chaque cote en une phrase. Calculez Σ = M + R + A. Σ ≥ 8 : retenu ; 6 ou 7 : à surveiller ; 5 ou moins : écarté. Dans l'appli : le Σ et la décision s'affichent tout seuls.", "Feuille 2, tableau M/R/A"], ["20–26", "Aléa", "Tirez la carte Aléa de l'atelier. Recotez la source concernée et écrivez dans le bloc violet pourquoi vous maintenez ou changez votre décision.", "Appli + feuille 2"], ["26–36", "Contrôle de couverture", "Seules les sources RETENUES (Σ ≥ 8) comptent. Pour chaque ER de gravité G3 ou G4, demandez-vous : « une source retenue peut-elle provoquer cet événement ? ». Oui : l'ER est COUVERT. Non : c'est un ANGLE MORT, vous retenez une source de plus ou vous revoyez une cotation. Dans l'appli : étape 2.", "Feuille 2, bas du tableau"], ["36–40", "Vérifier", "Cliquez sur « Vérifier » (cotations puis couverture).", "Appli"]], "appli": ["Le Σ, la couleur de décision et la liste des sources retenues se calculent seuls.", "Le contrôle de couverture ne propose que les sources retenues et vous dit tout de suite : ✔ couvert ou ✘ angle mort."], "controle": ["Chaque cotation M, R, A est justifiée en une phrase.", "Σ est calculé et la décision (retenu, à surveiller, écarté) est entourée.", "Chaque ER de gravité G3 ou G4 est couvert par au moins une source retenue.", "Une source à surveiller ou écartée n'a jamais été comptée comme couvrant un ER.", "Le bloc « Après l'aléa » est rempli."], "pieges": ["Compter une source « à surveiller » comme couvrante.", "Coter sans justifier.", "Oublier un ER grave : un angle mort veut dire qu'un risque majeur ne sera jamais étudié."], "exemple": "Couvert, c'est quoi ? Imaginez un ER « Fuite des plans » (G3). Si la seule source retenue est un hacktiviste qui veut faire du bruit, personne ne cherche à voler les plans : l'ER est un angle mort. Il faut alors retenir la source « concurrent » (Σ ≥ 8) ou revoir sa cotation.", "objs": ["Identifier les sources de risque (SR) et ce qu'elles visent (objectif visé).", "Évaluer la PERTINENCE de chaque source : motivation, ressources, activité (Σ = M + R + A).", "Retenir les sources prioritaires (Σ ≥ 8) et mettre les autres sous surveillance ou de côté.", "Contrôler que chaque événement redouté grave est couvert par au moins une source retenue."]}, "a3": {"titre": "Atelier 3 · Écosystème et scénarios stratégiques", "duree": 55, "obj": "Repérer quelles parties prenantes (fournisseurs, prestataires) peuvent servir de rebond à une source de risque, bâtir 3 scénarios stratégiques (source → partie prenante → événement redouté) et réduire la menace par des mesures d'écosystème.", "besoin": [["Plateau", "Zone ③ : trois couloirs SS1 à SS3 (cartes SR → PP → ER), cadre des mesures d'écosystème, et feuille 3 : radar des parties prenantes, scénarios stratégiques."], ["Cartes", "Deck vert ÉCOSYSTÈME (8 cartes PP : D, P, M, C imprimés) et deck vert foncé MESURE ÉCOSYSTÈME (8 cartes ME). Réutilisez les cartes SR retenues (atelier 2) et les cartes ER (atelier 1)."], ["À côté de vous", "Calculatrice, échelles D, P, M, C (bouton « Documents »)."]], "etapes": [["0–13", "Calculer le niveau de menace des parties prenantes", "Pour chaque carte verte : niveau = (D × P) ÷ (M × C). Écrivez D × P, puis M × C, puis le quotient. Zone : danger si ≥ 3 ; contrôle de 1,5 à moins de 3 ; veille en dessous de 1,5. Cochez la zone sur le radar de la feuille 3. Dans l'appli : saisissez votre niveau, l'appli le compare au calcul exact.", "Feuille 3, radar"], ["13–16", "Aléa", "Tirez la carte Aléa. Recalculez la partie prenante concernée et écrivez les conséquences dans le bloc violet.", "Appli + feuille 3"], ["16–35", "Construire les 3 scénarios stratégiques", "Pour chaque scénario SS : ① choisissez un ER grave ; ② choisissez la source RETENUE qui peut le provoquer ; ③ choisissez la partie prenante qui sert de relais (de préférence en zone danger) ; ④ posez les 3 cartes SR → PP → ER dans le couloir ; ⑤ cochez les critères A, B, C de vraisemblance avec leur preuve (A : Σ de la source ≥ 9 ; B : une PP du chemin est en danger ; C : une règle du socle sur le chemin est en Écart ou Partielle). V = A + B + C (nombre de critères cochés), au minimum 1. C'est une règle du jeu : la méthode officielle n'évalue la vraisemblance qu'à l'atelier 4.", "Zone ③ couloirs ; feuille 3"], ["35–50", "Choisir les mesures d'écosystème", "Pour chaque PP en zone danger, choisissez au moins une carte ME. Chaque ME change UNE variable de 1. Recalculez le niveau et la zone. Notez le coût en points de budget : il sera retiré des 14 points de budget de l'atelier 5.", "Zone ③ mesures ; feuille 3"], ["50–55", "Vérifier", "Cliquez sur « Vérifier » dans chaque étape.", "Appli"]], "appli": ["Le calculateur libre (D, P, M, C) vous aide sans remplacer le calcul écrit.", "La V et le G × V de chaque scénario se calculent à mesure que vous cochez A, B, C."], "controle": ["Chaque niveau de menace est calculé par écrit (D × P, M × C, quotient) et la zone est cochée.", "Chaque scénario part d'une source retenue, passe par une partie prenante et finit sur un ER ; sa gravité est celle de l'ER.", "Pour chaque V, vous savez dire quels critères A, B, C sont remplis, preuve à l'appui.", "Chaque partie prenante en danger a une mesure d'écosystème avec recalcul.", "Le bloc « Après l'aléa » est rempli."], "pieges": ["Inverser le quotient : (D × P) ÷ (M × C), pas l'inverse.", "Arrondir trop tôt : gardez 2 décimales.", "Choisir une source écartée ou à surveiller pour un scénario."], "exemple": "Exemple hors jeu : D 3, P 4, M 1, C 3. D × P = 12 ; M × C = 3 ; niveau = 12 ÷ 3 = 4,0 → zone danger (≥ 3).", "objs": ["Cartographier l'écosystème : les parties prenantes (PP) qui peuvent servir de rebond.", "Évaluer le niveau de menace de chaque partie prenante : (D × P) ÷ (M × C).", "Construire 3 scénarios stratégiques (source → partie prenante → événement redouté) et les évaluer.", "Choisir des mesures d'écosystème pour toute partie prenante en zone danger (menace ≥ 3) : l'objectif est de repasser sous 3 au moindre coût."]}, "a4": {"titre": "Atelier 4 · Scénarios opérationnels", "duree": 55, "obj": "Détailler comment une attaque se déroule réellement, en quatre actions (Connaître, Rentrer, Trouver, Exploiter), pour chacun de vos 3 scénarios stratégiques, mesurer sa vraisemblance et repérer les biens supports critiques.", "besoin": [["Plateau", "Zone ④ : 3 chaînes de 4 emplacements (Connaître, Rentrer, Trouver, Exploiter) et feuille 2, partie basse : cotation des étapes, actions écartées, tests T1 à T4, biens supports critiques."], ["Cartes", "Deck noir OPÉRATION (15 cartes : phase, action, bien visé), mélangées : certaines ne servent à rien. Posez 4 cartes par chaîne (12 au total) ; les 3 restantes seront écartées. Gardez les cartes bleues BS sous la main."], ["À côté de vous", "Tableau des freins (bouton « Documents », rubrique Échelles), feuille 3 et feuille 1."]], "etapes": [["0–8", "Lire les cartes noires", "Lisez les 15 cartes Opération et relisez vos 3 scénarios stratégiques (feuille 3).", "Cartes noires ; feuille 3"], ["8–25", "Poser les actions dans les 3 chaînes", "Pour chaque scénario, posez 4 actions dans l'ordre Connaître → Rentrer → Trouver → Exploiter (la méthode officielle ne fixe pas de sens de construction : astuce, fixez d'abord la dernière action, celle qui touche l'ER visé, puis remontez). Chaque action doit rendre la suivante possible : écrivez pourquoi. Dans l'appli : un menu par phase.", "Zone ④ ; feuille 2 (bas)"], ["25–28", "Aléa", "Tirez la carte Aléa : réexaminez vos chaînes et votre vraisemblance, écrivez le résultat dans le bloc violet.", "Appli"], ["28–40", "Écarter les actions inutiles", "Une carte est écartée si elle échoue à un test : T1 bien connu (est-il l'un des 10 biens supports de l'atelier 1 ?), T2 valeur métier (soutient-il une VM ?), T3 chemin vers un ER (sert-il un de vos 3 scénarios ?), T4 enchaînement (permet-il l'action suivante ?). Écartez 3 cartes et justifiez.", "Zone ④ « actions écartées »"], ["40–50", "Coter les étapes", "Pour chaque étape, comptez les freins F1 à F4 qui s'appliquent (tableau des freins). Pour chaque étape : 0 frein = V4 (très facile), 1 frein = V3, 2 freins = V2, 3 freins ou plus = V1 (très difficile). Le scénario prend la valeur de son étape la plus difficile (l'attaquant est arrêté dès qu'une étape est trop dure) : elle remplace la V de l'atelier 3. Exemple : freins 0, 1, 2, 0 donnent V 4, 3, 2, 4 ; V du scénario = 2.", "Feuille 2, atelier 4"], ["50–55", "Biens supports critiques", "Comptez les actions par bien support. Un BS est critique s'il est visé par au moins 2 actions dont au moins 1 Rentrer ou Exploiter. Cliquez sur « Vérifier ».", "Feuille 2, ligne BS critiques"]], "appli": ["Les menus de l'appli reprennent les cartes noires : choisissez la carte posée.", "V d'étape et V du scénario se calculent à mesure que vous cochez les freins."], "controle": ["Chaque chaîne a exactement 4 actions, une par phase, dans le bon ordre.", "Chaque action est justifiée : pourquoi suit-elle la précédente ?", "Chaque carte écartée échoue à un test, que vous savez nommer.", "Chaque étape a sa V et ses freins ; la V du scénario est la plus petite.", "Les biens supports critiques sont notés avec le décompte de leurs actions."], "pieges": ["Mettre deux actions de la même phase dans une chaîne.", "Compter un frein sans pouvoir le justifier.", "Oublier que la V de l'atelier 4 remplace celle de l'atelier 3."], "exemple": "Exemple de frein : si la règle du socle qui couvre l'étape est Conforme ou Partielle, F2 s'applique et la V baisse de 1 ; si elle est en Écart, aucun frein F2.", "objs": ["Construire les scénarios opérationnels : les chemins d'attaque en quatre phases (Connaître, Rentrer, Trouver, Exploiter).", "Identifier les cibles techniques : les biens supports visés par les actions, et ceux qui sont critiques.", "Évaluer la VRAISEMBLANCE de chaque scénario : plus la source est motivée et outillée (atelier 2) et plus le socle a d'écarts (atelier 1), plus l'attaque est facile. Chaque obstacle réel est un frein ; par étape, 0 frein = V4 … 3 freins ou plus = V1 ; le scénario vaut son étape la plus difficile.", "Préparer le niveau de risque brut : gravité (atelier 1) × vraisemblance, qui sera placé dans la matrice à l'atelier 5."]}, "a5": {"titre": "Atelier 5 · Traitement du risque", "duree": 40, "obj": "Choisir un plan de traitement sous budget (14 points) pour ramener chaque scénario au seuil d'acceptation, formuler les risques résiduels et faire signer la décision au directeur général.", "besoin": [["Plateau", "Zone ⑤ : emplacements des mesures et feuille 4 : matrice G × V, budget, avant / après traitement, décision du DG, risque résiduel."], ["Cartes", "Deck orange MESURE (12 cartes : coût et effet) et cartes ME retenues à l'atelier 3, à poser sur les emplacements."], ["Budget", "14 points de budget à répartir (coûts écrits sur la feuille 4). La matrice G × V de la feuille 4 reçoit deux valeurs par scénario : avant traitement, après traitement."], ["À côté de vous", "Calculatrice. G vient de la feuille 1, V de l'atelier 4."]], "etapes": [["0–5", "Placer les scénarios dans la matrice", "Pour chaque SS : G (gravité de l'ER visé, atelier 1) × V (vraisemblance du scénario opérationnel, atelier 4). Écrivez G × V dans la colonne « avant traitement » de la matrice (feuille 4). Niveaux : Faible ≤ 3, Moyen 4 à 6, Élevé 8 à 9, Critique ≥ 12.", "Zone ⑤ matrice ; feuille 4"], ["5–20", "Construire le plan sous budget", "Choisissez des mesures (cartes orange et ME) dans la limite de 14 points de budget. Lisez l'effet de chaque carte (« vraisemblance −1 » ou « gravité −1 »), recalculez G × V et écrivez-le dans la colonne « après traitement ». Objectif : chaque scénario à G × V ≤ 6. Deux mesures qui font la même chose ne se cumulent pas.", "Zone ⑤ PACS et budget"], ["20–25", "Aléa", "Tirez la carte Aléa : refaites le plan sous la nouvelle contrainte, dans le bloc violet.", "Appli"], ["25–34", "Risque résiduel et acceptation", "Un scénario encore au-dessus de 6 reçoit une mesure en plus, ou une dérogation signée du DG avec un responsable, un indicateur et une date de revue. Si un ER touche la sécurité des personnes, le risque résiduel n'est jamais accepté par dérogation : la table ajoute une mesure.", "Zone ⑤ acceptation"], ["34–40", "Vérifier", "Cliquez sur « Vérifier le plan ». Le DG signe la décision sur la feuille 4.", "Appli + feuille 4"]], "appli": ["Le coût du plan s'additionne en direct et vous prévient si le budget est dépassé.", "La dérogation du DG (responsable, indicateur, date) se saisit sous chaque scénario encore trop haut."], "controle": ["Le total des coûts ne dépasse pas 14 points de budget.", "Chaque scénario est à G × V ≤ 6, ou une dérogation signée du DG est écrite.", "Pour chaque mesure, G ou V a été recalculé par écrit.", "Chaque risque accepté a un responsable, un indicateur et une date de revue.", "Le plan s'appuie sur les écarts du socle (atelier 1).", "Chaque bien support critique (atelier 4) est protégé, ou son risque est accepté explicitement."], "pieges": ["Dépasser le budget.", "Utiliser la V de l'atelier 3 au lieu de celle de l'atelier 4.", "Cumuler deux mesures équivalentes (M et ME)."], "exemple": "Exemple : G4 × V2 = 8 (Élevé). Une mesure « vraisemblance −1 » donne G4 × V1 = 4 (Moyen) : sous le seuil de 6.", "objs": ["Placer chaque scénario dans la matrice avec son risque brut : G × V (G vient de l'atelier 1, V de l'atelier 4).", "Choisir un plan de traitement sous budget et recalculer le risque résiduel.", "Comparer chaque risque résiduel au seuil d'acceptation (G × V ≤ 6) : sinon, mesure en plus ou dérogation signée du DG.", "Formaliser la décision : responsable, indicateur, date de revue."]}, "deb": {"titre": "Débrief et bilan", "duree": 30, "obj": "Comparer votre analyse à celle des autres tables, comprendre les écarts avec la méthode officielle et repartir avec une action concrète.", "besoin": [["Plateau", "Bas de la feuille 4 : bilan de la journée et questions de débrief."], ["Cartes", "Aucune."], ["À côté de vous", "Votre dossier d'analyse (généré par l'appli)."]], "etapes": [["0–5", "Présenter votre résultat", "Score, risque le plus critique, plus grande divergence avec les autres tables.", "Écran de la classe"], ["5–17", "Comparer les tables", "Valeurs métier, couples retenus, plans de traitement : l'enseignant projette le comparatif.", "Tableau comparatif"], ["17–25", "Retour sur la méthode officielle", "Écarts entre les échelles du jeu et celles du guide EBIOS RM de l'ANSSI.", "Guide ANSSI"], ["25–30", "Ce que je fais lundi", "Écrivez une action concrète pour votre entreprise ou votre stage. Générez ensuite votre dossier.", "Appli"]], "appli": ["Votre dossier d'analyse (PDF) rassemble vos résultats et les photos de votre plateau."], "controle": ["Chaque joueur a écrit son action « lundi »."], "pieges": [], "objs": ["Comparer vos résultats à ceux des autres tables.", "Repérer les notions fragiles.", "Décider d'une action concrète pour lundi."]}}, "tutoB": {"a1": [["p", "b", "Dire ce qui compte pour FERROMEUSE Aciers Spéciaux (valeurs métier), ce qui le porte (biens supports), ce qui serait grave (événements redoutés, leur gravité) et où en est la sécurité de base (socle)."], ["p", "h3", "Les objectifs de l'atelier"], ["p", "bl", "Cadrer l'étude : dire ce qui compte pour l'entreprise (valeurs métier) et sur quoi cela repose (biens supports)."], ["p", "bl", "Identifier les événements redoutés (ER) et estimer puis calculer leur GRAVITÉ. Cette gravité sera reprise telle quelle à l'atelier 5 (risque = gravité × vraisemblance)."], ["p", "bl", "Évaluer le socle de sécurité : où l'entreprise est conforme, partielle ou en écart. C'est ce socle qui rendra les attaques plus ou moins faciles à l'atelier 4."], ["p", "bl", "Poser le cadre commun de la table : vocabulaire, échelles, documents."], ["p", "h3", "Ce dont vous avez besoin"], ["t", [["", ""], ["<b>Plateau</b>", "Feuille 1 (moitié droite du plateau, en haut à gauche) : tableau valeurs métier / biens supports, gravité des événements redoutés, socle."], ["<b>Cartes</b>", "Deck bleu ENTREPRISE (21 cartes : 5 valeurs métier VM, 10 biens supports BS, 6 événements redoutés ER). Mettez les 6 cartes ER de côté, FACE CACHÉE."], ["<b>À côté de vous</b>", "Le dossier de scénario (constats d'audit, coût d'un jour d'arrêt : 378 k€) et les échelles (bouton « Documents »)."]]], ["p", "h3", "Pas à pas (durées conseillées en minutes)"], ["t", [["Min", "Ce que vous faites", "Où"], ["0–3", "<b>Se préparer.</b> Sortez le deck bleu. Séparez les 6 cartes ER et posez-les face cachée au centre : personne ne les retourne avant l'étape « Calcul ».", "Cartes bleues"], ["3–13", "<b>Lire les valeurs métier et les biens supports.</b> Chacun lit à voix haute 2 ou 3 cartes VM puis BS. Une valeur métier est ce que l'entreprise doit protéger pour vivre (processus, information, savoir-faire) ; un bien support est ce sur quoi elle repose (matériel, logiciel, locaux, personnes).", "Cartes bleues VM et BS"], ["13–25", "<b>Relier valeurs métier et biens supports.</b> Pour chaque VM, demandez-vous : « si cette valeur est atteinte, quels biens supports sont touchés ? ». Écrivez leurs codes BS sur la feuille 1, dans la colonne « Biens supports associés », puis le critère le plus sensible de la VM : D (disponibilité), I (intégrité) ou C (confidentialité). Dans l'appli : étape 1, une carte par VM.", "Feuille 1, tableau du haut"], ["25–29", "<b>Estimer les gravités (sans les chiffres).</b> Chacun écrit en silence G1 à G4 pour chacun des 6 ER, d'après le titre seul et l'échelle de gravité. Comparez ensuite à voix haute. Dans l'appli : étape 2.", "Appli (estimation) + feuille 1"], ["29–38", "<b>Calculer les gravités.</b> Retournez les cartes ER. Pour chaque ER : jours d'arrêt × 378 k€ par jour, puis lisez l'échelle. Si le résultat diffère de votre estimation, écrivez en une phrase ce que le titre ne montrait pas. Les ER qui touchent la sécurité des personnes sont G4 par nature.", "Feuille 1, grille des ER"], ["38–46", "<b>Noter le socle de sécurité.</b> Pour chacune des 8 règles R1 à R8, lisez le constat d'audit (dossier de scénario) et choisissez Conforme (1 point), Partiel (0,5) ou Écart (0). Calculez le taux : total des points ÷ 8.", "Feuille 1 bis (socle)"], ["46–50", "<b>Aléa puis vérification.</b> Tirez la carte Aléa de l'atelier (bouton de l'appli) : écrivez dans le bloc violet de la feuille ce qui change. Cliquez sur « Vérifier » dans chaque étape : l'appli garde vos bonnes réponses, met ✘ sur les autres avec une courte explication, et vous laisse corriger.", "Appli"]]], ["p", "note", "Exemple hors jeu (boulangerie) : valeur métier « Vente du jour ». Si elle est atteinte, sont touchés : la caisse enregistreuse, le logiciel de commande en ligne et le four connecté → on écrit ces trois biens supports en face de « Vente du jour ». Critère le plus sensible : D (disponibilité), car sans caisse on ne vend plus."], ["p", "h3", "Dans l'appli"], ["p", "bl", "Chaque étape a un bouton « Vérifier » : ✔ juste (la réponse est conservée), ✘ à revoir avec une courte explication. Vous modifiez vos choix et revérifiez. Après 3 essais infructueux sur une même vérification, la solution est proposée avec ses explications (les points de cette vérification ne montent plus)."], ["p", "bl", "Bloqué ? Le bouton « Aide » donne d'abord une question gratuite ; indice et réponse coûtent 1 des 5 aides de votre table pour toute la journée."], ["p", "h3", "Avant de passer à la suite : auto-contrôle"], ["p", "bl", "☐ Chaque valeur métier a au moins un bien support, et chaque bien support apparaît dans au moins une valeur métier."], ["p", "bl", "☐ Aucun ER ne décrit une attaque : il décrit une atteinte (disponibilité, intégrité ou confidentialité) et son impact."], ["p", "bl", "☐ Chaque ER a une estimation écrite avant le calcul, un calcul écrit, et une phrase explique chaque écart."], ["p", "bl", "☐ Les 8 règles du socle sont notées et le taux est calculé."], ["p", "bl", "☐ Le bloc « Après l'aléa » est rempli."], ["p", "h3", "Pièges fréquents"], ["p", "bl", "Prendre un événement (« arrêt de production ») pour une valeur métier."], ["p", "bl", "Décrire l'attaque dans l'ER."], ["p", "bl", "Oublier les personnes et les locaux comme biens supports."], ["p", "bl", "Coter une gravité sans calcul."]], "a2": [["p", "b", "Décider quelles sources de risque (qui voudrait nous nuire, et pourquoi) méritent d'être étudiées, puis vérifier qu'aucun événement redouté grave n'est laissé sans source."], ["p", "h3", "Les objectifs de l'atelier"], ["p", "bl", "Identifier les sources de risque (SR) et ce qu'elles visent (objectif visé)."], ["p", "bl", "Évaluer la PERTINENCE de chaque source : motivation, ressources, activité (Σ = M + R + A)."], ["p", "bl", "Retenir les sources prioritaires (Σ ≥ 8) et mettre les autres sous surveillance ou de côté."], ["p", "bl", "Contrôler que chaque événement redouté grave est couvert par au moins une source retenue."], ["p", "h3", "Ce dont vous avez besoin"], ["t", [["", ""], ["<b>Plateau</b>", "Feuille 2, partie haute : tableau de cotation M / R / A / Σ, puis contrôle de couverture."], ["<b>Cartes</b>", "Deck rouge MENACE (6 cartes SR : un profil et un objectif visé). Aucune cotation n'est imprimée."], ["<b>À côté de vous</b>", "Les échelles M / R / A (bouton « Documents », rubrique Échelles), la calculatrice."]]], ["p", "h3", "Pas à pas (durées conseillées en minutes)"], ["t", [["Min", "Ce que vous faites", "Où"], ["0–8", "<b>Lire les cartes rouges.</b> Chacun lit à voix haute une ou deux cartes SR. Discutez du profil : qui est-ce, que veut-il ?", "Cartes rouges"], ["8–20", "<b>Coter M, R et A.</b> Pour chaque source, cotez de 1 à 4 : M motivation, R ressources, A activité (fréquence observée), avec les échelles du dossier. Justifiez chaque cote en une phrase. Calculez Σ = M + R + A. Σ ≥ 8 : retenu ; 6 ou 7 : à surveiller ; 5 ou moins : écarté. Dans l'appli : le Σ et la décision s'affichent tout seuls.", "Feuille 2, tableau M/R/A"], ["20–26", "<b>Aléa.</b> Tirez la carte Aléa de l'atelier. Recotez la source concernée et écrivez dans le bloc violet pourquoi vous maintenez ou changez votre décision.", "Appli + feuille 2"], ["26–36", "<b>Contrôle de couverture.</b> Seules les sources RETENUES (Σ ≥ 8) comptent. Pour chaque ER de gravité G3 ou G4, demandez-vous : « une source retenue peut-elle provoquer cet événement ? ». Oui : l'ER est COUVERT. Non : c'est un ANGLE MORT, vous retenez une source de plus ou vous revoyez une cotation. Dans l'appli : étape 2.", "Feuille 2, bas du tableau"], ["36–40", "<b>Vérifier.</b> Cliquez sur « Vérifier » (cotations puis couverture).", "Appli"]]], ["p", "note", "Couvert, c'est quoi ? Imaginez un ER « Fuite des plans » (G3). Si la seule source retenue est un hacktiviste qui veut faire du bruit, personne ne cherche à voler les plans : l'ER est un angle mort. Il faut alors retenir la source « concurrent » (Σ ≥ 8) ou revoir sa cotation."], ["p", "h3", "Dans l'appli"], ["p", "bl", "Le Σ, la couleur de décision et la liste des sources retenues se calculent seuls."], ["p", "bl", "Le contrôle de couverture ne propose que les sources retenues et vous dit tout de suite : ✔ couvert ou ✘ angle mort."], ["p", "h3", "Avant de passer à la suite : auto-contrôle"], ["p", "bl", "☐ Chaque cotation M, R, A est justifiée en une phrase."], ["p", "bl", "☐ Σ est calculé et la décision (retenu, à surveiller, écarté) est entourée."], ["p", "bl", "☐ Chaque ER de gravité G3 ou G4 est couvert par au moins une source retenue."], ["p", "bl", "☐ Une source à surveiller ou écartée n'a jamais été comptée comme couvrant un ER."], ["p", "bl", "☐ Le bloc « Après l'aléa » est rempli."], ["p", "h3", "Pièges fréquents"], ["p", "bl", "Compter une source « à surveiller » comme couvrante."], ["p", "bl", "Coter sans justifier."], ["p", "bl", "Oublier un ER grave : un angle mort veut dire qu'un risque majeur ne sera jamais étudié."]], "a3": [["p", "b", "Repérer quelles parties prenantes (fournisseurs, prestataires) peuvent servir de rebond à une source de risque, bâtir 3 scénarios stratégiques (source → partie prenante → événement redouté) et réduire la menace par des mesures d'écosystème."], ["p", "h3", "Les objectifs de l'atelier"], ["p", "bl", "Cartographier l'écosystème : les parties prenantes (PP) qui peuvent servir de rebond."], ["p", "bl", "Évaluer le niveau de menace de chaque partie prenante : (D × P) ÷ (M × C)."], ["p", "bl", "Construire 3 scénarios stratégiques (source → partie prenante → événement redouté) et les évaluer."], ["p", "bl", "Choisir des mesures d'écosystème pour toute partie prenante en zone danger (menace ≥ 3) : l'objectif est de repasser sous 3 au moindre coût."], ["p", "h3", "Ce dont vous avez besoin"], ["t", [["", ""], ["<b>Plateau</b>", "Zone ③ : trois couloirs SS1 à SS3 (cartes SR → PP → ER), cadre des mesures d'écosystème, et feuille 3 : radar des parties prenantes, scénarios stratégiques."], ["<b>Cartes</b>", "Deck vert ÉCOSYSTÈME (8 cartes PP : D, P, M, C imprimés) et deck vert foncé MESURE ÉCOSYSTÈME (8 cartes ME). Réutilisez les cartes SR retenues (atelier 2) et les cartes ER (atelier 1)."], ["<b>À côté de vous</b>", "Calculatrice, échelles D, P, M, C (bouton « Documents »)."]]], ["p", "h3", "Pas à pas (durées conseillées en minutes)"], ["t", [["Min", "Ce que vous faites", "Où"], ["0–13", "<b>Calculer le niveau de menace des parties prenantes.</b> Pour chaque carte verte : niveau = (D × P) ÷ (M × C). Écrivez D × P, puis M × C, puis le quotient. Zone : danger si ≥ 3 ; contrôle de 1,5 à moins de 3 ; veille en dessous de 1,5. Cochez la zone sur le radar de la feuille 3. Dans l'appli : saisissez votre niveau, l'appli le compare au calcul exact.", "Feuille 3, radar"], ["13–16", "<b>Aléa.</b> Tirez la carte Aléa. Recalculez la partie prenante concernée et écrivez les conséquences dans le bloc violet.", "Appli + feuille 3"], ["16–35", "<b>Construire les 3 scénarios stratégiques.</b> Pour chaque scénario SS : ① choisissez un ER grave ; ② choisissez la source RETENUE qui peut le provoquer ; ③ choisissez la partie prenante qui sert de relais (de préférence en zone danger) ; ④ posez les 3 cartes SR → PP → ER dans le couloir ; ⑤ cochez les critères A, B, C de vraisemblance avec leur preuve (A : Σ de la source ≥ 9 ; B : une PP du chemin est en danger ; C : une règle du socle sur le chemin est en Écart ou Partielle). V = A + B + C (nombre de critères cochés), au minimum 1. C'est une règle du jeu : la méthode officielle n'évalue la vraisemblance qu'à l'atelier 4.", "Zone ③ couloirs ; feuille 3"], ["35–50", "<b>Choisir les mesures d'écosystème.</b> Pour chaque PP en zone danger, choisissez au moins une carte ME. Chaque ME change UNE variable de 1. Recalculez le niveau et la zone. Notez le coût en points de budget : il sera retiré des 14 points de budget de l'atelier 5.", "Zone ③ mesures ; feuille 3"], ["50–55", "<b>Vérifier.</b> Cliquez sur « Vérifier » dans chaque étape.", "Appli"]]], ["p", "note", "Exemple hors jeu : D 3, P 4, M 1, C 3. D × P = 12 ; M × C = 3 ; niveau = 12 ÷ 3 = 4,0 → zone danger (≥ 3)."], ["p", "h3", "Dans l'appli"], ["p", "bl", "Le calculateur libre (D, P, M, C) vous aide sans remplacer le calcul écrit."], ["p", "bl", "La V et le G × V de chaque scénario se calculent à mesure que vous cochez A, B, C."], ["p", "h3", "Avant de passer à la suite : auto-contrôle"], ["p", "bl", "☐ Chaque niveau de menace est calculé par écrit (D × P, M × C, quotient) et la zone est cochée."], ["p", "bl", "☐ Chaque scénario part d'une source retenue, passe par une partie prenante et finit sur un ER ; sa gravité est celle de l'ER."], ["p", "bl", "☐ Pour chaque V, vous savez dire quels critères A, B, C sont remplis, preuve à l'appui."], ["p", "bl", "☐ Chaque partie prenante en danger a une mesure d'écosystème avec recalcul."], ["p", "bl", "☐ Le bloc « Après l'aléa » est rempli."], ["p", "h3", "Pièges fréquents"], ["p", "bl", "Inverser le quotient : (D × P) ÷ (M × C), pas l'inverse."], ["p", "bl", "Arrondir trop tôt : gardez 2 décimales."], ["p", "bl", "Choisir une source écartée ou à surveiller pour un scénario."]], "a4": [["p", "b", "Détailler comment une attaque se déroule réellement, en quatre actions (Connaître, Rentrer, Trouver, Exploiter), pour chacun de vos 3 scénarios stratégiques, mesurer sa vraisemblance et repérer les biens supports critiques."], ["p", "h3", "Les objectifs de l'atelier"], ["p", "bl", "Construire les scénarios opérationnels : les chemins d'attaque en quatre phases (Connaître, Rentrer, Trouver, Exploiter)."], ["p", "bl", "Identifier les cibles techniques : les biens supports visés par les actions, et ceux qui sont critiques."], ["p", "bl", "Évaluer la VRAISEMBLANCE de chaque scénario : plus la source est motivée et outillée (atelier 2) et plus le socle a d'écarts (atelier 1), plus l'attaque est facile. Chaque obstacle réel est un frein ; par étape, 0 frein = V4 … 3 freins ou plus = V1 ; le scénario vaut son étape la plus difficile."], ["p", "bl", "Préparer le niveau de risque brut : gravité (atelier 1) × vraisemblance, qui sera placé dans la matrice à l'atelier 5."], ["p", "h3", "Ce dont vous avez besoin"], ["t", [["", ""], ["<b>Plateau</b>", "Zone ④ : 3 chaînes de 4 emplacements (Connaître, Rentrer, Trouver, Exploiter) et feuille 2, partie basse : cotation des étapes, actions écartées, tests T1 à T4, biens supports critiques."], ["<b>Cartes</b>", "Deck noir OPÉRATION (15 cartes : phase, action, bien visé), mélangées : certaines ne servent à rien. Posez 4 cartes par chaîne (12 au total) ; les 3 restantes seront écartées. Gardez les cartes bleues BS sous la main."], ["<b>À côté de vous</b>", "Tableau des freins (bouton « Documents », rubrique Échelles), feuille 3 et feuille 1."]]], ["p", "h3", "Pas à pas (durées conseillées en minutes)"], ["t", [["Min", "Ce que vous faites", "Où"], ["0–8", "<b>Lire les cartes noires.</b> Lisez les 15 cartes Opération et relisez vos 3 scénarios stratégiques (feuille 3).", "Cartes noires ; feuille 3"], ["8–25", "<b>Poser les actions dans les 3 chaînes.</b> Pour chaque scénario, posez 4 actions dans l'ordre Connaître → Rentrer → Trouver → Exploiter (la méthode officielle ne fixe pas de sens de construction : astuce, fixez d'abord la dernière action, celle qui touche l'ER visé, puis remontez). Chaque action doit rendre la suivante possible : écrivez pourquoi. Dans l'appli : un menu par phase.", "Zone ④ ; feuille 2 (bas)"], ["25–28", "<b>Aléa.</b> Tirez la carte Aléa : réexaminez vos chaînes et votre vraisemblance, écrivez le résultat dans le bloc violet.", "Appli"], ["28–40", "<b>Écarter les actions inutiles.</b> Une carte est écartée si elle échoue à un test : T1 bien connu (est-il l'un des 10 biens supports de l'atelier 1 ?), T2 valeur métier (soutient-il une VM ?), T3 chemin vers un ER (sert-il un de vos 3 scénarios ?), T4 enchaînement (permet-il l'action suivante ?). Écartez 3 cartes et justifiez.", "Zone ④ « actions écartées »"], ["40–50", "<b>Coter les étapes.</b> Pour chaque étape, comptez les freins F1 à F4 qui s'appliquent (tableau des freins). Pour chaque étape : 0 frein = V4 (très facile), 1 frein = V3, 2 freins = V2, 3 freins ou plus = V1 (très difficile). Le scénario prend la valeur de son étape la plus difficile (l'attaquant est arrêté dès qu'une étape est trop dure) : elle remplace la V de l'atelier 3. Exemple : freins 0, 1, 2, 0 donnent V 4, 3, 2, 4 ; V du scénario = 2.", "Feuille 2, atelier 4"], ["50–55", "<b>Biens supports critiques.</b> Comptez les actions par bien support. Un BS est critique s'il est visé par au moins 2 actions dont au moins 1 Rentrer ou Exploiter. Cliquez sur « Vérifier ».", "Feuille 2, ligne BS critiques"]]], ["p", "note", "Exemple de frein : si la règle du socle qui couvre l'étape est Conforme ou Partielle, F2 s'applique et la V baisse de 1 ; si elle est en Écart, aucun frein F2."], ["p", "h3", "Dans l'appli"], ["p", "bl", "Les menus de l'appli reprennent les cartes noires : choisissez la carte posée."], ["p", "bl", "V d'étape et V du scénario se calculent à mesure que vous cochez les freins."], ["p", "h3", "Avant de passer à la suite : auto-contrôle"], ["p", "bl", "☐ Chaque chaîne a exactement 4 actions, une par phase, dans le bon ordre."], ["p", "bl", "☐ Chaque action est justifiée : pourquoi suit-elle la précédente ?"], ["p", "bl", "☐ Chaque carte écartée échoue à un test, que vous savez nommer."], ["p", "bl", "☐ Chaque étape a sa V et ses freins ; la V du scénario est la plus petite."], ["p", "bl", "☐ Les biens supports critiques sont notés avec le décompte de leurs actions."], ["p", "h3", "Pièges fréquents"], ["p", "bl", "Mettre deux actions de la même phase dans une chaîne."], ["p", "bl", "Compter un frein sans pouvoir le justifier."], ["p", "bl", "Oublier que la V de l'atelier 4 remplace celle de l'atelier 3."]], "a5": [["p", "b", "Choisir un plan de traitement sous budget (14 points) pour ramener chaque scénario au seuil d'acceptation, formuler les risques résiduels et faire signer la décision au directeur général."], ["p", "h3", "Les objectifs de l'atelier"], ["p", "bl", "Placer chaque scénario dans la matrice avec son risque brut : G × V (G vient de l'atelier 1, V de l'atelier 4)."], ["p", "bl", "Choisir un plan de traitement sous budget et recalculer le risque résiduel."], ["p", "bl", "Comparer chaque risque résiduel au seuil d'acceptation (G × V ≤ 6) : sinon, mesure en plus ou dérogation signée du DG."], ["p", "bl", "Formaliser la décision : responsable, indicateur, date de revue."], ["p", "h3", "Ce dont vous avez besoin"], ["t", [["", ""], ["<b>Plateau</b>", "Zone ⑤ : emplacements des mesures et feuille 4 : matrice G × V, budget, avant / après traitement, décision du DG, risque résiduel."], ["<b>Cartes</b>", "Deck orange MESURE (12 cartes : coût et effet) et cartes ME retenues à l'atelier 3, à poser sur les emplacements."], ["<b>Budget</b>", "14 points de budget à répartir (coûts écrits sur la feuille 4). La matrice G × V de la feuille 4 reçoit deux valeurs par scénario : avant traitement, après traitement."], ["<b>À côté de vous</b>", "Calculatrice. G vient de la feuille 1, V de l'atelier 4."]]], ["p", "h3", "Pas à pas (durées conseillées en minutes)"], ["t", [["Min", "Ce que vous faites", "Où"], ["0–5", "<b>Placer les scénarios dans la matrice.</b> Pour chaque SS : G (gravité de l'ER visé, atelier 1) × V (vraisemblance du scénario opérationnel, atelier 4). Écrivez G × V dans la colonne « avant traitement » de la matrice (feuille 4). Niveaux : Faible ≤ 3, Moyen 4 à 6, Élevé 8 à 9, Critique ≥ 12.", "Zone ⑤ matrice ; feuille 4"], ["5–20", "<b>Construire le plan sous budget.</b> Choisissez des mesures (cartes orange et ME) dans la limite de 14 points de budget. Lisez l'effet de chaque carte (« vraisemblance −1 » ou « gravité −1 »), recalculez G × V et écrivez-le dans la colonne « après traitement ». Objectif : chaque scénario à G × V ≤ 6. Deux mesures qui font la même chose ne se cumulent pas.", "Zone ⑤ PACS et budget"], ["20–25", "<b>Aléa.</b> Tirez la carte Aléa : refaites le plan sous la nouvelle contrainte, dans le bloc violet.", "Appli"], ["25–34", "<b>Risque résiduel et acceptation.</b> Un scénario encore au-dessus de 6 reçoit une mesure en plus, ou une dérogation signée du DG avec un responsable, un indicateur et une date de revue. Si un ER touche la sécurité des personnes, le risque résiduel n'est jamais accepté par dérogation : la table ajoute une mesure.", "Zone ⑤ acceptation"], ["34–40", "<b>Vérifier.</b> Cliquez sur « Vérifier le plan ». Le DG signe la décision sur la feuille 4.", "Appli + feuille 4"]]], ["p", "note", "Exemple : G4 × V2 = 8 (Élevé). Une mesure « vraisemblance −1 » donne G4 × V1 = 4 (Moyen) : sous le seuil de 6."], ["p", "h3", "Dans l'appli"], ["p", "bl", "Le coût du plan s'additionne en direct et vous prévient si le budget est dépassé."], ["p", "bl", "La dérogation du DG (responsable, indicateur, date) se saisit sous chaque scénario encore trop haut."], ["p", "h3", "Avant de passer à la suite : auto-contrôle"], ["p", "bl", "☐ Le total des coûts ne dépasse pas 14 points de budget."], ["p", "bl", "☐ Chaque scénario est à G × V ≤ 6, ou une dérogation signée du DG est écrite."], ["p", "bl", "☐ Pour chaque mesure, G ou V a été recalculé par écrit."], ["p", "bl", "☐ Chaque risque accepté a un responsable, un indicateur et une date de revue."], ["p", "bl", "☐ Le plan s'appuie sur les écarts du socle (atelier 1)."], ["p", "bl", "☐ Chaque bien support critique (atelier 4) est protégé, ou son risque est accepté explicitement."], ["p", "h3", "Pièges fréquents"], ["p", "bl", "Dépasser le budget."], ["p", "bl", "Utiliser la V de l'atelier 3 au lieu de celle de l'atelier 4."], ["p", "bl", "Cumuler deux mesures équivalentes (M et ME)."]], "deb": [["p", "b", "Comparer votre analyse à celle des autres tables, comprendre les écarts avec la méthode officielle et repartir avec une action concrète."], ["p", "h3", "Les objectifs de l'atelier"], ["p", "bl", "Comparer vos résultats à ceux des autres tables."], ["p", "bl", "Repérer les notions fragiles."], ["p", "bl", "Décider d'une action concrète pour lundi."], ["p", "h3", "Ce dont vous avez besoin"], ["t", [["", ""], ["<b>Plateau</b>", "Bas de la feuille 4 : bilan de la journée et questions de débrief."], ["<b>Cartes</b>", "Aucune."], ["<b>À côté de vous</b>", "Votre dossier d'analyse (généré par l'appli)."]]], ["p", "h3", "Pas à pas (durées conseillées en minutes)"], ["t", [["Min", "Ce que vous faites", "Où"], ["0–5", "<b>Présenter votre résultat.</b> Score, risque le plus critique, plus grande divergence avec les autres tables.", "Écran de la classe"], ["5–17", "<b>Comparer les tables.</b> Valeurs métier, couples retenus, plans de traitement : l'enseignant projette le comparatif.", "Tableau comparatif"], ["17–25", "<b>Retour sur la méthode officielle.</b> Écarts entre les échelles du jeu et celles du guide EBIOS RM de l'ANSSI.", "Guide ANSSI"], ["25–30", "<b>Ce que je fais lundi.</b> Écrivez une action concrète pour votre entreprise ou votre stage. Générez ensuite votre dossier.", "Appli"]]], ["p", "h3", "Dans l'appli"], ["p", "bl", "Votre dossier d'analyse (PDF) rassemble vos résultats et les photos de votre plateau."], ["p", "h3", "Avant de passer à la suite : auto-contrôle"], ["p", "bl", "☐ Chaque joueur a écrit son action « lundi »."]]}, "rules": [["p", "h2", "But du jeu"], ["p", "b", "Vous formez la cellule d'analyse de risque de FERROMEUSE Aciers Spéciaux. En 5 ateliers (ceux de la méthode EBIOS Risk Manager) vous allez des valeurs métier jusqu'à l'acceptation des risques. Vous lisez des cartes, vous les posez sur le plateau, vous calculez, vous débattez et vous écrivez sur le plateau. L'appli de votre table vérifie vos résultats (✔ ou ✘) sans donner la réponse et compte les points."], ["p", "h2", "Comment se déroule un atelier"], ["p", "bl", "<b>1 · Consignes</b> : ouvrez « Consignes de l'atelier » (bouton fixe en bas). Elles disent quoi sortir, quoi faire, dans quel ordre, où écrire."], ["p", "bl", "<b>2 · Première version</b> : lisez les cartes, posez-les sur leurs emplacements, calculez, écrivez sur la feuille du plateau et saisissez vos choix dans l'appli."], ["p", "bl", "<b>3 · Aléa</b> : quand la première version est posée, tirez la carte Aléa de l'atelier (bouton dans l'appli). Elle change une donnée ou une contrainte. Vous révisez votre travail dans le bloc « Après l'aléa » (version 2) ; la version 1 n'est jamais effacée."], ["p", "bl", "<b>4 · Vérification</b> : cliquez sur « Vérifier ». ✔ = juste (conservé), ✘ = à revoir, avec une courte phrase d'explication. Corrigez et revérifiez : seuls les meilleurs points sont gardés. Après 3 essais infructueux sur une même vérification, vous pouvez afficher la solution expliquée."], ["p", "bl", "<b>5 · Atelier suivant</b> : quand toutes les étapes sont vérifiées, passez à l'atelier suivant."], ["p", "h2", "Les aides : 5 pour toute la journée"], ["p", "b", "Chaque table dispose de <b>5 aides</b> pour tout le jeu. Le bouton « Aide » propose d'abord une question gratuite ; un indice, ou la réponse d'un élément précis (par exemple « Révéler VM2 »), consomme <b>1 aide</b> et coûte <b>1 point</b>. Choisissez quand les utiliser : les 5 sont partagées par toute la table, sur tous les ateliers."], ["p", "h2", "Règles de table"], ["p", "bl", "Toute cotation est justifiée à voix haute en une phrase. Un résultat sans calcul écrit n'est pas valable."], ["p", "bl", "Droit de contestation : une fois par atelier, chaque joueur peut contester une cotation ; l'équipe la justifie ou la modifie."], ["p", "bl", "Votre résultat peut différer de la référence de l'appli. Les calculs (Σ, niveau de menace, G × V, coûts) doivent être exacts ; les choix (cotations subjectives, chemin retenu) peuvent différer d'un niveau s'ils sont justifiés. Les écarts se discutent au débrief."], ["p", "h2", "Durée et score"], ["p", "b", "Atelier 1 : 50 min · atelier 2 : 40 · atelier 3 : 55 · atelier 4 : 55 · atelier 5 : 40 · débrief : 30. Les points de l'appli servent à comparer les tables et à repérer les notions fragiles, pas à classer les personnes. L'enseignant établit la note finale avec la fiche d'évaluation."]], "materiel": [["p", "h2", "Où est quoi ? Le matériel en un coup d'œil"], ["t", [["Ce que vous avez", "Où le trouver", "Quand l'utiliser"], ["Plateau A1", "Au centre de la table. Moitié droite : les 4 feuilles de travail imprimées (on écrit dessus). Moitié gauche : les emplacements des cartes.", "Toute la journée"], ["Cartes bleues ENTREPRISE (21)", "Deck bleu. 5 VM + 10 BS + 6 ER. Les ER restent face cachée jusqu'au calcul.", "Atelier 1 (BS gardées pour l'atelier 4)"], ["Cartes rouges MENACE (6)", "Deck rouge : les sources de risque SR.", "Atelier 2 (SR retenues posées à l'atelier 3)"], ["Cartes vertes ÉCOSYSTÈME (8) et vert foncé MESURE ÉCOSYSTÈME (8)", "Deck vert (PP : D, P, M, C imprimés) et deck vert foncé (ME).", "Atelier 3"], ["Cartes noires OPÉRATION (15)", "Deck noir : phase, action, bien visé. Certaines ne servent à rien.", "Atelier 4"], ["Cartes orange MESURE (12)", "Deck orange : coût en points de budget et effet.", "Atelier 5"], ["Cartes violettes ALÉA", "Elles n'ont plus besoin d'être lues par quelqu'un : l'appli tire la carte de l'atelier pour votre table.", "Milieu de chaque atelier"], ["Feuilles A4 de réserve", "Copies des 4 feuilles du plateau, en cas d'erreur.", "À la demande"], ["Appli compagnon", "Sur votre téléphone ou votre ordinateur. Les boutons fixes en bas de l'écran : Consignes, Règles, Documents, Aide.", "Toute la journée"]]], ["p", "h2", "Les feuilles du plateau"], ["t", [["Feuille", "Atelier", "Contenu"], ["Feuille 1", "Atelier 1", "Valeurs métier / biens supports, gravité des ER, socle de sécurité"], ["Feuille 2 (haut)", "Atelier 2", "Cotation M / R / A / Σ et contrôle de couverture"], ["Feuille 3", "Atelier 3", "Radar des parties prenantes, scénarios stratégiques, mesures d'écosystème"], ["Feuille 2 (bas)", "Atelier 4", "Étapes, freins, actions écartées, biens supports critiques"], ["Feuille 4", "Atelier 5 et débrief", "Matrice G × V, budget, avant / après, décision du DG"]]]], "quiz": [{"q": "Une source de risque est cotée M = 2, R = 3, A = 2. Quelle est sa décision ?", "o": ["Retenue (Σ ≥ 8)", "À surveiller (Σ de 6 à 7)", "Écartée (Σ ≤ 5)"], "a": 1, "e": "Σ = 2 + 3 + 2 = 7. Entre 6 et 7, la source est « à surveiller » : elle ne compte pas pour la couverture des événements redoutés."}, {"q": "Une partie prenante a D = 3, P = 4, M = 2, C = 3. Quel est son niveau de menace (D × P) ÷ (M × C) et sa zone ?", "o": ["2,0 : zone contrôle", "0,5 : zone veille", "12 : zone danger"], "a": 0, "e": "D × P = 12 ; M × C = 6 ; 12 ÷ 6 = 2,0. De 1,5 à moins de 3 : zone contrôle. Le dénominateur est M × C (maturité × confiance) : plus M et C sont hauts, plus la menace baisse."}, {"q": "Après traitement, un scénario est à G × V = 8 alors que le seuil d'acceptation est 6. Que faites-vous ?", "o": ["Rien : 8 reste acceptable", "Ajouter une mesure pour descendre à 6 ou moins, ou obtenir une dérogation signée du DG (responsable, indicateur, date de revue)", "Changer la gravité du scénario pour que le total passe"], "a": 1, "e": "Le seuil est G × V ≤ 6. Au-dessus, il faut une mesure en plus ou une dérogation écrite et signée par le DG. On ne modifie jamais G pour « faire passer » un risque."}], "scen": [["p", "h2", "Fiche entreprise"], ["t", [["Raison sociale", "FERROMEUSE Aciers Spéciaux SAS (entreprise fictive, Meuse, Grand Est)"], ["Activité", "Laminage à chaud et traitement thermique d'aciers spéciaux pour l'automobile et l'aéronautique"], ["Taille", "640 salariés, 138 M€ de chiffre d'affaires, soit environ 378 k€ par jour (138 M€ ÷ 365)"], ["Sites", "Site A : laminoir (4 lignes) et traitement thermique. Site B : logistique et finition"], ["Clients", "Trois constructeurs et équipementiers représentent 55 % du chiffre d'affaires"], ["Certifications", "Qualité automobile et aéronautique (audit client chaque année)"], ["Projet stratégique", "« Usine 4.0 » : connecter le MES à un jumeau numérique hébergé dans le cloud"]]], ["p", "h2", "Système d'information et système industriel"], ["p", "bl", "Environ 140 automates programmables de deux constructeurs pilotent fours, laminoirs et convoyeurs."], ["p", "bl", "Une supervision SCADA sur postes Windows hérités affiche les 4 lignes en temps réel."], ["p", "bl", "Un MES planifie la production et alimente l'ERP. Un serveur de recettes stocke les compositions d'alliages."], ["p", "bl", "Une passerelle IT/OT et un pare-feu assurent une segmentation partielle."], ["p", "bl", "Le constructeur d'automates et l'intégrateur SCADA se connectent par VPN pour la télémaintenance."], ["p", "bl", "Des sous-traitants et des intérimaires accèdent à la salle de contrôle et aux armoires électriques avec des badges temporaires."], ["p", "h2", "Constats de l'audit interne sur le socle de sécurité (atelier 1, étape « Socle »)"], ["p", "note", "L'audit décrit la situation sans la noter : c'est à vous d'attribuer un état à chaque règle (Conforme, Partiel, Écart)."], ["t", [["Règle", "Constat de l'audit interne (sans notation)"], ["R1 Segmentation IT/OT", "Un pare-feu sépare bureautique et industriel, mais plusieurs flux directs existent (SCADA vers MES, accès du constructeur) sans zone démilitarisée industrielle. Ces flux directs ne sont pas filtrés : la séparation n'est pas effective."], ["R2 Télémaintenance", "Accès VPN du constructeur et de l'intégrateur : comptes partagés, sessions permanentes, aucun second facteur d'authentification."], ["R3 Sauvegardes", "Configurations d'automates sauvegardées hors ligne pour environ 60 % des automates ; aucune restauration n'a jamais été testée."], ["R4 Postes de supervision", "Postes SCADA Windows hérités : correctifs non appliqués depuis deux ans, durcissement inexistant."], ["R5 Sensibilisation", "80 % du personnel formé ; prestataires et intérimaires non formés."], ["R6 Détection OT", "Aucune journalisation ni détection sur le réseau industriel."], ["R7 Continuité", "Procédures de repli manuel testées chaque année sur les 4 lignes."], ["R8 Clauses contractuelles", "Des clauses de sécurité figurent dans 3 contrats sur 8 prestataires critiques."]]], ["p", "note", "<b>Comment décider ?</b> <b>Conforme</b> : la règle est en place, complète et vérifiée (1 point). <b>Partiel</b> : en place en partie, ou en place mais jamais vérifiée (0,5). <b>Écart</b> : absente, ou en place mais sans effet réel (0)."], ["p", "h3", "Contexte réglementaire (à discuter, non à affirmer)"], ["p", "note", "Selon son activité et sa taille, FERROMEUSE peut relever de réglementations européennes de cybersécurité (directive NIS 2) ou de référentiels de sécurité industrielle (famille IEC 62443). Retenez simplement que ces cadres existent : vous n'avez pas à les appliquer dans le jeu, ils sont évoqués au débrief."]], "ech": [["p", "note", "Ces règles sont des <b>simplifications pédagogiques</b>. À la fin de la journée, vous les comparerez aux échelles du guide officiel de l'ANSSI."], ["t", [["Gravité", "Définition"], ["G1 Mineure", "Perte inférieure à 50 k€, arrêt de quelques heures sur une ligne"], ["G2 Significative", "50 à 500 k€, arrêt de plusieurs heures à un jour"], ["G3 Grave", "0,5 à 5 M€, client directement touché, certification menacée"], ["G4 Critique", "Plus de 5 M€, atteinte à la sécurité des personnes ou à l'environnement, arrêt administratif"]]], ["t", [["Vraisemblance", "Définition"], ["V1 Peu vraisemblable", "Nécessite des moyens très importants ou plusieurs conditions rares"], ["V2 Vraisemblable", "Réalisable par une source motivée avec des moyens courants"], ["V3 Très vraisemblable", "Facilement réalisable, déjà observé dans le secteur"], ["V4 Quasi certaine", "Pratiquement garanti si la source le décide"]]], ["p", "h3", "Atelier 2 : coter la motivation, les ressources et l'activité (de 1 à 4)"], ["t", [["Niveau", "Motivation (M)", "Ressources (R)", "Activité (A)"], ["1", "Faible : intérêt marginal, opportuniste", "Très limitées : une personne isolée, outils publics", "Rarement observée dans le secteur"], ["2", "Moyenne : intérêt réel mais pas prioritaire", "Limitées : outils courants, compétences moyennes", "Occasionnelle : quelques cas par an dans le secteur"], ["3", "Forte : objectif clair, prêt à investir du temps", "Importantes : équipe organisée, outils spécialisés ou accès légitimes", "Régulière : attaques observées chaque mois"], ["4", "Très forte : objectif prioritaire, détermination durable", "Très importantes : organisation structurée, moyens élevés", "Très fréquente : attaques quasi quotidiennes"]]], ["p", "h3", "Atelier 3 : les quatre variables d'une partie prenante (D, P, M, C)"], ["t", [["Variable", "Définition", "Valeur 1", "Valeur 4", "Effet sur le niveau de menace"], ["D · Dépendance", "À quel point l'organisation a besoin de cette partie prenante pour fonctionner. Peut-on la remplacer vite ?", "Remplaçable en quelques jours, sans conséquence", "Indispensable, aucune solution de repli", "D monte : la menace monte"], ["P · Pénétration", "Jusqu'où la partie prenante entre dans nos systèmes et nos locaux : VPN, comptes, badge, clés USB, accès physique.", "Aucun accès, simples échanges de documents", "Accès permanent et privilégié (administration, VPN toujours ouvert)", "P monte : la menace monte"], ["M · Maturité cyber", "Capacité de la partie prenante à se protéger et à gérer un incident : organisation, outils, certification, sensibilisation de son personnel.", "Aucune démarche de sécurité", "Démarche structurée, certifiée et testée", "M monte : la menace baisse"], ["C · Confiance", "Confiance que l'on peut accorder à ses intentions et à ses engagements : contrat, historique, transparence, droit d'audit.", "Doutes, intérêts divergents, aucun engagement", "Relation éprouvée, engagements opposables, intérêts alignés", "C monte : la menace baisse"]]], ["p", "h3", "Atelier 3 : les mesures d'écosystème (ME), leviers pour réduire le niveau de menace d'une partie prenante"], ["p", "note", "Les cartes ME (vert foncé) sont les <b>mesures d'écosystème</b> : chacune agit sur une variable de la partie prenante. Leur but : faire sortir de la zone danger les parties prenantes qui sont des rebonds faciles. Après chaque mesure, recalculez le niveau et la zone."], ["t", [["Variable", "Ce qu'elle mesure", "Comment la faire évoluer", "Cartes ME"], ["D · Dépendance", "À quel point FERROMEUSE a besoin de la partie prenante", "Prévoir un second prestataire ou un plan B (D baisse)", "ME6"], ["P · Pénétration", "Accès de la partie prenante à nos systèmes et à nos locaux", "Accès à la demande, cloisonnement, accompagnement sur site (P baisse)", "ME3, ME4, ME5"], ["M · Maturité cyber", "Niveau de sécurité de la partie prenante", "Audit, sensibilisation du prestataire (M monte)", "ME1, ME7"], ["C · Confiance", "Engagements opposables et relation éprouvée", "Clauses contractuelles, revue annuelle, exercice commun (C monte)", "ME2, ME8"]]], ["p", "h3", "Atelier 4 : les freins qui rendent une étape plus difficile"], ["t", [["Frein", "Question à se poser sur l'étape", "Effet"], ["F1 · Compétences ou moyens", "La source doit-elle disposer de compétences ou de moyens qu'elle n'a pas naturellement (par exemple connaître les protocoles industriels) ?", "−1"], ["F2 · Règle du socle", "Une règle du socle qui couvre cette étape est-elle Conforme ou Partielle ? (Écart : aucun frein)", "−1"], ["F3 · Conditions cumulatives", "Faut-il réunir plusieurs conditions indépendantes (présence physique et badge valide, par exemple) ?", "−1"], ["F4 · Détection probable", "Quelqu'un ou quelque chose a-t-il de bonnes chances de remarquer l'action ?", "−1"]]], ["p", "h3", "Récapitulatif des règles du jeu"], ["t", [["Notion", "Règle"], ["Pertinence d'un couple source / objectif (atelier 2)", "Σ = M + R + A. Σ ≥ 8 : retenu · 6 à 7 : à surveiller · ≤ 5 : écarté"], ["Niveau de menace d'une partie prenante (atelier 3)", "(D × P) ÷ (M × C). Danger ≥ 3 · Contrôle de 1,5 à moins de 3 · Veille moins de 1,5"], ["Vraisemblance d'un scénario stratégique (atelier 3)", "Nombre de critères remplis, mi
