<title>Compagnon EBIOS RM · PRESTATAIRE</title>
<style>

*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:132px}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:15px;margin:0;flex:1;line-height:1.2}header small{display:block;font-weight:400;opacity:.8;font-size:12px}
.tb{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:18px;padding:8px 12px;font-size:14px}
.wrap{max-width:820px;margin:0 auto;padding:12px 16px}
#side{display:none}
nav{position:fixed;bottom:var(--cb,0px);left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:7px 0 6px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:48px}
nav button b{font-size:16px}nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}nav button.lock{opacity:.45}
#dock{position:sticky;top:var(--hh,56px);z-index:5;display:flex;gap:5px;padding:4px 6px;background:var(--bg);border-bottom:1px solid var(--line)}
.dk{flex:1;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:11px;line-height:1.1;min-height:42px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;box-shadow:0 2px 5px rgba(0,0,0,.2);padding:2px 4px}
.dk b{font-size:16px;line-height:1}.dk.aide{background:#6b4ea0}.dk.aide.zero{background:#7a7f8c}.dk.cur{background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.card h2{font-size:17px;margin:0 0 4px;color:var(--acc)}.card h3{font-size:15px;margin:10px 0 4px}
.mut{color:var(--mut);font-size:13.5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;min-height:44px}
.btn.sec{background:var(--soft);color:var(--acc)}.btn.sm{padding:8px 12px;font-size:14px;min-height:38px}.btn[disabled]{opacity:.45}.btn.big2{width:100%;font-size:17px;padding:14px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 9px;max-width:100%;min-height:42px}
textarea{width:100%;min-height:64px}input[type=number],input[type=text]{width:100%}
table{border-collapse:collapse;width:100%}td,th{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left;font-size:14.5px}th{font-size:12px;color:var(--mut);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:16px;padding:6px 11px;margin:3px 3px 3px 0;font-size:14px;background:var(--card);min-height:38px}
.chip input{width:20px;height:20px;min-height:0;margin:0}.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;color:#fff}
.z-d{background:#c0392b}.z-c{background:#d9a21a}.z-v{background:#2f8f5b}.l-f{background:#2f8f5b}.l-m{background:#d9a21a}.l-e{background:#e07b1a}.l-c{background:#c0392b}
.ok{color:var(--ok);font-weight:700}.ko{color:var(--ko);font-weight:700}.warn{color:var(--warn);font-weight:700}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);border-radius:16px 16px 0 0;max-height:90vh;overflow:auto;width:100%;max-width:820px;margin:0 auto;padding:14px 16px 24px}
.sheet .x{position:sticky;top:-14px;float:right;z-index:2}
.banner{background:#fff3cd;color:#5c4400;border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:14px}
.big{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.hist div{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:13px}.hist span.b{height:14px;background:var(--acc);border-radius:4px;display:inline-block;min-width:2px}
.rep{position:fixed;inset:0;background:#fff;color:#000;z-index:30;overflow:auto;padding:20px}.rep h1{font-size:20px}.rep h2{font-size:15px;border-bottom:2px solid #12284c;margin-top:16px}
.rep td,.rep th{font-size:12px;border:1px solid #ccc;padding:3px 5px}.rep img{max-width:48%;margin:2px}
.doc h1{font-size:18px;margin:14px 0 6px;color:var(--acc)}.doc h2{font-size:16px;margin:14px 0 4px}.doc h3{font-size:14.5px;margin:10px 0 3px;color:var(--mut)}
.doc p{margin:5px 0}.doc .bl{padding-left:16px;position:relative;margin:3px 0}.doc .bl:before{content:'•';position:absolute;left:3px}.doc .note{color:var(--mut);font-size:13.5px}
.doc .st{font-weight:700;color:var(--mut)}.doc .tt{font-size:18px;font-weight:800}.doc .tw{overflow-x:auto;margin:6px 0}.doc table td,.doc table th{border:1px solid var(--line);font-size:13.5px;padding:5px 7px;vertical-align:top}
.doc table tr:first-child td{background:var(--soft);font-weight:600}.doc .cor{background:rgba(31,138,76,.12);border-left:4px solid var(--ok);padding:6px 10px;margin:8px 0;border-radius:4px}.doc .rh{background:var(--soft);border-left:4px solid var(--acc);padding:6px 10px;font-weight:700;margin:8px 0}
details.dd{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 8px;padding:2px 12px}details.dd>summary{padding:11px 0;font-weight:700;cursor:pointer}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.steps span{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:13px}.steps span.d{border-color:var(--ok);background:rgba(31,138,76,.1)}.steps span.v{border-color:var(--ok);background:rgba(31,138,76,.22)}
.next{background:var(--soft);border-left:5px solid var(--acc);border-radius:8px;padding:9px 12px;margin:0 0 12px;font-weight:600}
.vmrow{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
.doclist .btn{display:flex;width:100%;justify-content:space-between;align-items:center;margin:6px 0;text-align:left;min-height:54px;font-size:16px}
.mx{display:grid;grid-template-columns:34px repeat(4,1fr);gap:3px;text-align:center;font-size:12px}.mx div{min-height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap}
.tiles{display:flex;gap:8px;margin:6px 0}.tile{display:inline-flex;align-items:baseline;justify-content:center;gap:5px;min-width:58px;padding:6px 10px;border-radius:10px;font-weight:800;font-size:22px;margin-right:4px}.tile i{font-style:normal;font-size:13px;font-weight:700;opacity:.85}.tile.up{background:#fbe3e0;color:#9b2c1f}.tile.dn{background:#dcf1e3;color:#1d6b3b}.frm{font-size:14px;color:var(--mut);margin:2px 0 6px;font-variant-numeric:tabular-nums}
.abcbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}.abc{display:flex;gap:10px;align-items:flex-start;margin:7px 0}.abc .ev{color:var(--acc);font-weight:600;font-size:13.5px}
.why{display:block;color:var(--ko);font-size:12.5px;font-weight:500;line-height:1.3;margin-top:2px}.sol h3{margin-top:0}.fab{position:fixed;right:12px;bottom:100px;z-index:9;border:0;border-radius:26px;background:var(--a5);color:#fff;font-weight:700;font-size:15px;padding:13px 18px;box-shadow:0 3px 12px rgba(0,0,0,.35)}.fab2{position:fixed;left:12px;bottom:100px;z-index:9;border:0;border-radius:22px;background:var(--navy);color:#fff;font-weight:600;font-size:13px;padding:10px 14px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.steps{display:none}#crumb{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);min-height:30px;z-index:6;display:flex;align-items:center;gap:4px;overflow-x:auto;white-space:nowrap;padding:4px 8px;background:var(--card);border-top:1px solid var(--line);font-size:12px;-webkit-overflow-scrolling:touch}#crumb .sep{color:var(--mut)}#crumb .cr{flex:0 0 auto;border:0;background:none;color:var(--mut);font-size:12px;padding:5px 4px;border-radius:8px;max-width:none}#crumb .cr.v{color:var(--ok)}#crumb .cr.c{color:#fff;background:var(--acc);font-weight:700}#crumb .cr.l{opacity:.45}@media(min-width:1000px){#crumb{display:none!important}.steps{display:flex}}
body{padding-bottom:104px}.rvbar{margin:0 0 8px;padding:6px 8px;background:var(--soft);border-radius:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ro input,.ro select,.ro textarea{opacity:.85}
#tbar{position:fixed;left:8px;bottom:150px;z-index:9;display:flex;flex-direction:column;gap:5px;align-items:flex-start}#tbar div{display:flex;gap:5px}#tbar button{border:0;border-radius:20px;background:#c0392b;color:#fff;font-weight:700;font-size:12px;padding:8px 10px;box-shadow:0 3px 10px rgba(0,0,0,.35)}#tbar button.on{background:#1e8449}
.sheet .fab{z-index:30;bottom:20px}.sheet .fab2{z-index:30;bottom:20px}
#pb{position:sticky;top:calc(var(--hh,56px) + var(--dh,0px));z-index:4;background:var(--bg);padding:6px 0 8px;border-bottom:1px solid var(--line);margin-bottom:10px}#pb .bar i{background:var(--acc)}#pb.fin .bar i{background:var(--ok)}#pb .pbn{font-size:13.5px;font-weight:600;margin-top:4px;line-height:1.3}#pb.fin .pbn{color:var(--ok)}
.locknote{background:#fff3cd;color:#5c4400;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.chip.ok{border-color:var(--ok);background:rgba(31,138,76,.14)}.chip.ko{border-color:var(--ko);background:rgba(192,57,43,.14)}select.ok{border-color:var(--ok);background:rgba(31,138,76,.1)}select.ko{border-color:var(--ko);background:rgba(192,57,43,.12)}.cell{font-size:17px;margin-left:4px}
.erc{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}.gscale{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.gscale span{flex:1;min-width:46%;border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:12.5px;color:var(--mut)}.gscale span.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.tag{display:inline-block;background:var(--navy);color:#fff;border-radius:11px;padding:0 7px;font-size:12px;font-weight:700}
.dash td,.dash th{font-size:13px;padding:6px 3px}.dash .cellb{min-width:70px}.dash .st-ko{background:rgba(192,57,43,.14)}.dash .st-w{background:rgba(217,162,26,.16)}
@media(min-width:1000px){
 body{font-size:17px;padding-bottom:56px}
 .wrap{max-width:1240px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px}
 #dock{display:none}
 .fab,.fab2{bottom:24px}#tbar{bottom:84px}
 #side{display:block;position:sticky;top:64px;align-self:start}
 #side .dk{width:100%;min-height:62px;flex-direction:row;gap:10px;font-size:16px;margin:0 0 10px;justify-content:flex-start;padding:0 16px}
 .sheet{background:transparent;pointer-events:none;justify-content:flex-end;align-items:stretch}
 .sheet>div{pointer-events:auto;border-radius:0;max-height:100vh;height:100vh;width:min(640px,48vw);max-width:none;margin:0;box-shadow:-6px 0 24px rgba(0,0,0,.28);font-size:16.5px}
 .card{padding:14px 18px}.mut{font-size:14px}
}
@media print{body>*:not(.rep){display:none!important}.rep{position:static;padding:0}.noprint{display:none}}
@media(max-width:999px){.stk th{position:sticky;top:calc(var(--hh,56px) + var(--dh,0px));background:var(--card);z-index:3;box-shadow:0 1px 0 var(--line)}}
.qrg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:8px 0}.qrc{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:#fff;color:#000;page-break-inside:avoid}.qrt{font-weight:700;margin-bottom:4px}.qrs svg{width:100%;height:auto;max-width:230px}.sess{width:100%;min-width:170px;box-sizing:border-box;text-transform:uppercase}.cmp{margin:2px 0;font-size:.95em}.dpm{font-size:13px}.todo{font-weight:600;margin:2px 0 8px}.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.sc{font-size:12px;border-radius:8px;padding:2px 7px;background:#e6e9ef}.sc.e{background:#f5c6c0}.sc.p{background:#f7e3a8}.sc.c{background:#cfe9d8}.bud{margin:6px 0}
body.tour #dock,body.tour nav,body.tour #crumb,body.tour .fab,body.tour .fab2,body.tour #tbar,body.tour #side,body.tour #pb{display:none!important}
body.prof .wrap{max-width:1500px}body.prof{font-size:17px}body.tour{font-size:18px;padding-bottom:30px}body.tour .wrap{display:block;max-width:1500px}
.tourgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}@media(max-width:900px){.tourgrid{grid-template-columns:1fr}}
.tstep{display:flex;gap:10px;padding:8px 10px;border-radius:10px;margin:6px 0;background:var(--card);border:1px solid var(--line)}.tstep .ti{font-size:1.3em;width:1.5em;text-align:center}.tstep.v{border-left:5px solid var(--ok)}.tstep.c{border-left:5px solid var(--acc);background:var(--soft)}.tstep.l{opacity:.55}.tdev{margin:8px 0;padding-bottom:6px;border-bottom:1px solid var(--line)}
.need{background:var(--soft);border-left:4px solid var(--acc);padding:8px 12px;border-radius:8px;margin:6px 0 10px;font-size:14px}
</style>

2, "Pénétration : −1."], ["ME5", "Badge nominatif et accompagnement sur site", "P", -1, 1, "Pénétration : −1 (accès physique)."], ["ME6", "Second prestataire ou plan B de continuité", "D", -1, 2, "Dépendance : −1."], ["ME7", "Sensibilisation et formation des équipes du prestataire", "M", 1, 1, "Maturité cyber de la partie prenante : +1."], ["ME8", "Revue annuelle et exercice de crise commun", "C", 1, 1, "Confiance : +1 (relation éprouvée)."]], "mes": [["M1", "Cloisonnement du SI interne, de la plateforme et des tunnels clients avec zone démilitarisée", 4, "SS1 : vraisemblance −1."], ["M2", "Bastion d'accès aux clients avec second facteur et sessions à la demande", 3, "SS1 : vraisemblance −1."], ["M3", "Sauvegardes hors ligne testées (plateforme, base de configurations)", 2, "SS1 : gravité −1 (reprise plus rapide)."], ["M4", "Détection sur la plateforme et sur les sessions d'intervention", 4, "SS1 et SS3 : vraisemblance −1."], ["M5", "Clauses de sécurité et audit des sous-traitants et des éditeurs critiques", 2, "PP2 et PP7 : maturité +1."], ["M6", "Cloisonnement et chiffrement de la base de configurations, contrôle des exports", 3, "SS2 : vraisemblance −1."], ["M7", "Comptes nominatifs, habilitations et expiration des accès des sous-traitants", 2, "SS3 : vraisemblance −1."], ["M8", "Double validation des interventions sensibles chez les clients (quatre yeux, sessions enregistrées)", 3, "SS3 : gravité −1."], ["M9", "Remplacement des postes obsolètes", 4, "SS1 : vraisemblance −1."], ["M10", "Sensibilisation ciblée des salariés et des sous-traitants", 1, "Réduit un écart du socle (R5). Pas d'effet chiffré."], ["M11", "Validation à quatre yeux des changements de scripts de déploiement", 2, "SS3 : vraisemblance −1."], ["M12", "Cyber-assurance et responsabilité civile professionnelle (partage du risque)", 2, "Finance l'impact mais ne change ni G ni V."]], "alea": [["AL1", "Atelier 1", "Migration vers le cloud", "Synaptis migre une partie de sa plateforme de supervision dans le cloud. Ajoutez au périmètre l'hébergeur et ses accès, puis revoyez votre liste de biens supports."], ["AL2", "Atelier 1", "Audit d'un client", "Un client du secteur public exige la preuve d'un socle de sécurité. Ajoutez une ligne de socle « journalisation des sessions d'intervention » et notez son état."], ["AL3", "Atelier 2", "Attaque contre un concurrent", "Un rançongiciel a paralysé un prestataire concurrent. L'activité de SR2 passe à 4 (déjà au maximum). Justifiez le maintien du couple."], ["AL4", "Atelier 2", "Réorganisation des équipes", "Une réorganisation supprime plusieurs équipes d'exploitation. La motivation de SR4 augmente d'un niveau (maximum 4). Recalculez la pertinence."], ["AL5", "Atelier 3", "Rachat de clients", "Un groupe sans culture cyber rachète plusieurs clients de taille intermédiaire. La maturité de PP2 baisse d'un niveau. Recalculez."], ["AL6", "Atelier 3", "Alerte d'un CERT", "Une vulnérabilité critique touche l'outil de supervision. La maturité de PP1 baisse d'un niveau. Recalculez."], ["AL7", "Atelier 4", "Absence d'expert", "L'architecte de la plateforme est indisponible 10 minutes. Son équipe décrit un mode opératoire sans lui, puis le fait relire à son retour."], ["AL8", "Atelier 4", "Technique publiée", "Une méthode d'attaque sur les outils de supervision et les coffres de mots de passe est publiée. Réexaminez la vraisemblance de SS1 et justifiez votre cotation."], ["AL9", "Atelier 5", "Gel budgétaire", "Le budget passe de 14 à 11 points de budget. Refaites votre plan d'amélioration."], ["AL10", "Atelier 5", "Exigence de la direction", "Aucun risque de niveau Élevé ou Critique ne peut être accepté. Ajustez votre plan en conséquence."]], "ops": [["O1", "Exploiter", "Exfiltration lente et discrète des fichiers vers un serveur externe.", "BS4", "SS2"], ["O2", "Trouver", "Cartographie de la plateforme et liste des comptes à privilèges.", "BS6, BS3", "SS1"], ["O3", "Rentrer", "Accès au coffre avec le compte d'un sous-traitant complice.", "BS6", "SS3"], ["O4", "Rentrer", "Compromission d'un compte d'administration de l'hébergeur (mot de passe réutilisé).", "BS3", "SS2"], ["O5", "Exploiter", "Déni de service sur le site web commercial de Synaptis.", "Site web commercial", "aucune"], ["O6", "Connaître", "Recherche en sources ouvertes sur un client de taille intermédiaire : salariés, outils, accès.", "BS7", "SS1"], ["O7", "Exploiter", "Rebond vers les SI de plusieurs clients avec les accès légitimes, alertes inhibées.", "BS7", "SS3"], ["O8", "Connaître", "Écoute du Wi-Fi invité de l'accueil.", "Wi-Fi invité", "aucune"], ["O9", "Connaître", "Veille sur l'hébergeur cloud et ses administrateurs.", "BS3", "SS2"], ["O10", "Connaître", "Connaissance interne : coffre de mots de passe, procédures d'intervention, clients sensibles.", "BS10, BS1", "SS3"], ["O11", "Rentrer", "Hameçonnage d'un utilisateur chez un client, vol de sa session VPN.", "BS7", "SS1"], ["O12", "Rentrer", "Vol d'un ordinateur portable d'un commercial dans un train.", "Portable commercial", "aucune"], ["O13", "Trouver", "Repérage des volumes qui contiennent la base de configurations des clients.", "BS4", "SS2"], ["O14", "Exploiter", "Rançongiciel sur la plateforme et les postes, sauvegardes supprimées.", "BS2, BS3", "SS1"], ["O15", "Trouver", "Identification des clients sensibles et de leurs comptes privilégiés.", "BS1", "SS3"]], "roles": [], "ref": {"vmtab": {"VM1": {"bs": ["BS2", "BS3", "BS6", "BS7", "BS9", "BS10"], "crit": ["D"]}, "VM2": {"bs": ["BS3", "BS5", "BS6", "BS8"], "crit": ["D", "I"]}, "VM3": {"bs": ["BS3", "BS4", "BS8"], "crit": ["C"]}, "VM4": {"bs": ["BS1", "BS6", "BS7", "BS10"], "crit": ["I"]}, "VM5": {"bs": ["BS5"], "crit": ["I"]}}, "vmbs": {"BS1": ["VM4"], "BS2": ["VM1"], "BS3": ["VM1", "VM2", "VM3"], "BS4": ["VM3"], "BS5": ["VM2", "VM5"], "BS6": ["VM1", "VM2", "VM4"], "BS7": ["VM1", "VM4"], "BS8": ["VM2", "VM3"], "BS9": ["VM1"], "BS10": ["VM1", "VM4"]}, "cov": {"ER1": ["SR2"], "ER2": ["SR4"], "ER3": ["SR1", "SR5"], "ER4": ["SR4", "SR1"], "ER5": ["SR2"], "ER6": ["SR2"]}, "pert": {"SR1": [3, 4, 2], "SR2": [4, 3, 4], "SR3": [2, 2, 2], "SR4": [3, 3, 2], "SR5": [3, 3, 2], "SR6": [1, 1, 3]}, "ss": [{"id": "SS1", "title": "Rançongiciel propagé depuis un client", "chain": "SR2 Cybercriminel → Client PP2 compromis → rebond par le tunnel permanent vers notre plateforme → chiffrement de la plateforme et des postes", "srs": ["SR2"], "pp": "PP2", "er": "ER1", "G": 4, "crit": [1, 1, 1], "V": 3, "why": "A : Σ de SR2 = 11 ≥ 9. B : PP2 niveau 3,0, zone danger. C : R2 en écart (accès privilégiés et tunnels permanents) sur le chemin."}, {"id": "SS2", "title": "Vol de la base de configurations des clients via l'hébergeur", "chain": "SR1 Étatique ou SR5 Courtier → Hébergeur PP6 compromis → accès à la base de configurations → exfiltration", "srs": ["SR1", "SR5"], "pp": "PP6", "er": "ER3", "G": 3, "crit": [1, 0, 1], "V": 2, "why": "A : Σ de SR1 = 9 ≥ 9 (SR5 = 8 ne suffit pas, on retient la plus pertinente). B : PP6 niveau 1,5, zone contrôle seulement. C : R1 en écart (plateforme reliée au cloud sans cloisonnement des accès)."}, {"id": "SS3", "title": "Compromission de clients par un initié et un sous-traitant complice", "chain": "SR4 Initié + sous-traitant technique PP7 (compte du coffre) → récupération de comptes privilégiés → rebond vers les SI de plusieurs clients", "srs": ["SR4"], "pp": "PP7", "er": "ER4", "G": 4, "crit": [0, 1, 1], "V": 2, "why": "A : Σ de SR4 = 8 < 9. B : PP7 niveau 3,0, zone danger. C : R6 en écart (aucune détection sur les sessions d'intervention chez les clients) et R8 partielle (clauses avec les freelances)."}], "etapes": {"SS1": [{"op": "O6", "phase": "Connaître", "V": 4, "why": "aucun frein : sources ouvertes"}, {"op": "O11", "phase": "Rentrer", "V": 3, "why": "F2 : R5 partielle (hameçonnage d'un utilisateur chez un client, sensibilisation partielle) ; R2 en écart : pas de frein"}, {"op": "O2", "phase": "Trouver", "V": 3, "why": "F1 : il faut connaître l'architecture de la plateforme et les comptes à privilèges ; R1 et R6 en écart, pas de frein"}, {"op": "O14", "phase": "Exploiter", "V": 4, "why": "aucun frein : postes et serveurs obsolètes (R4 en écart), rançongiciel courant"}], "SS2": [{"op": "O9", "phase": "Connaître", "V": 4, "why": "aucun frein : sources ouvertes"}, {"op": "O4", "phase": "Rentrer", "V": 2, "why": "F3 : mot de passe réutilisé ET sans second facteur côté hébergeur ; F4 : l'hébergeur surveille les connexions d'administration"}, {"op": "O13", "phase": "Trouver", "V": 3, "why": "F1 : il faut savoir repérer les volumes de la base de configurations dans l'architecture cloud"}, {"op": "O1", "phase": "Exploiter", "V": 3, "why": "F1 : l'exfiltration lente et discrète demande du savoir-faire"}], "SS3": [{"op": "O10", "phase": "Connaître", "V": 4, "why": "aucun frein : l'initié connaît déjà le coffre de mots de passe, les procédures d'intervention et les clients sensibles"}, {"op": "O3", "phase": "Rentrer", "V": 2, "why": "F3 : complicité du sous-traitant ET contournement de l'expiration et de la validation des accès ; F4 : un administrateur ou la détection peut remarquer un accès inhabituel au coffre"}, {"op": "O15", "phase": "Trouver", "V": 4, "why": "aucun frein : l'initié sait quels clients sont sensibles et où sont leurs comptes"}, {"op": "O7", "phase": "Exploiter", "V": 3, "why": "F4 : le client ou un contrôle croisé peut remarquer une intervention hors planning"}]}, "meplan": {"PP2": 1, "PP7": 1}, "crit": ["BS3", "BS4", "BS6", "BS7"], "horsSujet": ["O5", "O8", "O12"], "danger": ["PP2", "PP7"]}, "hints": {"1": [["Ils listent des serveurs et des logiciels comme valeurs métier", "« Si vous changez de serveur, cet élément existe-t-il encore ? »", "« Que doit continuer à faire l'organisation même sans informatique ? »", "« Service d'infogérance rendu aux clients est une valeur métier ; Coffre de mots de passe et comptes à privilèges des clients est un bien support. »"], ["Ils écrivent « rançongiciel » ou « piratage » dans un ER", "« L'ER dit-il ce que veut l'attaquant ou ce que subit l'organisation ? »", "« Reformulez sans parler d'attaque : quelle atteinte (perte, altération, divulgation) de quelle valeur métier ? »", "« Plateforme de supervision et d'exploitation indisponible plus de 12 jours » est un ER ; « rançongiciel sur un système » n'en est pas un."], ["Ils cotent la gravité au ressenti (« c'est grave »)", "« Combien de jours d'arrêt ? Combien coûte un jour ? »", "« Le dossier donne 180 k€ par jour d'arrêt. »", "« 12 jours × 180 k€ = 2 160 k€, soit G4. »"], ["Ils hésitent entre G3 et G4 pour ER4", "« Quel est le critère qui s'applique : le coût chiffré, ou une atteinte qualitative (sécurité, conformité, survie) ? »", "« Relisez la définition de G4 dans l'échelle du dossier : elle ne se limite pas au montant. »", "« ER4 : Compromission de clients à travers nos propres accès → G4. »"], ["Ils notent le socle sans relire les constats", "« Quelle phrase du constat justifie votre état ? »", "« Écart : rien en place. Partiel : en place mais incomplet ou non testé. Conforme : en place et vérifié. »", "« R3 (Sauvegardes hors ligne de la plateforme et de la base de configurations, restauration testée) : partielle car la restauration n'a jamais été testée. R6 (Journalisation et détection sur la plateforme et sur les sessions d'intervention chez les clients) : aucune journalisation, donc Écart. »"], ["Ils se trompent sur le taux de conformité", "« Combien de points au total, sur combien de règles ? »", "« Conforme 1, Partiel 0,5, Écart 0. »", "« 2,5 points sur 8 règles : 2,5 ÷ 8 ≈ 31 %. »"], ["Un bien support n'est rattaché à aucune valeur métier", "« Si ce bien tombe, quelle valeur métier souffre ? »", "« Cherchez ce qui dépend de lui : flux, personnes, locaux, données. »", "« Le tableau de référence de l'atelier 1 (section précédente) donne le rattachement attendu ; une autre proposition est acceptée si elle est justifiée. »"], ["Désaccord entre joueurs sur une cotation", "« Chacun peut-il la justifier en une phrase ? »", "« Le RSSI tranche après écoute ; chaque joueur a un droit de contestation par atelier. »", "« Notez la cotation retenue et la raison : un désaccord argumenté vaut mieux qu'un consensus mou. »"]], "2": [["Ils confondent objectif visé et événement redouté", "« Est-ce ce que veut la source, ou ce que redoute l'organisation ? »", "« Un objectif : gagner de l'argent. Un ER : plateforme de supervision et d'exploitation indisponible plus de 12 jours. »", "« Le lien objectif → ER se fait à l'atelier 3. »"], ["Ils cotent toutes les sources de la même façon", "« Laquelle de ces deux sources est la plus active dans le secteur de l'organisation ? »", "« Utilisez toute l'échelle : 1 très faible, 4 très fort. »", "« SR6 (curieux) reste bas ; SR2 (rançongiciel) est haut sur l'activité. »"], ["Ils écartent l'initié parce que « ce n'est pas un hacker »", "« Que possède un salarié ou un intervenant interne qu'un attaquant externe n'a pas ? »", "« Des accès légitimes, la connaissance des procédures et des horaires. »", "« Ses ressources (R) montent à 3 : il n'a pas besoin d'outils. »"], ["Ils ne comprennent pas l'activité (A)", "« Combien d'attaques de ce type voit-on dans le secteur de l'organisation ? »", "« A mesure la fréquence observée, pas l'intérêt de la source. »", "« Les rançongiciels visant ce secteur sont très fréquents : A élevé. »"], ["Ils retiennent les 6 sources", "« Quel est le seuil de rétention ? »", "« Σ ≥ 8 retenu · 6 à 7 à surveiller · ≤ 5 écarté. »", "« La méthode sert à prioriser : une source à Σ = 5 sort de l'étude. »"], ["Un ER G3 ou G4 n'est atteint par aucun couple retenu", "« Qui pourrait agir sur le bien support de cet ER ? »", "« Regardez les sources à surveiller (6 à 7) ou relisez leurs R et A. »", "« ER4 (Compromission de clients à travers nos propres accès) : l'initié SR4 est le seul acteur plausible. »"], ["Ils demandent la « bonne » valeur M, R, A", "« Quelle phrase de la carte justifie votre chiffre ? »", "« Aucune valeur n'est imprimée : reliez chaque chiffre à l'échelle du dossier. »", "« Une cotation avec une phrase de justification vaut mieux qu'un chiffre « exact ». »"], ["Σ = 7 : retenu ou pas ?", "« Quel est le seuil ? »", "« 7 est à surveiller : on ne l'analyse pas maintenant. »", "« Un aléa peut le faire basculer (défi 2.1). »"]], "3": [["Ils ne savent pas lire la carte PP", "« Quels sont les quatre nombres imprimés ? Quelle est la formule ? »", "« D × P au numérateur (ce qui monte la menace), M × C au dénominateur (ce qui la baisse). »", "« PP2 : D3 P4 M2 C2 → 12 ÷ 4 = 3,0. »"], ["Ils inversent la maturité", "« Une PP très mûre est-elle plus ou moins dangereuse ? »", "« M est au dénominateur : quand M monte, le niveau baisse. »", "« PP7 (M1) est plus dangereuse que PP3 (M4), toutes choses égales. »"], ["Ils hésitent sur une zone (3,0 ou 1,5 pile)", "« Le seuil est-il « ≥ » ou « > » ? »", "« Danger ≥ 3 · contrôle de 1,5 à moins de 3 · veille < 1,5. »", "« PP2 = 3,0 : danger. PP7 = 3,0 : danger. PP6 = 1,5 : contrôle. »"], ["Ils passent par PP3 (Autorités et organismes de certification) parce qu'elle est « grosse »", "« Dans quelle zone est PP3 ? Quelle est sa pénétration ? »", "« Une forte dépendance ne suffit pas : PP3 a P2, M4, C4. »", "« Cherchez une PP en danger ou en contrôle qui a un accès au bien support de l'ER. »"], ["Ils ne trouvent pas la PP du chemin", "« Quel ER vise ce couple ? Quel bien support y mène ? Qui y a accès ? »", "« Lisez la description au dos de chaque carte PP. »", "« ER1 : PP2 (Clients de taille intermédiaire) ou PP1. ER3 : PP6 (Hébergeur cloud). ER4 : PP7 (Sous-traitants techniques et freelances). »"], ["Ils veulent passer par deux PP, ou par aucune", "« Une seule PP suffit-elle pour relier la source à l'ER ? »", "« Le second emplacement du couloir est facultatif ; sans relais, il n'y a pas de scénario d'écosystème. »", "« Gardez une PP ; ajoutez un second relais seulement si vous pouvez écrire pourquoi. »"], ["Ils cochent un critère sans preuve", "« Montrez-moi où c'est écrit. »", "« A : feuille 2 (Σ). B : radar. C : socle (feuille 1). »", "« SS1 : A : Σ de SR2 = 11 ≥ 9. B : PP2 niveau 3,0, zone danger. C : R2 en écart (accès privilégiés et tunnels permanents) sur le chemin. »"], ["Ils comptent C mais la règle ne concerne pas le chemin", "« Quelle étape du chemin cette règle protège-t-elle ? »", "« La règle doit couvrir un maillon du chemin. »", "« SS2 : R1 en écart (plateforme reliée au cloud sans cloisonnement des accès). SS3 : R6 en écart (aucune détection sur les sessions d'intervention chez les clients) et R8 partielle (clauses avec les freelances). »"], ["Ils inventent la gravité du scénario", "« D'où vient G ? »", "« De l'ER visé, jamais du scénario. »", "« SS1 → ER1 = G4. »"], ["Ils choisissent une ME qui n'agit pas sur la bonne variable", "« Quelle variable fait monter le niveau de cette PP ? »", "« Chaque ME agit sur une seule variable (tableau des leviers, section 5). »", "« PP2 : P4 forte, M2 et C2 faibles → ME3 (P), ME1 (M), ME2 (C). PP7 : M1 → ME7 (ou ME5 sur P). »"], ["La PP reste en danger après leur ME", "« Avez-vous recalculé ? Quel est le nouveau niveau ? »", "« Un niveau de 3,0 reste en danger : il faut passer sous 3. »", "« PP2 avec ME1 : M passe à 3, 12 ÷ (3 × 2) = 2,0 : sortie de la zone danger. »"], ["Ils font quatre scénarios (SR1 et SR5 séparés)", "« Même ER, même PP : combien de scénarios ? »", "« Un seul ; on garde la source la plus pertinente. »", "« SR1 (Σ 9) est plus pertinente que SR5 (Σ 8). »"], ["Ils ne voient pas à quoi sert une ME", "« Que voulez-vous obtenir sur le radar ? »", "« Faire sortir la PP de la zone danger sans attendre qu'elle devienne parfaite. »", "« Après ME1, PP2 passe de 3,0 à 2,0 : elle reste en contrôle, mais n'est plus un rebond facile. »"]], "4": [["Ils ne comprennent pas ce que sont les cartes noires", "« Combien de cartes noires ? Combien d'emplacements ? »", "« Les cartes noires sont les cartes Opération : 15 cartes pour 12 emplacements. »", "« Chaque carte porte une phase, une action et un bien visé. »"], ["Plusieurs cartes « Rentrer » paraissent possibles", "« Quelle PP traverse votre scénario ? Quel bien support est visé ? »", "« Une seule carte par phase correspond à votre scénario. »", "« SS1 : Clients de taille intermédiaire (BS7). SS2 : Hébergeur cloud (BS3). SS3 : Sous-traitants techniques et freelances (BS6). »"], ["Ils placent Exploiter avant Trouver, ou exfiltrent avant d'avoir repéré", "« Qu'a-t-on obtenu à l'étape précédente ? Peut-on agir sans cela ? »", "« Connaître → Rentrer → Trouver → Exploiter : chaque résultat rend le suivant possible. »", "« On n'exfiltre pas ce qu'on n'a pas localisé. »"], ["Ils ne repèrent pas les cartes hors sujet", "« Pour chaque carte restante, le bien visé est-il l'un des 10 biens supports ? »", "« Testez T1, puis T2 et T3. »", "« Site web commercial, Wi-Fi invité, Portable commercial : aucun n'est l'un des 10 biens supports. »"], ["Ils font la moyenne des V", "« Une chaîne résiste-t-elle mieux que son maillon le plus difficile ? »", "« V du scénario = la plus petite V des 4 étapes. »", "« SS1 : 4, 3, 3, 4 → V3. »"], ["Ils trouvent tous les biens supports critiques, ou aucun", "« Combien d'actions visent ce bien ? L'une est-elle un Rentrer ou un Exploiter ? »", "« Comptez sur les 12 cartes posées. Critique : au moins 2 actions dont un Rentrer ou un Exploiter. »", "« 4 biens supports répondent (BS3, BS4, BS6, BS7). »"], ["Leur V de l'atelier 4 diffère de celle de l'atelier 3", "« Qu'avez-vous appris en détaillant les actions ? »", "« C'est normal : l'atelier 4 affine. La V de l'atelier 4 remplace l'autre. »", "« Faites écrire la raison sur la feuille 2. »"], ["Ils veulent une action absente des cartes", "« Passe-t-elle les tests T1 à T4 ? »", "« Autorisée si elle est justifiée par les tests ; sinon utilisez la carte. »", "« Les chaînes de référence tiennent avec les cartes fournies. »"], ["Ils ne savent pas coter Pr", "« Quels obstacles réels l'attaquant rencontre-t-il pour cette action ? »", "« Chaque obstacle (compétences rares, conditions à réunir, règle du socle qui gêne, détection) baisse Pr d'un cran. »", "« SS1 Rentrer (hameçonnage de l'intégrateur) : sensibilisation partielle, un obstacle : Pr3. »"], ["Ils font une moyenne des Pr", "« L'attaquant doit-il réussir toutes les étapes ? »", "« Pr cumulée = min (Pr de l'action ; Pr cumulée précédente) : le maillon le plus faible fixe le niveau. »", "« Pr 4, 3, 2, 4 : cumulées 4, 3, 2, 2 ; vraisemblance V2, pas 3,25. »"]], "5": [["Ils ne savent pas d'où viennent G et V", "« Quel ER vise le scénario ? Quelle est la plus petite V de ses étapes ? »", "« G : feuille 1. V : feuille 2, atelier 4. »", "« SS1 : ER1 G4, V3 → 12 · SS2 : ER3 G3, V2 → 6 · SS3 : ER4 G4, V2 → 8. »"], ["Ils utilisent la V de l'atelier 3", "« Quelle V a été confirmée par le détail des étapes ? »", "« La V du scénario opérationnel remplace celle du scénario stratégique. »", "« SS1 : V3 dans les deux ateliers ; SS2 et SS3 : V2. »"], ["Ils dépassent les 14 points de budget", "« Combien de points de risque gagne-t-on par point de budget ? »", "« Classez les mesures par gain par point de budget. »", "« M7 : 2 points par point de budget ; M8 : 0,67 mais traite SS3 (G4). »"], ["Ils ne recalculent pas G ou V", "« Que dit la carte : G, V, ou les deux ? »", "« Écrivez G × V avant, puis après. »", "« M2 : SS1 V3 → V2. M3 : SS1 G4 → G3. »"], ["Ils cumulent M5 et ME1 + ME7", "« Ces deux lignes font-elles la même chose ? »", "« Elles agissent sur la maturité de PP2 et PP7. »", "« Ne les comptez pas deux fois. »"], ["Ils acceptent par dérogation un risque qui touche la sécurité des personnes", "« Quel scénario touche la sécurité des personnes ? Peut-on l'accepter par dérogation ? »", "« SS3 vise ER4 (G4). »", "« Ce risque ne s'accepte pas par dérogation : ajoutez une mesure avant la signature du DG. »"], ["Ils veulent accepter un risque sans condition", "« Qui est responsable ? Quel indicateur ? Quelle date de revue ? »", "« Reprenez le modèle de formulation. »", "« Responsable : le RSSI · indicateur mesurable · revue à 6 mois. »"], ["Ils proposent la cyber-assurance (M12) pour réduire un risque", "« Change-t-elle G ou V ? »", "« Elle partage le coût d'un sinistre, elle ne réduit rien. »", "« « Partager » est une stratégie, mais sans recalcul de G × V. »"], ["Un bien support critique n'est couvert par aucune mesure", "« Quelle mesure protège ce bien ? »", "« Sinon, le risque associé doit être accepté explicitement. »", "« BS4 (Base de configurations des clients) : M6 non retenue, donc SS2 accepté. »"], ["Le budget n'est pas utilisé", "« Un risque élevé subsiste-t-il ? »", "« Le budget est un plafond, pas une obligation. »", "« Plan de référence : 13 points de budget sur 14. »"]]}, "v2": {"tuto": {"a1": {"titre": "Atelier 1 · Cadrage et socle de sécurité", "duree": 50, "obj": "Dire ce qui compte pour Synaptis Services (valeurs métier), ce qui le porte (biens supports), ce qui serait grave (événements redoutés, leur gravité) et où en est la sécurité de base (socle).", "besoin": [["Plateau", "Feuille 1 (moitié droite du plateau, en haut à gauche) : tableau valeurs métier / biens supports, gravité des événements redoutés, socle."], ["Cartes", "Deck bleu ENTREPRISE (21 cartes : 5 valeurs métier VM, 10 biens supports BS, 6 événements redoutés ER). Mettez les 6 cartes ER de côté, FACE CACHÉE."], ["À côté de vous", "Le dossier de scénario (constats d'audit, coût d'un jour d'arrêt : 180 k€) et les échelles (bouton « Documents »)."]], "etapes": [["0–3", "Se préparer", "Sortez le deck bleu. Séparez les 6 cartes ER et posez-les face cachée au centre : personne ne les retourne avant l'étape « Calcul ».", "Cartes bleues"], ["3–13", "Lire les valeurs métier et les biens supports", "Chacun lit à voix haute 2 ou 3 cartes VM puis BS. Une valeur métier est ce que l'entreprise doit protéger pour vivre (processus, information, savoir-faire) ; un bien support est ce sur quoi elle repose (matériel, logiciel, locaux, personnes).", "Cartes bleues VM et BS"], ["13–25", "Relier valeurs métier et biens supports", "Pour chaque VM, demandez-vous : « si cette valeur est atteinte, quels biens supports sont touchés ? ». Écrivez leurs codes BS sur la feuille 1, dans la colonne « Biens supports associés », puis le critère le plus sensible de la VM : D (disponibilité), I (intégrité) ou C (confidentialité). Dans l'appli : étape 1, une carte par VM.", "Feuille 1, tableau du haut"], ["25–29", "Estimer les gravités (sans les chiffres)", "Chacun écrit en silence G1 à G4 pour chacun des 6 ER, d'après le titre seul et l'échelle de gravité. Comparez ensuite à voix haute. Dans l'appli : étape 2.", "Appli (estimation) + feuille 1"], ["29–38", "Calculer les gravités", "Retournez les cartes ER. Pour chaque ER : jours d'arrêt × 180 k€ par jour, puis lisez l'échelle. Si le résultat diffère de votre estimation, écrivez en une phrase ce que le titre ne montrait pas. Les ER qui touchent la sécurité des personnes sont G4 par nature.", "Feuille 1, grille des ER"], ["38–46", "Noter le socle de sécurité", "Pour chacune des 8 règles R1 à R8, lisez le constat d'audit (dossier de scénario) et choisissez Conforme (1 point), Partiel (0,5) ou Écart (0). Calculez le taux : total des points ÷ 8.", "Feuille 1 bis (socle)"], ["46–50", "Aléa puis vérification", "Tirez la carte Aléa de l'atelier (bouton de l'appli) : écrivez dans le bloc violet de la feuille ce qui change. Cliquez sur « Vérifier » dans chaque étape : l'appli garde vos bonnes réponses, met ✘ sur les autres avec une courte explication, et vous laisse corriger.", "Appli"]], "appli": ["Chaque étape a un bouton « Vérifier » : ✔ juste (la réponse est conservée), ✘ à revoir avec une courte explication. Vous modifiez vos choix et revérifiez. Après 3 essais infructueux sur une même vérification, la solution est proposée avec ses explications (les points de cette vérification ne montent plus).", "Bloqué ? Le bouton « Aide » donne d'abord une question gratuite ; indice et réponse sont illimités, mais chacun coûte 1 point de pénalité (noté à votre nom ; la table voit le total)."], "controle": ["Chaque valeur métier a au moins un bien support, et chaque bien support apparaît dans au moins une valeur métier.", "Aucun ER ne décrit une attaque : il décrit une atteinte (disponibilité, intégrité ou confidentialité) et son impact.", "Chaque ER a une estimation écrite avant le calcul, un calcul écrit, et une phrase explique chaque écart.", "Les 8 règles du socle sont notées et le taux est calculé.", "Le bloc « Après l'aléa » est rempli."], "pieges": ["Prendre un événement (« arrêt de production ») pour une valeur métier.", "Décrire l'attaque dans l'ER.", "Oublier les personnes et les locaux comme biens supports.", "Coter une gravité sans calcul."], "exemple": "Exemple hors jeu (boulangerie) : valeur métier « Vente du jour ». Si elle est atteinte, sont touchés : la caisse enregistreuse, le logiciel de commande en ligne et le four connecté → on écrit ces trois biens supports en face de « Vente du jour ». Critère le plus sensible : D (disponibilité), car sans caisse on ne vend plus.", "objs": ["Cadrer l'étude : dire ce qui compte pour l'entreprise (valeurs métier) et sur quoi cela repose (biens supports).", "Identifier les événements redoutés (ER) et estimer puis calculer leur GRAVITÉ. Cette gravité sera reprise telle quelle à l'atelier 5 (risque = gravité × vraisemblance).", "Évaluer le socle de sécurité : où l'entreprise est conforme, partielle ou en écart. C'est ce socle qui rendra les attaques plus ou moins faciles à l'atelier 4.", "Poser le cadre commun de la table : vocabulaire, échelles, documents."]}, "a2": {"titre": "Atelier 2 · Sources de risque", "duree": 40, "obj": "Décider quelles sources de risque (qui voudrait nous nuire, et pourquoi) méritent d'être étudiées, puis vérifier qu'aucun événement redouté grave n'est laissé sans source.", "besoin": [["Plateau", "Feuille 2, partie haute : tableau de cotation M / R / A / Σ, puis contrôle de couverture."], ["Cartes", "Deck rouge MENACE (6 cartes SR : un profil et un objectif visé). Aucune cotation n'est imprimée."], ["À côté de vous", "Les échelles M / R / A (bouton « Documents », rubrique Échelles), la calculatrice."]], "etapes": [["0–8", "Lire les cartes rouges", "Chacun lit à voix haute une ou deux cartes SR. Discutez du profil : qui est-ce, que veut-il ?", "Cartes rouges"], ["8–20", "Coter M, R et A", "Pour chaque source, cotez de 1 à 4 : M motivation, R ressources, A activité (fréquence observée), avec les échelles du dossier. Justifiez chaque cote en une phrase. Calculez Σ = M + R + A. Σ ≥ 8 : retenu ; 6 ou 7 : à surveiller ; 5 ou moins : écarté. Dans l'appli : le Σ et la décision s'affichent tout seuls.", "Feuille 2, tableau M/R/A"], ["20–26", "Aléa", "Tirez la carte Aléa de l'atelier. Recotez la source concernée et écrivez dans le bloc violet pourquoi vous maintenez ou changez votre décision.", "Appli + feuille 2"], ["26–36", "Contrôle de couverture", "Seules les sources RETENUES (Σ ≥ 8) comptent. Pour chaque ER de gravité G3 ou G4, demandez-vous : « une source retenue peut-elle provoquer cet événement ? ». Oui : l'ER est COUVERT. Non : c'est un ANGLE MORT, vous retenez une source de plus ou vous revoyez une cotation. Dans l'appli : étape 2.", "Feuille 2, bas du tableau"], ["36–40", "Vérifier", "Cliquez sur « Vérifier » (cotations puis couverture).", "Appli"]], "appli": ["Le Σ, la couleur de décision et la liste des sources retenues se calculent seuls.", "Le contrôle de couverture ne propose que les sources retenues et vous dit tout de suite : ✔ couvert ou ✘ angle mort."], "controle": ["Chaque cotation M, R, A est justifiée en une phrase.", "Σ est calculé et la décision (retenu, à surveiller, écarté) est entourée.", "Chaque ER de gravité G3 ou G4 est couvert par au moins une source retenue.", "Une source à surveiller ou écartée n'a jamais été comptée comme couvrant un ER.", "Le bloc « Après l'aléa » est rempli."], "pieges": ["Compter une source « à surveiller » comme couvrante.", "Coter sans justifier.", "Oublier un ER grave : un angle mort veut dire qu'un risque majeur ne sera jamais étudié."], "exemple": "Couvert, c'est quoi ? Imaginez un ER « Fuite des plans » (G3). Si la seule source retenue est un hacktiviste qui veut faire du bruit, personne ne cherche à voler les plans : l'ER est un angle mort. Il faut alors retenir la source « concurrent » (Σ ≥ 8) ou revoir sa cotation.", "objs": ["Identifier les sources de risque (SR) et ce qu'elles visent (objectif visé).", "Évaluer la PERTINENCE de chaque source : motivation, ressources, activité (Σ = M + R + A).", "Retenir les sources prioritaires (Σ ≥ 8) et mettre les autres sous surveillance ou de côté.", "Contrôler que chaque événement redouté grave est couvert par au moins une source retenue."]}, "a3": {"titre": "Atelier 3 · Écosystème et scénarios stratégiques", "duree": 55, "obj": "Repérer quelles parties prenantes (fournisseurs, prestataires, clients : la chaîne d'approvisionnement, ou supply chain) peuvent servir de rebond à une source de risque, bâtir 3 scénarios stratégiques (source → partie prenante → événement redouté) et réduire la menace par des mesures d'écosystème.", "besoin": [["Plateau", "Zone ③ : trois couloirs SS1 à SS3 (cartes SR → PP → ER), cadre des mesures d'écosystème, et feuille 3 : radar des parties prenantes, scénarios stratégiques."], ["Cartes", "Deck vert ÉCOSYSTÈME (8 cartes PP : D, P, M, C imprimés) et deck vert foncé MESURE ÉCOSYSTÈME (8 cartes ME). Réutilisez les cartes SR retenues (atelier 2) et les cartes ER (atelier 1)."], ["À côté de vous", "Calculatrice, échelles D, P, M, C (bouton « Documents »)."]], "etapes": [["0–13", "Calculer le niveau de menace des parties prenantes", "Pour chaque carte verte : niveau = (D × P) ÷ (M × C). Écrivez D × P, puis M × C, puis le quotient. Zone : danger si ≥ 3 ; contrôle de 1,5 à moins de 3 ; veille en dessous de 1,5. Cochez la zone sur le radar de la feuille 3. Dans l'appli : saisissez votre niveau, l'appli le compare au calcul exact.", "Feuille 3, radar"], ["13–16", "Aléa", "Tirez la carte Aléa. Recalculez la partie prenante concernée et écrivez les conséquences dans le bloc violet.", "Appli + feuille 3"], ["16–35", "Construire les 3 scénarios stratégiques", "Pour chaque scénario SS : ① choisissez un ER grave ; ② choisissez la source RETENUE qui peut le provoquer ; ③ choisissez la partie prenante qui sert de relais (de préférence en zone danger) ; ④ posez les 3 cartes SR → PP → ER dans le couloir ; ⑤ vérifiez que le couple source/objectif (SR/OV) retenu à l'atelier 2 mène bien à cet ER. La gravité du scénario est celle de l'ER ; la vraisemblance n'est pas estimée ici : conformément à la méthode officielle (EBIOS RM), elle l'est à l'atelier 4.", "Zone ③ couloirs ; feuille 3"], ["35–50", "Choisir les mesures d'écosystème", "Pour chaque PP en zone danger, choisissez au moins une carte ME. Chaque ME change UNE variable de 1. Recalculez le niveau et la zone. Notez le coût en points de budget : il sera retiré des 14 points de budget de l'atelier 5.", "Zone ③ mesures ; feuille 3"], ["50–55", "Vérifier", "Cliquez sur « Vérifier » dans chaque étape.", "Appli"]], "appli": ["Le calculateur libre (D, P, M, C) vous aide sans remplacer le calcul écrit.", "La gravité de chaque scénario est reprise de l'ER ; la vraisemblance sera estimée à l'atelier 4."], "controle": ["Chaque niveau de menace est calculé par écrit (D × P, M × C, quotient) et la zone est cochée.", "Chaque scénario part d'une source retenue, passe par une partie prenante et finit sur un ER ; sa gravité est celle de l'ER.", "Pour chaque scénario, vous savez dire quel couple SR/OV retenu l'alimente et quel ER il vise.", "Chaque partie prenante en danger a une mesure d'écosystème avec recalcul.", "Le bloc « Après l'aléa » est rempli."], "pieges": ["Inverser le quotient : (D × P) ÷ (M × C), pas l'inverse.", "Arrondir trop tôt : gardez 2 décimales.", "Choisir une source écartée ou à surveiller pour un scénario."], "exemple": "Exemple hors jeu : D 3, P 4, M 1, C 3. D × P = 12 ; M × C = 3 ; niveau = 12 ÷ 3 = 4,0 → zone danger (≥ 3).", "objs": ["Cartographier l'écosystème : les parties prenantes (PP) qui peuvent servir de rebond.", "Évaluer le niveau de menace de chaque partie prenante : (D × P) ÷ (M × C).", "Construire 3 scénarios stratégiques (source → partie prenante → événement redouté) et les évaluer.", "Choisir des mesures d'écosystème pour toute partie prenante en zone danger (menace ≥ 3) : l'objectif est de repasser sous 3 au moindre coût."]}, "a4": {"titre": "Atelier 4 · Scénarios opérationnels", "duree": 55, "obj": "Détailler comment une attaque se déroule réellement, en quatre actions (Connaître, Rentrer, Trouver, Exploiter), pour chacun de vos 3 scénarios stratégiques, mesurer sa vraisemblance et repérer les biens supports critiques.", "besoin": [["Plateau", "Zone ④ : 3 chaînes de 4 emplacements (Connaître, Rentrer, Trouver, Exploiter) et feuille 2, partie basse : cotation des étapes, actions écartées, tests T1 à T4, biens supports critiques."], ["Cartes", "Deck noir OPÉRATION (15 cartes : phase, action, bien visé), mélangées : certaines ne servent à rien. Posez 4 cartes par chaîne (12 au total) ; les 3 restantes seront écartées. Gardez les cartes bleues BS sous la main."], ["À côté de vous", "Fiche méthode « vraisemblance » (page de méthode de l'atelier dans l'appli), feuille 3 et feuille 1."]], "etapes": [["0–8", "Lire les cartes noires", "Lisez les 15 cartes Opération et relisez vos 3 scénarios stratégiques (feuille 3).", "Cartes noires ; feuille 3"], ["8–25", "Poser les actions dans les 3 chaînes", "Pour chaque scénario, posez 4 actions dans l'ordre Connaître → Rentrer → Trouver → Exploiter (la méthode officielle ne fixe pas de sens de construction : astuce, fixez d'abord la dernière action, celle qui touche l'ER visé, puis remontez). Chaque action doit rendre la suivante possible : écrivez pourquoi. Dans l'appli : un menu par phase.", "Zone ④ ; feuille 2 (bas)"], ["25–28", "Aléa", "Tirez la carte Aléa : réexaminez vos chaînes et votre vraisemblance, écrivez le résultat dans le bloc violet.", "Appli"], ["28–40", "Écarter les actions inutiles", "Une carte est écartée si elle échoue à un test : T1 bien connu (est-il l'un des 10 biens supports de l'atelier 1 ?), T2 valeur métier (soutient-il une VM ?), T3 chemin vers un ER (sert-il un de vos 3 scénarios ?), T4 enchaînement (permet-il l'action suivante ?). Écartez 3 cartes et justifiez.", "Zone ④ « actions écartées »"], ["40–50", "Coter les étapes", "Pour chaque action posée, répondez aux questions de l'appli (compétences, conditions à réunir, règle du socle de l'atelier 1, détection), puis cotez la probabilité de succès Pr de 1 (faible) à 4 (quasi certaine). Pr cumulée = min (Pr de l'action ; Pr cumulée de l'action précédente) ; la première action garde sa Pr. La vraisemblance du scénario est la Pr cumulée de la dernière action : elle remplace la V de l'atelier 3. Exemple : Pr 4, 3, 2, 4 donnent des cumulées 4, 3, 2, 2 ; V du scénario = 2. Ce n'est pas une moyenne.", "Feuille 2, atelier 4"], ["50–55", "Biens supports critiques", "Comptez les actions par bien support. Un BS est critique s'il est visé par au moins 2 actions dont au moins 1 Rentrer ou Exploiter. Cliquez sur « Vérifier ».", "Feuille 2, ligne BS critiques"]], "appli": ["Les menus de l'appli reprennent les cartes noires : choisissez la carte posée.", "Pr cumulée et V du scénario se calculent à mesure que vous cotez Pr. Une étape de méthode avec exercices ouvre l'atelier."], "controle": ["Chaque chaîne a exactement 4 actions, une par phase, dans le bon ordre.", "Chaque action est justifiée : pourquoi suit-elle la précédente ?", "Chaque carte écartée échoue à un test, que vous savez nommer.", "Chaque action a sa Pr justifiée par les questions ; la V du scénario est la dernière Pr cumulée (la plus petite).", "Les biens supports critiques sont notés avec le décompte de leurs actions."], "pieges": ["Mettre deux actions de la même phase dans une chaîne.", "Cote Pr sans pouvoir justifier chaque obstacle ; faire une moyenne au lieu d'un minimum.", "Oublier que la V de l'atelier 4 remplace celle de l'atelier 3."], "exemple": "Exemple : si la règle du socle qui couvre l'étape est Conforme ou Partielle, c'est un obstacle pour l'attaquant et Pr baisse d'un cran ; si elle est en Écart, ce n'est pas un obstacle.", "objs": ["Construire les scénarios opérationnels : les chemins d'attaque en quatre phases (Connaître, Rentrer, Trouver, Exploiter).", "Identifier les cibles techniques : les biens supports visés par les actions, et ceux qui sont critiques.", "Évaluer la VRAISEMBLANCE de chaque scénario : plus la source est motivée et outillée (atelier 2) et plus le socle a d'écarts (atelier 1), plus l'attaque est facile. Méthode ANSSI « standard » simplifiée : chaque action reçoit une probabilité de succès Pr de 1 à 4 ; la Pr cumulée d'une action est le minimum entre sa Pr et la Pr cumulée de l'action précédente ; la vraisemblance du scénario est la Pr cumulée de la dernière action.", "Préparer le niveau de risque brut : gravité (atelier 1) × vraisemblance, qui sera placé dans la matrice à l'atelier 5."]}, "a5": {"titre": "Atelier 5 · Traitement du risque", "duree": 40, "obj": "Choisir un plan de traitement sous budget (14 points) pour ramener chaque scénario au seuil d'acceptation, formuler les risques résiduels et faire signer la décision au directeur général.", "besoin": [["Plateau", "Zone ⑤ : emplacements des mesures et feuille 4 : matrice G × V, budget, avant / après traitement, décision du DG, risque résiduel."], ["Cartes", "Deck orange MESURE (12 cartes : coût et effet) et cartes ME retenues à l'atelier 3, à poser sur les emplacements."], ["Budget", "14 points de budget à répartir (coûts écrits sur la feuille 4). La matrice G × V de la feuille 4 reçoit deux valeurs par scénario : avant traitement, après traitement."], ["À côté de vous", "Calculatrice. G vient de la feuille 1, V de l'atelier 4."]], "etapes": [["0–5", "Placer les scénarios dans la matrice", "Pour chaque SS : G (gravité de l'ER visé, atelier 1) × V (vraisemblance du scénario opérationnel, atelier 4). Écrivez G × V dans la colonne « avant traitement » de la matrice (feuille 4). Niveaux : Faible ≤ 3, Moyen 4 à 6, Élevé 8 à 9, Critique ≥ 12.", "Zone ⑤ matrice ; feuille 4"], ["5–20", "Construire le plan sous budget", "Choisissez des mesures (cartes orange et ME) dans la limite de 14 points de budget. Lisez l'effet de chaque carte (« vraisemblance −1 » ou « gravité −1 »), recalculez G × V et écrivez-le dans la colonne « après traitement ». Objectif : chaque scénario à G × V ≤ 6. Deux mesures qui font la même chose ne se cumulent pas.", "Zone ⑤ PACS et budget"], ["20–25", "Aléa", "Tirez la carte Aléa : refaites le plan sous la nouvelle contrainte, dans le bloc violet.", "Appli"], ["25–34", "Risque résiduel et acceptation", "Un scénario encore au-dessus de 6 reçoit une mesure en plus, ou une dérogation signée du DG avec un responsable, un indicateur et une date de revue. Si un ER touche la sécurité des personnes, le risque résiduel n'est jamais accepté par dérogation : la table ajoute une mesure.", "Zone ⑤ acceptation"], ["34–40", "Vérifier", "Cliquez sur « Vérifier le plan ». Le DG signe la décision sur la feuille 4.", "Appli + feuille 4"]], "appli": ["Le coût du plan s'additionne en direct et vous prévient si le budget est dépassé.", "La dérogation du DG (responsable, indicateur, date) se saisit sous chaque scénario encore trop haut."], "controle": ["Le total des coûts ne dépasse pas 14 points de budget.", "Chaque scénario est à G × V ≤ 6, ou une dérogation signée du DG est écrite.", "Pour chaque mesure, G ou V a été recalculé par écrit.", "Chaque risque accepté a un responsable, un indicateur et une date de revue.", "Le plan s'appuie sur les écarts du socle (atelier 1).", "Chaque bien support critique (atelier 4) est protégé, ou son risque est accepté explicitement."], "pieges": ["Dépasser le budget.", "Utiliser la V de l'atelier 3 au lieu de celle de l'atelier 4.", "Cumuler deux mesures équivalentes (M et ME)."], "exemple": "Exemple : G4 × V2 = 8 (Élevé). Une mesure « vraisemblance −1 » donne G4 × V1 = 4 (Moyen) : sous le seuil de 6.", "objs": ["Placer chaque scénario dans la matrice avec son risque brut : G × V (G vient de l'atelier 1, V de l'atelier 4).", "Choisir un plan de traitement sous budget et recalculer le risque résiduel.", "Comparer chaque risque résiduel au seuil d'acceptation (G × V ≤ 6) : sinon, mesure en plus ou dérogation signée du DG.", "Formaliser la décision : responsable, indicateur, date de revue."]}, "deb": {"titre": "Débrief et bilan", "duree": 30, "obj": "Comparer votre analyse à celle des autres tables, comprendre les écarts avec la méthode officielle et repartir avec une action concrète.", "besoin": [["Plateau", "Bas de la feuille 4 : bilan de la journée et questions de débrief."], ["Cartes", "Aucune."], ["À côté de vous", "Votre dossier d'analyse (généré par l'appli)."]], "etapes": [["0–5", "Présenter votre résultat", "Score, risque le plus critique, plus grande divergence avec les autres tables.", "Écran de la classe"], ["5–17", "Comparer les tables", "Valeurs métier, couples retenus, plans de traitement : l'enseignant projette le comparatif.", "Tableau comparatif"], ["17–25", "Retour sur la méthode officielle", "Écarts entre les échelles du jeu et celles du guide EBIOS RM de l'ANSSI.", "Guide ANSSI"], ["25–30", "Ce que je fais lundi", "Écrivez une action concrète pour votre entreprise ou votre stage. Générez ensuite votre dossier.", "Appli"]], "appli": ["Votre dossier d'analyse (PDF) rassemble vos résultats et les photos de votre plateau."], "controle": ["Chaque joueur a écrit son action « lundi »."], "pieges": [], "objs": ["Comparer vos résultats à ceux des autres tables.", "Repérer les notions fragiles.", "Décider d'une action concrète pour lundi."]}}, "tutoB": {"a1": [["p", "b", "Dire ce qui compte pour Synaptis Services (valeurs métier), ce qui le porte (biens supports), ce qui serait grave (événements redoutés, leur gravité) et où en est la sécurité de base (socle)."], ["p", "h3", "Les objectifs de l'atelier"], ["p", "bl", "Cadrer l'étude : dire ce qui compte pour l'entreprise (valeurs métier) et sur quoi cela repose (biens supports)."], ["p", "bl", "Identifier les événements redoutés (ER) et estimer puis calculer leur GRAVITÉ. Cette gravité sera reprise telle quelle à l'atelier 5 (risque = gravité × vraisemblance)."], ["p", "bl", "Évaluer le socle de sécurité : où l'entreprise est conforme, partielle ou en écart. C'est ce socle qui rendra les attaques plus ou moins faciles à l'atelier 4."], ["p", "bl", "Poser le cadre commun de la table : vocabulaire, échelles, documents."], ["p", "h3", "Ce dont vous avez besoin"], ["t", [["", ""], ["<b>Plateau</b>", "Feuille 1 (moitié droite du plateau, en haut à gauche) : tableau valeurs métier / biens supports, gravité des événements redoutés, socle."], ["<b>Cartes</b>", "Deck bleu ENTREPRISE (21 cartes : 5 valeurs métier VM, 10 biens supports BS, 6 événements redoutés ER). Mettez les 6 cartes ER de côté, FACE CACHÉE."], ["<b>À côté de vous</b>", "Le dossier de scénario (constats d'audit, coût d'un jour d'arrêt : 180 k€) et les échelles (bouton « Documents »)."]]], ["p", "h3", "Pas à pas (durées conseillées en minutes)"], ["t", [["Min", "Ce que vous faites", "Où"], ["0–3", "<b>Se préparer.</b> Sortez le deck bleu. Séparez les 6 cartes ER et posez-les face cachée au centre : personne ne les retourne avant l'étape « Calcul ».", "Cartes bleues"], ["3–13", "<b>Lire les valeurs métier et les biens supports.</b> Chacun lit à voix haute 2 ou 3 cartes VM puis BS. Une valeur métier est ce que l'entreprise doit protéger pour vivre (processus, information, savoir-faire) ; un bien support est ce sur quoi elle repose (matériel, logiciel, locaux, personnes).", "Cartes bleues VM et BS"], ["13–25", "<b>Relier valeurs métier et biens supports.</b> Pour chaque VM, demandez-vous : « si cette valeur est atteinte, quels biens supports sont touchés ? ». Écrivez leurs codes BS sur la feuille 1, dans la colonne « Biens supports associés », puis le critère le plus sensible de la VM : D (disponibilité), I (intégrité) ou C (confidentialité). Dans l'appli : étape 1, une carte par VM.", "Feuille 1, tableau du haut"], ["25–29", "<b>Estimer les gravités (sans les chiffres).</b> Chacun écrit en silence G1 à G4 pour chacun des 6 ER, d'après le titre seul et l'échelle de gravité. Comparez ensuite à voix haute. Dans l'appli : étape 2.", "Appli (estimation) + feuille 1"], ["29–38", "<b>Calculer les gravités.</b> Retournez les cartes ER. Pour chaque ER : jours d'arrêt × 180 k€ par jour, puis lisez l'échelle. Si le résultat diffère de votre estimation, écrivez en une phrase ce que le titre ne montrait pas. Les ER qui touchent la sécurité des personnes sont G4 par nature.", "Feuille 1, grille des ER"], ["38–46", "<b>Noter le socle de sécurité.</b> Pour chacune des 8 règles R1 à R8, lisez le constat d'audit (dossier de scénario) et choisissez Conforme (1 point), Partiel (0,5) ou Écart (0). Calculez le taux : total des points ÷ 8.", "Feuille 1 bis (socle)"], ["46–50", "<b>Aléa puis vérification.</b> Tirez la carte Aléa de l'atelier (bouton de l'appli) : écrivez dans le bloc violet de la feuille ce qui change. Cliquez sur « Vérifier » dans chaque étape : l'appli garde vos bonnes réponses, met ✘ sur les autres avec une courte explication, et vous laisse corriger.", "Appli"]]], ["p", "note", "Exemple hors jeu (boulangerie) : valeur métier « Vente du jour ». Si elle est atteinte, sont touchés : la caisse enregistreuse, le logiciel de commande en ligne et le four connecté → on écrit ces trois biens supports en face de « Vente du jour ». Critère le plus sensible : D (disponibilité), car sans caisse on ne vend plus."], ["p", "h3", "Dans l'appli"], ["p", "bl", "Chaque étape a un bouton « Vérifier » : ✔ juste (la réponse est conservée), ✘ à revoir avec une courte explication. Vous modifiez vos choix et revérifiez. Après 3 essais infructueux sur une même vérification, la solution est proposée avec ses explications (les points de cette vérification ne montent plus)."], ["p", "bl", "Bloqué ? Le bouton « Aide » donne d'abord une question gratuite ; indice et réponse sont illimités, mais chacun coûte 1 point de pénalité (noté à votre nom ; la table voit le total)."], ["p", "h3", "Avant de passer à la suite : auto-contrôle"], ["p", "bl", "☐ Chaque valeur métier a au moins un bien support, et chaque bien support apparaît dans au moins une valeur métier."], ["p", "bl", "☐ Aucun ER ne décrit une attaque : il décrit une atteinte (disponibilité, intégrité ou confidentialité) et son impact."], ["p", "bl", "☐ Chaque ER a une estimation écrite avant le calcul, un calcul écrit, et une phrase explique chaque écart."], ["p", "bl", "☐ Les 8 règles du socle sont notées et le taux est calculé."], ["p", "bl", "☐ Le bloc « Après l'aléa » est rempli."], ["p", "h3", "Pièges fréquents"], ["p", "bl", "Prendre un événement (« arrêt de production ») pour une valeur métier."], ["p", "bl", "Décrire l'attaque dans l'ER."], ["p", "bl", "Oublier les personnes et les locaux comme biens supports."], ["p", "bl", "Coter une gravité sans calcul."]], "a2": [["p", "b", "Décider quelles sources de risque (qui voudrait nous nuire, et pourquoi) méritent d'être étudiées, puis vérifier qu'aucun événement redouté grave n'est laissé sans source."], ["p", "h3", "Les objectifs de l'atelier"], ["p", "bl", "Identifier les sources de risque (SR) et ce qu'elles visent (objectif visé)."], ["p", "bl", "Évaluer la PERTINENCE de chaque source : motivation, ressources, activité (Σ = M + R + A)."], ["p", "bl", "Retenir les sources prioritaires (Σ ≥ 8) et mettre les autres sous surveillance ou de côté."], ["p", "bl", "Contrôler que chaque événement redouté grave est couvert par au moins une source retenue."], ["p", "h3", "Ce dont vous avez besoin"], ["t", [["", ""], ["<b>Plateau</b>", "Feuille 2, partie haute : tableau de cotation M / R / A / Σ, puis contrôle de couverture."], ["<b>Cartes</b>", "Deck rouge MENACE (6 cartes SR : un profil et un objectif visé). Aucune cotation n'est imprimée."], ["<b>À côté de vous</b>", "Les échelles M / R / A (bouton « Documents », rubrique Échelles), la calculatrice."]]], ["p", "h3", "Pas à pas (durées conseillées en minutes)"], ["t", [["Min", "Ce que vous faites", "Où"], ["0–8", "<b>Lire les cartes rouges.</b> Chacun lit à voix haute une ou deux cartes SR. Discutez du profil : qui est-ce, que veut-il ?", "Cartes rouges"], ["8–20", "<b>Coter M, R et A.</b> Pour chaque source, cotez de 1 à 4 : M motivation, R ressources, A activité (fréquence observée), avec les échelles du dossier. Justifiez chaque cote en une phrase. Calculez Σ = M + R + A. Σ ≥ 8 : retenu ; 6 ou 7 : à surveiller ; 5 ou moins : écarté. Dans l'appli : le Σ et la décision s'affichent tout seuls.", "Feuille 2, tableau M/R/A"], ["20–26", "<b>Aléa.</b> Tirez la carte Aléa de l'atelier. Recotez la source concernée et écrivez dans le bloc violet pourquoi vous maintenez ou changez votre décision.", "Appli + feuille 2"], ["26–36", "<b>Contrôle de couverture.</b> Seules les sources RETENUES (Σ ≥ 8) comptent. Pour chaque ER de gravité G3 ou G4, demandez-vous : « une source retenue peut-elle provoquer cet événement ? ». Oui : l'ER est COUVERT. Non : c'est un ANGLE MORT, vous retenez une source de plus ou vous revoyez une cotation. Dans l'appli : étape 2.", "Feuille 2, bas du tableau"], ["36–40", "<b>Vérifier.</b> Cliquez sur « Vérifier » (cotations puis couverture).", "Appli"]]], ["p", "note", "Couvert, c'est quoi ? Imaginez un ER « Fuite des plans » (G3). Si la seule source retenue est un hacktiviste qui veut faire du bruit, personne ne cherche à voler les plans : l'ER est un angle mort. Il faut alors retenir la source « concurrent » (Σ ≥ 8) ou revoir sa cotation."], ["p", "h3", "Dans l'appli"], ["p", "bl", "Le Σ, la couleur de décision et la liste des sources retenues se calculent seuls."], ["p", "bl", "Le contrôle de couverture ne propose que les sources retenues et vous dit tout de suite : ✔ couvert ou ✘ angle mort."], ["p", "h3", "Avant de passer à la suite : auto-contrôle"], ["p", "bl", "☐ Chaque cotation M, R, A est justifiée en une phrase."], ["p", "bl", "☐ Σ est calculé et la décision (retenu, à surveiller, écarté) est entourée."], ["p", "bl", "☐ Chaque ER de gravité G3 ou G4 est couvert par au moins une source retenue."], ["p", "bl", "☐ Une source à surveiller ou écartée n'a jamais été comptée comme couvrant un ER."], ["p", "bl", "☐ Le bloc « Après l'aléa » est rempli."], ["p", "h3", "Pièges fréquents"], ["p", "bl", "Compter une source « à surveiller » comme couvrante."], ["p", "bl", "Coter sans justifier."], ["p", "bl", "Oublier un ER grave : un angle mort veut dire qu'un risque majeur ne sera jamais étudié."]], "a3": [["p", "b", "Repérer quelles parties prenantes (fournisseurs, prestataires, clients : la chaîne d'approvisionnement, ou supply chain) peuvent servir de rebond à une source de risque, bâtir 3 scénarios stratégiques (source → partie prenante → événement redouté) et réduire la menace par des mesures d'écosystème."], ["p", "h3", "Les objectifs de l'atelier"], ["p", "bl", "Cartographier l'écosystème : les parties prenantes (PP) qui peuvent servir de rebond."], ["p", "bl", "Évaluer le niveau de menace de chaque partie prenante : (D × P) ÷ (M × C)."], ["p", "bl", "Construire 3 scénarios stratégiques (source → partie prenante → événement redouté) et les évaluer."], ["p", "bl", "Choisir des mesures d'écosystème pour toute partie prenante en zone danger (menace ≥ 3) : l'objectif est de repasser sous 3 au moindre coût."], ["p", "h3", "Ce dont vous avez besoin"], ["t", [["", ""], ["<b>Plateau</b>", "Zone ③ : trois couloirs SS1 à SS3 (cartes SR → PP → ER), cadre des mesures d'écosystème, et feuille 3 : radar des parties prenantes, scénarios stratégiques."], ["<b>Cartes</b>", "Deck vert ÉCOSYSTÈME (8 cartes PP : D, P, M, C imprimés) et deck vert foncé MESURE ÉCOSYSTÈME (8 cartes ME). Réutilisez les cartes SR retenues (atelier 2) et les cartes ER (atelier 1)."], ["<b>À côté de vous</b>", "Calculatrice, échelles D, P, M, C (bouton « Documents »)."]]], ["p", "h3", "Pas à pas (durées conseillées en minutes)"], ["t", [["Min", "Ce que vous faites", "Où"], ["0–13", "<b>Calculer le niveau de menace des parties prenantes.</b> Pour chaque carte verte : niveau = (D × P) ÷ (M × C). Écrivez D × P, puis M × C, puis le quotient. Zone : danger si ≥ 3 ; contrôle de 1,5 à moins de 3 ; veille en dessous de 1,5. Cochez la zone sur le radar de la feuille 3. Dans l'appli : saisissez votre niveau, l'appli le compare au calcul exact.", "Feuille 3, radar"], ["13–16", "<b>Aléa.</b> Tirez la carte Aléa. Recalculez la partie prenante concernée et écrivez les conséquences dans le bloc violet.", "Appli + feuille 3"], ["16–35", "<b>Construire les 3 scénarios stratégiques.</b> Pour chaque scénario SS : ① choisissez un ER grave ; ② choisissez la source RETENUE qui peut le provoquer ; ③ choisissez la partie prenante qui sert de relais (de préférence en zone danger) ; ④ posez les 3 cartes SR → PP → ER dans le couloir ; ⑤ vérifiez que le couple source/objectif (SR/OV) retenu à l'atelier 2 mène bien à cet ER. La gravité du scénario est celle de l'ER ; la vraisemblance n'est pas estimée ici : conformément à la méthode officielle (EBIOS RM), elle l'est à l'atelier 4.", "Zone ③ couloirs ; feuille 3"], ["35–50", "<b>Choisir les mesures d'écosystème.</b> Pour chaque PP en zone danger, choisissez au moins une carte ME. Chaque ME change UNE variable de 1. Recalculez le niveau et la zone. Notez le coût en points de budget : il sera retiré des 14 points de budget de l'atelier 5.", "Zone ③ mesures ; feuille 3"], ["50–55", "<b>Vérifier.</b> Cliquez sur « Vérifier » dans chaque étape.", "Appli"]]], ["p", "note", "Exemple hors jeu : D 3, P 4, M 1, C 3. D × P = 12 ; M × C = 3 ; niveau = 12 ÷ 3 = 4,0 → zone danger (≥ 3)."], ["p", "h3", "Dans l'appli"], ["p", "bl", "Le calculateur libre (D, P, M, C) vous aide sans remplacer le calcul écrit."], ["p", "bl", "La gravité de chaque scénario est reprise de l'ER ; la vraisemblance sera estimée à l'atelier 4."], ["p", "h3", "Avant de passer à la suite : auto-contrôle"], ["p", "bl", "☐ Chaque niveau de menace est calculé par écrit (D × P, M × C, quotient) et la zone est cochée."], ["p", "bl", "☐ Chaque scénario part d'une source retenue, passe par une partie prenante et finit sur un ER ; sa gravité est celle de l'ER."], ["p", "bl", "☐ Pour chaque scénario, vous savez dire quel couple SR/OV retenu l'alimente et quel ER il vise."], ["p", "bl", "☐ Chaque partie prenante en danger a une mesure d'écosystème avec recalcul."], ["p", "bl", "☐ Le bloc « Après l'aléa » est rempli."], ["p", "h3", "Pièges fréquents"], ["p", "bl", "Inverser le quotient : (D × P) ÷ (M × C), pas l'inverse."], ["p", "bl", "Arrondir trop tôt : gardez 2 décimales."], ["p", "bl", "Choisir une source écartée ou à surveiller pour un scénario."]], "a4": [["p", "b", "Détailler comment une attaque se déroule réellement, en quatre actions (Connaître, Rentrer, Trouver, Exploiter), pour chacun de vos 3 scénarios stratégiques, mesurer sa vraisemblance et repérer les biens supports critiques."], ["p", "h3", "Les objectifs de l'atelier"], ["p", "bl", "Construire les scénarios opérationnels : les chemins d'attaque en quatre phases (Connaître, Rentrer, Trouver, Exploiter)."], ["p", "bl", "Identifier les cibles techniques : les biens supports visés par les actions, et ceux qui sont critiques."], ["p", "bl", "Évaluer la VRAISEMBLANCE de chaque scénario : plus la source est motivée et outillée (atelier 2) et plus le socle a d'écarts (atelier 1), plus l'attaque est facile. Méthode ANSSI « standard » simplifiée : chaque action reçoit une probabilité de succès Pr de 1 à 4 ; la Pr cumulée d'une action est le minimum entre sa Pr et la Pr cumulée de l'action précédente ; la vraisemblance du scénario est la Pr cumulée de la dernière action."], ["p", "bl", "Préparer le niveau de risque brut : gravité (atelier 1) × vraisemblance, qui sera placé dans la matrice à l'atelier 5."], ["p", "h3", "Ce dont vous avez besoin"], ["t", [["", ""], ["<b>Plateau</b>", "Zone ④ : 3 chaînes de 4 emplacements (Connaître, Rentrer, Trouver, Exploiter) et feuille 2, partie basse : cotation des étapes, actions écartées, tests T1 à T4, biens supports critiques."], ["<b>Cartes</b>", "Deck noir OPÉRATION (15 cartes : phase, action, bien visé), mélangées : certaines ne servent à rien. Posez 4 cartes par chaîne (12 au total) ; les 3 restantes seront écartées. Gardez les cartes bleues BS sous la main."], ["<b>À côté de vous</b>", "Fiche méthode « vraisemblance » (page de méthode de l'atelier dans l'appli), feuille 3 et feuille 1."]]], ["p", "h3", "Pas à pas (durées conseillées en minutes)"], ["t", [["Min", "Ce que vous faites", "Où"], ["0–8", "<b>Lire les cartes noires.</b> Lisez les 15 cartes Opération et relisez vos 3 scénarios stratégiques (feuille 3).", "Cartes noires ; feuille 3"], ["8–25", "<b>Poser les actions dans les 3 chaînes.</b> Pour chaque scénario, posez 4 actions dans l'ordre Connaître → Rentrer → Trouver → Exploiter (la méthode officielle ne fixe pas de sens de construction : astuce, fixez d'abord la dernière action, celle qui touche l'ER visé, puis remontez). Chaque action doit rendre la suivante possible : écrivez pourquoi. Dans l'appli : un menu par phase.", "Zone ④ ; feuille 2 (bas)"], ["25–28", "<b>Aléa.</b> Tirez la carte Aléa : réexaminez vos chaînes et votre vraisemblance, écrivez le résultat dans le bloc violet.", "Appli"], ["28–40", "<b>Écarter les actions inutiles.</b> Une carte est écartée si elle échoue à un test : T1 bien connu (est-il l'un des 10 biens supports de l'atelier 1 ?), T2 valeur métier (soutient-il une VM ?), T3 chemin vers un ER (sert-il un de vos 3 scénarios ?), T4 enchaînement (permet-il l'action suivante ?). Écartez 3 cartes et justifiez.", "Zone ④ « actions écartées »"], ["40–50", "<b>Coter les étapes.</b> Pour chaque action posée, répondez aux questions de l'appli (compétences, conditions à réunir, règle du socle de l'atelier 1, détection), puis cotez la probabilité de succès Pr de 1 (faible) à 4 (quasi certaine). Pr cumulée = min (Pr de l'action ; Pr cumulée de l'action précédente) ; la première action garde sa Pr. La vraisemblance du scénario est la Pr cumulée de la dernière action : elle remplace la V de l'atelier 3. Exemple : Pr 4, 3, 2, 4 donnent des cumulées 4, 3, 2, 2 ; V du scénario = 2. Ce n'est pas une moyenne.", "Feuille 2, atelier 4"], ["50–55", "<b>Biens supports critiques.</b> Comptez les actions par bien support. Un BS est critique s'il est visé par au moins 2 actions dont au moins 1 Rentrer ou Exploiter. Cliquez sur « Vérifier ».", "Feuille 2, ligne BS critiques"]]], ["p", "note", "Exemple : si la règle du socle qui couvre l'étape est Conforme ou Partielle, c'est un obstacle pour l'attaquant et Pr baisse d'un cran ; si elle est en Écart, ce n'est pas un obstacle."], ["p", "h3", "Dans l'appli"], ["p", "bl", "Les menus de l'appli reprennent les cartes noires : choisissez la carte posée."], ["p", "bl", "Pr cumulée et V du scénario se calculent à mesure que vous cotez Pr. Une étape de méthode avec exercices ouvre l'atelier."], ["p", "h3", "Avant de passer à la suite : auto-contrôle"], ["p", "bl", "☐ Chaque chaîne a exactement 4 actions, une par phase, dans le bon ordre."], ["p", "bl", "☐ Chaque action est justifiée : pourquoi suit-elle la précédente ?"], ["p", "bl", "☐ Chaque carte écartée échoue à un test, que vous savez nommer."], ["p", "bl", "☐ Chaque action a sa Pr justifiée par les questions ; la V du scénario est la dernière Pr cumulée (la plus petite)."], ["p", "bl", "☐ Les biens supports critiques sont notés avec le décompte de leurs actions."], ["p", "h3", "Pièges fréquents"], ["p", "bl", "Mettre deux actions de la même phase dans une chaîne."], ["p", "bl", "Cote Pr sans pouvoir justifier chaque obstacle ; faire une moyenne au lieu d'un minimum."], ["p", "bl", "Oublier que la V de l'atelier 4 remplace celle de l'atelier 3."]], "a5": [["p", "b", "Choisir un plan de traitement sous budget (14 points) pour ramener chaque scénario au seuil d'acceptation, formuler les risques résiduels et faire signer la décision au directeur général."], ["p", "h3", "Les objectifs de l'atelier"], ["p", "bl", "Placer chaque scénario dans la matrice avec son risque brut : G × V (G vient de l'atelier 1, V de l'atelier 4)."], ["p", "bl", "Choisir un plan de traitement sous budget et recalculer le risque résiduel."], ["p", "bl", "Comparer chaque risque résiduel au seuil d'acceptation (G × V ≤ 6) : sinon, mesure en plus ou dérogation signée du DG."], ["p", "bl", "Formaliser la décision : responsable, indicateur, date de revue."], ["p", "h3", "Ce dont vous avez besoin"], ["t", [["", ""], ["<b>Plateau</b>", "Zone ⑤ : emplacements des mesures et feuille 4 : matrice G × V, budget, avant / après traitement, décision du DG, risque résiduel."], ["<b>Cartes</b>", "Deck orange MESURE (12 cartes : coût et effet) et cartes ME retenues à l'atelier 3, à poser sur les emplacements."], ["<b>Budget</b>", "14 points de budget à répartir (coûts écrits sur la feuille 4). La matrice G × V de la feuille 4 reçoit deux valeurs par scénario : avant traitement, après traitement."], ["<b>À côté de vous</b>", "Calculatrice. G vient de la feuille 1, V de l'atelier 4."]]], ["p", "h3", "Pas à pas (durées conseillées en minutes)"], ["t", [["Min", "Ce que vous faites", "Où"], ["0–5", "<b>Placer les scénarios dans la matrice.</b> Pour chaque SS : G (gravité de l'ER visé, atelier 1) × V (vraisemblance du scénario opérationnel, atelier 4). Écrivez G × V dans la colonne « avant traitement » de la matrice (feuille 4). Niveaux : Faible ≤ 3, Moyen 4 à 6, Élevé 8 à 9, Critique ≥ 12.", "Zone ⑤ matrice ; feuille 4"], ["5–20", "<b>Construire le plan sous budget.</b> Choisissez des mesures (cartes orange et ME) dans la limite de 14 points de budget. Lisez l'effet de chaque carte (« vraisemblance −1 » ou « gravité −1 »), recalculez G × V et écrivez-le dans la colonne « après traitement ». Objectif : chaque scénario à G × V ≤ 6. Deux mesures qui font la même chose ne se cumulent pas.", "Zone ⑤ PACS et budget"], ["20–25", "<b>Aléa.</b> Tirez la carte Aléa : refaites le plan sous la nouvelle contrainte, dans le bloc violet.", "Appli"], ["25–34", "<b>Risque résiduel et acceptation.</b> Un scénario encore au-dessus de 6 reçoit une mesure en plus, ou une dérogation signée du DG avec un responsable, un indicateur et une date de revue. Si un ER touche la sécurité des personnes, le risque résiduel n'est jamais accepté par dérogation : la table ajoute une mesure.", "Zone ⑤ acceptation"], ["34–40", "<b>Vérifier.</b> Cliquez sur « Vérifier le plan ». Le DG signe la décision sur la feuille 4.", "Appli + feuille 4"]]], ["p", "note", "Exemple : G4 × V2 = 8 (Élevé). Une mesure « vraisemblance −1 » donne G4 × V1 = 4 (Moyen) : sous le seuil de 6."], ["p", "h3", "Dans l'appli"], ["p", "bl", "Le coût du plan s'additionne en direct et vous prévient si le budget est dépassé."], ["p", "bl", "La dérogation du DG (responsable, indicateur, date) se saisit sous chaque scénario encore trop haut."], ["p", "h3", "Avant de passer à la suite : auto-contrôle"], ["p", "bl", "☐ Le total des coûts ne dépasse pas 14 points de budget."], ["p", "bl", "☐ Chaque scénario est à G × V ≤ 6, ou une dérogation signée du DG est écrite."], ["p", "bl", "☐ Pour chaque mesure, G ou V a été recalculé par écrit."], ["p", "bl", "☐ Chaque risque accepté a un responsable, un indicateur et une date de revue."], ["p", "bl", "☐ Le plan s'appuie sur les écarts du socle (atelier 1)."], ["p", "bl", "☐ Chaque bien support critique (atelier 4) est protégé, ou son risque est accepté explicitement."], ["p", "h3", "Pièges fréquents"], ["p", "bl", "Dépasser le budget."], ["p", "bl", "U
