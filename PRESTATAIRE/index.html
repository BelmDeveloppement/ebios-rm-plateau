tiliser la V de l'atelier 3 au lieu de celle de l'atelier 4."], ["p", "bl", "Cumuler deux mesures équivalentes (M et ME)."]], "deb": [["p", "b", "Comparer votre analyse à celle des autres tables, comprendre les écarts avec la méthode officielle et repartir avec une action concrète."], ["p", "h3", "Les objectifs de l'atelier"], ["p", "bl", "Comparer vos résultats à ceux des autres tables."], ["p", "bl", "Repérer les notions fragiles."], ["p", "bl", "Décider d'une action concrète pour lundi."], ["p", "h3", "Ce dont vous avez besoin"], ["t", [["", ""], ["<b>Plateau</b>", "Bas de la feuille 4 : bilan de la journée et questions de débrief."], ["<b>Cartes</b>", "Aucune."], ["<b>À côté de vous</b>", "Votre dossier d'analyse (généré par l'appli)."]]], ["p", "h3", "Pas à pas (durées conseillées en minutes)"], ["t", [["Min", "Ce que vous faites", "Où"], ["0–5", "<b>Présenter votre résultat.</b> Score, risque le plus critique, plus grande divergence avec les autres tables.", "Écran de la classe"], ["5–17", "<b>Comparer les tables.</b> Valeurs métier, couples retenus, plans de traitement : l'enseignant projette le comparatif.", "Tableau comparatif"], ["17–25", "<b>Retour sur la méthode officielle.</b> Écarts entre les échelles du jeu et celles du guide EBIOS RM de l'ANSSI.", "Guide ANSSI"], ["25–30", "<b>Ce que je fais lundi.</b> Écrivez une action concrète pour votre entreprise ou votre stage. Générez ensuite votre dossier.", "Appli"]]], ["p", "h3", "Dans l'appli"], ["p", "bl", "Votre dossier d'analyse (PDF) rassemble vos résultats et les photos de votre plateau."], ["p", "h3", "Avant de passer à la suite : auto-contrôle"], ["p", "bl", "☐ Chaque joueur a écrit son action « lundi »."]]}, "rules": [["p", "h2", "But du jeu"], ["p", "b", "Vous formez la cellule d'analyse de risque de Synaptis Services. En 5 ateliers (ceux de la méthode EBIOS Risk Manager) vous allez des valeurs métier jusqu'à l'acceptation des risques. Vous lisez des cartes, vous les posez sur le plateau, vous calculez, vous débattez et vous écrivez sur le plateau. L'appli de votre table vérifie vos résultats (✔ ou ✘) sans donner la réponse et compte les points."], ["p", "h2", "Comment se déroule un atelier"], ["p", "bl", "<b>1 · Consignes</b> : ouvrez « Consignes de l'atelier » (bouton fixe en bas). Elles disent quoi sortir, quoi faire, dans quel ordre, où écrire."], ["p", "bl", "<b>2 · Première version</b> : lisez les cartes, posez-les sur leurs emplacements, calculez, écrivez sur la feuille du plateau et saisissez vos choix dans l'appli."], ["p", "bl", "<b>3 · Aléa</b> : quand la première version est posée, tirez la carte Aléa de l'atelier (bouton dans l'appli). Elle change une donnée ou une contrainte. Vous révisez votre travail dans le bloc « Après l'aléa » (version 2) ; la version 1 n'est jamais effacée."], ["p", "bl", "<b>4 · Vérification</b> : cliquez sur « Vérifier ». ✔ = juste (conservé), ✘ = à revoir, avec une courte phrase d'explication. Corrigez et revérifiez : seuls les meilleurs points sont gardés. Après 3 essais infructueux sur une même vérification, vous pouvez afficher la solution expliquée."], ["p", "bl", "<b>5 · Atelier suivant</b> : quand toutes les étapes sont vérifiées, passez à l'atelier suivant."], ["p", "h2", "Les aides : illimitées, avec pénalité"], ["p", "b", "L'aide est <b>illimitée</b>. Le bouton « Aide » propose d'abord une question gratuite ; un indice, ou la réponse d'un élément précis (par exemple « Révéler VM2 »), coûte <b>1 point de pénalité</b>, noté au nom du joueur qui le demande. La table voit le total des aides utilisées ; l'enseignant voit le détail par joueur. Utilisez-les à bon escient."], ["p", "h2", "Règles de table"], ["p", "bl", "Toute cotation est justifiée à voix haute en une phrase. Un résultat sans calcul écrit n'est pas valable."], ["p", "bl", "Droit de contestation : une fois par atelier, chaque joueur peut contester une cotation ; l'équipe la justifie ou la modifie."], ["p", "bl", "Votre résultat peut différer de la référence de l'appli. Les calculs (Σ, niveau de menace, G × V, coûts) doivent être exacts ; les choix (cotations subjectives, chemin retenu) peuvent différer d'un niveau s'ils sont justifiés. Les écarts se discutent au débrief."], ["p", "h2", "Durée et score"], ["p", "b", "Atelier 1 : 50 min · atelier 2 : 40 · atelier 3 : 55 · atelier 4 : 55 · atelier 5 : 40 · débrief : 30. Les points de l'appli servent à comparer les tables et à repérer les notions fragiles, pas à classer les personnes. L'enseignant établit la note finale avec la fiche d'évaluation."]], "materiel": [["p", "h2", "Où est quoi ? Le matériel en un coup d'œil"], ["t", [["Ce que vous avez", "Où le trouver", "Quand l'utiliser"], ["Plateau A1", "Au centre de la table. Moitié droite : les 4 feuilles de travail imprimées (on écrit dessus). Moitié gauche : les emplacements des cartes.", "Toute la journée"], ["Cartes bleues ENTREPRISE (21)", "Deck bleu. 5 VM + 10 BS + 6 ER. Les ER restent face cachée jusqu'au calcul.", "Atelier 1 (BS gardées pour l'atelier 4)"], ["Cartes rouges MENACE (6)", "Deck rouge : les sources de risque SR.", "Atelier 2 (SR retenues posées à l'atelier 3)"], ["Cartes vertes ÉCOSYSTÈME (8) et vert foncé MESURE ÉCOSYSTÈME (8)", "Deck vert (PP : D, P, M, C imprimés) et deck vert foncé (ME).", "Atelier 3"], ["Cartes noires OPÉRATION (15)", "Deck noir : phase, action, bien visé. Certaines ne servent à rien.", "Atelier 4"], ["Cartes orange MESURE (12)", "Deck orange : coût en points de budget et effet.", "Atelier 5"], ["Cartes violettes ALÉA", "Elles n'ont plus besoin d'être lues par quelqu'un : l'appli tire la carte de l'atelier pour votre table.", "Milieu de chaque atelier"], ["Feuilles A4 de réserve", "Copies des 4 feuilles du plateau, en cas d'erreur.", "À la demande"], ["Appli compagnon", "Sur votre téléphone ou votre ordinateur. Les boutons fixes en bas de l'écran : Consignes, Règles, Documents, Aide.", "Toute la journée"]]], ["p", "h2", "Les feuilles du plateau"], ["t", [["Feuille", "Atelier", "Contenu"], ["Feuille 1", "Atelier 1", "Valeurs métier / biens supports, gravité des ER, socle de sécurité"], ["Feuille 2 (haut)", "Atelier 2", "Cotation M / R / A / Σ et contrôle de couverture"], ["Feuille 3", "Atelier 3", "Radar des parties prenantes, scénarios stratégiques, mesures d'écosystème"], ["Feuille 2 (bas)", "Atelier 4", "Étapes, freins, actions écartées, biens supports critiques"], ["Feuille 4", "Atelier 5 et débrief", "Matrice G × V, budget, avant / après, décision du DG"]]]], "quiz": [{"q": "Une source de risque est cotée M = 2, R = 3, A = 2. Quelle est sa décision ?", "o": ["Retenue (Σ ≥ 8)", "À surveiller (Σ de 6 à 7)", "Écartée (Σ ≤ 5)"], "a": 1, "e": "Σ = 2 + 3 + 2 = 7. Entre 6 et 7, la source est « à surveiller » : elle ne compte pas pour la couverture des événements redoutés."}, {"q": "Une partie prenante a D = 3, P = 4, M = 2, C = 3. Quel est son niveau de menace (D × P) ÷ (M × C) et sa zone ?", "o": ["2,0 : zone contrôle", "0,5 : zone veille", "12 : zone danger"], "a": 0, "e": "D × P = 12 ; M × C = 6 ; 12 ÷ 6 = 2,0. De 1,5 à moins de 3 : zone contrôle. Le dénominateur est M × C (maturité × confiance) : plus M et C sont hauts, plus la menace baisse."}, {"q": "Après traitement, un scénario est à G × V = 8 alors que le seuil d'acceptation est 6. Que faites-vous ?", "o": ["Rien : 8 reste acceptable", "Ajouter une mesure pour descendre à 6 ou moins, ou obtenir une dérogation signée du DG (responsable, indicateur, date de revue)", "Changer la gravité du scénario pour que le total passe"], "a": 1, "e": "Le seuil est G × V ≤ 6. Au-dessus, il faut une mesure en plus ou une dérogation écrite et signée par le DG. On ne modifie jamais G pour « faire passer » un risque."}], "scen": [["p", "h2", "Fiche entreprise"], ["t", [["Raison sociale", "Synaptis Services (infogérant et ESN fictif)"], ["Activité", "Infogérance et exploitation des systèmes d'information d'une cinquantaine de clients (collectivités, industriels, santé) : supervision, support et interventions à distance 24 h sur 24"], ["Taille", "450 salariés, chiffre d'affaires de 66 M€, soit environ 180 k€ par jour d'arrêt total (66 M€ ÷ 365)"], ["Sites", "Siège, centre de supervision (24 h sur 24) et salle serveurs ; plateforme de supervision en partie hébergée chez un fournisseur cloud"], ["Partenaires", "Une cinquantaine de clients dont des PME et ETI à la maturité cyber hétérogène, les éditeurs de la supervision et du coffre de mots de passe, des sous-traitants techniques et des freelances, un centre de support externalisé"], ["Contrôles", "Certification ISO 27001, audits de sécurité des clients, engagements de niveau de service et de confidentialité, déclaration des violations de données"], ["Projet stratégique", "« Plateforme d'automatisation » : automatiser les interventions chez les clients et migrer la supervision vers le cloud"]]], ["p", "h2", "Système d'information et accès chez les clients"], ["p", "bl", "Une plateforme de supervision et d'automatisation et un coffre de mots de passe permettent d'intervenir à distance sur les systèmes d'information des clients."], ["p", "bl", "Environ 300 postes de techniciens et d'ingénieurs fonctionnent sous un système hérité, aux mises à jour limitées."], ["p", "bl", "La plateforme de supervision et la gestion des tickets tournent en partie chez le fournisseur cloud. La base de configurations stocke les inventaires, les schémas et les documents d'architecture d'une cinquantaine de clients."], ["p", "bl", "Un pare-feu et une passerelle assurent une segmentation partielle entre le SI interne, la plateforme de supervision et les tunnels vers les réseaux des clients."], ["p", "bl", "Les éditeurs de la supervision et du coffre de mots de passe et des sous-traitants techniques se connectent par VPN pour la télémaintenance."], ["p", "bl", "Des intérimaires, des sous-traitants et des techniciens indépendants accèdent au centre de supervision avec des badges temporaires ; des sous-traitants disposent de comptes dans le coffre de mots de passe."], ["p", "h2", "Constats de l'audit interne sur le socle de sécurité (atelier 1, étape « Socle »)"], ["p", "note", "L'audit décrit la situation sans la noter : c'est à vous d'attribuer un état à chaque règle (Conforme, Partiel, Écart)."], ["t", [["Règle", "Constat de l'audit interne (sans notation)"], ["R1 Cloisonnement SI interne, plateforme et tunnels clients", "Un pare-feu et une passerelle séparent le SI interne, la plateforme de supervision et les réseaux des clients, mais plusieurs tunnels permanents arrivent directement sur la plateforme, sans zone démilitarisée. Ces flux directs ne sont pas filtrés : la séparation n'est pas effective."], ["R2 Accès privilégiés et télémaintenance", "Le coffre de mots de passe contient des comptes partagés ; les accès aux clients se font par VPN avec sessions permanentes et aucun second facteur d'authentification."], ["R3 Sauvegardes", "Plateforme et base de configurations sauvegardées hors ligne pour environ 60 % des serveurs ; la restauration complète n'a jamais été testée."], ["R4 Postes et serveurs", "Environ 300 postes de techniciens sous un système hérité : correctifs non appliqués depuis deux ans, durcissement inexistant."], ["R5 Sensibilisation", "80 % des salariés formés ; intérimaires, freelances et sous-traitants non formés."], ["R6 Journalisation et détection", "Aucune journalisation ni détection sur la plateforme ni sur les sessions d'intervention chez les clients."], ["R7 Plan de continuité", "Bascule du centre de supervision sur le site de secours testée chaque année."], ["R8 Clauses contractuelles", "Des clauses de sécurité figurent dans 3 contrats sur 8 avec les sous-traitants et éditeurs critiques ; aucune avec les freelances."]]], ["p", "note", "<b>Comment décider ?</b> <b>Conforme</b> : la règle est en place, complète et vérifiée (1 point). <b>Partiel</b> : en place en partie, ou en place mais jamais vérifiée (0,5). <b>Écart</b> : absente, ou en place mais sans effet réel (0)."], ["p", "h3", "Contexte réglementaire (à discuter, non à affirmer)"], ["p", "note", "Selon son activité et sa taille, Synaptis peut relever de la directive NIS 2 (prestataire de services gérés), du RGPD (Synaptis est sous-traitant des données de ses clients), de la certification ISO 27001 et des exigences de sécurité imposées contractuellement par les clients. Retenez simplement que ces cadres existent : vous n'avez pas à les appliquer dans le jeu, ils sont évoqués au débrief."]], "ech": [["p", "note", "Ces règles sont des <b>simplifications pédagogiques</b>. À la fin de la journée, vous les comparerez aux échelles du guide officiel de l'ANSSI."], ["t", [["Gravité", "Définition"], ["G1 Mineure", "Perte inférieure à 20 k€, gêne passagère sans impact sur les clients"], ["G2 Significative", "20 à 200 k€, service perturbé quelques heures, aucun engagement de niveau de service rompu"], ["G3 Grave", "0,2 à 2 M€, services indisponibles chez des clients, pénalités, données touchées, certification menacée"], ["G4 Critique", "Plus de 2 M€, ou compromission d'un client à travers nos accès, ou survie de l'entreprise en jeu, ou mise en cause pénale des responsables"]]], ["t", [["Vraisemblance", "Définition"], ["V1 Peu vraisemblable", "Nécessite des moyens très importants ou plusieurs conditions rares"], ["V2 Vraisemblable", "Réalisable par une source motivée avec des moyens courants"], ["V3 Très vraisemblable", "Facilement réalisable, déjà observé dans le secteur"], ["V4 Quasi certaine", "Pratiquement garanti si la source le décide"]]], ["p", "h3", "Atelier 2 : coter la motivation, les ressources et l'activité (de 1 à 4)"], ["t", [["Niveau", "Motivation (M)", "Ressources (R)", "Activité (A)"], ["1", "Faible : intérêt marginal, opportuniste", "Très limitées : une personne isolée, outils publics", "Rarement observée dans le secteur"], ["2", "Moyenne : intérêt réel mais pas prioritaire", "Limitées : outils courants, compétences moyennes", "Occasionnelle : quelques cas par an dans le secteur"], ["3", "Forte : objectif clair, prêt à investir du temps", "Importantes : équipe organisée, outils spécialisés ou accès légitimes", "Régulière : attaques observées chaque mois"], ["4", "Très forte : objectif prioritaire, détermination durable", "Très importantes : organisation structurée, moyens élevés", "Très fréquente : attaques quasi quotidiennes"]]], ["p", "h3", "Atelier 3 : les quatre variables d'une partie prenante (D, P, M, C)"], ["t", [["Variable", "Définition", "Valeur 1", "Valeur 4", "Effet sur le niveau de menace"], ["D · Dépendance", "À quel point l'organisation a besoin de cette partie prenante pour fonctionner. Peut-on la remplacer vite ?", "Remplaçable en quelques jours, sans conséquence", "Indispensable, aucune solution de repli", "D monte : la menace monte"], ["P · Pénétration", "Jusqu'où la partie prenante entre dans nos systèmes et nos locaux : VPN, comptes, badge, clés USB, accès physique.", "Aucun accès, simples échanges de documents", "Accès permanent et privilégié (administration, VPN toujours ouvert)", "P monte : la menace monte"], ["M · Maturité cyber", "Capacité de la partie prenante à se protéger et à gérer un incident : organisation, outils, certification, sensibilisation de son personnel.", "Aucune démarche de sécurité", "Démarche structurée, certifiée et testée", "M monte : la menace baisse"], ["C · Confiance", "Confiance que l'on peut accorder à ses intentions et à ses engagements : contrat, historique, transparence, droit d'audit.", "Doutes, intérêts divergents, aucun engagement", "Relation éprouvée, engagements opposables, intérêts alignés", "C monte : la menace baisse"]]], ["p", "h3", "Atelier 3 : les mesures d'écosystème (ME), leviers pour réduire le niveau de menace d'une partie prenante"], ["p", "note", "Les cartes ME (vert foncé) sont les <b>mesures d'écosystème</b> : chacune agit sur une variable de la partie prenante. Leur but : faire sortir de la zone danger les parties prenantes qui sont des rebonds faciles. Après chaque mesure, recalculez le niveau et la zone."], ["t", [["Variable", "Ce qu'elle mesure", "Comment la faire évoluer", "Cartes ME"], ["D · Dépendance", "À quel point Synaptis a besoin de la partie prenante", "Prévoir un second prestataire ou un plan B (D baisse)", "ME6"], ["P · Pénétration", "Accès de la partie prenante à nos systèmes et à nos locaux", "Accès à la demande, cloisonnement, accompagnement sur site (P baisse)", "ME3, ME4, ME5"], ["M · Maturité cyber", "Niveau de sécurité de la partie prenante", "Audit, sensibilisation du prestataire (M monte)", "ME1, ME7"], ["C · Confiance", "Engagements opposables et relation éprouvée", "Clauses contractuelles, revue annuelle, exercice commun (C monte)", "ME2, ME8"]]], ["p", "h3", "Atelier 4 : les obstacles qui font baisser la probabilité de succès Pr d'une action"], ["t", [["Obstacle", "Question à se poser sur l'action", "Effet"], ["F1 · Compétences ou moyens", "La source doit-elle disposer de compétences ou de moyens qu'elle n'a pas naturellement (par exemple connaître la plateforme de supervision et ses interfaces) ?", "−1"], ["F2 · Règle du socle", "Une règle du socle qui couvre cette étape est-elle Conforme ou Partielle ? (Écart : aucun frein)", "−1"], ["F3 · Conditions cumulatives", "Faut-il réunir plusieurs conditions indépendantes (complicité d'un sous-traitant et contournement d'un contrôle de validation, par exemple) ?", "−1"], ["F4 · Détection probable", "Quelqu'un ou quelque chose a-t-il de bonnes chances de remarquer l'action ?", "−1"]]], ["p", "h3", "Récapitulatif des règles du jeu"], ["t", [["Notion", "Règle"], ["Pertinence d'un couple source / objectif (atelier 2)", "Σ = M + R + A. Σ ≥ 8 : retenu · 6 à 7 : à surveiller · ≤ 5 : écarté"], ["Niveau de menace d'une partie prenante (atelier 3)", "(D × P) ÷ (M × C). Danger ≥ 3 · Contrôle de 1,5 à moins de 3 · Veille moins de 1,5"], ["Scénario stratégique (atelier 3)", "Pas de vraisemblance à l'atelier 3 : la gravité du scénario est celle de l'ER ; la vraisemblance est estimée à l'atelier 4"], ["Probabilité de succès Pr d'une action (atelier 4)", "Aucun obstacle = Pr4, un = Pr3, deux = Pr2, trois ou plus = Pr1. Pr cumulée = min (Pr de l'action ; Pr cumulée de l'action précédente)"], ["Vraisemblance d'un scénario opérationnel (atelier 4)", "La Pr cumulée de la dernière action (le maillon le plus faible). Elle remplace la V de l'atelier 3 pour la matrice de l'atelier 5"], ["Niveau de risque (atelier 5)", "G × V. Faible ≤ 3 · Moyen 4 à 6 · Élevé 8 à 9 · Critique ≥ 12"], ["Seuil d'acceptation (atelier 5)", "G × V ≤ 6. Après traitement, chaque scénario doit être à 6 ou moins ; au-dessus, il faut une mesure en plus ou une dérogation signée du DG"]]]], "defis": {"a1": [["p", "h2c1", "Défis flash de l'atelier 1 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 1.1 · Valeur métier ou bien support ?.</b> Classez : a) base de configurations des clients ; b) serveur de la plateforme de supervision ; c) rétablissement des incidents des clients dans les délais contractuels ; d) outil d'automatisation des interventions ; e) confiance des clients ; f) centre de supervision ; g) certification ISO 27001 ; h) technicien d'astreinte."], ["p", "b", "<b>Défi 1.2 · Gravité.</b> Cotez : a) arrêt d'un quart des services numériques pendant 6 heures ; b) arrêt total des services numériques pendant 5 jours ; c) arrêt total de 12 jours."], ["p", "b", "<b>Défi 1.3 · Priorités du socle.</b> Parmi R1 à R8, lesquelles traiteriez-vous en premier, et pourquoi ?"], ["p", "b", "<b>Défi 1.4 · Impact chiffré.</b> Chiffrez un arrêt de la plateforme de 12 jours et placez-le sur l'échelle. À partir de quel jour le seuil de G4 est-il franchi ?"]], "a2": [["p", "h2c2", "Défis flash de l'atelier 2 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 2.1.</b> Un hacktiviste voit son activité passer de 2 à 4 après une campagne médiatique visant l'un des clients du prestataire. Recalculez et décidez."], ["p", "b", "<b>Défi 2.2.</b> Donnez pour chaque source de risque un exemple d'objectif visé différent de celui de la carte."], ["p", "b", "<b>Défi 2.3.</b> Pourquoi la ressource (R) de SR4 est-elle de 3 alors qu'il est seul ?"]], "a3": [["p", "h2c3", "Défis flash de l'atelier 3 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 3.1.</b> Calculez et classez : société de gardiennage des locaux (D 2, P 3, M 1, C 2) ; éditeur du logiciel de gestion des tickets (D 3, P 3, M 3, C 3) ; prestataire de nettoyage (D 1, P 2, M 2, C 3)."], ["p", "b", "<b>Défi 3.2.</b> Mesurez l'effet de la mesure M5 (maturité +1) sur PP2 et PP7."], ["p", "b", "<b>Défi 3.3.</b> Un étudiant propose : « SR1 → autorités et organismes de certification (PP3) → ER3 ». Quel couple SR/OV retenu l'alimente, et quelle gravité hérite-t-il ?"], ["p", "b", "<b>Défi 3.4.</b> Pourquoi le niveau de menace d'une partie prenante peut-il baisser sans toucher à la partie prenante elle-même ?"], ["p", "b", "<b>Défi 3.5.</b> Cotez le scénario : SR3 hacktiviste (Σ 6) → PP4 centre de support externalisé de niveau 1 (niveau 0,67) → ER6. Aucune règle du socle en écart ou partielle ne se trouve sur ce chemin."]], "a4": [["p", "h2c4", "Défis flash de l'atelier 4 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 4.1.</b> Remettez dans l'ordre : O1 exfiltration, O9 veille sur l'hébergeur, O13 repérage des volumes, O4 compte administrateur compromis."], ["p", "b", "<b>Défi 4.2.</b> Citez un bien support et une mesure de détection pour chaque phase de SS1."], ["p", "b", "<b>Défi 4.3.</b> Le bastion d'accès avec second facteur (M2) est déployé : R2 devient Conforme. Recotez « Rentrer » de SS1 par le VPN, puis cherchez une autre étape Rentrer et donnez la vraisemblance de SS1."], ["p", "b", "<b>Défi 4.5.</b> Dans vos trois chaînes, quels biens supports sont visés par au moins deux actions, dont un Rentrer ou un Exploiter ? Lequel protégeriez-vous en premier, et pourquoi ?"], ["p", "b", "<b>Défi 4.4.</b> Une publication décrit comment cartographier une plateforme de supervision et ses accès clients sans en connaître l'architecture (AL8). Que devient le frein F1 de « Trouver » en SS1 ? Quelle est la vraisemblance de SS1 ?"]], "a5": [["p", "h2c5", "Défis flash de l'atelier 5 (bonus de 2 points au maximum, si vous avez fini avant le temps)"], ["p", "b", "<b>Défi 5.1.</b> Placez dans la matrice un risque G2 × V4, un risque G4 × V1 et un risque G3 × V3. Donnez leur niveau."], ["p", "b", "<b>Défi 5.2.</b> Avec 6 points de budget, quelle priorité pour SS1 seul (12) ?"], ["p", "b", "<b>Défi 5.3.</b> Pourquoi la cyber-assurance (M12) n'apparaît-elle pas dans le plan de référence ?"], ["p", "b", "<b>Défi 5.4.</b> Rédigez une décision d'acceptation pour SS1 résiduel (G3 × V2 = 6)."]]}}, "defs": [["p", "h2", "Fiche de définitions · un seul vocabulaire pour toute la table"], ["p", "note", "À lire par tous les joueurs avant de commencer et à garder sous la main. La dernière colonne indique <b>la carte ou la zone du plateau qui porte la notion</b>."], ["p", "h3", "Pour tous"], ["t", [["Terme", "Définition en une phrase", "Où le trouver"], ["<b>Valeur métier (VM)</b>", "Ce qui est essentiel à la mission de l'organisation (un processus, une information, un savoir-faire). Test : « si on change de technologie, cela existe-t-il encore ? »", "Carte bleue ENTREPRISE"], ["<b>Bien support (BS)</b>", "Composante du SI, de l'OT, des locaux ou des personnes sur laquelle repose une valeur métier. Il disparaît avec la technologie.", "Carte bleue ENTREPRISE"], ["<b>Événement redouté (ER)</b>", "Atteinte à une valeur métier selon un critère (disponibilité, intégrité, confidentialité), avec son impact. On ne décrit jamais l'attaque.", "Carte bleue ENTREPRISE"], ["<b>Gravité (G1 à G4)</b>", "Niveau d'impact d'un ER, coté avec l'échelle du dossier de scénario (calcul jours d'arrêt × coût par jour quand c'est possible). Un ER qui touche la sécuri   else if(a==='doc')openDoc(b.dataset.id);
  else if(a==='docs')docsSheet();
  else if(a==='tuto')openTuto(b.dataset.a||null);
  else if(a==='tutook'){const id=b.dataset.a;S.tuto[id]=1;S.tutoOpen='';save();setv('t0.'+id,Date.now());render()}
  else if(a==='tutoopen'){S.tutoOpen=b.dataset.a;save();render()}
  else if(a==='tutoclose'){S.tutoOpen='';save();render()}
  else if(a==='drawalea'){const id=b.dataset.a,nm=id.replace('a','Atelier '),l=CFG.alea.filter(x=>x[1]===nm);if(l.length)setv('alea.'+id,hashStr((S.session||'')+'|'+(S.table||'')+'|'+id)%l.length);render()}
  else if(a==='gatecheck'){const Q=CFG.v2.quiz;S.gate.sel=S.gate.sel||{};S.gate.tries=S.gate.tries||{};if(Q.some((q,i)=>S.gate.sel[i]==null)){toast('Répondez aux 3 questions');return}
    let all=true;Q.forEach((q,i)=>{const ok=S.gate.sel[i]===q.a;S.gate.q[i]={ok};if(ok&&!S.gate.tries[i])award('lec.q'+i,1);S.gate.tries[i]=(S.gate.tries[i]||0)+1;if(!ok)all=false});
    if(all){S.gate.done=true;toast('Lecture validée : vous pouvez commencer l\'atelier 1')}else toast('Relisez les explications des réponses ✘ et corrigez');save();pub('st');render()}
  else if(a==='tsel'){S.tsel=S.tsel===b.dataset.id?'':b.dataset.id;render()}
  else if(a==='evadd'){const v=(($('#evnew')||{}).value||'').trim();if(v){evG(v);S.evt=v;save();render()}}
  else if(a==='evprint')evPrint();
  else if(a==='evcsv')evCsv();
  else if(a==='unlock'){const c=($('#acode')||{}).value||'';unlockAnim(c).then(ok=>{if(ok)render();else{const m=$('#amsg');if(m)m.textContent='Code incorrect, ou fichier introuvable (ouvrez la page en ligne, pas depuis un fichier).'}})}
  else if(a==='lock'){NET.animDoc=null;render()}
  else if(a==='pulse'){S.pulse[b.dataset.a]=b.dataset.e;save();render()}
  else if(a==='dossier')dossier();
  else if(a==='json'){const bl=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),u=URL.createObjectURL(bl),x=document.createElement('a');x.href=u;x.download='analyse_'+CFG.key+'_table'+(S.table||'')+'.json';x.click()}
  else if(a==='menu')menu();
  else if(a==='wrongtable'){const p=S.pname;wipeS();S.pname=p;S.kickedMsg=0;save();connect();toast('Scannez le QR code de votre scénario');render()}
  else if(a==='gen'){S.session=Math.random().toString(36).slice(2,6).toUpperCase();save();connect();render()}
  else if(a==='tstart'){const at=g('anim.at')||'a1',mi=num(g('anim.min'))||AT.find(x=>x.id===at).min;pubRaw({k:'timer',at,start:Date.now(),dur:mi*60000})}
  else if(a==='tstop'){pubRaw({k:'timer',at:'',start:0,dur:0,stop:true})}
  else if(a==='tpause'){pubRaw({k:'timer',at:'',start:Date.now(),dur:30*60000})}
  else if(a==='alea'){const at=g('anim.at')||'a1',nm=at.replace('a','Atelier '),al=CFG.alea.filter(x=>x[1]===nm);if(al.length){const x=al[Math.floor(Math.random()*al.length)];pubRaw({k:'alea',id:x[0],t:x[0]+' · '+x[2],x:x[3]})}}
  else if(a==='aleaoff'){pubRaw({k:'alea',id:'',t:'',x:''});NET.alea=null;render()}
  else if(a==='video'){sheet('<h2>Message de la direction</h2><video controls playsinline style="width:100%;border-radius:10px" src="dg.mp4"></video><p class="mut">Si la vidéo ne se lance pas, demandez le fichier à l\'enseignant.</p>')}
});
function menu(){sheet(`<h2>Réglages</h2><p><label>N° de table <input data-k="__table" type="text" value="${esc(S.table)}" style="width:90px"></label> <label>Code <input data-k="__session" type="text" value="${esc(S.session)}" style="width:110px;text-transform:uppercase"></label></p><p class="mut">Relais : ${esc(RELAY)} · état : ${esc(NET.status)}</p><p><button class="btn sec" data-act="go" data-t="home">Accueil</button> <button class="btn sec" onclick="if(confirm('Effacer toutes les données de cet appareil ?')){localStorage.removeItem('${LSK}');location.reload()}">Tout effacer</button></p>`)}
function dossier(){const ba=byAt();const rows=(t,arr)=>`<table>${arr.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</table>`;
  let h=`<div class="rep"><p class="noprint"><button class="btn" onclick="window.print()">Imprimer / Enregistrer en PDF</button> <button class="btn sec" onclick="document.querySelector('.rep').remove()">Fermer</button></p><h1>Dossier d'analyse de risque · ${esc(CFG.org)}</h1><p>Méthode EBIOS RM · Table ${esc(S.table||'—')} · ${new Date().toLocaleDateString('fr-FR')} · Score : ${fmt(total(),1)} pts</p>`;
  h+=`<h2>Atelier 1 · Valeurs métier et biens supports</h2>`+rows('',[['Valeur métier','Biens supports','Critère'],...CFG.vm.map(v=>[v[0]+' '+esc(v[1]),CFG.bs.filter(b=>g('a1.vb.'+v[0]+'.'+b[0])).map(b=>b[0]).join(', '),['D','I','C'].filter(c=>g('a1.vc.'+v[0]+'.'+c)).join(' ')])]);
  h+=`<h2>Atelier 1 · Gravité des événements redoutés</h2>`+rows('',[['ER','Estimation','Gravité retenue','Jours d\'arrêt / montant'],...CFG.er.map(e=>{const am=erAmt(e[0]);return [e[0]+' '+esc(e[1]),g('a1.pari.'+e[0])||'',g('a1.g.'+e[0])||'',am?(am.p?'personnes':am.j!=null?am.j+' j':fmt(am.cost,0)+' k€'):(g('a1.j.'+e[0])||'')]})]);
  const so=CFG.socle.reduce((s,r)=>s+(g('a1.so.'+r[0])==='Conforme'?1:g('a1.so.'+r[0])==='Partiel'?.5:0),0);
  h+=`<p>Socle : ${fmt(so,1)} / ${CFG.socle.length} (${fmt(100*so/CFG.socle.length,0)} %) · ${CFG.socle.map(r=>r[0]+' '+(g('a1.so.'+r[0])||'?')).join(' · ')}</p>`;
  h+=`<h2>Atelier 2 · Sources de risque</h2>`+rows('',[['Source','M','R','A','Σ','Décision'],...CFG.sr.map(s=>{const m=num(g('a2.'+s[0]+'.M')),r=num(g('a2.'+s[0]+'.R')),a=num(g('a2.'+s[0]+'.A'));return [s[0]+' '+esc(s[1]),m||'',r||'',a||'',m&&r&&a?m+r+a:'',m&&r&&a?sigmaDec(m+r+a):'']})]);
  h+=`<h2>Atelier 3 · Scénarios stratégiques</h2>`+rows('',[['SS','Chemin','Justification'],...[1,2,3].map(i=>['SS'+i,[g('a3.ss.'+i+'.sr'),g('a3.ss.'+i+'.pp'),g('a3.ss.'+i+'.er')].map(x=>x||'?').join(' → '),esc(g('a3.ss.'+i+'.why')||'')])]);
  h+=`<p>Mesures d'écosystème : ${CFG.pp.map(p=>{const c=CFG.me.filter(m=>g('a3.me.c.'+p[0]+'.'+m[0])).map(m=>m[0]);return c.length?p[0]+' : '+c.join('+'):''}).filter(Boolean).join(' · ')||'—'}</p>`;
  h+=`<h2>Atelier 4 · Scénarios opérationnels</h2>`+rows('',[['SS','Connaître','Rentrer','Trouver','Exploiter','V'],...CFG.ref.ss.map(s=>[s.id,...['Connaître','Rentrer','Trouver','Exploiter'].map(p=>g('a4.ch.'+s.id+'.'+p)||'?'),'V'+v4s(s.id)])]);
  h+=`<p>Biens supports critiques : ${CFG.bs.filter(b=>g('a4.crit.'+b[0])).map(b=>b[0]).join(', ')||'—'}</p>`;
  h+=`<h2>Atelier 5 · Traitement du risque</h2><p>Plan : ${CFG.mes.filter(m=>g('a5.m.'+m[0])).map(m=>m[0]).join(', ')||'—'} · coût ${planCost()} / ${CFG.budget} · seuil d'acceptation G × V ≤ ${CFG.seuil}</p>`+rows('',[['SS','Après traitement (G × V)','Seuil','Dérogation du DG'],...CFG.ref.ss.map((s,i)=>{const x=after(i+1);return [s.id,x,(x<=CFG.seuil?'sous le seuil':'au-dessus'),x>CFG.seuil?esc([g('a5.d.'+(i+1)+'.resp'),g('a5.d.'+(i+1)+'.ind'),g('a5.d.'+(i+1)+'.date')].map(y=>y||'…').join(' · ')):'']})]);
  h+=`<p>Signature du DG : ______________________ </p><h2>Ce que je fais lundi</h2><p>${esc(g('deb.lundi')||'')}</p>`;
  const phs=Object.entries(S.photos).filter(([k,v])=>v.length);if(phs.length){h+='<h2>Photos du plateau</h2>'+phs.map(([k,v])=>'<div><b>'+k.toUpperCase()+'</b><br>'+v.map(p=>'<img src="'+p+'">').join('')+'</div>').join('')}
  h+='</div>';document.body.insertAdjacentHTML('beforeend',h)}

function tourRefus(){return '<div class="card"><h2>🔒 Accès à la tour de contrôle refusé</h2><div class="banner" style="background:#fde8e6;color:#a02a1d">Ce lien est incomplet ou ne correspond pas à votre table. Scannez le QR code « Tour de contrôle » remis à votre table par l\'enseignant.</div></div>'}
// ---------- Tour de contrôle (?tour=N&s=CODE) : écran PC en lecture seule
function atStart(a){const ks=Object.keys(S.its).filter(k=>k.startsWith(a+'.')&&!k.startsWith('a1.pari')||k.startsWith(a+'.pari'));const ts=ks.map(k=>S.its[k]).filter(Boolean);return ts.length?Math.min(...ts):0}
function atLast(a){const ts=Object.keys(S.its).filter(k=>k.startsWith(a+'.')).map(k=>S.its[k]).filter(Boolean);return ts.length?Math.max(...ts):0}
function stepStatus(a,x){if(S.force&&S.force[a+':'+x.id])return 'f';if(x.chk&&x.chk!=='a1vm'&&revGrp(x.chk))return 'r';if(x.chk==='a1vm'&&CFG.vm.some(v=>S.rev['a1_vm:'+v[0]]))return stepOK(x)?'r':'c';return stepOK(x)?'v':'c'}
function stepProg(x){if(!x.chk)return '';if(x.chk==='a1vm'){const r=S.res.a1vm||{};const n=CFG.vm.filter(v=>r[v[0]]===true||S.rev['a1_vm:'+v[0]]).length;return n+' / '+CFG.vm.length+' valeurs métier validées'}const r=S.res[x.chk];if(r&&typeof r==='object'){const e=Object.entries(r).filter(([k])=>k!=='_all');const o=e.filter(([,v])=>v===true).length,k=e.filter(([,v])=>v===false).length;return '✔ '+o+' · ✘ '+k}return 'pas encore vérifié'}
function stepAtt(x){if(!x.chk)return 0;if(x.chk==='a1vm')return CFG.vm.reduce((s,v)=>s+(S.att['a1_vm:'+v[0]]||0),0);const gr=Object.keys(VRES).find(k=>VRES[k].includes(x.chk));return gr?(S.att[gr]||0):0}
function mm(ms){const m=Math.floor(ms/60000);return m+' min'}
function tourPage(){
 const now=Date.now(),tbn=S.table,lm=NET.lastMsg||0,age=lm?Math.round((now-lm)/1000):null;
 const net=!S.session?'<div class="banner" style="font-size:1.1em"><b>Code de session manquant.</b> Ajoutez <code>&s=CODE</code> à l\'adresse de cet écran (code donné par l\'enseignant).</div>':(NET.status!=='connecté'&&NET.status.indexOf('local')<0?'<div class="banner" style="font-size:1.1em;background:#fde8e6;color:#a02a1d"><b>⚠ Connexion perdue ou indisponible</b> ('+esc(NET.status)+'). Les données affichées peuvent être en retard.</div>':'')+(lm?'':'<div class="banner">En attente des données de la table '+esc(tbn)+'… (les téléphones de la table doivent être connectés avec le même code de session)</div>');
 let a=(AT.find(x=>x.id!=='deb'&&!ok_(x.id))||AT[AT.length-1]).id;const A=AT.find(x=>x.id===a),T=CFG.v2.tuto[a]||{},st=STEPS[a]||[];
 let h=`<div class="card tourh"><h2>🛰 Tour de contrôle · Table ${esc(tbn)} · ${esc(CFG.key)}</h2><div class="row"><span class="tag">${fmt(total(),1)} pts</span><span class="tag" style="background:#6b4ea0">aides utilisées ${aidesUsed()}</span><span class="tag" style="background:${planCost()>CFG.budget?'#c0392b':'#a35a00'}">budget ${planCost()} / ${CFG.budget}</span><span class="tag" style="background:#5b6678">${esc(S.session?NET.status:'sans session')}</span>${Object.entries(aidesBy()).map(([k,v])=>'<span class="tag" style="background:#8a6bbf">'+esc(k)+' : '+v+' aide'+(v>1?'s':'')+'</span>').join('')}<span class="mut">${age==null?'aucune donnée reçue':'dernière donnée il y a '+(age<90?age+' s':Math.round(age/60)+' min')}</span></div></div>${net}`;
 if(NET.alea)h+=`<div class="banner"><b>Carte Aléa : ${esc(NET.alea.t)}</b><br>${esc(NET.alea.x)}</div>`;
 h+='<div class="card"><h3 style="margin-top:0">Avancement des 5 ateliers</h3>'+AT.filter(x=>x.id!=='deb').map(x=>{const s0=atStart(x.id),fin=ok_(x.id),pr=Math.round(100*prog_(x.id)),el=s0?now-(fin?Math.max(atLast(x.id),s0):now):0,late=!fin&&s0&&el>x.min*60000*1.15;const used=s0?(fin?atLast(x.id)-s0:now-s0):0;return `<div class="row" style="margin:6px 0;flex-wrap:nowrap"><b style="width:150px${x.id===a?';color:var(--acc)':''}">${x.n} ${x.id===a?'◀':''}</b><div class="bar" style="flex:1"><i style="width:${pr}%;background:${fin?'var(--ok)':late?'var(--ko)':'var(--acc)'}"></i></div><span style="width:70px;text-align:right">${fin?'<span class="ok">✔ fini</span>':pr+' %'}</span><span style="width:170px;text-align:right" class="${late?'warn':'mut'}">${s0?'⏱ '+mm(used)+' / '+x.min+' min'+(late?' ⚠':''):'pas commencé · '+x.min+' min'}</span></div>`}).join('')+'<div class="mut">Temps estimé à partir de la première saisie de chaque atelier.</div></div>';
 h+=`<div class="tourgrid"><div class="card"><h2 style="color:var(--${A.c.slice(2)})">${esc(A.n)} · ${esc(A.t)}</h2><div class="mut">${esc(T.obj||'')}</div><h3>Étapes dans l'appli</h3>`;
 let seen=false;st.forEach(x=>{const s=stepStatus(a,x),cur=s==='c'&&!seen;if(s==='c')seen=true;const ic=s==='v'?'✔':s==='r'?'👁':s==='f'?'⏭':cur?'▶':'○';const nt=stepAtt(x);h+=`<div class="tstep ${s==='v'||s==='r'||s==='f'?'v':cur?'c':'l'}"><div class="ti">${ic}</div><div><b>${esc(x.l.replace(/^[①②③④⑤] /,''))}</b>${s==='r'?' <span class="mut">(solution révélée)</span>':''}${s==='f'?' <span class="mut">(passée en test)</span>':''}<div class="mut">${cur?esc(x.todo()||''):''}</div>${x.chk&&(cur||s==='v'||s==='r')?'<div class="mut">'+esc(stepProg(x))+(nt?' · essais infructueux : '+nt:'')+'</div>':''}</div></div>`});
 h+=`<div class="banner" style="margin-top:10px"><b>Prochaine action :</b> ${esc(nextAction(a).replace(/^👉 /,''))}</div></div>`;
 h+=`<div class="card"><h3 style="margin-top:0">Rappel : le déroulé conseillé (${esc(String(T.duree||A.min))} min)</h3>${(T.etapes||[]).map(e=>`<div class="tdev"><b>${esc(e[0])} min · ${esc(e[1])}</b><div>${esc(e[2])}</div>${e[3]?'<div class="mut">Matériel : '+esc(e[3])+'</div>':''}</div>`).join('')}<h3>Où écrire / quoi sortir</h3>${(T.besoin||[]).map(b=>`<div class="mut"><b>${esc(b[0])}</b> : ${esc(b[1])}</div>`).join('')}</div></div>`;
 return h+'<h2 style="margin:18px 0 6px">Réponses de la table</h2>'+tblPage()}

// ---------- barre de test flottante + aperçu des écrans (vide / rempli)
let PSNAP=null;
function tbarRender(){let t=$('#tbar');if(!t){t=document.createElement('div');t.id='tbar';document.body.appendChild(t)}const on=TEST&&!IS_ANIM&&!IS_TOUR;t.style.display=on?'':'none';if(on)t.innerHTML='<div><button data-act="back">◀ Retour</button><button data-act="skip">Suite ▶</button></div><div><button data-act="prev" class="'+(PREV?'on':'')+'">👁 '+['Aperçu : off','Aperçu : vide','Aperçu : rempli'][PREV]+'</button><button data-act="reset">↺ Zéro</button></div>'}
function setPrev(n){if(PREV===2&&n!==2){try{const s=JSON.parse(PSNAP);Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,s)}catch(e){}PSNAP=null}
 if(n===2){PSNAP=JSON.stringify(S);PREV=2;try{demoFill()}catch(er){console.error(er)}}else{PREV=n}
 if(PREV&&!isAt(tab)&&tab==='home'){tab='a1'}if(!PREV)save();render();window.scrollTo(0,0)}
function demoFill(){const R=CFG.ref;window.REVLOCK=true;
 CFG.vm.forEach(v=>{CFG.bs.forEach(b=>setv('a1.vb.'+v[0]+'.'+b[0],R.vmtab[v[0]].bs.includes(b[0])));['D','I','C'].forEach(c=>setv('a1.vc.'+v[0]+'.'+c,R.vmtab[v[0]].crit.includes(c)))});
 CFG.er.forEach(e=>{setv('a1.pari.'+e[0],e[4]);setv('a1.g.'+e[0],e[4])});CFG.socle.forEach(s=>setv('a1.so.'+s[0],s[2]));
 CFG.sr.forEach(s=>setv('a2.ov.'+s[0],s[3]));S.res.a2p={};CFG.sr.forEach(s=>{S.res.a2p[s[0]]=true});
 CFG.sr.forEach(s=>['M','R','A'].forEach((c,i)=>setv('a2.'+s[0]+'.'+c,R.pert[s[0]][i])));
 const ret=retenues();CFG.er.forEach(e=>{if(R.cov[e[0]])R.cov[e[0]].filter(x=>ret.includes(x)).forEach(x=>setv('a2.cov.'+e[0]+'.'+x,true))});
 CFG.pp.forEach(p=>{['D','P','M','C'].forEach(c=>setv('a3.pd.'+p[0]+'.'+c,String(p[{D:3,P:4,M:5,C:6}[c]])));setv('a3.lv.'+p[0],(p[3]*p[4])/(p[5]*p[6]))});
 R.ss.forEach((s,i)=>{const n=i+1;setv('a3.ss.'+n+'.sr',s.srs[0]);setv('a3.ss.'+n+'.pp',s.pp);setv('a3.ss.'+n+'.er',s.er);});
 /*ME*/refMe().picks.forEach(([pid,mid])=>setv('a3.me.c.'+pid+'.'+mid,true));if(0)R.danger.forEach(pid=>{const p=PP[pid];let best=null;for(let m=1;m<(1<<CFG.me.length);m++){const cs=CFG.me.filter((x,i)=>m&(1<<i));const v={D:p[3],P:p[4],M:p[5],C:p[6]};cs.forEach(c=>v[c[2]]=Math.min(4,Math.max(1,v[c[2]]+c[3])));if(menace(v.D,v.P,v.M,v.C)<3){const cost=cs.reduce((a,c)=>a+c[4],0);if(!best||cost<best.cost)best={cost,cs}}}if(best)best.cs.forEach(c=>setv('a3.me.c.'+pid+'.'+c[0],true))});
 R.ss.forEach(s=>{const E=R.etapes[s.id];['Connaître','Rentrer','Trouver','Exploiter'].forEach((ph,k)=>{setv('a4.ch.'+s.id+'.'+ph,E[k].op);setv('a4.pr.'+s.id+'.'+k,String(E[k].V));(pq()[E[k].op]||[]).forEach((q,qi)=>setv('a4.q.'+s.id+'.'+k+'.'+qi,q.ok))})});
 EXO.forEach(x=>{cumOf(x.pr).forEach((v,k)=>setv('a4.ex.'+x.id+'.'+k,String(v)));setv('a4.ex.'+x.id+'.V',String(cumOf(x.pr)[3]))});setv('a4.ex.Q','Le minimum : V1');R.horsSujet.forEach((o,i)=>setv('a4.hs.'+(i+1),o));R.crit.forEach(c=>setv('a4.crit.'+c,true));
 const bp=bestPlan();if(bp)bp.ms.forEach(m=>setv('a5.m.'+m[0],true));S.res.a1est={ok:true};S.res.a5plan={ok:true};
 CELLS={};['a1_vm','a1_g','a1_so','a2_p','a2_s','a2_c','a3_p','a3_s','a3_m','a4_e','a4_c','a4_h','a4_b','a5'].forEach(f=>{try{V[f]()}catch(er){}});
 const m=Object.assign({},S.res.cells||{});Object.assign(m,CELLS);CELLS=null;S.res.cells=m;window.REVLOCK=false}
window.addEventListener('hashchange',()=>location.reload());
connect();render();
